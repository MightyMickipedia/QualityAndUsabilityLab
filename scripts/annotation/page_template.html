<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotation · __NAME____BATCH__</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--card:#f6f8fa;--accent:#0969da;--ins:#d1f4d6;--del:#ffd7d5;--ok:#1a7f37}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#3d444d;--card:#161b22;--accent:#4493f8;--ins:#1f5a2c;--del:#7a2a28;--ok:#3fb950}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1240px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:22px 0 6px;color:var(--muted);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.type{border-left:4px solid var(--accent);background:var(--card);padding:10px 14px;margin:14px 0;border-radius:0 6px 6px 0}
.type b{font-family:ui-monospace,monospace}
.text{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;white-space:pre-wrap}
ins{background:var(--ins);text-decoration:none;border-radius:3px;padding:1px 2px}
del{background:var(--del);text-decoration:line-through;border-radius:3px;padding:1px 2px;opacity:.85}
details{border:1px solid var(--line);border-radius:6px;padding:8px 14px}
summary{cursor:pointer;font-weight:600}
.article{white-space:pre-wrap;margin-top:8px}
.q{margin:16px 0}
.q p{margin:0 0 2px;font-weight:600}
.q small{display:block;color:var(--muted);margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:default}
.nav{display:flex;justify-content:space-between;gap:8px;margin:24px 0 12px}
.save{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.done{color:var(--ok);font-weight:600}
.anchors{margin:6px 0 10px;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.anchors li{margin:2px 0}
.anchors b{color:var(--fg)}
.scale button{min-width:44px;padding:9px 0}
.note{font-size:14px;color:var(--muted);margin:10px 0}
.grid{display:grid;grid-template-columns:1fr;gap:8px 28px}
.articlebox{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:10px 14px;white-space:pre-wrap;background:var(--bg)}
.articlebox h3{margin:0 0 8px;font-size:16px;white-space:normal}
#layout{display:none;padding:5px 12px;font-size:14px}
.orig{margin-top:10px;font-size:15px}
.orig .text{margin-top:8px}
@media (min-width:980px){#layout{display:inline-block}
body:not(.stacked) .grid{grid-template-columns:1fr 1fr}
body:not(.stacked) .articlebox{max-height:760px;position:sticky;top:12px}}
code{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<div class="top"><h1>Annotation · __NAME____BATCH__</h1><span><button id="layout"></button> <span class="muted" id="progress"></span></span></div>
<div id="item"></div>
<div class="nav"><button id="prev">← Back</button><button id="next">Next →</button></div>
<div class="save">
  <button id="download">Save answers file</button>
  <button id="copy">Copy answers</button>
  <span class="muted" id="status"></span>
</div>
<p class="muted">Your answers are kept in this browser while you work. When you are done, save the file and put it into <code>__ANSWERS__</code>.</p>
</main>
<script>
const NAME = "__NAME__";
const ITEMS = __DATA__;
const SAMPLE = "__SAMPLE__";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
