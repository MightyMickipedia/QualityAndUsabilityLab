Prozent liegt die Partei nun an dritter Stelle.<ins> Das ZDF-Politbarometer ist eine regelmäßige politische Umfrage des Fernsehsenders ZDF.<\/ins> Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s008", "type": "EntE", "definition": "Entity error: a participant of the action (person, organisation, thing) or one of its attributes, such as a number, is wrong.", "original": "Die dänische Regierungschefin Mette Frederiksen will mit dem künftigen US-Präsidenten Donald Trump über dessen Aussage sprechen, er wolle Grönland unter US-Kontrolle bringen. Ihr Büro habe Kontakt zu Trump aufgenommen, sagte Frederiksen am Donnerstag nach einem Treffen mit den Chefs der im <del>dänischen<\/del> Parlament vertretenen Parteien. Sie habe aber noch nicht mit ihm gesprochen.\n\nFrederiksen glaubt nicht, dass Trump versuchen werde, Grönland mit Gewalt zu annektieren. &quot;Wir haben keinen Grund zu der Annahme, dass das passieren würde&quot;, sagte sie.\n\nTrump hatte am Dienstag seine Drohungen bekräftigt, die USA wollten den Panamakanal in Mittelamerika und das als autonomes Gebiet zu Dänemark gehörende rohstoffreiche Grönland annektieren. Ein militärisches Vorgehen wollte er dabei nicht ausschließen. &quot;Es kann sein, dass man etwas tun muss&quot;, sagte er.\n\nDieser Artikel wird weiter aktualisiert.", "modified": "Die dänische Regierungschefin Mette Frederiksen will mit dem künftigen US-Präsidenten Donald Trump über dessen Aussage sprechen, er wolle Grönland unter US-Kontrolle bringen. Ihr Büro habe Kontakt zu Trump aufgenommen, sagte Frederiksen am Donnerstag nach einem Treffen mit den Chefs der im <ins>schwedischen<\/ins> Parlament vertretenen Parteien. Sie habe aber noch nicht mit ihm gesprochen.\n\nFrederiksen glaubt nicht, dass Trump versuchen werde, Grönland mit Gewalt zu annektieren. &quot;Wir haben keinen Grund zu der Annahme, dass das passieren würde&quot;, sagte sie.\n\nTrump hatte am Dienstag seine Drohungen bekräftigt, die USA wollten den Panamakanal in Mittelamerika und das als autonomes Gebiet zu Dänemark gehörende rohstoffreiche Grönland annektieren. Ein militärisches Vorgehen wollte er dabei nicht ausschließen. &quot;Es kann sein, dass man etwas tun muss&quot;, sagte er.\n\nDieser Artikel wird weiter aktualisiert.", "title": "Title Not Found", "article": "Die dänische Regierungschefin Mette Frederiksen will mit dem künftigen US-Präsidenten Donald Trump über dessen Aussage sprechen, er wolle Grönland unter US-Kontrolle bringen. Ihr Büro habe Kontakt zu Trump aufgenommen, sagte Frederiksen am Donnerstag nach einem Treffen mit den Chefs der im dänischen Parlament\nvertretenen Parteien. Sie habe aber noch nicht mit ihm gesprochen.\nSie glaube nicht,\ndass Trump versuchen werde, Grönland mit Gewalt zu annektieren, sagte Frederiksen. &quot;Wir haben\nkeinen Grund zu der Annahme, dass das passieren würde&quot;, sagte sie.\nTrump hatte am Dienstag seine Drohungen bekräftigt, die USA wollten den Panamakanal in\nMittelamerika und das als autonomes Gebiet zu Dänemark gehörende rohstoffreiche\nGrönland annektieren. Ein militärisches Vorgehen wollte er dabei nicht\nausschließen. &quot;Es kann sein, dass man etwas tun muss&quot;, sagte er.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s015", "type": "EntE", "definition": "Entity error: a participant of the action (person, organisation, thing) or one of its attributes, such as a number, is wrong.", "original": "Die Linke verdankt ihre ständige Präsenz im Bundestag seit 1990 vor allem Petra Pau und Gesine Lötzsch, die 2002 trotz des Scheiterns ihrer Partei an der Fünf-Prozent-Hürde direkt gewählt wurden. Die Grundmandatsklausel ermöglichte es damals, dass sie einzogen. Heute gilt jedoch, dass eine Partei mindestens drei Direktmandate benötigt, um trotz eines Scheiterns an der Fünf-Prozent-Hürde in den Bundestag einzuziehen. Dies betrifft auch prominente Kandidaten wie <del>Sahra<\/del> <del>Wagenknecht.<\/del> Andere Parteien wie die Freien Wähler hoffen ebenfalls, über die Grundmandatsklausel in den Bundestag zu gelangen. Die CSU könnte dagegen aufgrund des neuen Wahlrechts negative Auswirkungen erleben, da nur die erfolgreichsten Direktkandidaten einziehen dürfen.", "modified": "Die Linke verdankt ihre ständige Präsenz im Bundestag seit 1990 vor allem Petra Pau und Gesine Lötzsch, die 2002 trotz des Scheiterns ihrer Partei an der Fünf-Prozent-Hürde direkt gewählt wurden. Die Grundmandatsklausel ermöglichte es damals, dass sie einzogen. Heute gilt jedoch, dass eine Partei mindestens drei Direktmandate benötigt, um trotz eines Scheiterns an der Fünf-Prozent-Hürde in den Bundestag einzuziehen. Dies betrifft auch prominente Kandidaten wie <ins>Frank<\/ins> <ins>Biermann.<\/ins> Andere Parteien wie die Freien Wähler hoffen ebenfalls, über die Grundmandatsklausel in den Bundestag zu gelangen. Die CSU könnte dagegen aufgrund des neuen Wahlrechts negative Auswirkungen erleben, da nur die erfolgreichsten Direktkandidaten einziehen dürfen.", "title": "Das Modell Pau-Lötzsch hat ausgedient", "article": "Dass die Linke von sich behaupten kann, seit 1990 stets im Bundestag vertreten gewesen zu sein, verdankt sie vor allem zwei Frauen: Petra Pau und Gesine Lötzsch. Die beiden gewannen 2002 ihre Berliner Wahlkreise direkt und zogen als einzige Vertreterinnen der PDS wieder in den Bundestag ein, obwohl ihre Partei damals an der Fünf-Prozent-Hürde gescheitert war.\nDie beiden Frauen sorgten so für eine gewisse parlamentarische Kontinuität, bevor ihrer Partei dann bei der vorgezogenen Bundestagswahl 2005 der fulminante Wiedereinzug gelang: Gemeinsam mit der SPD-Abspaltung WASG erreichte das neue Bündnis Linkspartei.PDS Dank der Schröderschen Hartz-Reformen 8,7 Prozent.\nDerzeit kämpft die Linke erneut um ihre Existenz. Doch was damals funktionierte, wäre heute nicht mehr möglich. Zwar hat das Bundesverfassungsgericht im vergangenen Juli die Wahlrechtsreform der Ampelparteien korrigiert. Es setzte die Grundmandatsklausel wieder in Kraft, die SPD, Grüne und FDP abschaffen wollten. Auch bei der kommenden Wahl gilt daher: Wenn eine Partei drei Direktmandate gewinnt, darf sie in der Höhe ihres Zweitstimmenergebnisses in den Bundestag einziehen, selbst wenn sie insgesamt unter fünf Prozent bleibt.\n\nZwei reichen nicht\n\nAnders als früher dürfen aber nicht mehr automatisch alle siegreichen Direktkandidaten auch in den Bundestag einziehen. &quot;Scheitert eine Partei an der Fünf-Prozent-Hürde, erhält aber trotzdem in ein oder zwei Wahlkreisen die meisten Erststimmen, dürfen die Gewinner ihr Bundestagsmandat nicht antreten&quot;, sagte der Politologe Frank Biermann. Dies sei in der Öffentlichkeit jedoch kaum bekannt. Deswegen werde irrtümlich gelegentlich davon ausgegangen, dass sehr prominente Vertreter ihrer Parteien wie beispielsweise Sahra Wagenknecht auch alleine in den Bundestag einziehen könnten, wenn sie es schafften, ihren Wahlkreis zu gewinnen.\nDass dies nicht so ist, bestätigt auch die Bundeswahlleiterin. &quot;Erreichen nur ein oder zwei Wahlkreiskandidierende einer Partei in ihrem Wahlkreis die Erststimmenmehrheit, bleiben die Partei und auch die beiden besagten Kandidierenden bei der Sitzverteilung unberücksichtigt&quot;, erläutert ein Sprecher der Behörde. Immer vorausgesetzt natürlich, die Partei liegt insgesamt unter fünf Prozent.\nZu tun hat das allerdings nicht mit der jüngsten Wahlrechtsreform, wie der Jurist Christian Kirchberg im Gespräch mit ZEIT ONLINE klarstellte. Kirchberg hatte gemeinsam mit Gregor Gysi die Wahlrechtsreform der Ampelkoalition vor dem Bundesverfassungsgericht angefochten. Pau und Lötzsch hätten vielmehr von einer Unklarheit im damaligen Wahlrecht profitiert, die der Gesetzgeber im Auftrag des Bundesverfassungsgerichts bereits 2011 beseitigt hatte, sagt Kirchberg.\nZwei Ausnahmen gibt es allerdings: Handelt es sich um die Partei einer nationalen Minderheit wie etwa den Südschleswigschen Wählerverband (SSW), in dem die in Schleswig-Holstein lebenden Dänen organisiert sind, dürfen erfolgreiche Direktkandidaten doch in den Bundestag einziehen, auch wenn es weniger als drei sind oder wenn die Partei unter fünf Prozent bleibt. Der SSW ist derzeit mit einem Abgeordneten im Bundestag vertreten.\nAuch Kandidaten, die entweder keiner Partei angehören oder unabhängig von ihrer Partei antreten, dürften ihr Mandat wahrnehmen, wenn sie in ihrem Wahlkreis die Mehrheit der Erststimmen gewinnen. Derzeit tritt etwa in Westthüringen der AfD-Bundestagsabgeordnete Klaus Stöber unabhängig von seiner Partei an, weil diese ihn nicht als Direktkandidaten aufstellte. Sollte er seinen Wahlkreis gewinnen, dürfte er auch in den Bundestag einziehen.\n\nFreie Wähler hoffen auf Grundmandatsklausel\n\nAnders könnte es dagegen bei einigen Kandidaten sowohl der Linken, der Freien Wähler oder auch des BSW sein – denn diese wurden alle von ihren jeweiligen Parteien nominiert. Bei der Linken werden vor allem Ex-Fraktionschef Gysi gute Chancen nachgesagt, seinen Berliner Wahlkreis wie bei den vergangenen fünf Bundestagswahlen erneut direkt zu gewinnen. Das Gleiche gilt auch für den Chef der Linkengruppe im Bundestag, Sören Pellmann aus Leipzig, der der Linken schon bei der vergangenen Wahl das parlamentarische Überleben sicherte. In Thüringen kämpft Ex-Ministerpräsident Bodo Ramelow um ein Direktmandat. Er war dort stets weit beliebter als seine Partei und hat deswegen durchaus gute Chancen, seinen Wahlkreis zu gewinnen. Doch wirklich erfolgreich sein können sie eben nur, wenn sie mindestens zu dritt sind.\nAuch die Freien Wähler hoffen derzeit, über die Grundmandatsklausel in den Bundestag einzuziehen. Sie treten in Bayern mit ihrem Bundesvorsitzenden, dem bayerischen Wirtschaftsminister und stellvertretenden Ministerpräsidenten Hubert Aiwanger an, der bereits bei der vergangenen Landtagswahl eines von zwei bayerischen Direktmandaten gewann. Derzeit stehen die Freien Wähler bei zwei bis 3,5 Prozent. Auch Aiwanger ist deshalb darauf angewiesen, dass außer ihm noch mindestens zwei weitere FW-Kandidaten erfolgreich sind. Ausgeschlossen ist das nicht. Denn neben ihm bewerben sich in Bayern zwei FW-Landräte und ein Bürgermeister um ein Direktmandat und damit Menschen, die zumindest auf lokaler Ebene gut vernetzt und bekannt sind.\nBeim BSW hat anders, als vielleicht viele denken, nicht Sahra Wagenknecht, sondern Ex-Fußballmanager Oliver Ruhnert von Union Berlin die besten Chancen auf ein Direktmandat. Er tritt in der ehemaligen Linkenhochburg Marzahn-Hellersdorf an. Bei der Europawahl wurde das BSW dort stärkste Kraft. Parteichefin Sahra Wagenknecht tritt dagegen erst gar nicht in einem Wahlkreis an, sondern nur auf Platz eins der nordrhein-westfälischen Landesliste. &quot;Wir setzen nicht auf die Grundmandatsklausel, sondern werben um die Zweitstimme, um auf über fünf Prozent zu kommen&quot;, sagt ein Sprecher des BSW.\n\nAuch CSU muss leiden\n\nNegative Folgen könnte das neue Wahlrecht allerdings auch für erfolgreiche CSU-Direktkandidaten haben. Allerdings nicht, weil es von ihnen zu wenige, sondern weil es zu viele geben könnte. Bis zur Wahl 2021 galt: Gewinnt eine Partei mehr Direktmandate, als ihr nach ihrem Zweitstimmenergebnis zustehen, durften trotzdem alle Wahlkreissieger in den Bundestag einziehen. Die anderen Parteien erhielten dafür Ausgleichsmandate. Dadurch allerdings wurde der Bundestag immer größer. Genau das wollte die Ampel mit der Wahlrechtsreform verhindern.\nKünftig erhält eine Partei deswegen nur so viele Mandate, wie ihr nach ihrem Zweitstimmenergebnis zustehen. Gibt es mehr erfolgreiche Wahlkreisgewinner, was bei der CSU in Bayern der Fall sein könnte, ziehen nur die mit den meisten Stimmen von ihnen auch tatsächlich in den Bundestag ein. Die mit den schwächsten Erststimmenergebnissen müssen draußen bleiben.\nDas führt zu ganz neuen Formen der Wahlwerbung. So argumentierte der Grünenbundestagsabgeordnete Dieter Janecek unlängst auf X , wer wolle, dass der Wahlkreis München-West/Mitte auch künftig durch einen direkt gewählten Kandidaten im Bundestag vertreten sei, solle doch bitte mit der Erststimme Grün, also ihn, wählen. Beim letzten Mal gewann zwar sein Konkurrent von der CSU, bayernweit allerdings mit einem der schlechtesten Erststimmenergebnisse der CSU. Diesmal könnte er also bei einem sehr knappen Wahlsieg ganz scheitern. Dass wirklich viele Wählerinnen und Wähler die Wahlrechtsreform schon so weit durchdrungen haben, dass sie derartige taktische Überlegen anstellen, erscheint allerdings fraglich."}, {"id": "s021", "type": "EntE", "definition": "Entity error: a participant of the action (person, organisation, thing) or one of its attributes, such as a number, is wrong.", "original": "Die Bundesagentur für Arbeit (BA) vermeldet ein Jahr nach Einführung des sogenannten Jobturbo Fortschritte bei der Arbeitsmarktintegration von Ukrainern in Deutschland.\n\nIm August 2024 lebten laut Ausländerzentralregister etwa <del>1,3<\/del> Millionen Ukrainerinnen und Ukrainer in Deutschland, die meisten davon als Kriegsflüchtlinge.\n\nVon den rund 768.000 Ukrainern im erwerbsfähigen Alter haben nach neuen BA-Daten mehr einen Job angenommen als noch vor einem Jahr.\n\nIm August 2023 zählten noch etwa 197.660 Ukrainer in Arbeit, ein Jahr später waren es bereits etwa 272.400 Ukrainer in geringfügigen und sozialversicherungspflichtigen Jobs.\n\nDer Jobturbo sollte ursprünglich 200.000 Ukrainern in Deutschland zu einem Arbeitsplatz verhelfen.", "modified": "Die Bundesagentur für Arbeit (BA) vermeldet ein Jahr nach Einführung des sogenannten Jobturbo Fortschritte bei der Arbeitsmarktintegration von Ukrainern in Deutschland.\n\nIm August 2024 lebten laut Ausländerzentralregister etwa <ins>1,4<\/ins> Millionen Ukrainerinnen und Ukrainer in Deutschland, die meisten davon als Kriegsflüchtlinge.\n\nVon den rund 768.000 Ukrainern im erwerbsfähigen Alter haben nach neuen BA-Daten mehr einen Job angenommen als noch vor einem Jahr.\n\nIm August 2023 zählten noch etwa 197.660 Ukrainer in Arbeit, ein Jahr später waren es bereits etwa 272.400 Ukrainer in geringfügigen und sozialversicherungspflichtigen Jobs.\n\nDer Jobturbo sollte ursprünglich 200.000 Ukrainern in Deutschland zu einem Arbeitsplatz verhelfen.", "title": "Mehr ukrainische Flüchtlinge nehmen Arbeit auf", "article": "Etwa ein Jahr nach Start des sogenannten Jobturbos der Bundesregierung sieht die Bundesagentur für Arbeit (BA) Fortschritte bei der Arbeitsmarktintegration von Ukrainern. &quot;Mit dem Jobturbo haben wir einen Schritt nach vorne gemacht&quot;, sagte BA-Vorstand Daniel Terzenbach dem RedaktionsNetzwerk Deutschland (RND).\nNach Angaben der Bundesagentur für Arbeit ( PDF ) lebten laut Ausländerzentralregister Ende August 2024 1,3 Millionen Ukrainerinnen und Ukrainer in Deutschland. Die große Mehrheit sind Kriegsflüchtlinge. Von den geflüchteten Ukrainern sind nach Zahlen der Bundesagentur für Arbeit, aus denen die Bundesregierung im Oktober zitierte ,\n\n 768.000 im \nerwerbsfähigen Alter.\nVon diesen knapp 770.000 Ukrainern im erwerbsfähigen Alter haben nach neuen BA-Daten im Vergleich zum Vorjahr mehr einen Job angenommen. Im August 2023 – damals lag die Zahl aller Ukrainer in Deutschland noch bei 1,2 Millionen – zählte die Behörde noch 197.660 Ukrainer in Arbeit, ein Jahr später waren insgesamt 272.400 Ukrainer in geringfügigen und sozialversicherungspflichtigen Jobs.\n\n&quot;Jobturbo&quot; sollte 200.000 Ukrainer in Jobs bringen\n\nAuch die monatliche Zahl von Ukrainern, die aus der Arbeitslosigkeit in \nJobs auf dem sogenannten ersten Arbeitsmarkt gewechselt sind, ist \ndemnach gestiegen. 2023 zählte die BA insgesamt 36.661 Abgänge \nukrainischer Staatsangehöriger in den Arbeitsmarkt. 2024 (bis \neinschließlich Oktober) waren es 62.810 Abgänge. Darunter fallen auch \n(außer-)betriebliche Ausbildungen und Selbstständigkeit.\nMit diesem Anstieg von bislang insgesamt etwa 137.000 Arbeitsaufnahmen im Jahr 2024 zeichnet sich ein geringerer Anstieg ab, als sich die Bundesregierung von ihrem sogenannten Jobturbo-Programm für ukrainische Flüchtlinge vorgenommen hatte. Bundesarbeitsminister Hubertus Heil hatte vor einem Jahr angekündigt, mit dem Programm sollten im Jahr 2024 200.000 Ukrainer direkt in einen Job vermittelt und 500 Millionen Euro gespart werden.\n&quot;Es ist heute viel wahrscheinlicher, dass Ukrainerinnen und Ukrainer in \nArbeit kommen als vor dem Jobturbo&quot;, sagte BA-Vorstand Terzenbach, der auch \nSonderbeauftragter für die Arbeitsmarktintegration Geflüchteter war. &quot;Aber es gibt auch noch Luft nach oben.&quot;\n\nStreit über Bürgergeld für Ukraine-Flüchtlinge\n\nNach Zahlen des Instituts für Arbeitsmarkt- und Berufsforschung (IAB) vom August liegt Deutschland bei der Beschäftigungsquote geflüchteter Ukrainer\n im europäischen Mittelfeld: 27 Prozent von ihnen gingen demnach einer Arbeit \nnach . Am höchsten sei die Quote in Litauen, Dänemark und Polen mit \njeweils 57, 53 und 48 Prozent. Finnland, Norwegen und Spanien \nverzeichnen hingegen niedrige Quoten unter 20 Prozent, in Rumänien \narbeiten demnach nur sieben Prozent der Geflüchteten.\nDie große Mehrheit der in Deutschland lebenden ukrainischen Flüchtlinge bekommt Bürgergeld. Darüber gab es in der Politik immer wieder Streit. Heil hatte damals gesagt, es sei &quot;an der Zeit, eine Arbeit aufzunehmen&quot;, das Bürgergeld kein &quot;bedingungsloses \nGrundeinkommen&quot;.\nIm Sommer, vor den Landtagswahlen in Sachsen, Thüringen und Brandenburg, kam die Diskussion erneut auf. Die damals noch im Bund mitregierende FDP und die größte Oppositionsfraktion Union hatten gefordert, geflüchteten Ukrainern statt Bürgergeld geringere Sozialleistungen nach dem Asylbewerberleistungsgesetz zu zahlen.\nAber auch Brandenburgs Ministerpräsident Dietmar Woidke von der SPD hatte das B ürgergeld für ukrainische Flüchtlinge infrage gestellt . Sein Innenminister Michael Stübgen (CDU) argumentierte, das Bürgergeld sei zum &quot;Bremsschuh für die Arbeitsaufnahme&quot; geworden. Die Bundesregierung wies die Kürzungsforderungen damals zurück .\nDie Autoren der IAB-Studie vom Sommer sehen das Bürgergeld nicht als entscheidenden Grund, der ukrainische Flüchtlinge an einer Arbeitsaufnahme hindere . Vielmehr seien unter anderem Fragen, wie stark der Arbeitsmarkt reguliert ist, und der Zugang zu Kinderbetreuung und Gesundheitsversorgung entscheidende Faktoren. Die große Mehrheit der ukrainischen Kriegsflüchtlinge sind Frauen und Kinder."}, {"id": "s031", "type": "EntE", "definition": "Entity error: a participant of the action (person, organisation, thing) or one of its attributes, such as a number, is wrong.", "original": "Die verheerenden Waldbrände in Kalifornien fordern weitere Opfer und zerstören tausende Gebäude, während Einsatzkräfte und Soldaten im Kampf gegen die Flammen Unterstützung leisten.", "modified": "Die verheerenden Waldbrände in Kalifornien fordern weitere Opfer und zerstören tausende Gebäude, während Einsatzkräfte und <ins>Deutsche <\/ins>Soldaten im Kampf gegen die Flammen Unterstützung leisten.", "title": "Title Not Found", "article": "Bei den verheerenden Waldbränden in Kalifornien bleibt die\nLage trotz nachlassender Winde angespannt. Behörden melden einen weiteren Toten,\ndamit sind bisher mindestens elf Menschen durch die Feuerkatastrophe umgekommen.\nSoldaten stehen bereit, um im Kampf gegen die Flammen zu helfen. Gleichzeitig\nstellt sich die Frage, wer für die Schäden aufkommt, die das Feuer hinterlässt.\nAm Freitagmittag (Ortszeit) überbrachte US-Präsident Joe\nBiden aber auch positive Nachrichten: Es gebe Fortschritte bei den Löscharbeiten. Kaliforniens\nGouverneur Gavin Newsom äußerte die Hoffnung, dass die Einsatzkräfte im\nTagesverlauf weitere Erfolge erzielen.\nGleichzeitig warnte die Chefin des US-Katastrophenschutzes\nFema, Deanne Criswell, dass die Gefahr keineswegs gebannt sei: &quot;Die Situation\nist weiterhin sehr gefährlich.&quot; Zwar sei der Wind aktuell schwächer , doch werde\nin den kommenden Tagen wieder mit stärkeren Böen gerechnet.\n\nFast 10.000 Gebäude zerstört\n\nIm Großraum Los Angeles brennen weiterhin mehrere Feuer, die\nbislang kaum eingedämmt sind. Insgesamt hatten fünf Brandherde auf einer Fläche von rund 13.750 Hektar (137,5 Quadratkilometer) gewütet. Das ist fast so groß wie die Stadt Kaiserslautern. Die Flammen haben fast 10.000 Gebäude zerstört, rund\n180.000 Menschen mussten fliehen.\nTausende Einsatzkräfte kämpfen gegen die Flammen. Laut\nVerteidigungsministerium stehen auch 500 in Kalifornien stationierte Soldaten\nfür Einsätze bereit. Sie könnten auf Anforderung der kalifornischen Behörden\nunter anderem bei Such- und Rettungseinsätzen oder beim Räumen von Straßen\nhelfen, sagte eine Sprecherin. Zudem seien zehn Helikopter sowie\nvier spezielle Brandbekämpfungssysteme verfügbar, die in Militärflugzeuge\neingebaut werden können und teilweise am Wochenende zum Einsatz kommen sollen.\n\nSorgen um Versicherungsschutz\n\nNeben der akuten Katastrophe ist auch die Rolle von\nVersicherern in den Fokus gerückt: Die Brände könnten laut Analysten zu den\nkostspieligsten in der Geschichte der USA werden. Kaliforniens\nVersicherungsbeauftragter Ricardo Lara forderte eine schnelle Auszahlung von\nVersicherungsleistungen für die Betroffenen. Zudem seien eine Modernisierung\ndes Versicherungssystems und eine bessere Katastrophenvorsorge dringend\nnotwendig.\nViele Häuser in den USA bestehen aus Holz, was die Ausbreitung von\nBränden begünstigt. Wegen steigender Risiken durch Fluten, Stürme und Brände durch den Klimawandel wird es zudem immer schwieriger, tragfähige Versicherungspolicen anzubieten."}, {"id": "s044", "type": "EntE", "definition": "Entity error: a participant of the action (person, organisation, thing) or one of its attributes, such as a number, is wrong.", "original": "Der iranische Präsident <del>Massud<\/del> <del>Peseschkian<\/del> hat Vorwürfe zurückgewiesen, dass der Iran ein Attentat auf den designierten republikanischen US-Präsidenten Donald Trump geplant habe.", "modified": "Der iranische Präsident <ins>Ebrahim<\/ins> <ins>Raisi<\/ins> hat Vorwürfe zurückgewiesen, dass der Iran ein Attentat auf den designierten republikanischen US-Präsidenten Donald Trump geplant habe.", "title": "Title Not Found", "article": "Der iranische Präsident Massud Peseschkian hat Vorwürfe zurückgewiesen, der Iran habe ein Attentat auf den designierten republikanischen US-Präsidenten Donald Trump geplant. &quot;Wir haben so etwas nie versucht und werden es auch nie tun&quot;, sagte Peseschkian in einem Interview mit NBC News auf die Frage, ob es einen iranischen Plan gegeben habe, Trump zu töten.\nDas US-Justizministerium hatte im November einen Iraner angeklagt, der im Auftrag der iranischen Revolutionsgarden ein Attentat auf Trump geplant haben soll.  Die Strafanzeige, die bei einem Bundesgericht in Manhattan eingereicht wurde,\nrichte sich gegen einen namentlich nicht genannten Angehörigen der \niranischen paramilitärischen Organisation. Der Beschuldigte sollte demnach im September einen mutmaßlichen \nKontaktmann angewiesen haben, einen Plan für die Beschattung und Tötung \nTrumps zu erarbeiten. US-Sicherheitsbehörden hatten den mutmaßlichen Anschlag nach eigenen Angaben vereitelt.\nTrump selbst hatte im Wahlkampf behauptet, der Iran könnte hinter Mordanschlägen auf ihn stecken. Tatsächlich überlebte Trump während seines Wahlkampfes zwei Attentatsversuche – einen bei einer Wahlkampfveranstaltung im Juli in Butler im Bundesstaat Pennsylvania und einen weiteren im September in der Nähe seines Golfplatzes in West Palm Beach in Florida. Die Ermittler fanden jedoch keine Hinweise auf eine iranische Beteiligung.\nDer Iran hat wiederholt Vorwürfe der USA zurückgewiesen, sich in amerikanische Angelegenheiten einzumischen, auch in Bezug auf Cyberoperationen. Die Regierung in Teheran wirft den USA ebenfalls vor, sich seit Jahrzehnten in iranische Angelegenheiten einzumischen und verweist dabei auf Ereignisse vom Putsch gegen Ministerpräsident Mohammad Mosaddegh im Jahr 1953 bis zur Tötung des iranischen Militärkommandeurs Kasem Soleimani durch einen US-Drohnenangriff im Jahr 2020."}, {"id": "s002", "type": "CircE", "definition": "Circumstance error: action and participants are right, but the circumstances are wrong: place, time, manner or condition.", "original": "In Moskaus Luxus-Kondomerie &quot;Preserwatiwnaja&quot; drängeln sich Kunden vor bunten Auslagen voller Kondome in verschiedenen Größen und Geschmacksrichtungen. <del>Während<\/del> <del>des<\/del> <del>Kriegs<\/del> boomt der Verkauf von Verhütungsmitteln in Russland, was den Herrscher Wladimir Putin ärgert, der seit Langem die Geburt mehr Kinder predigt.", "modified": "In Moskaus Luxus-Kondomerie &quot;Preserwatiwnaja&quot; drängeln sich Kunden vor bunten Auslagen voller Kondome in verschiedenen Größen und Geschmacksrichtungen. <ins>Vor<\/ins> <ins>dem<\/ins> <ins>Krieg<\/ins> boomt der Verkauf von Verhütungsmitteln in Russland, was den Herrscher Wladimir Putin ärgert, der seit Langem die Geburt mehr Kinder predigt.", "title": "&quot;So losrennen, des ist doch deppert&quot;", "article": "Dieser Artikel ist Teil von ZEIT am Wochenende , Ausgabe 03/2025.\nEs gibt sie in vielen Farben, es gibt sie in vielen Größen, es gibt sie in vielen Geschmacksrichtungen. Sie kommen aus Deutschland, Japan und England: die Kondome! In der Luxus-Kondomerie &quot;Preserwatiwnaja&quot; in der Fußgängerzone Alter Arbat in Moskau drängeln sich die Leute vor den Auslagen. Einer zieht ein Kondom auf einen Kiefernholzzylinder und misst die Länge. Ein anderer sucht ein Gleitmittel. Eine Frau schaut sich amüsiert bunte Büroklammern an, bei deren Umriss auch unschuldigste Gemüter an Kondome denken. Daneben sind Lutscher in der Form von Geschlechtsorganen ausgestellt. Die Verkäuferin, eine blonde Frau mit großen Tattoos auf den Armen, erläutert einer Kundin die Anwendung von Silikon-Gerätschaften für die einsamen Tage, wenn der Partner mal auf Reisen ist. In der Preserwatiwnaja herrscht oft Hochbetrieb. Die Verkäuferin ist zufrieden: &quot;Wir haben ein richtig gutes Jahr hinter uns.&quot;\nRussland im Krieg hat das Liebesleben nicht verlernt. Aber anders, als die Mächtigen es sich wünschen. In Russland boomt der Verkauf von Verhütungsmitteln. Online-Apotheken meldeten 2024 Rekordverkäufe von Kontrazeptiva aller Art. Allein die Verkäufe der Pille sind im Vergleich zum Vorjahr um zehn Prozent gewachsen. Das ärgert den Herrscher. Wladimir Putin predigt seit Langem, dass die Russen mehr Kinder bekommen sollen. Auf der demografischen Krisenkonferenz &quot;Russland, eine große Familie großer Familien&quot; im April 2024 beschwor er sein Volk, viele Kinder zu haben, sei das &quot;neue Normal&quot;. Im Mai gab er einen Erlass heraus, dass die Zahl der Kinder pro Frau wachsen muss, samt Fünfjahresplan bis ins nächste Jahrzehnt: von derzeit 1,4 auf 1,6 Kinder pro Frau im Jahr 2030 und 1,8 Kinder 2036. Das sei eine &quot;Schlüsselfrage&quot; der russischen Staatlichkeit. Auf einer Wirtschaftskonferenz im Herbst 2024 lobte er die Großmütter und forderte, dass es in Russland &quot;Mode werden muss, viele Kinder zu haben, wie in der Zeit, als Familien sieben bis zehn Köpfe zählten&quot;. Das wären fünf bis acht Kinder pro Frau, die Putin sich wünscht.\nDavon ist Russland weiter entfernt als viele andere Länder. Tatsächlich sind die Reproduktionszahlen aus Putins Sicht dramatisch. Jede vierte Ehe in Russland bleibt ohne Nachkommen: Die Zahl kinderloser Ehen ist laut der Statistikbehörde Rosstat 2024 von 17 auf 24 Prozent gestiegen, in Deutschland liegt sie unter 20 Prozent. Allen Putin-Erlassen zum Trotz ist die Geburtenrate erneut um drei Prozent gefallen – auf den niedrigsten Stand seit Putins Anfängen. Russland schrumpft: 2023 gab es 300.000 Russen weniger als im Jahr zuvor, in diesem Jahr werden es noch weniger sein. Und das zu einer Zeit, in der Putin sein Volk so dringend und so zahlreich braucht. Zum Kinderaufziehen zu Hause, zum Kämpfen an der ewigen Front in der Ukraine und zum Besiedeln der immer neuen Territorien, aus denen die Ukrainer in Massen geflohen sind. Putin hat mit seinem Land noch viel vor. &quot;Wir sind schlicht physisch nicht genug!&quot;, schimpfte er in einer Rede bei einem Wirtschaftsforum im September. Doch was sind die Gründe für die geringen Geburtenraten? Was tut der Staat dagegen? Und kann das helfen?\nWie immer, wenn Putin etwas will, überschlagen sich russische Politiker und Bürokraten mit allerlei Initiativen, um den Wunsch des Herrschers stracks in die Tat umzusetzen. Nina Ostanina, Vorsitzende des Parlamentskomitees zum Schutz der Familie, fordert eine &quot;demografische Spezialoperation&quot; in Anlehnung an die &quot;militärische Spezialoperation&quot;, den Putin-Euphemismus für den Krieg. Die Familienpolitikerin Anna Kusnezowa ruft die Frauen auf, im Alter von 20 Jahren mit dem Kinderkriegen anzufangen, dann &quot;können sie locker vier Kinder bekommen und dem nationalen Demografie-Projekt zuarbeiten&quot;. Ein Abgeordneter der Putin-Partei fordert von Frauen, &quot;mal ordentlich zu gebären, solange die Gebärmaschine arbeitet&quot;. Nach einiger Aufregung um das Wort Gebärmaschine befand das Duma-Komitee für Ethik unter dem Vorsitz der 87-jährigen Kosmonautin Walentina Tereschkowa, dass der Ausdruck &quot;nichts Beleidigendes oder Negatives&quot; beinhalte. Der Parlamentspräsident Wjatscheslaw Wolodin erkennt die Ursachen der russischen Kinderarmut in westlicher Propaganda: &quot;Wir müssen die Jugend vor der aufgezwungenen Ideologie der Kinderlosigkeit durch Internet, Medien und Filme schützen.&quot;\nAlso entstehen auch neue Gesetze. Die russische Duma verabschiedete Mitte November ein Verbot der &quot;Propaganda für Kinderlosigkeit&quot;. Damit werden alle öffentlichen Überlegungen, warum man vielleicht auch keine Kinder haben könnte, unter Strafe gestellt. Die Duma hat vor allem die &quot;Childfree-Bewegung&quot; im Visier, die Anhänger in Großbritannien und den USA hat. In Russland war sie vor der politisch erzeugten Erregung völlig unbekannt. Eine ideologische Bewegung für Kinderlosigkeit kennt das Land nicht. Im Gegenteil: Nach Umfragen sagen nur 2,4 Prozent der Russinnen, dass sie keine Kinder haben wollen. Der Rückgang der Geburtenrate ist kein Protest, kein politisches Statement – es sind einfach die Umstände. Es wird also verboten, was es nicht gibt. In Ermangelung von Tätern und Tatbeständen werden Internetforen von Frauen geschlossen, die sich über Schwangerschaft und Geburtsvorbereitung austauschen. Russische Regionen schließen private Kliniken, die Abtreibungen vornehmen. In staatlichen Krankenhäusern warten orthodoxe Priester, die jede Schwangere mit Sermonen über die sündhafte &quot;Tötung des ungeborenen Lebens&quot; beglücken. In den Schulen werden Erstklässler über Putins &quot;traditionelle Familienwerte&quot; aufgeklärt, ältere Schüler schreiben Aufsätze mit dem Thema &quot;Wenn ich Mama (oder Papa) werde&quot;.\nDass es noch andere Gründe geben könnte für das unaufhörliche Sinken der Geburtenrate, so etwas wird nicht diskutiert. Regierungsfreundliche Demografen betonen gern, dass sich die niedrigen Geburtenraten der 1990er-Jahre heute auswirken, weil es schlicht weniger potenzielle Eltern gibt. Aber bei dieser nüchternen Feststellung belassen sie es dann.\nNiemand stellt öffentlich die Frage, ob vielleicht auch der Krieg einen Einfluss haben könne. Für solch eine &quot;Diskreditierung der Armee&quot; kann der Fragesteller schnell ins Gefängnis kommen. Der Überfall auf die Ukraine und das Kriegsgeheul um den Endkampf gegen den Westen haben Teile der Bevölkerung tief verunsichert: Wohin führt dieser Krieg, und warum ist er nach drei Jahren immer noch nicht zu Ende? Der Soziologe Lew Gudkow vom Lewada-Umfragezentrum sagt, dass die russische Bevölkerung stark zwischen Stolz auf die Nation und Angst schwanke. Die vom Propagandafernsehen gefütterten Stolzen seien klar in der Mehrheit. Aber die Zahl derer, die Angst hätten, wachse, zuletzt auf bis zu 38 Prozent. Forscher der Hochschule für Wirtschaft haben Russinnen und Russen gefragt, ob sich ihre Familienplanung seit 2022 geändert habe. Immerhin 30 Prozent haben ihre Kinderpläne aufgeschoben oder gar ganz aufgegeben. Alles potenzielle Kunden der Online-Apotheken und der Preserwatiwnaja.\nAber neben der gefühlten Unsicherheit gibt es vor allem knallharte Alltagsgründe. Russland ist teuer geworden: beim Wohnen, Leben und Essen. Walentina hat zwei Kinder im Grundschulalter. Sie möchte wie die anderen Frauen in den folgenden Absätzen ihren wirklichen Vornamen nicht in der Zeitung lesen. Vor wenigen Jahren kaufte Walentina mit ihrem Mann eine Dreizimmerwohnung auf Kredit. &quot;Kinder brauchen Platz&quot;, sagt sie. Nun aber sind die Zinsen und Preise dermaßen explodiert, dass sie die Wohnung aufgeben mussten. Sie ist mit ihrer Familie zu ihren Eltern gezogen, da leben sie zu sechst auf knapp 70 Quadratmetern. Wenig Platz für die Kinder. &quot;Für viele junge Menschen wirken die hohen Preise total abschreckend&quot;, sagt Walentina. Für eine Familie brauchen die Frauen einen gut bezahlten Job, einen guten Kindergarten und vor allem einen Mann, der mindestens ebenso gut verdient.\nFrauen stellen die Hälfte aller Arbeitenden in Russland, die Kindergärten sind ausreichend, nur Partner zu finden, ist gar nicht so einfach. Der Männerschwund ist eine neue russische Realität, ähnlich wie nach dem Zweiten Weltkrieg, als viele Männer nicht von der Front zurückkamen. Es gibt ein Männerproblem in Russland, in dreifacher Hinsicht. Entweder es gibt sie nicht. Oder es gibt die Falschen. Oder sie sind nicht erreichbar.\nEin beliebtes Restaurant im Moskauer Zentrum, das Moloko in der Bolschaja Dmitrowka, nicht weit vom Bolschoi-Theater. Am Tisch rechts sitzen sechs Frauen und erzählen sich lachend Stell-dir-vor-Geschichten. Am Tisch links sitzen zwei Frauen, die Ellenbogen auf die Platte gestützt, und sprechen leise und ernst miteinander. Die Tische dahinter: Frauen! Dazwischen balanciert ein Kellner Tabletts. Immerhin ein Mann. Wenige Meter die Straße hinauf liegt die Bar Kot Schroedingera. Ein Gewölbe mit braunen Wänden, roten Lampenschirmen und braunen Sesseln. Darin haben es sich junge Frauen in weiten beigen Jacken und Hosen bequem gemacht. Einige tragen Sonnenbrillen im Haar. Vor ihnen Cocktails und Sekt in den Gläsern. Eine Frau bedient. Eine Frau mixt den Cocktail. Zwei Frauen tanzen miteinander. Kein Mann außer mir zu sehen, zumindest an diesem Abend. &quot;Das ist das Problem&quot;, sagt Jewgenija, eine Moskauer Geschäftsfrau Ende 30, glücklich verheiratet. &quot;Es fühlt sich an, als seien die Männer vom Erdboden verschluckt.&quot; Wenn man durch Moskau laufe, könne man nicht mal eben einen Mann kennenlernen. Spätestens seit dem Überfall auf die Ukraine fehlen in Russland junge Männer im öffentlichen Raum. Und Moskau ist noch sehr gut dran, weil die Regierung Soldaten vor allem in den ländlichen Regionen rekrutiert. Die Herausforderung, einen Mann mit Job kennenzulernen, um eine Familie zu gründen, ist in der Provinz noch viel größer. Kennenlernen läuft oft über Dating-Apps, aber die sind mit Vorsicht zu genießen, damit man nicht an den Falschen gerät.\nDie klassische russische Kontaktanzeige hat einen Zusatz: &quot;Suche einen Mann O. S. A.&quot; Das heißt &quot;ohne schädliche Angewohnheiten&quot;, gemeint sind Trinken, Kettenrauchen, Drogen, Gewalt. Auch diese Probleme sind in der Provinz oft krasser als in Moskau. Nach Schätzungen von Menschenrechtsorganisationen sterben jährlich weit über 1.000 russische Frauen an den Folgen häuslicher Gewalt, oft ist Alkohol im Spiel. Galina ist vor dieser Gewalt in die Hauptstadt geflohen. Sie stammt aus einer Provinzstadt in Zentralrussland und erzählt von ihrem ersten Mann, den sie über ihre Nachbarn kennengelernt hatte. An ihrem Geburtstag schlug er sie das erste Mal, mit einem nassen Aufnehmer quer über die Augen. Beim nächsten Mal nahm er die flache Hand, dann die Fäuste. Schlug sie regelmäßig, mehrere Jahre lang. Bis sie endlich Reißaus nahm – und in die große Stadt floh. Heute lebt sie allein in Moskau. Ohne Kinder, ohne Mann, aber in Ruhe und Sicherheit und mit einem guten Job.\nSo einen Job haben auch diese jungmännlichen Gewinnertypen im 5-G-Format: gut aussehend, Gym-gestählt, gute Arbeit, gutes Auto, Geld. Sie ziehen mit gelangweilter Miene durch die Moskauer Restaurants und Bars und werden von den Frauen mit ebenso gelangweilter Miene aus dem Augenwinkel fokussiert. Wer sich umdreht, hat verloren. Doch Vorsicht auch bei dieser Spezies Mann, sagt die Geschäftsfrau Jewgenija. &quot;Die Männer wissen, dass sie in der Minderheit sind und sehr begehrt.&quot; Also seien sie sehr wählerisch und sähen Frauen oft nur als &quot;Vergnügungsobjekt&quot; für ein paar Monate. &quot;Dann wird gewechselt.&quot; Umgekehrt seien auch viele Moskauer Frauen heikel. Ihr Traummann müsse schon 5-G-Format haben, eine schöne Wohnung, in die die superanspruchsvolle Verlobte dann einziehe und die sie mit seinem Geld aufwendig umgestalte. Wer wolle sich so eine schon ins Haus holen? &quot;Und weil das alles so kompliziert ist, studieren viele junge Leute lieber erst mal, suchen sich einen guten Job, verdienen Geld und arbeiten viel. Was das Kinderkriegen nicht so leicht macht.&quot;\nKann es sein, dass die russischen Mächtigen an all diesen wichtigen Gründen für Kinderlosigkeit vorbeisehen? Nicht ganz. Zwei ältere Karrierefrauen erkennen in den Karrierewünschen junger Frauen eine Gefahr für die demografische Entwicklung Russlands. Dabei gehen diese Wünsche nicht auf westliche Propaganda zurück, sondern auf die sowjetische Tradition, Frauen in Arbeit zu bringen. Eine Tradition, die unter Putin von &quot;Familienwerten&quot; verdrängt werden soll. Eine Senatorin aus der Region Tscheljabinsk sagt, Russland solle aufhören, &quot;die Mädchen zu einer höheren Bildung zu bewegen, was am Ende zu nichts führt. Die Suche nach sich selbst zieht sich Jahre hin, und am Ende ist die Gebärfunktion futsch.&quot; Die Direktorin des Moskauer Instituts für Biologie und Biomedizin meint, es sei ein &quot;riesiger Fehler&quot; gewesen, Frauen zu höherer Bildung zuzulassen. Die Frau wolle sich dann bei der Arbeit beweisen, werde Geschäftsfrau oder Professorin. &quot;Und wer bringt die Kinder auf die Welt, wer erzieht sie und bietet ihnen Geborgenheit?&quot;\nIm Gegensatz zu diesen Karrierefrauen warnt der Gesundheitsminister der russischen Region Primorje vor der strikten Teilung der Gesellschaft in Arbeitende und Erziehende. Man könne sowohl hart arbeiten als auch Kinder bekommen, sagte Jewgenij Schestopalow in einem Interview des Föderalexpress. Der Journalist fragte ihn, wann denn Leute, die 12 bis 14 Stunden arbeiteten, und davon gebe es immer mehr in Russland, wann diese Leute ihre Kinder zeugen sollten. &quot;In den Pausen!&quot;, antwortete der Minister kurz und entschieden. Ihm schwebte dabei offenbar das Modell sowjetischer Büros vor, wo der selbstverständlich männliche Chef hinter seinem Schreibtisch eine kleine Tür hatte, die zu einer Kammer mit einem Bett und einem Kühlschrank mit Alkoholika führte. Dort konnte der Chef ausruhen, allein oder in Gesellschaft einer vertrauenswürdigen Mitarbeiterin. Doch dürfte auch dieser promiskuitive Pausenvorschlag an Russlands Demografie-Problem nichts grundsätzlich ändern. Denn das moderne Russland ist nicht die Sowjetunion: Damals waren Kondome Mangelware oder mangelhaft mit Löchern gefertigt. Heute gibt es die Preserwatiwnaja."}, {"id": "s016", "type": "CircE", "definition": "Circumstance error: action and participants are right, but the circumstances are wrong: place, time, manner or condition.", "original": "Mehrere US-Bundesstaaten, darunter Kalifornien und New York, haben Klage gegen Präsident Trumps Dekret zur Abschaffung des Erhalts der US-Staatsbürgerschaft bei Geburt eingereicht. Die Kläger argumentieren, dass das Dekret verfassungswidrig sei. Trump will die automatische Staatsbürgerschaft für Personen streichen, deren Eltern keine US-Bürger oder Bewohner mit dauerhafter Aufenthaltsgenehmigung waren. Die Maßnahme soll am 19. <del>Februar<\/del> in Kraft treten. Trumps Sprecher bezeichnet die Kläger als &quot;&quot;radikale Linke&quot;&quot;. Darüber hinaus erlaubt ein weiteres Dekret von Trump Festnahmen von Migranten ohne gültigen Aufenthaltsstatus an sensiblen Orten wie Kirchen und Schulen, was zuvor untersagt war.", "modified": "Mehrere US-Bundesstaaten, darunter Kalifornien und New York, haben Klage gegen Präsident Trumps Dekret zur Abschaffung des Erhalts der US-Staatsbürgerschaft bei Geburt eingereicht. Die Kläger argumentieren, dass das Dekret verfassungswidrig sei. Trump will die automatische Staatsbürgerschaft für Personen streichen, deren Eltern keine US-Bürger oder Bewohner mit dauerhafter Aufenthaltsgenehmigung waren. Die Maßnahme soll am 19. <ins>März<\/ins> in Kraft treten. Trumps Sprecher bezeichnet die Kläger als &quot;&quot;radikale Linke&quot;&quot;. Darüber hinaus erlaubt ein weiteres Dekret von Trump Festnahmen von Migranten ohne gültigen Aufenthaltsstatus an sensiblen Orten wie Kirchen und Schulen, was zuvor untersagt war.", "title": "Title Not Found", "article": "Mehrere US-Bundesstaaten ziehen wegen der von Präsident Donald Trump angestrebten Abschaffung des Erhalts der US-Staatsbürgerschaft bei Geburt auf dem Boden der USA vor Gericht. 22 Bundesstaaten, darunter die von Demokraten regierten Staaten Kalifornien und New York, reichten am Dienstag bei einem Bundesgericht in Massachusetts Klage ein gegen ein entsprechendes Dekret, das Trump kurz nach seiner Vereidigung am Montag unterzeichnet hatte .\nDas Dekret sei &quot;offenkundig verfassungswidrig und offen gesagt unamerikanisch&quot;, sagte der kalifornische Generalstaatsanwalt Rob Bonta. Das zuständige Gericht müsse das Inkrafttreten dieser Anordnung &quot;sofort blockieren und sicherstellen, dass die Rechte der in den USA geborenen Kinder, die davon betroffen sind, während des Rechtsstreits in Kraft bleiben&quot;.\nTrump habe mit dem Dekret &quot;seine Befugnisse weit überschritten, und wir werden ihn zur Rechenschaft ziehen&quot;, sagte Bonta. &quot;Präsidenten haben breite Macht, aber sie sind keine Könige&quot;, sagte der Generalstaatsanwalt von New Jersey, Matt Platkin. Die Bürgerrechtsorganisation ACLU und andere NGO reichten in New Hampshire ebenfalls eine Klage gegen das Dekret des Rechtspopulisten ein .\nMit seiner Anordnung will Trump\n die automatische Staatsbürgerschaft für Personen streichen, deren \nMütter sich nicht legal in den USA aufhielten oder deren Väter keine \nUS-Bürger oder Bewohner mit dauerhafter Aufenthaltsgenehmigung waren. \nGleiches soll für Personen gelten, deren Mütter zwar legal in den USA \nwaren, aber nur temporär, und deren Väter keine Staatsbürger oder \nPersonen mit dauerhafter Aufenthaltsgenehmigung waren. Die Maßnahme soll\n am 19. Februar in Kraft treten. Unklar ist, ob die Exekutivanordnung \nrückwirkende Folgen für Personen haben würde, die aufgrund ihrer Geburt \nautomatisch US-Staatsbürger wurden.\n\nTrumps Sprecher bezeichnet Kläger als &quot;radikale Linke&quot;\n\nTrump hatte die Maßnahme im Wahlkampf angekündigt. Gegner der Aufhebung verweisen auf \nden 14. Zusatz der US-Verfassung, wonach im Land geborene Menschen \nStaatsbürger sind. Es sei klar, dass dieser Zusatz auch für Menschen \ngelte, deren Eltern zum Zeitpunkt ihrer Geburt keine rechtmäßigen Bürger\n der USA seien. Trump und seine Verbündeten \nziehen die Auslegung des Zusatzes infrage und fordern strengere \nStandards für die Verleihung der Staatsbürgerschaft.\nTrump räumte am Montag auf Nachfrage ein, dass es zu rechtlichen Anfechtungen seines Plans kommen könne. Die Klagen bezeichnete ein Sprecher als &quot;nichts weiter als eine Verlängerung des Widerstands der \nLinken. Radikale Linke können sich entweder dazu entscheiden, gegen den \nStrom zu schwimmen und den überwältigenden Willen des Volkes \nzurückzuweisen, oder sie können mitmachen und mit Präsident Trump zusammenarbeiten&quot;, sagte Harrison Fields, der neue stellvertretende Pressesprecher des US-Präsidialamts.\n\nFestnahmen auch in Kirchen oder Schulen erlaubt\n\nTrump behauptet fälschlicherweise, dass die USA das weltweit einzige Land seien, in dem das sogenannte Geburtsortsprinzip gelte. Tatsächlich gilt es unter anderem auch in den US-Nachbarländern Kanada und Mexiko . Seit dem Jahr 2000 greift auch für in Deutschland geborene Kinder ausländischer Eltern das Geburtsortsprinzip.\nTrump hatte nach seinem Amtsantritt diverse Dekrete zur Eindämmung irregulärer Migration unterzeichnet. Wie das Heimatschutzministerium mitteilte, soll die Einwanderungsbehörde ICE Migranten ohne gültigen \nAufenthaltsstatus auch wieder an oder in der Nähe sogenannter sensibler Orte in \nGewahrsam nehmen dürfen. Dazu zählen etwa \nKirchen, Schulen oder Krankenhäuser. Dies ist den Beamten seit 2011 \nuntersagt. Die Regierung des demokratischen US-Präsidenten Joe Biden \nhatte die Regelung noch ausgeweitet und die Befugnisse der Behörde \nweiter eingeschränkt.\n&quot;Kriminelle werden sich nicht mehr in \nAmerikas Schulen und Kirchen verstecken können, um einer Festnahme zu \nentgehen&quot;, teilte das Heimatschutzministerium nun mit. Trumps\n Regierung werde den Beamten nicht &quot;die Hände binden&quot; und vertraue \nstattdessen darauf, dass diese &quot;ihren gesunden Menschenverstand&quot; \neinsetzten."}, {"id": "s023", "type": "CircE", "definition": "Circumstance error: action and participants are right, but the circumstances are wrong: place, time, manner or condition.", "original": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor <del>vier<\/del> Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "modified": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor <ins>fünf<\/ins> Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "title": "Anführer ultrarechter Gruppen aus Gefängnissen entlassen", "article": "Donald Trump hat seinen Amtseid als 47. Präsident der Vereinigten Staaten abgelegt. Es ist bereits seine zweite Amtszeit, er war auch von 2017 bis 2021 US-Präsident.\nDie Zeremonie fand wegen frostiger Temperaturen im Kapitol statt. Den Sitz des US-Kongresses hatten wütende Trump-Anhänger vor vier Jahren gestürmt.\nKurz nach seinem Amtsantritt unterzeichnete Trump zahlreiche Dekrete , die unter anderem eine Begnadigung der Kapitolstürmer, eine Abschaffung des Birthrights und einen Austritt aus dem Pariser Klimaabkommen vorsehen.\nAlle Artikel zum Thema finden Sie auf unserer Themenseite zum neuen US-Präsidenten .\nNeben eigenen Recherchen verwenden wir auch Material der Nachrichtenagenturen dpa, AP, AFP, KNA und Reuters."}, {"id": "s025", "type": "CircE", "definition": "Circumstance error: action and participants are right, but the circumstances are wrong: place, time, manner or condition.", "original": "Die Bundesagentur für Arbeit (BA) vermeldet ein Jahr nach Einführung des sogenannten Jobturbo Fortschritte bei der Arbeitsmarktintegration von Ukrainern in Deutschland.\n\nIm <del>August<\/del> 2024 lebten laut Ausländerzentralregister etwa 1,3 Millionen Ukrainerinnen und Ukrainer in Deutschland, die meisten davon als Kriegsflüchtlinge.\n\nVon den rund 768.000 Ukrainern im erwerbsfähigen Alter haben nach neuen BA-Daten mehr einen Job angenommen als noch vor einem Jahr.\n\nIm August 2023 zählten noch etwa 197.660 Ukrainer in Arbeit, ein Jahr später waren es bereits etwa 272.400 Ukrainer in geringfügigen und sozialversicherungspflichtigen Jobs.\n\nDer Jobturbo sollte ursprünglich 200.000 Ukrainern in Deutschland zu einem Arbeitsplatz verhelfen.", "modified": "Die Bundesagentur für Arbeit (BA) vermeldet ein Jahr nach Einführung des sogenannten Jobturbo Fortschritte bei der Arbeitsmarktintegration von Ukrainern in Deutschland.\n\nIm <ins>September<\/ins> 2024 lebten laut Ausländerzentralregister etwa 1,3 Millionen Ukrainerinnen und Ukrainer in Deutschland, die meisten davon als Kriegsflüchtlinge.\n\nVon den rund 768.000 Ukrainern im erwerbsfähigen Alter haben nach neuen BA-Daten mehr einen Job angenommen als noch vor einem Jahr.\n\nIm August 2023 zählten noch etwa 197.660 Ukrainer in Arbeit, ein Jahr später waren es bereits etwa 272.400 Ukrainer in geringfügigen und sozialversicherungspflichtigen Jobs.\n\nDer Jobturbo sollte ursprünglich 200.000 Ukrainern in Deutschland zu einem Arbeitsplatz verhelfen.", "title": "Mehr ukrainische Flüchtlinge nehmen Arbeit auf", "article": "Etwa ein Jahr nach Start des sogenannten Jobturbos der Bundesregierung sieht die Bundesagentur für Arbeit (BA) Fortschritte bei der Arbeitsmarktintegration von Ukrainern. &quot;Mit dem Jobturbo haben wir einen Schritt nach vorne gemacht&quot;, sagte BA-Vorstand Daniel Terzenbach dem RedaktionsNetzwerk Deutschland (RND).\nNach Angaben der Bundesagentur für Arbeit ( PDF ) lebten laut Ausländerzentralregister Ende August 2024 1,3 Millionen Ukrainerinnen und Ukrainer in Deutschland. Die große Mehrheit sind Kriegsflüchtlinge. Von den geflüchteten Ukrainern sind nach Zahlen der Bundesagentur für Arbeit, aus denen die Bundesregierung im Oktober zitierte ,\n\n 768.000 im \nerwerbsfähigen Alter.\nVon diesen knapp 770.000 Ukrainern im erwerbsfähigen Alter haben nach neuen BA-Daten im Vergleich zum Vorjahr mehr einen Job angenommen. Im August 2023 – damals lag die Zahl aller Ukrainer in Deutschland noch bei 1,2 Millionen – zählte die Behörde noch 197.660 Ukrainer in Arbeit, ein Jahr später waren insgesamt 272.400 Ukrainer in geringfügigen und sozialversicherungspflichtigen Jobs.\n\n&quot;Jobturbo&quot; sollte 200.000 Ukrainer in Jobs bringen\n\nAuch die monatliche Zahl von Ukrainern, die aus der Arbeitslosigkeit in \nJobs auf dem sogenannten ersten Arbeitsmarkt gewechselt sind, ist \ndemnach gestiegen. 2023 zählte die BA insgesamt 36.661 Abgänge \nukrainischer Staatsangehöriger in den Arbeitsmarkt. 2024 (bis \neinschließlich Oktober) waren es 62.810 Abgänge. Darunter fallen auch \n(außer-)betriebliche Ausbildungen und Selbstständigkeit.\nMit diesem Anstieg von bislang insgesamt etwa 137.000 Arbeitsaufnahmen im Jahr 2024 zeichnet sich ein geringerer Anstieg ab, als sich die Bundesregierung von ihrem sogenannten Jobturbo-Programm für ukrainische Flüchtlinge vorgenommen hatte. Bundesarbeitsminister Hubertus Heil hatte vor einem Jahr angekündigt, mit dem Programm sollten im Jahr 2024 200.000 Ukrainer direkt in einen Job vermittelt und 500 Millionen Euro gespart werden.\n&quot;Es ist heute viel wahrscheinlicher, dass Ukrainerinnen und Ukrainer in \nArbeit kommen als vor dem Jobturbo&quot;, sagte BA-Vorstand Terzenbach, der auch \nSonderbeauftragter für die Arbeitsmarktintegration Geflüchteter war. &quot;Aber es gibt auch noch Luft nach oben.&quot;\n\nStreit über Bürgergeld für Ukraine-Flüchtlinge\n\nNach Zahlen des Instituts für Arbeitsmarkt- und Berufsforschung (IAB) vom August liegt Deutschland bei der Beschäftigungsquote geflüchteter Ukrainer\n im europäischen Mittelfeld: 27 Prozent von ihnen gingen demnach einer Arbeit \nnach . Am höchsten sei die Quote in Litauen, Dänemark und Polen mit \njeweils 57, 53 und 48 Prozent. Finnland, Norwegen und Spanien \nverzeichnen hingegen niedrige Quoten unter 20 Prozent, in Rumänien \narbeiten demnach nur sieben Prozent der Geflüchteten.\nDie große Mehrheit der in Deutschland lebenden ukrainischen Flüchtlinge bekommt Bürgergeld. Darüber gab es in der Politik immer wieder Streit. Heil hatte damals gesagt, es sei &quot;an der Zeit, eine Arbeit aufzunehmen&quot;, das Bürgergeld kein &quot;bedingungsloses \nGrundeinkommen&quot;.\nIm Sommer, vor den Landtagswahlen in Sachsen, Thüringen und Brandenburg, kam die Diskussion erneut auf. Die damals noch im Bund mitregierende FDP und die größte Oppositionsfraktion Union hatten gefordert, geflüchteten Ukrainern statt Bürgergeld geringere Sozialleistungen nach dem Asylbewerberleistungsgesetz zu zahlen.\nAber auch Brandenburgs Ministerpräsident Dietmar Woidke von der SPD hatte das B ürgergeld für ukrainische Flüchtlinge infrage gestellt . Sein Innenminister Michael Stübgen (CDU) argumentierte, das Bürgergeld sei zum &quot;Bremsschuh für die Arbeitsaufnahme&quot; geworden. Die Bundesregierung wies die Kürzungsforderungen damals zurück .\nDie Autoren der IAB-Studie vom Sommer sehen das Bürgergeld nicht als entscheidenden Grund, der ukrainische Flüchtlinge an einer Arbeitsaufnahme hindere . Vielmehr seien unter anderem Fragen, wie stark der Arbeitsmarkt reguliert ist, und der Zugang zu Kinderbetreuung und Gesundheitsversorgung entscheidende Faktoren. Die große Mehrheit der ukrainischen Kriegsflüchtlinge sind Frauen und Kinder."}, {"id": "s026", "type": "CircE", "definition": "Circumstance error: action and participants are right, but the circumstances are wrong: place, time, manner or condition.", "original": "Die Linke verdankt ihre ständige Präsenz im Bundestag seit 1990 vor allem Petra Pau und Gesine Lötzsch, die <del>2002<\/del> trotz des Scheiterns ihrer Partei an der Fünf-Prozent-Hürde direkt gewählt wurden. Die Grundmandatsklausel ermöglichte es damals, dass sie einzogen. Heute gilt jedoch, dass eine Partei mindestens drei Direktmandate benötigt, um trotz eines Scheiterns an der Fünf-Prozent-Hürde in den Bundestag einzuziehen. Dies betrifft auch prominente Kandidaten wie Sahra Wagenknecht. Andere Parteien wie die Freien Wähler hoffen ebenfalls, über die Grundmandatsklausel in den Bundestag zu gelangen. Die CSU könnte dagegen aufgrund des neuen Wahlrechts negative Auswirkungen erleben, da nur die erfolgreichsten Direktkandidaten einziehen dürfen.", "modified": "Die Linke verdankt ihre ständige Präsenz im Bundestag seit 1990 vor allem Petra Pau und Gesine Lötzsch, die <ins>2003<\/ins> trotz des Scheiterns ihrer Partei an der Fünf-Prozent-Hürde direkt gewählt wurden. Die Grundmandatsklausel ermöglichte es damals, dass sie einzogen. Heute gilt jedoch, dass eine Partei mindestens drei Direktmandate benötigt, um trotz eines Scheiterns an der Fünf-Prozent-Hürde in den Bundestag einzuziehen. Dies betrifft auch prominente Kandidaten wie Sahra Wagenknecht. Andere Parteien wie die Freien Wähler hoffen ebenfalls, über die Grundmandatsklausel in den Bundestag zu gelangen. Die CSU könnte dagegen aufgrund des neuen Wahlrechts negative Auswirkungen erleben, da nur die erfolgreichsten Direktkandidaten einziehen dürfen.", "title": "Das Modell Pau-Lötzsch hat ausgedient", "article": "Dass die Linke von sich behaupten kann, seit 1990 stets im Bundestag vertreten gewesen zu sein, verdankt sie vor allem zwei Frauen: Petra Pau und Gesine Lötzsch. Die beiden gewannen 2002 ihre Berliner Wahlkreise direkt und zogen als einzige Vertreterinnen der PDS wieder in den Bundestag ein, obwohl ihre Partei damals an der Fünf-Prozent-Hürde gescheitert war.\nDie beiden Frauen sorgten so für eine gewisse parlamentarische Kontinuität, bevor ihrer Partei dann bei der vorgezogenen Bundestagswahl 2005 der fulminante Wiedereinzug gelang: Gemeinsam mit der SPD-Abspaltung WASG erreichte das neue Bündnis Linkspartei.PDS Dank der Schröderschen Hartz-Reformen 8,7 Prozent.\nDerzeit kämpft die Linke erneut um ihre Existenz. Doch was damals funktionierte, wäre heute nicht mehr möglich. Zwar hat das Bundesverfassungsgericht im vergangenen Juli die Wahlrechtsreform der Ampelparteien korrigiert. Es setzte die Grundmandatsklausel wieder in Kraft, die SPD, Grüne und FDP abschaffen wollten. Auch bei der kommenden Wahl gilt daher: Wenn eine Partei drei Direktmandate gewinnt, darf sie in der Höhe ihres Zweitstimmenergebnisses in den Bundestag einziehen, selbst wenn sie insgesamt unter fünf Prozent bleibt.\n\nZwei reichen nicht\n\nAnders als früher dürfen aber nicht mehr automatisch alle siegreichen Direktkandidaten auch in den Bundestag einziehen. &quot;Scheitert eine Partei an der Fünf-Prozent-Hürde, erhält aber trotzdem in ein oder zwei Wahlkreisen die meisten Erststimmen, dürfen die Gewinner ihr Bundestagsmandat nicht antreten&quot;, sagte der Politologe Frank Biermann. Dies sei in der Öffentlichkeit jedoch kaum bekannt. Deswegen werde irrtümlich gelegentlich davon ausgegangen, dass sehr prominente Vertreter ihrer Parteien wie beispielsweise Sahra Wagenknecht auch alleine in den Bundestag einziehen könnten, wenn sie es schafften, ihren Wahlkreis zu gewinnen.\nDass dies nicht so ist, bestätigt auch die Bundeswahlleiterin. &quot;Erreichen nur ein oder zwei Wahlkreiskandidierende einer Partei in ihrem Wahlkreis die Erststimmenmehrheit, bleiben die Partei und auch die beiden besagten Kandidierenden bei der Sitzverteilung unberücksichtigt&quot;, erläutert ein Sprecher der Behörde. Immer vorausgesetzt natürlich, die Partei liegt insgesamt unter fünf Prozent.\nZu tun hat das allerdings nicht mit der jüngsten Wahlrechtsreform, wie der Jurist Christian Kirchberg im Gespräch mit ZEIT ONLINE klarstellte. Kirchberg hatte gemeinsam mit Gregor Gysi die Wahlrechtsreform der Ampelkoalition vor dem Bundesverfassungsgericht angefochten. Pau und Lötzsch hätten vielmehr von einer Unklarheit im damaligen Wahlrecht profitiert, die der Gesetzgeber im Auftrag des Bundesverfassungsgerichts bereits 2011 beseitigt hatte, sagt Kirchberg.\nZwei Ausnahmen gibt es allerdings: Handelt es sich um die Partei einer nationalen Minderheit wie etwa den Südschleswigschen Wählerverband (SSW), in dem die in Schleswig-Holstein lebenden Dänen organisiert sind, dürfen erfolgreiche Direktkandidaten doch in den Bundestag einziehen, auch wenn es weniger als drei sind oder wenn die Partei unter fünf Prozent bleibt. Der SSW ist derzeit mit einem Abgeordneten im Bundestag vertreten.\nAuch Kandidaten, die entweder keiner Partei angehören oder unabhängig von ihrer Partei antreten, dürften ihr Mandat wahrnehmen, wenn sie in ihrem Wahlkreis die Mehrheit der Erststimmen gewinnen. Derzeit tritt etwa in Westthüringen der AfD-Bundestagsabgeordnete Klaus Stöber unabhängig von seiner Partei an, weil diese ihn nicht als Direktkandidaten aufstellte. Sollte er seinen Wahlkreis gewinnen, dürfte er auch in den Bundestag einziehen.\n\nFreie Wähler hoffen auf Grundmandatsklausel\n\nAnders könnte es dagegen bei einigen Kandidaten sowohl der Linken, der Freien Wähler oder auch des BSW sein – denn diese wurden alle von ihren jeweiligen Parteien nominiert. Bei der Linken werden vor allem Ex-Fraktionschef Gysi gute Chancen nachgesagt, seinen Berliner Wahlkreis wie bei den vergangenen fünf Bundestagswahlen erneut direkt zu gewinnen. Das Gleiche gilt auch für den Chef der Linkengruppe im Bundestag, Sören Pellmann aus Leipzig, der der Linken schon bei der vergangenen Wahl das parlamentarische Überleben sicherte. In Thüringen kämpft Ex-Ministerpräsident Bodo Ramelow um ein Direktmandat. Er war dort stets weit beliebter als seine Partei und hat deswegen durchaus gute Chancen, seinen Wahlkreis zu gewinnen. Doch wirklich erfolgreich sein können sie eben nur, wenn sie mindestens zu dritt sind.\nAuch die Freien Wähler hoffen derzeit, über die Grundmandatsklausel in den Bundestag einzuziehen. Sie treten in Bayern mit ihrem Bundesvorsitzenden, dem bayerischen Wirtschaftsminister und stellvertretenden Ministerpräsidenten Hubert Aiwanger an, der bereits bei der vergangenen Landtagswahl eines von zwei bayerischen Direktmandaten gewann. Derzeit stehen die Freien Wähler bei zwei bis 3,5 Prozent. Auch Aiwanger ist deshalb darauf angewiesen, dass außer ihm noch mindestens zwei weitere FW-Kandidaten erfolgreich sind. Ausgeschlossen ist das nicht. Denn neben ihm bewerben sich in Bayern zwei FW-Landräte und ein Bürgermeister um ein Direktmandat und damit Menschen, die zumindest auf lokaler Ebene gut vernetzt und bekannt sind.\nBeim BSW hat anders, als vielleicht viele denken, nicht Sahra Wagenknecht, sondern Ex-Fußballmanager Oliver Ruhnert von Union Berlin die besten Chancen auf ein Direktmandat. Er tritt in der ehemaligen Linkenhochburg Marzahn-Hellersdorf an. Bei der Europawahl wurde das BSW dort stärkste Kraft. Parteichefin Sahra Wagenknecht tritt dagegen erst gar nicht in einem Wahlkreis an, sondern nur auf Platz eins der nordrhein-westfälischen Landesliste. &quot;Wir setzen nicht auf die Grundmandatsklausel, sondern werben um die Zweitstimme, um auf über fünf Prozent zu kommen&quot;, sagt ein Sprecher des BSW.\n\nAuch CSU muss leiden\n\nNegative Folgen könnte das neue Wahlrecht allerdings auch für erfolgreiche CSU-Direktkandidaten haben. Allerdings nicht, weil es von ihnen zu wenige, sondern weil es zu viele geben könnte. Bis zur Wahl 2021 galt: Gewinnt eine Partei mehr Direktmandate, als ihr nach ihrem Zweitstimmenergebnis zustehen, durften trotzdem alle Wahlkreissieger in den Bundestag einziehen. Die anderen Parteien erhielten dafür Ausgleichsmandate. Dadurch allerdings wurde der Bundestag immer größer. Genau das wollte die Ampel mit der Wahlrechtsreform verhindern.\nKünftig erhält eine Partei deswegen nur so viele Mandate, wie ihr nach ihrem Zweitstimmenergebnis zustehen. Gibt es mehr erfolgreiche Wahlkreisgewinner, was bei der CSU in Bayern der Fall sein könnte, ziehen nur die mit den meisten Stimmen von ihnen auch tatsächlich in den Bundestag ein. Die mit den schwächsten Erststimmenergebnissen müssen draußen bleiben.\nDas führt zu ganz neuen Formen der Wahlwerbung. So argumentierte der Grünenbundestagsabgeordnete Dieter Janecek unlängst auf X , wer wolle, dass der Wahlkreis München-West/Mitte auch künftig durch einen direkt gewählten Kandidaten im Bundestag vertreten sei, solle doch bitte mit der Erststimme Grün, also ihn, wählen. Beim letzten Mal gewann zwar sein Konkurrent von der CSU, bayernweit allerdings mit einem der schlechtesten Erststimmenergebnisse der CSU. Diesmal könnte er also bei einem sehr knappen Wahlsieg ganz scheitern. Dass wirklich viele Wählerinnen und Wähler die Wahlrechtsreform schon so weit durchdrungen haben, dass sie derartige taktische Überlegen anstellen, erscheint allerdings fraglich."}];
const KEY = "annotation-" + NAME;
const QUESTIONS = [
  {id: "q1", text: "1. How many changes are there?", hint: "Several words can be one change, if they belong to one error. A second, unrelated edit is \"more than one\".", opts: ["one", "none", "more than one"]},
  {id: "q2", text: "2. Is the change of the asked error type?", hint: "For faithfulness types the changed statement must also be wrong compared to the article. A weaker but still true statement is \"no\".", opts: ["yes", "no", "unclear"]},
  {id: "q3", text: "3. Is the changed part correct German?", hint: "Grammar and spelling of the changed or added words.", opts: ["yes", "no"]},
  {id: "q4", text: "4. How severe is the error?", hint: "high: changes the main claim. medium: a wrong secondary fact. low: a small detail. For coverage types: how important is the deleted sentence, or how much does the added sentence distract.", opts: ["low", "medium", "high"]},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

// Which questions need an answer: none after "none" in question 1, and no German check for GramE (it is wrong on purpose).
function asked(item, a) {
  return QUESTIONS.filter(q => q.id === "q1" || (a.q1 !== "none" && !(q.id === "q3" && item.type === "GramE")));
}
function complete(item) {
  const a = answers[item.id] || {};
  return asked(item, a).every(q => a[q.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const need = asked(item, a).map(q => q.id);
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Output ${pos + 1} of ${ITEMS.length} · ${done} done`;
  let h = `<div class="type">Asked error type: <b>${item.type}</b><br>${item.definition}</div>`;
  h += `<h2>Modified summary (new words marked)</h2><div class="text">${item.modified}</div>`;
  h += `<h2>Original summary (removed words marked)</h2><div class="text">${item.original}</div>`;
  h += `<h2>Article</h2><details><summary>${item.title || "Show the article"}</summary><div class="article">${item.article}</div></details>`;
  for (const q of QUESTIONS) {
    const on = need.includes(q.id);
    h += `<div class="q${on ? "" : " skip"}"><p>${q.text}</p><small>${on ? q.hint : "Not needed for this output."}</small><div class="opts">`;
    for (const o of q.opts) h += `<button data-q="${q.id}" data-o="${o}" class="${a[q.id] === o && on ? "on" : ""}" ${on ? "" : "disabled"}>${o}</button>`;
    h += `</div></div>`;
  }
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All outputs done.</span>' : `${ITEMS.length - done} outputs left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {}, row = {};
    for (const q of asked(item, a)) if (a[q.id]) row[q.id] = a[q.id];
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  const id = ITEMS[pos].id;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: b.dataset.o});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
render();
</script>
</body>
