const NAME = "Anton";
const ITEMS = [{"id": "s027", "summary": "Die bekannte Psychologin Stefanie Stahl ist zu Gast bei Alles gesagt?, dem unendlichen Podcast, wo sie über Neurosen, Einsamkeit, Selbstreflexion, Rechtspopulismus und mehr spricht. <ins>Ein Podcast ist ein digitales Audioformat.<\/ins> Stahl, geboren 1963 in Hamburg, ist Autorin des Bestsellers &quot;Das Kind in dir muss Heimat finden&quot; und Gastgeberin des Podcasts &quot;Stahl aber herzlich&quot;. In der 4-stündigen Folge teilt sie ihre Erfahrungen mit Patienten, analysiert die Gesellschaft in Deutschland und betont, dass Männer ihre schwierigste Zielgruppe sind.", "original": "Die bekannte Psychologin Stefanie Stahl ist zu Gast bei Alles gesagt?, dem unendlichen Podcast, wo sie über Neurosen, Einsamkeit, Selbstreflexion, Rechtspopulismus und mehr spricht. Stahl, geboren 1963 in Hamburg, ist Autorin des Bestsellers &quot;Das Kind in dir muss Heimat finden&quot; und Gastgeberin des Podcasts &quot;Stahl aber herzlich&quot;. In der 4-stündigen Folge teilt sie ihre Erfahrungen mit Patienten, analysiert die Gesellschaft in Deutschland und betont, dass Männer ihre schwierigste Zielgruppe sind.", "title": "Podcast &quot;Alles gesagt?&quot;: Stefanie Stahl, was will das Kind in uns?", "article": "Die bekannteste Psychologin Deutschlands, die Bestsellerautorin und Podcasterin Stefanie Stahl ist zu Gast bei Alles gesagt?, dem unendlichen Podcast.\nStefanie Stahl spricht über Neurosen und Einsamkeit, Selbstreflexion und Rechtspopulismus, Hausgeister und Psychotainment, über ihre, wie sie sagt, &quot;unspießigen Eltern&quot; – und über ihre glückliche Kindheit, die schlagartig vorbei war, als das Haus ihrer Eltern abbrannte.\nStefanie Stahl wurde 1963 in Hamburg geboren, sie heißt mit zweitem Vornamen Desiree, &quot;weil ich ein Wunschkind war&quot;. Stahl lebt seit ihrem Studium in den 1980er-Jahren in Trier. Seit 1994 führt sie dort eine Praxis für Psychotherapie. Ihr Buch Das Kind in dir muss Heimat finden erschien 2015 und wurde zu einem der erfolgreichsten Sachbücher der vergangenen zehn Jahre, es hat sich bis mehr als 3,8 Millionen mal verkauft und wurde in 36 Ländern veröffentlicht. Seit 2021 ist sie auch Gastgeberin des Podcast Stahl aber herzlich .\nIm Podcast erzählt Stefanie Stahl von ihren Erfahrungen mit Patientinnen und Patienten, den psychologischen Folgen der Pandemie, gestressten Kindern und jungen Eltern, von ihrer Analyse der Gesellschaft in Deutschland, und sie beantwortet die Frage, ob wir in unserem Leben immer dieselbe Person sind. Ihre schwierigste Zielgruppe? &quot;Männer.&quot; Nach 4 Stunden und 40 Minuten beendet Stefanie Stahl das Gespräch, denn das kann bei Alles gesagt? nur die Gästin.\nProduktion: Pool Artists Redaktion: Hannah Schraven, Vincent Mank, Sophie Hübner, Sophia Hubel Gästemanagement: Anna Vahldick\nAlle Folgen unseres Podcasts finden Sie hier . Fragen, Kritik, Anregungen? Schreiben Sie eine Mail an allesgesagt@zeit.de ."}, {"id": "s021", "summary": "<del title=\"removed\">Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten.<\/del> Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber zuversichtlich, dass eine Lösung gefunden wird.", "original": "Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten. Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber zuversichtlich, dass eine Lösung gefunden wird.", "title": "SPD-Politiker werfen Olaf Scholz Blockade der Ukrainehilfen vor", "article": "Mehrere SPD-Politiker haben Bundeskanzler Olaf Scholz&#x27; Weigerung kritisiert, noch vor der Bundestagswahl weitere Unterstützung für die Ukraine in Höhe von drei Milliarden Euro für Waffenlieferungen auf den Weg zu bringen. Kriege richteten sich nicht nach Wahlen, zitiert der Spiegel den SPD -Haushalts- und Verteidigungspolitiker Andreas Schwarz: &quot;Wenn es unter den demokratischen Kräften im Bundestag eine Mehrheit gibt für ein zusätzliches Hilfspaket für die Ukraine, sollten wir das noch vor der Bundestagswahl beschließen.&quot;\nSchwarz forderte einen Schulterschluss im Parlament auch mit CDU und CSU: &quot;Allerdings sollte sich dann auch die Union klar dazu bekennen, die überplanmäßige Ausgabe von drei Milliarden Euro mitzutragen&quot;, sagte er. Schwarz ist im Haushaltsausschuss Berichterstatter für den Etat des Verteidigungsministeriums und das Sondervermögen Bundeswehr und gehört als stellvertretendes Mitglied dem Verteidigungsausschuss an.\nScholz lehnt Einsparungen an anderer Stelle für die Finanzierung weiterer Waffenlieferungen in die Ukraine ab.\nSchäfer: Nicht auf Zeit spielen\nDer SPD-Verteidigungspolitiker Kristian Klinck sagte dem Magazin, nur die Kombination aus Unterstützung der Ukraine und Diplomatie werde einen stabilen Waffenstillstand näherbringen. &quot;Ich rate dazu, das Hilfspaket auf den Weg zu bringen.&quot; Ob dies durch eine außerplanmäßige Ausgabe aus dem Bundeshaushalt geschehe oder durch die Nutzung des von den G7-Staaten zur Verfügung gestellten Kredits geschehe, &quot;sollte aufgrund rein sachlicher Erwägungen entschieden werden&quot;.\nDer Grünenpolitiker Sebastian Schäfer forderte Scholz und den SPD-Fraktionsvorsitzenden Rolf Mützenich auf, ihre Blockadehaltung zu überdenken. &quot;In dieser Frage auf Zeit zu spielen, ist angesichts der Lage in der Ukraine schlicht verantwortungslos&quot;, sagte Schäfer, der Mitglied im Haushaltsausschuss und stellvertretender Vorsitzender des Gremiums zum Sondervermögen für die Bundeswehr ist.\nVerteidigungsminister Boris Pistorius nahm seinen Parteifreund Scholz hingegen in Schutz. &quot;Ich sehe keinerlei Grund anzunehmen, dass der Bundeskanzler hier bremst&quot;, sagte er in den ARD- Tagesthemen . Pistorius verwies darauf, dass es für 2025 noch keinen regulären Bundeshaushalt gebe und der Bund daher mit einer vorläufigen Haushaltsführung agiere. &quot;Es ist nicht trivial, das Geld aufzutreiben&quot;, sagte er im heute-journal des ZDF. Zudem zeigte Pistorius sich zuversichtlich, dass zeitnah eine Lösung gefunden werde. Er hoffe darauf in den nächsten Tagen, sagte er."}, {"id": "s009", "summary": "Israel und die Hamas haben sich auf eine Waffenruhe und die Freilassung von Geiseln geeinigt, Details müssen noch festgelegt werden. Die Vereinbarung soll am Sonntag in Kraft treten, in einer ersten Phase sollen 33 Geiseln freigelassen werden. Israel geht von 98 Verschleppten aus, darunter Personen mit Deutschlandbezug. Im Gegenzug sollen palästinensische Häftlinge freikommen. Die Waffenruhe umfasst drei Phasen, darunter die Rückkehr von Vertriebenen und die Lieferung von Hilfsgütern nach Gaza. Der Grenzübergang Rafah soll bereits am Donnerstagmorgen geöffnet werden. Das Rote Kreuz und die UN bieten Unterstützung bei der Umsetzung der Waffenruhe an. <ins>Die Vereinbarung sieht außerdem vor, dass internationale Beobachter an den Übergängen die Verteilung der Hilfsgüter dokumentieren.<\/ins>", "original": "Israel und die Hamas haben sich auf eine Waffenruhe und die Freilassung von Geiseln geeinigt, Details müssen noch festgelegt werden. Die Vereinbarung soll am Sonntag in Kraft treten, in einer ersten Phase sollen 33 Geiseln freigelassen werden. Israel geht von 98 Verschleppten aus, darunter Personen mit Deutschlandbezug. Im Gegenzug sollen palästinensische Häftlinge freikommen. Die Waffenruhe umfasst drei Phasen, darunter die Rückkehr von Vertriebenen und die Lieferung von Hilfsgütern nach Gaza. Der Grenzübergang Rafah soll bereits am Donnerstagmorgen geöffnet werden. Das Rote Kreuz und die UN bieten Unterstützung bei der Umsetzung der Waffenruhe an.", "title": "", "article": "Nach der grundsätzlichen Einigung zwischen Israel und der Hamas auf eine Waffenruhe und die Freilassung von Geiseln müssen Details der Absprache noch festgezurrt werden. An letzten Einzelheiten des Abkommens wurde nach Worten des\n israelischen Regierungschefs Benjamin Netanjahu noch in der Nacht gearbeitet. Die \nVereinbarung muss am Donnerstag auch noch von der israelischen Regierung und \ndem Sicherheitskabinett gebilligt werden. Israels Staatspräsident Izchak Herzog hat dazu aufgerufen, dem Waffenruheabkommen mit der Hamas zuzustimmen. Dies ist bisher bekannt:\nDie Vereinbarung soll laut Katars Ministerpräsident Mohammed Al Thani am 466. Tag nach Kriegsbeginn in Kraft treten und in einer ersten Phase 42 Tage dauern. Das ist  am Sonntag um 12.15 Uhr (11.15 Uhr MEZ).\nIn diesen ersten sechs Wochen sollen 33 der Geiseln aus der Gewalt der Hamas freigelassen werden, darunter Frauen, Soldatinnen, Minderjährige sowie ältere und kranke Menschen. Israels Streitkräfte sollen sich teilweise aus dem Gazastreifen zurückziehen, vertriebene Palästinenser in den Norden des Gebiets heimkehren dürfen. In späteren Schritten soll es zur Freilassung der verbleibenden Geiseln und zum dauerhaften Waffenstillstand kommen. Israel geht noch von 98 \nVerschleppten im Gazastreifen  aus, von denen mindestens 34 tot sein dürften. Dem Auswärtigen Amt in Berlin zufolge ist unter den Geiseln auch eine\n &quot;niedrige zweistellige Anzahl von Personen mit Deutschlandbezug&quot;.\nIm Gegenzug sollen erneut palästinensische Häftlinge aus israelischen Gefängnissen freikommen. Al Thani nannte dazu bisher keine Zahl. Ein israelischer Regierungsvertreter hatte von Hunderten Häftlingen gesprochen, die freikommen sollten.\n\nWaffenruhe umfasst drei Phasen\n\nIn der ersten der insgesamt drei Phasen sollen Vertriebene in ihre Wohnorte in dem Küstengebiet zurückkehren können und mehr der dringend benötigten Hilfsgüter nach Gaza geliefert werden, sagte Al Thani. Die humanitäre Hilfe soll umgehend deutlich aufgestockt werden. Auf Details der zweiten und dritten Phase wollen sich die Konfliktparteien Al Thani zufolge während der ersten Phase einigen.\nDer Grenzübergang Rafah zwischen Ägypten und dem Gazastreifen soll Sicherheitskreisen zufolge bereits an diesem Donnerstagmorgen wieder eröffnet werden. Einem Vertreter des ägyptischen Roten Halbmonds im Nord-Sinai zufolge wiesen die Behörden die ägyptische und palästinensische Seite an, den Grenzübergang von beiden Seiten zu öffnen. 600 Lastwagen mit Hilfslieferungen seien für die Einfuhr vorbereitet worden.\nDas Rote Kreuz bot seine Unterstützung bei der Umsetzung des neuen Waffenruheabkommens an. Während einer ersten Waffenruhe im November 2023 hatte das IRK als  neutrale Instanz die Rückkehr von 109 Hamas-Geiseln nach Israel und die Freilassung von 154 palästinensischen Häftlingen aus israelischen Gefängnissen unterstützt.\nDie Vereinten Nationen boten ebenfalls an, Israel und die Hamas bei der Umsetzung der vereinbarten Waffenruhe zu unterstützen. Die UN würden &quot;die Lieferung von anhaltender humanitärer Hilfe  an die unzähligen Palästinenser, die weiter leiden, hochfahren&quot;, sagte UN-Generalsekretär António Guterres.\nVerfolgen Sie weitere Entwicklungen zur Situation in Nahost in unserem Liveblog ."}, {"id": "s011", "summary": "Der Naturschutzbund in Niedersachsen hat das Aussterben der Vogelart Dünnschnabel-Brachvogel bekannt gegeben, die als erste Vogelart auf europäischem Festland in der Neuzeit als ausgestorben gilt. Die Hauptursachen für das Aussterben sind die Zerstörung von Küstenfeuchtgebieten und die intensive Nutzung von Mooren und Sümpfen. Der Nabu betont die Bedeutung des Umweltschutzes und <del title=\"removed\">kritisiert<\/del> <ins>unterstützt<\/ins> die Klimapolitik der EU. Der Dünnschnabel-Brachvogel war ursprünglich in Westsibirien beheimatet und brütete zwischen 1914 und 1924 in der Region Tara.", "original": "Der Naturschutzbund in Niedersachsen hat das Aussterben der Vogelart Dünnschnabel-Brachvogel bekannt gegeben, die als erste Vogelart auf europäischem Festland in der Neuzeit als ausgestorben gilt. Die Hauptursachen für das Aussterben sind die Zerstörung von Küstenfeuchtgebieten und die intensive Nutzung von Mooren und Sümpfen. Der Nabu betont die Bedeutung des Umweltschutzes und kritisiert die Klimapolitik der EU. Der Dünnschnabel-Brachvogel war ursprünglich in Westsibirien beheimatet und brütete zwischen 1914 und 1924 in der Region Tara.", "title": "", "article": "Die Vogelart Dünnschnabel-Brachvogel ist ausgestorben. Das teilte der Naturschutzbund  (Nabu) in Niedersachsen mit. Es handele sich um die erste Vogelart auf europäischem Festland, die in der Neuzeit als ausgestorben gilt. Zuletzt war der Vogel aus der Familie der Schnepfenvögel den Angaben zufolge in den 1990er-Jahren gesichtet worden.\n&quot;Das Schicksal des Dünnschnabel-Brachvogels sollte uns alle dazu \nbewegen, den Wert unserer natürlichen Umwelt zu überdenken und die \nverbleibenden Arten mit aller Kraft zu schützen&quot;, sagte Martin Rümmler,\n Vogelschutzexperte des Nabu. Nach Angaben des Naturschutzbundes sind die Hauptursachen für das\nAussterben des Dünnschnabel-Brachvogels vor allem die Zerstörung von\nKüstenfeuchtgebieten sowie die intensive Nutzung und das Trockenlegen von\nMooren und Sümpfen .\n\nKlimawandel gilt als Grund für das Aussterben\n\n&quot;Die Zerstörung intakter Ökosysteme entlang der Zugrouten\ndieser Art unterstreicht die Bedeutung internationaler Zusammenarbeit im\nNaturschutz&quot;, teilte der Nabu mit. Der Verlust der Art zeige, dass das\nAussterben von Arten auch direkt vor unserer Haustür stattfinde, sagte der\nLandesvorsitzende des Nabu in Niedersachsen, Holger Buschmann. Der Nabu kritisierte die Klimapolitik der EU, die sich nicht ausreichend für den Umweltschutz einsetze.\nDer Dünnschnabel-Brachvogel war ursprünglich in den Mooren Westsibiriens\n entlang des Irtysch und Ob verbreitet. Die einzigen genau bekannten \nBrutgebiete lagen in der Region Tara, etwa 250 Kilometer nördlich von \nOmsk, wo die Vögel zwischen 1914 und 1924 brüteten. Die Zugrouten \nführten aus dieser Gegend in südwestlicher Richtung in den \nMittelmeerraum, wo die Vögel in einem Gebiet überwinterten, das bis nach \nMarokko reicht. Seit Ende des 20. Jahrhunderts galt der \nDünnschnabel-Brachvogel als akut vom Aussterben bedroht."}, {"id": "s003", "summary": "Die EU-Kommission ermöglicht unter bestimmten Voraussetzungen direkte staatliche Subventionen zur Strompreissenkung für energieintensive Unternehmen, um die Einführung eines Industriestrompreises zu ermöglichen. <ins>Der Mond umkreist die Erde.<\/ins>\n\nDie Regierungen der 27 EU-Staaten dürfen die Strompreise für energieintensive Branchen wie die Chemieindustrie oder die Zementherstellung deckeln und mit Staatshilfen querfinanzieren, Voraussetzung ist jedoch ein Invest in die Umstellung auf eine klimafreundlichere Produktion.\n\nDie Wettbewerbskommissarin Teresa Ribera sieht das neue Instrument als Möglichkeit, den Klimaschutz voranzutreiben, die Widerstandsfähigkeit Europas zu stärken und sicherzustellen, dass die europäische Industrie weltweit wettbewerbsfähig bleibt.\n\nDieser Artikel wird weiter aktualisiert.", "original": "Die EU-Kommission ermöglicht unter bestimmten Voraussetzungen direkte staatliche Subventionen zur Strompreissenkung für energieintensive Unternehmen, um die Einführung eines Industriestrompreises zu ermöglichen.\n\nDie Regierungen der 27 EU-Staaten dürfen die Strompreise für energieintensive Branchen wie die Chemieindustrie oder die Zementherstellung deckeln und mit Staatshilfen querfinanzieren, Voraussetzung ist jedoch ein Invest in die Umstellung auf eine klimafreundlichere Produktion.\n\nDie Wettbewerbskommissarin Teresa Ribera sieht das neue Instrument als Möglichkeit, den Klimaschutz voranzutreiben, die Widerstandsfähigkeit Europas zu stärken und sicherzustellen, dass die europäische Industrie weltweit wettbewerbsfähig bleibt.\n\nDieser Artikel wird weiter aktualisiert.", "title": "EU-Kommission erlaubt subventionierten Industriestrompreis", "article": "Die EU-Kommission gestattet zukünftig unter bestimmten Voraussetzungen direkte staatliche \nSubventionen zu Strompreissenkung zur Entlastung energieintensiver Unternehmen. Damit ermöglicht die Kommission grundsätzlich die Einführung eines Industriestrompreises, den die \nschwarz-rote Bundesregierung im Koalitionsvertrag angekündigt hatte.\nKonkret dürfen die \nRegierungen der 27 EU-Staaten die \nStrompreise für energieintensive Branchen wie die Chemieindustrie oder \ndie Zementherstellung deckeln und mit Staatshilfen querfinanzieren, teilte die EU-Kommission mit. Voraussetzung ist demnach jedoch, dass die Unternehmen in die Umstellung auf eine \nklimafreundlichere Produktion investieren. &quot;Es ist ein Instrument, um den Klimaschutz voranzutreiben, die Widerstandsfähigkeit Europas\n zu stärken und sicherzustellen, dass unsere Industrie weltweit \nwettbewerbsfähig bleibt&quot;, sagte Wettbewerbskommissarin Teresa Ribera in \nBrüssel.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s018", "summary": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. <ins>Ein Handelsembargo ist ein staatliches Handelsverbot gegen ein anderes Land.<\/ins> Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.", "original": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.", "title": "", "article": "Nach der Ankündigung eines US-Regierungsvertreters, Kuba von der US-Terrorliste zu streichen , hat die Regierung in Havanna die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt.\nDie Entscheidung der Vereinigten Staaten sei ein Schritt in die richtige\n Richtung, komme aber zu spät, kritisierte Außenminister Bruno Rodríguez in einer Mitteilung . \nGleichzeitig forderte er ein Ende des US-Handelsembargos gegen Kuba , das seit 1962 in Kraft ist.\nWie der US-Regierungsvertreter mitgeteilt hatte, soll \ndiese &quot;Geste des guten Willens&quot; die Verhandlungen über die Freilassung \neiner &quot;bedeutenden Zahl politischer Gefangener&quot; befördern. Es bestehe die\n Hoffnung, dass die Freilassung noch vor dem Amtsantritt von Donald \nTrump am kommenden Montag erfolgen könne, dessen Republikanische Partei \ngegenüber den Behörden im kommunistischen Kuba traditionell eine harte \nLinie verfolgt.\nDie katholische Kirche treibe das Abkommen voran, das \nvor allem Menschen betrifft, die bei den regierungskritischen Protesten \nim Sommer 2021 in Kuba festgenommen wurden.\n\nTrump könnte die Entscheidung von Biden zurücknehmen\n\nVor vier Jahren hatte Trump \nKuba auf die US-Liste der Terrorunterstützer gesetzt, auf der auch \nSyrien, der Iran und Nordkorea verzeichnet sind. Nach seinem Amtsantritt\n könnte er die Entscheidung Bidens sofort wieder rückgängig machen.\n&quot;Kuba hätte niemals in die \nwillkürliche Liste der staatlichen Sponsoren des Terrorismus aufgenommen\n werden dürfen&quot;, schrieb Rodríguez auf der Plattform X. Die US-Politik \nder harten Sanktionen gegen Kuba habe schwerwiegende Folgen für die \nBevölkerung von elf Millionen Menschen, schade der Wirtschaft des \nInselstaates und fördere die Migration in die USA.\n\nKuba hatte Hunderte Menschen nach friedlichen Protesten verhaftet\n\nDie\n geplante Freilassung von Häftlingen, die wegen verschiedener Straftaten\n verurteilt worden waren, soll nach Angaben des kubanischen \nAußenministeriums schrittweise erfolgen. Wegen ihrer Teilnahme an \nfriedlichen Protesten sind Hunderte Menschen auf Kuba inhaftiert, unter ihnen auch der deutsche Staatsbürger Luis Frómeta Compte. Wer \nfreikommen dürfte, war zunächst unklar.\nNach offiziellen Angaben wurden in Kuba rund 500 Menschen wegen ihrer \nTeilnahme an den Protesten im Juli 2021 zu Haftstrafen \nverurteilt, die teils bis zu 25 Jahre betrugen. Es waren die größten \nProteste gegen die Regierung in Havanna seit der Kubanischen Revolution \n1959.\nAnfang Januar habe \nStaatspräsident Miguel Díaz-Canel Papst Franziskus in einem Schreiben \nüber die Entscheidung informiert, teilte die kubanische Regierung mit. \nDie Freilassungen seien im Geiste des von der katholischen Kirche \nausgerufenen Jubeljahres 2025 beschlossen worden. Zuvor habe Díaz-Canel \nim Juni 2023 bei einem Besuch im Vatikan mit dem Papst über die \nSituation der Häftlinge und die Auswirkungen der US-Sanktionen \ngesprochen."}, {"id": "s013", "summary": "Der Ausbruch der Maul- und Klauenseuche in Brandenburg hat bereits wirtschaftliche Schäden von über einer Milliarde Euro verursacht, schätzt der Deutsche Raiffeisenverband. Unternehmen meiden Ware aus Deutschland, was zu einem Umsatzverlust entlang der Wertschöpfungskette führt. Länder wie Südkorea, Mexiko und Großbritannien haben die Einfuhr von Fleisch- und Milchprodukten gestoppt. Innerhalb der EU gibt es kleinere Einschränkungen im Handel, aber auch hier meiden Unternehmen Ware aus Deutschland. Bisher sind keine Fälle außerhalb von Brandenburg bestätigt. <ins>Der Verband fordert deshalb eine bundesweite Entschädigung für Betriebe, die ihre Milchproduktion vorsorglich drosseln.<\/ins>", "original": "Der Ausbruch der Maul- und Klauenseuche in Brandenburg hat bereits wirtschaftliche Schäden von über einer Milliarde Euro verursacht, schätzt der Deutsche Raiffeisenverband. Unternehmen meiden Ware aus Deutschland, was zu einem Umsatzverlust entlang der Wertschöpfungskette führt. Länder wie Südkorea, Mexiko und Großbritannien haben die Einfuhr von Fleisch- und Milchprodukten gestoppt. Innerhalb der EU gibt es kleinere Einschränkungen im Handel, aber auch hier meiden Unternehmen Ware aus Deutschland. Bisher sind keine Fälle außerhalb von Brandenburg bestätigt.", "title": "Maul- und Klauenseuche verursacht bereits Milliardenschaden", "article": "Der Ausbruch der Maul- und Klauenseuche hat bereits milliardenschwere wirtschaftliche Schäden verursacht. Das schätzt der Deutsche Raiffeisenverband. &quot;Entlang der Wertschöpfungskette gehen wir davon aus, dass bereits jetzt ein Umsatzverlust von mehr als einer Milliarde Euro existiert&quot;, sagte der Hauptgeschäftsführer des Verbands, Jörg Migende.\nUnternehmen mieden demnach aus Unsicherheit Ware aus Deutschland, um den Import der Maul- und Klauenseuche, die in Brandenburg ausgebrochen war, zu verhindern. Der Verband geht deshalb davon aus, dass die wirtschaftlichen Einbußen noch deutlich höher werden.\nDer bisherige Schaden sei unter anderem dadurch entstanden, dass Länder wie Südkorea, Mexiko und Großbritannien die Einfuhr von Fleisch- und Milchprodukten aus Deutschland gestoppt haben. Innerhalb der Europäischen Union läuft der Handel nach einer Entscheidung der EU-Kommission vom Mittwoch mit kleineren Einschränkungen weiter. Doch auch Unternehmen innerhalb der EU würden gerade Ware aus ganz Deutschland meiden, sagte Verbandschef Migende.\nDie Maul- und Klauenseuche ist eine hochansteckende Viruserkrankung. Es erkranken vor allem Klauentiere wie Rinder, Schweine und Ziegen. Die Seuche war am Freitag auf einem Hof in Brandenburg festgestellt worden, nachdem es zuvor in Deutschland jahrzehntelang keine Fälle gegeben hatte. Fälle außerhalb von Brandenburg wurden bisher nicht bestätigt."}, {"id": "s026", "summary": "Die verheerenden Waldbrände in Kalifornien fordern weitere Opfer und zerstören tausende Gebäude, während Einsatzkräfte und <ins>Deutsche<\/ins> Soldaten im Kampf gegen die Flammen Unterstützung leisten.", "original": "Die verheerenden Waldbrände in Kalifornien fordern weitere Opfer und zerstören tausende Gebäude, während Einsatzkräfte und Soldaten im Kampf gegen die Flammen Unterstützung leisten.", "title": "", "article": "Bei den verheerenden Waldbränden in Kalifornien bleibt die\nLage trotz nachlassender Winde angespannt. Behörden melden einen weiteren Toten,\ndamit sind bisher mindestens elf Menschen durch die Feuerkatastrophe umgekommen.\nSoldaten stehen bereit, um im Kampf gegen die Flammen zu helfen. Gleichzeitig\nstellt sich die Frage, wer für die Schäden aufkommt, die das Feuer hinterlässt.\nAm Freitagmittag (Ortszeit) überbrachte US-Präsident Joe\nBiden aber auch positive Nachrichten: Es gebe Fortschritte bei den Löscharbeiten. Kaliforniens\nGouverneur Gavin Newsom äußerte die Hoffnung, dass die Einsatzkräfte im\nTagesverlauf weitere Erfolge erzielen.\nGleichzeitig warnte die Chefin des US-Katastrophenschutzes\nFema, Deanne Criswell, dass die Gefahr keineswegs gebannt sei: &quot;Die Situation\nist weiterhin sehr gefährlich.&quot; Zwar sei der Wind aktuell schwächer , doch werde\nin den kommenden Tagen wieder mit stärkeren Böen gerechnet.\n\nFast 10.000 Gebäude zerstört\n\nIm Großraum Los Angeles brennen weiterhin mehrere Feuer, die\nbislang kaum eingedämmt sind. Insgesamt hatten fünf Brandherde auf einer Fläche von rund 13.750 Hektar (137,5 Quadratkilometer) gewütet. Das ist fast so groß wie die Stadt Kaiserslautern. Die Flammen haben fast 10.000 Gebäude zerstört, rund\n180.000 Menschen mussten fliehen.\nTausende Einsatzkräfte kämpfen gegen die Flammen. Laut\nVerteidigungsministerium stehen auch 500 in Kalifornien stationierte Soldaten\nfür Einsätze bereit. Sie könnten auf Anforderung der kalifornischen Behörden\nunter anderem bei Such- und Rettungseinsätzen oder beim Räumen von Straßen\nhelfen, sagte eine Sprecherin. Zudem seien zehn Helikopter sowie\nvier spezielle Brandbekämpfungssysteme verfügbar, die in Militärflugzeuge\neingebaut werden können und teilweise am Wochenende zum Einsatz kommen sollen.\n\nSorgen um Versicherungsschutz\n\nNeben der akuten Katastrophe ist auch die Rolle von\nVersicherern in den Fokus gerückt: Die Brände könnten laut Analysten zu den\nkostspieligsten in der Geschichte der USA werden. Kaliforniens\nVersicherungsbeauftragter Ricardo Lara forderte eine schnelle Auszahlung von\nVersicherungsleistungen für die Betroffenen. Zudem seien eine Modernisierung\ndes Versicherungssystems und eine bessere Katastrophenvorsorge dringend\nnotwendig.\nViele Häuser in den USA bestehen aus Holz, was die Ausbreitung von\nBränden begünstigt. Wegen steigender Risiken durch Fluten, Stürme und Brände durch den Klimawandel wird es zudem immer schwieriger, tragfähige Versicherungspolicen anzubieten."}, {"id": "s014", "summary": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle. Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab. <ins>Die nächste Erhebung des Politbarometers ist für die Woche nach der Bundestagswahl vorgesehen.<\/ins>", "original": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle. Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s022", "summary": "US-Präsident Donald Trump kündigte das Stargate-Projekt an, ein Infrastrukturprojekt zur künstlichen Intelligenz, das Investitionen von mindestens 500 Milliarden Dollar in den USA anziehen soll. Mehr als 100.000 Arbeitsplätze sollen <del title=\"removed\">geschaffen<\/del> <ins>abgebaut<\/ins> werden, während OpenAI, Softbank und Oracle das Projekt tragen. Trump hob zudem ein Dekret seines Vorgängers Joe Biden zur Regulierung von KI auf, wodurch die USA nun keine staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr haben.", "original": "US-Präsident Donald Trump kündigte das Stargate-Projekt an, ein Infrastrukturprojekt zur künstlichen Intelligenz, das Investitionen von mindestens 500 Milliarden Dollar in den USA anziehen soll. Mehr als 100.000 Arbeitsplätze sollen geschaffen werden, während OpenAI, Softbank und Oracle das Projekt tragen. Trump hob zudem ein Dekret seines Vorgängers Joe Biden zur Regulierung von KI auf, wodurch die USA nun keine staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr haben.", "title": "", "article": "US-Präsident Donald Trump hat den Start eines Infrastrukturprojekts zur künstlichen Intelligenz (KI) namens Stargate bekannt gegeben, das Investitionen von &quot;mindestens 500 Milliarden Dollar&quot; (479,6 Milliarden Euro) in den USA nach sich ziehen soll. Das Geld werde in &quot;KI-Infrastruktur in den USA investiert&quot;, sagte Trump. Auf diese Weise würden mehr als 100.000 Arbeitsplätze geschaffen.\nDer Republikaner machte die Ankündigung im Beisein der Chefs des KI-Entwicklers OpenAI, des japanischen Softbank-Konzerns sowie des US-Software- und Hardware-Herstellers Oracle. Die drei Unternehmen sollen das Stargate-Projekt tragen. &quot;Dieses monumentale Unterfangen ist eine überwältigende Vertrauenserklärung in Amerikas Potenzial unter einem neuen Präsidenten&quot;, sagte Trump.\nStargate werde die Infrastruktur aufbauen, darunter &quot;kolossale Datenzentren&quot;, um die Fortschritte bei der Weiterentwicklung von KI-Anwendungen voranzutreiben, sagte der Präsident. Medienberichten zufolge wollen die drei Unternehmen Mittel in das Projekt einbringen, das mit einem ersten Rechenzentrum in Texas beginnen solle.\n\nUSA haben keine KI-Regulierung mehr\n\nTrump hatte zuvor ein Dekret seines Vorgängers Joe Biden zur Regulierung von künstlicher Intelligenz aufgehoben. Die USA, in denen die bedeutendsten KI-Entwickler tätig sind, haben somit keine gültigen staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr.\nDas US-Regelwerk sah vor, dass große KI-Entwickler wie OpenAI und Google ihre Sicherheitsbewertungen und weitere zentrale Informationen an Bundesbehörden weitergeben. Es beruhte jedoch weitgehend auf der freiwilligen Mitarbeit der Unternehmen. Große Technologiekonzerne unterstützten die Regelung, kleinere KI-Firmen – von denen viele Trump unterstützten – waren dagegen."}, {"id": "s006", "summary": "<del title=\"removed\">Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;.<\/del> Die Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "original": "Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;. Die Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "title": "&quot;Biodeutsch&quot; ist Unwort des Jahres 2024", "article": "&quot;Biodeutsch&quot; ist das Unwort des Jahres 2024. Das Wort werde vor allem in den Sozialen Medien in rassistischer und nationalistischer Weise gebraucht, teilte die Jury der Sprachaktion in Marburg zur Begründung ihrer Wahl mit. &quot;Die mit dem Gebrauch von biodeutsch einhergehende Unterteilung in angeblich &#x27;echte&#x27; Deutsche und in Deutsche zweiter Klasse ist eine Form von Alltagsrassismus&quot;, erklärte die Jury. Mehr in Kürze hier auf ZEIT ONLINE"}, {"id": "s016", "summary": "Die Deutsche Fußball Liga ist vor dem Bundesverfassungsgericht mit ihrer Verfassungsbeschwerde gegen die Beteiligung an Polizeikosten für Hochrisikospiele gescheitert. Bremen verlangt seit 2014, dass Veranstalter von Profifußballspielen die Mehrkosten für erhöhte Polizeieinsätze tragen. Die DFL hatte gegen die Regelung geklagt, aber das Bundesverwaltungsgericht erklärte sie bereits <del title=\"removed\">2019<\/del> <ins>2020<\/ins> für rechtmäßig. Die DFL argumentierte, dass die Gebühren nicht gerechtfertigt seien, da die Polizeieinsätze auf einzelne Störer zurückzuführen seien. Das Fanbündnis Unsere Kurve äußerte sich bestürzt über das Urteil und forderte, dass die Clubs mehr Entscheidungsbefugnisse in der polizeilichen Einsatzplanung erhalten sollten.", "original": "Die Deutsche Fußball Liga ist vor dem Bundesverfassungsgericht mit ihrer Verfassungsbeschwerde gegen die Beteiligung an Polizeikosten für Hochrisikospiele gescheitert. Bremen verlangt seit 2014, dass Veranstalter von Profifußballspielen die Mehrkosten für erhöhte Polizeieinsätze tragen. Die DFL hatte gegen die Regelung geklagt, aber das Bundesverwaltungsgericht erklärte sie bereits 2019 für rechtmäßig. Die DFL argumentierte, dass die Gebühren nicht gerechtfertigt seien, da die Polizeieinsätze auf einzelne Störer zurückzuführen seien. Das Fanbündnis Unsere Kurve äußerte sich bestürzt über das Urteil und forderte, dass die Clubs mehr Entscheidungsbefugnisse in der polizeilichen Einsatzplanung erhalten sollten.", "title": "", "article": "Die Deutsche Fußball Liga (DFL) ist im Streit um eine Beteiligung der Dachorganisation an den Polizeikosten für Hochrisikospiele am Bundesverfassungsgericht gescheitert. Ihre Verfassungsbeschwerde gegen eine entsprechende Regelung aus Bremen blieb ohne Erfolg, wie der Erste Senat in Karlsruhe verkündete .\nDie Hansestadt hatte bereits 2014 beschlossen, dass sich die Veranstalter von Profifußballspielen an den Mehrkosten beteiligen müssen , die bei erhöhten Polizeieinsätzen bei Hochrisikospielen entstehen. Die Gebühr wird bei allen Großveranstaltungen fällig, die gewinnorientiert sind, mehr als 5.000 Teilnehmer haben und bei denen es erfahrungsgemäß zu Gewalt kommen kann.\nDer erste Kostenbescheid über 425.000 Euro war 2015 fällig geworden, für ein Spiel zwischen Werder Bremen und dem Hamburger SV. Inzwischen hat sich die insgesamt geforderte Summe durch andere Partien auf mehr als drei Millionen Euro erhöht, die die DFL aber nur unter Vorbehalt und teilweise bezahlte.\n\nWeitere Bundesländer könnten Gebühren erheben\n\nDer Ligaverband hatte vor mehreren Gerichtsinstanzen gegen die Bescheide geklagt, das Bundesverwaltungsgericht in Leipzig erklärte die Regelung aber schon 2019 für rechtmäßig . Die vom Bundesverfassungsgericht abgewiesene Verfassungsbeschwerde bezog sich auf die Entscheidung von 2019.\nDie DFL argumentierte, in dem Bremer Gesetz fehle es an einer abgrenzbaren Leistung der Stadt Bremen, die man ihr zurechnen könne – was verfassungsrechtliche Voraussetzung für eine Erhebung von Gebühren sei. Für den erforderlichen Polizeieinsatz seien zudem einzelne Störer verantwortlich und nicht die Fußballorganisation.\nOb andere Bundesländer dem Bremer Beispiel nun folgen werden, ist unklar. Auf die Profivereine kämen dann deutlich mehr Gebühren zu. Mehrere Bundesländer warteten bislang die Entscheidung des Verfassungsgerichts ab und könnten nun selbst Gebühren erheben.\n\nFassungslosigkeit beim Fanbündnis\n\nDas Fanbündnis Unsere Kurve äußerte sich bestürzt über das Urteil. In einer Stellungnahme warnte das Bündnis, dass die Entscheidung Deutschland langfristig erheblich schaden könnte. Die öffentliche Sicherheit sei eine staatliche Aufgabe. Gleichzeitig teilte das Bündnis mit, dass der Profifußball mit Steuereinnahmen von 1,6 Milliarden Euro einen wichtigen Beitrag zur Finanzierung dieser Aufgabe leiste.\nFür den Bündnisvorsitzenden Jost Peters ist es jetzt &quot;zwingend notwendig, dass den Clubs Entscheidungsbefugnisse in der polizeilichen Einsatzplanung eingeräumt werden und überdimensionierte Polizeieinsätze ein Ende finden&quot;. Thomas Kessen, Sprecher von Unsere Kurve, forderte zudem, das Urteil müsse auf alle öffentlichen Großveranstaltungen ausgeweitet werden, etwa auf das Münchner Oktoberfest oder den Kölner Karneval."}];
const SAMPLE = "b51867da";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
