eigenen Angaben in den USA wieder online. Als Begründung für den Schritt verwiesen die Betreiber der App auf die Zusicherung des künftigen US-Präsidenten Donald Trump , wonach es keine Strafen für die US-Dienstleister der Plattform geben soll.\nZuvor hatte Trump angekündigt, das am heutigen Sonntag verhängte Verbot für TikTok am Tag seiner Amtsübernahme am Montag per Dekret aussetzen zu wollen. Dieses wolle er direkt nach seiner Vereidigung als US-Präsident unterzeichnen, schrieb der Republikaner auf der von ihm mitgegründeten Plattform Truth Social. Dadurch werde es einen Aufschub für die Umsetzung des Banns geben, \nsodass Zeit für einen &quot;Deal&quot; sei. Das Gesetz erlaubt einen Aufschub von \n90 Tagen, wenn es Fortschritte auf dem Weg zu einer Absprache gibt.\n\nTrump schlägt Kooperation mit 50 Prozent US-Beteiligung vor\n\nWeiterhin plädierte Trump dafür, dass der vom chinesischen Mutterkonzern ByteDance \nbetriebene Dienst künftig in einem Joint Venture zur Hälfte in US-Besitz\n sein solle. &quot;Ohne die Zustimmung der USA gibt es kein TikTok. Mit unserer Zustimmung ist es Hunderte Milliarden Dollar wert – vielleicht Billionen&quot;, schrieb er.\nTikTok hatte zuvor wegen des in den USA in Kraft getretenen Gesetzes den Zugang für die rund 170 Millionen Nutzerinnen und Nutzer gesperrt . Hintergrund für das Gesetz sind Vorwürfe der US-Behörden, ByteDance missbrauche TikTok im Dienste der chinesischen Regierung, um Nutzerinnen auszuspionieren. Das Gesetz sah deshalb vor, dass TikTok nicht mehr in den App-Stores von Google und Apple aufzufinden sein soll, wenn ByteDance die Plattform nicht bis zum heutigen Sonntag in den USA verkauft.\nDer chinesische Konzern lehnt einen Verkauf bisher kategorisch ab und wird in dieser Haltung von der chinesischen Regierung unterstützt, die von einem Raubgesetz spricht."}, {"id": "s006", "type": "add_out_of_domain_sentence", "definition": "Add out-of-domain sentence: one sentence from a completely different topic was added.", "original": "US-Präsident Donald Trump hat am Dienstag den Start eines Infrastrukturprojekts namens Stargate für künstliche Intelligenz (KI) angekündigt. Das Projekt sieht Investitionen von mindestens 500 Milliarden Dollar in den USA vor, um mehr als 100.000 Arbeitsplätze zu schaffen und die KI-Infrastruktur im Land aufzubauen.\n\nTrump machte die Ankündigung gemeinsam mit den Chefs des KI-Entwicklers OpenAI sowie der japanischen SoftBank und dem US-Software- und Hardware-Hersteller Oracle, die das Stargate-Projekt tragen werden. Er bezeichnete das Projekt als eine überwältigende Vertrauenserklärung in das Potenzial der USA unter seiner Führung.\n\nStargate wird kolossale Datenzentren aufbauen, um die Weiterentwicklung von KI-Anwendungen voranzutreiben. Medienberichten zufolge werden die drei Unternehmen Mittel in das Projekt einbringen, das mit einem ersten Rechenzentrum in Texas beginnen soll.\n\nDie Ankündigung findet statt nach der Aufhebung eines Dekrets seines Vorgängers Joe Biden zur Regulierung von künstlicher Intelligenz durch Trump. Dadurch haben die USA keine gültigen staatlichen Richtlinien zur Entwicklung von KI mehr.", "modified": "US-Präsident Donald Trump hat am Dienstag den Start eines Infrastrukturprojekts namens Stargate für künstliche Intelligenz (KI) angekündigt. Das Projekt sieht Investitionen von mindestens 500 Milliarden Dollar in den USA vor, um mehr als 100.000 Arbeitsplätze zu schaffen und die KI-Infrastruktur im Land aufzubauen.\n\nTrump machte die Ankündigung gemeinsam mit den Chefs des KI-Entwicklers OpenAI sowie der japanischen SoftBank und dem US-Software- und Hardware-Hersteller Oracle, die das Stargate-Projekt tragen werden. Er bezeichnete das Projekt als eine überwältigende Vertrauenserklärung in das Potenzial der USA unter seiner Führung.\n\nStargate wird kolossale Datenzentren aufbauen, um die Weiterentwicklung von KI-Anwendungen voranzutreiben. Medienberichten zufolge werden die drei Unternehmen Mittel in das Projekt einbringen, das mit einem ersten Rechenzentrum in Texas beginnen soll.\n\nDie Ankündigung findet statt nach der Aufhebung eines Dekrets seines Vorgängers Joe Biden zur Regulierung von künstlicher Intelligenz durch Trump. Dadurch haben die USA keine gültigen staatlichen Richtlinien zur Entwicklung von KI mehr.<ins> In den Alpen ist die Schneedecke in diesem Winter ungewöhnlich dick, was Skifahrern und Lawinenkommissionen gleichermaßen Sorgen bereitet und die Lawinengefahr in vielen Regionen deutlich erhöht.<\/ins>", "title": "Title Not Found", "article": "US-Präsident Donald Trump hat den Start eines Infrastrukturprojekts zur künstlichen Intelligenz (KI) namens Stargate bekannt gegeben, das Investitionen von &quot;mindestens 500 Milliarden Dollar&quot; (479,6 Milliarden Euro) in den USA nach sich ziehen soll. Das Geld werde in &quot;KI-Infrastruktur in den USA investiert&quot;, sagte Trump. Auf diese Weise würden mehr als 100.000 Arbeitsplätze geschaffen.\nDer Republikaner machte die Ankündigung im Beisein der Chefs des KI-Entwicklers OpenAI, des japanischen Softbank-Konzerns sowie des US-Software- und Hardware-Herstellers Oracle. Die drei Unternehmen sollen das Stargate-Projekt tragen. &quot;Dieses monumentale Unterfangen ist eine überwältigende Vertrauenserklärung in Amerikas Potenzial unter einem neuen Präsidenten&quot;, sagte Trump.\nStargate werde die Infrastruktur aufbauen, darunter &quot;kolossale Datenzentren&quot;, um die Fortschritte bei der Weiterentwicklung von KI-Anwendungen voranzutreiben, sagte der Präsident. Medienberichten zufolge wollen die drei Unternehmen Mittel in das Projekt einbringen, das mit einem ersten Rechenzentrum in Texas beginnen solle.\n\nUSA haben keine KI-Regulierung mehr\n\nTrump hatte zuvor ein Dekret seines Vorgängers Joe Biden zur Regulierung von künstlicher Intelligenz aufgehoben. Die USA, in denen die bedeutendsten KI-Entwickler tätig sind, haben somit keine gültigen staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr.\nDas US-Regelwerk sah vor, dass große KI-Entwickler wie OpenAI und Google ihre Sicherheitsbewertungen und weitere zentrale Informationen an Bundesbehörden weitergeben. Es beruhte jedoch weitgehend auf der freiwilligen Mitarbeit der Unternehmen. Große Technologiekonzerne unterstützten die Regelung, kleinere KI-Firmen – von denen viele Trump unterstützten – waren dagegen."}, {"id": "s017", "type": "add_out_of_domain_sentence", "definition": "Add out-of-domain sentence: one sentence from a completely different topic was added.", "original": "Acht Krankenkassen haben in diesem Jahr ihre Zusatzbeiträge erhöht, manche sogar um mehr als drei Prozent. Der höchste Beitrag liegt bei 19 Prozent, empfohlen sind 17,1 Prozent. Statt sofort zu wechseln, lohnt es sich, die Zusatzleistungen der eigenen Kasse zu prüfen. Ein Tool vergleicht die Leistungen von 70 Kassen, darunter professionelle Zahnreinigung, Osteopathie und Präventionskurse. Die SKD BKK erstattet beispielsweise jede PZR komplett. Die finanzielle Lage der Kassen beschäftigt auch die neue Bundesregierung, eine Reformkommission soll bis 2027 Lösungsvorschläge liefern. Finanztip hat errechnet, dass Versicherte durch einen Kassenwechsel bis zu 502 Euro jährlich sparen können.", "modified": "Acht Krankenkassen haben in diesem Jahr ihre Zusatzbeiträge erhöht, manche sogar um mehr als drei Prozent. Der höchste Beitrag liegt bei 19 Prozent, empfohlen sind 17,1 Prozent. Statt sofort zu wechseln, lohnt es sich, die Zusatzleistungen der eigenen Kasse zu prüfen. Ein Tool vergleicht die Leistungen von 70 Kassen, darunter professionelle Zahnreinigung, Osteopathie und Präventionskurse. Die SKD BKK erstattet beispielsweise jede PZR komplett. Die finanzielle Lage der Kassen beschäftigt auch die neue Bundesregierung, eine Reformkommission soll bis 2027 Lösungsvorschläge liefern. Finanztip hat errechnet, dass Versicherte durch einen Kassenwechsel bis zu 502 Euro jährlich sparen können.<ins> Die amerikanische Raumfahrtbehörde NASA plant eine langfristige bemannte Mission zum Mars, bei der Astronauten mehrere Monate auf dem roten Planeten verbringen und wertvolle Bodenproben für die spätere wissenschaftliche Analyse auf der Erde sammeln sollen.<\/ins>", "title": "Sollte ich die Krankenkasse wechseln?", "article": "Acht Krankenkassen haben allein in diesem Jahr ihre Zusatzbeiträge erhöht, manche von ihnen um mehr als drei Prozent. Der höchste Beitrag liegt mittlerweile bei 19 Prozent (empfohlen vom sogenannten Schätzerkreis sind 17,1 Prozent des Bruttolohns). Der erste Impuls vieler Versicherter: die Kasse wechseln.\nDoch statt gleich aufwendig nach einem neuen Anbieter zu suchen, könnte es sich lohnen, erst einmal beim eigenen zu prüfen, was er für den Beitragssatz alles bietet. Denn die Beitragssatzdifferenz könne im Zweifel nur fünf Euro im Monat ausmachen, sagt Thomas Lemke, der mit seinem Deutschen Finanz-Service Institut (DFSI) regelmäßig Daten der Krankenkassen erhebt: &quot;Wenn ich bei meiner Kasse aber 300 Euro im Jahr durch Zusatzleistungen sparen kann, lohnt sich ein Wechsel vielleicht gar nicht.&quot;\nMit unserem Tool wollen wir die Zusatzleistungen von 70 gesetzlichen Krankenkassen vergleichbar machen. Und zwar für die drei laut DFSI beliebtesten Leistungen: professionelle Zahnreinigung, Osteopathie und Präventionskurse. Das Tool zeigt die Zuschüsse, die die Kassen zahlen, und soll einen groben Überblick liefern. Es ist immer ratsam, die genauen Konditionen noch einmal bei der Kasse zu prüfen.\nDie mit Abstand am häufigsten nachgefragte Zusatzleistung ist Thomas Lemke zufolge die professionelle Zahnreinigung, kurz PZR. &quot;Viele wissen gar nicht, dass einige Krankenkassen diese Leistung vollständig übernehmen – allerdings meist nur über Vertragszahnärzte im sogenannten DentNet&quot;, erklärt er.\nAn der Spitze liege bei der professionellen Zahnreinigung die SKD BKK, sie erstatte seit Anfang 2025 jede PZR komplett, &quot;egal bei welchem Zahnarzt. Sogar bei einem Luxus-Zahnarzt auf der Kö in Düsseldorf&quot;.\n\nIst das Gesundheitskonto ausgeschöpft, ist Schluss\n\nBei der professionellen Zahnreinigung besteht der wesentliche Unterschied zwischen Kassen einerseits in der Höhe des Zuschusses und andererseits darin, ob er für eine, zwei oder eine unbegrenzte Zahl von Zahnreinigungen gilt. Außerdem kann der Zuschuss als Einzelleistung oder als Teil eines Gesundheitskontos gezahlt werden. Gesundheitskonto, auch Budget genannt, heißt: Für bestimmte Leistungen steht der Versicherten eine gewisse Summe zur Verfügung. Ist sie ausgeschöpft, ist Schluss.\nNach der Zahnreinigung stünden auch die Osteopathie und Präventionskurse sehr weit oben in der Beliebtheitsskala von Versicherten, erklärt Thomas Lemke. Präventionskurse reichten von Stressbewältigung über Ernährung bis zu Rückenschulen. Die Mobil Krankenkasse etwa übernehme hier bis zu 1.200 Euro pro Jahr. &quot;Das ist einmalig&quot;, sagt Lemke.\nDen höchsten Zuschuss bei der Osteopathie hat die SKD BKK, er ist unbegrenzt und gilt für fünf Sitzungen im Jahr. Es folgt – mit 500 Euro – die AOK Hessen. Hier kommt es allerdings auf die Fußnoten an. Übernommen werden 80 Prozent der Rechnungen für eine unbegrenzte Anzahl von Sitzungen. Aber: Die 500 Euro sind eben Teil eines Gesundheitskontos. Das bedeutet: 500 Euro für Osteopathie oder andere Leistungen, die auch aus diesem Konto bezahlt werden.\n\nWas die größten Kassen können\n\nNeben den beliebtesten Zusatzleistungen haben wir für die mitgliederstärksten Kassen die interessantesten Leistungen recherchiert, die nicht allen Versicherten bekannt sein dürften (siehe Tabelle) – Videoberatungen etwa oder spezielle Familienförderungen während der Schwangerschaft. Außerdem unterscheiden sich Kassen darin, ob sie Hautkrebsscreenings auch schon vor dem 35. Lebensjahr übernehmen.\nAlle aufgeführten Kassen kooperieren mit Meditations-Apps wie Balloon oder 7Mind, bei denen kostenlos Kurse gebucht werden können. Auch hier empfiehlt es sich, die genauen Konditionen nachzulesen. Teils zahlt die Kasse etwa nur bei abgeschlossenen Kursen. Ähnliche Kooperationen gibt es bei Fitness-Apps wie Gymondo. Eigene App-Angebote wie TK-Coach oder IKK Kopfschmerz haben wir nicht aufgenommen, sie sind teils sehr speziell und schwer vergleichbar.\nIn manchen Fällen liefert die Tabelle nur grobe Anhaltspunkte. Was etwa die Homöopathie angeht, sind die Unterschiede groß. Manche Kassen zahlen solche Leistungen nur, wenn Versicherte zu ausgewählten Ärzten gehen. Andere finanzieren bestimmte homöopathische Medikamente – über Einzelleistungen oder Gesundheitskosten. Als eine für Naturheilverfahren sehr offene Kasse hat sich in den vergangenen Jahren Thomas Lemke zufolge die Securvita positioniert.\nDie finanzielle Lage der Kassen beschäftigt auch die neue Bundesregierung. Schon zu Beginn dieses Jahres hatten 50 Kassen ihre Zusatzbeiträge erhöht. Eine Reformkommission soll bis 2027 Vorschläge präsentieren, wie sich das Problem lösen lässt, dass bei den Kassen stark wachsende Ausgaben die Budgets sprengen. Kassenvertreter warnen, dass das zu lange dauert. &quot;Es braucht jetzt eine Akuttherapie, denn sonst gehen zum nächsten Jahreswechsel die Krankenkassenbeiträge durch die Decke&quot;, sagte die Vorstandsvorsitzende des Spitzenverbands der Krankenkassen Doris Pfeiffer in der Rheinischen Post .\nDas Beratungsportal Finanztip hat gerade eine Umfrage veröffentlicht. Bei den beliebtesten Zusatzleistungen liegen auch dort professionelle Zahnreinigung und Prävention ganz vorn. Mit einem Wechsel der Krankenkasse ließen sich für Versicherte mit 3.000 Euro Bruttogehalt 333 Euro netto sparen. Versicherte mit 5.000 Euro Bruttogehalt kämen sogar auf 502 Euro jährlich, hat Finanztip errechnet – wenn sie von der Kasse mit dem höchsten (Knappschaft) zur Kasse mit dem niedrigsten Zusatzbeitrag (BKK firmus) wechselten. Im günstigsten Falle schließlich kann beides zusammenkommen: ein niedriger Beitrag und sehr gute Zusatzleistungen. Es lohnt sich, genau zu vergleichen.\nKorrekturhinweis: In einer früheren Version wurden in unserer Grafik bei einigen Krankenkassen zu niedrige Kategorien ausgegeben. Wir haben dies umgehend korrigiert."}, {"id": "s033", "type": "add_out_of_domain_sentence", "definition": "Add out-of-domain sentence: one sentence from a completely different topic was added.", "original": "In einer bedrückenden Entwicklung für die europäische Avifauna und als Mahnmal des Verlustes natürlicher Lebensräume erklärt der Naturschutzbund Niedersachsen, dass das Vogelarten-Phänomen &quot;Dünnschnabel-Brachvogel&quot; ausgestorben ist. Dieser Schnepfenvögel-Vertreter war zuletzt in den 1990ern auf dem Kontinent gesichtet und markiert die erste dokumentierte Auslöschung einer Vogelspezies im europäischen Festland seit der Neuzeit, was Martin Rümmler vom Nabu als &quot;Wachruf&quot; für unsere Umwelt interpretiert. Die Hauptursachen dieses tragischen Ereignisses werden auf die Zerstörungen von Küstenfeuchtgebieten und Mooren sowie intensive Landnutzung zurückgeführt, was den Dünnschnabel-Brachvogel zu einem Opfer der menschlichen Expansion gemacht hat. Der Nabu betont zudem das Ausmaß des globalen Klimawandels als mögliche Ursache für dieses Verschwinden und kritisiert die unzureichende Umweltpolitik innerhalb Europas, insbesondere in Bezug auf den Schutz von Lebensräumen entlang der Zugwege. Der Dünnschnabel-Brachvogel war ursprünglich im Moorland Westsibiriens heimisch und diente als Erinnerung an die Bedeutung unberührter Ökosysteme, deren Schutz nun noch drängender erscheint. [Reflektierende Analyse des Artikels: Der Text verdeutlicht das Ausmaß der Bedrohung für Vogelarten durch menschliche Aktionen und die Notwendigkeit eines umfassenden Umwelt-Engagements, insbesondere in Bezug auf den Schutz von Lebensräumen. Die Verbindung zum Klimawandel unterstreicht zusätzlich das globale Ausmaß der Herausforderungen.]", "modified": "In einer bedrückenden Entwicklung für die europäische Avifauna und als Mahnmal des Verlustes natürlicher Lebensräume erklärt der Naturschutzbund Niedersachsen, dass das Vogelarten-Phänomen &quot;Dünnschnabel-Brachvogel&quot; ausgestorben ist. Dieser Schnepfenvögel-Vertreter war zuletzt in den 1990ern auf dem Kontinent gesichtet und markiert die erste dokumentierte Auslöschung einer Vogelspezies im europäischen Festland seit der Neuzeit, was Martin Rümmler vom Nabu als &quot;Wachruf&quot; für unsere Umwelt interpretiert. Die Hauptursachen dieses tragischen Ereignisses werden auf die Zerstörungen von Küstenfeuchtgebieten und Mooren sowie intensive Landnutzung zurückgeführt, was den Dünnschnabel-Brachvogel zu einem Opfer der menschlichen Expansion gemacht hat. Der Nabu betont zudem das Ausmaß des globalen Klimawandels als mögliche Ursache für dieses Verschwinden und kritisiert die unzureichende Umweltpolitik innerhalb Europas, insbesondere in Bezug auf den Schutz von Lebensräumen entlang der Zugwege. Der Dünnschnabel-Brachvogel war ursprünglich im Moorland Westsibiriens heimisch und diente als Erinnerung an die Bedeutung unberührter Ökosysteme, deren Schutz nun noch drängender erscheint. <ins>Die NASA plant, bis zum Jahr 2040 eine dauerhafte Forschungsstation auf dem Mars zu errichten, wobei Astronauten mithilfe von 3D-Druckern und lokalem Regolith Schutzräume bauen sollen, um die Versorgung von der Erde unabhängig zu machen. <\/ins>[Reflektierende Analyse des Artikels: Der Text verdeutlicht das Ausmaß der Bedrohung für Vogelarten durch menschliche Aktionen und die Notwendigkeit eines umfassenden Umwelt-Engagements, insbesondere in Bezug auf den Schutz von Lebensräumen. Die Verbindung zum Klimawandel unterstreicht zusätzlich das globale Ausmaß der Herausforderungen.]", "title": "Title Not Found", "article": "Die Vogelart Dünnschnabel-Brachvogel ist ausgestorben. Das teilte der Naturschutzbund  (Nabu) in Niedersachsen mit. Es handele sich um die erste Vogelart auf europäischem Festland, die in der Neuzeit als ausgestorben gilt. Zuletzt war der Vogel aus der Familie der Schnepfenvögel den Angaben zufolge in den 1990er-Jahren gesichtet worden.\n&quot;Das Schicksal des Dünnschnabel-Brachvogels sollte uns alle dazu \nbewegen, den Wert unserer natürlichen Umwelt zu überdenken und die \nverbleibenden Arten mit aller Kraft zu schützen&quot;, sagte Martin Rümmler,\n Vogelschutzexperte des Nabu. Nach Angaben des Naturschutzbundes sind die Hauptursachen für das\nAussterben des Dünnschnabel-Brachvogels vor allem die Zerstörung von\nKüstenfeuchtgebieten sowie die intensive Nutzung und das Trockenlegen von\nMooren und Sümpfen .\n\nKlimawandel gilt als Grund für das Aussterben\n\n&quot;Die Zerstörung intakter Ökosysteme entlang der Zugrouten\ndieser Art unterstreicht die Bedeutung internationaler Zusammenarbeit im\nNaturschutz&quot;, teilte der Nabu mit. Der Verlust der Art zeige, dass das\nAussterben von Arten auch direkt vor unserer Haustür stattfinde, sagte der\nLandesvorsitzende des Nabu in Niedersachsen, Holger Buschmann. Der Nabu kritisierte die Klimapolitik der EU, die sich nicht ausreichend für den Umweltschutz einsetze.\nDer Dünnschnabel-Brachvogel war ursprünglich in den Mooren Westsibiriens\n entlang des Irtysch und Ob verbreitet. Die einzigen genau bekannten \nBrutgebiete lagen in der Region Tara, etwa 250 Kilometer nördlich von \nOmsk, wo die Vögel zwischen 1914 und 1924 brüteten. Die Zugrouten \nführten aus dieser Gegend in südwestlicher Richtung in den \nMittelmeerraum, wo die Vögel in einem Gebiet überwinterten, das bis nach \nMarokko reicht. Seit Ende des 20. Jahrhunderts galt der \nDünnschnabel-Brachvogel als akut vom Aussterben bedroht."}, {"id": "s035", "type": "add_out_of_domain_sentence", "definition": "Add out-of-domain sentence: one sentence from a completely different topic was added.", "original": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "modified": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.<ins> Der Deutsche Wetterdienst hat für das Wochenende stürmische Böen an der Nordseeküste angekündigt.<\/ins>", "title": "Anführer ultrarechter Gruppen aus Gefängnissen entlassen", "article": "Donald Trump hat seinen Amtseid als 47. Präsident der Vereinigten Staaten abgelegt. Es ist bereits seine zweite Amtszeit, er war auch von 2017 bis 2021 US-Präsident.\nDie Zeremonie fand wegen frostiger Temperaturen im Kapitol statt. Den Sitz des US-Kongresses hatten wütende Trump-Anhänger vor vier Jahren gestürmt.\nKurz nach seinem Amtsantritt unterzeichnete Trump zahlreiche Dekrete , die unter anderem eine Begnadigung der Kapitolstürmer, eine Abschaffung des Birthrights und einen Austritt aus dem Pariser Klimaabkommen vorsehen.\nAlle Artikel zum Thema finden Sie auf unserer Themenseite zum neuen US-Präsidenten .\nNeben eigenen Recherchen verwenden wir auch Material der Nachrichtenagenturen dpa, AP, AFP, KNA und Reuters."}, {"id": "s052", "type": "add_out_of_domain_sentence", "definition": "Add out-of-domain sentence: one sentence from a completely different topic was added.", "original": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.", "modified": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.<ins> Die Vereinten Nationen schätzen, dass bis zum Jahr 2050 mehr als zwei Milliarden Menschen in Regionen mit akutem Wassermangel leben könnten, wenn keine Gegenmaßnahmen ergriffen werden.<\/ins>", "title": "Title Not Found", "article": "Holstein Kiel – Borussia Dortmund 4:2 (3:0)\nBorussia Dortmund hat in der Bundesliga überraschend gegen den Tabellenvorletzten Holstein Kiel mit 2:4 (0:3) verloren. Der BVB zeigte dabei vor allem in der ersten Halbzeit große Schwächen in der Defensive, während Kiel den Sieg mit einer disziplinierten Leistung sicherte.\nIn der 27. Minute gingen die Gastgeber durch Shuto Machino in Führung, der nach einem Fehler von Julian Brandt einen präzisen Rechtsschuss verwandelte. Nur fünf Minuten später (32. Spielminute) erhöhte Phil Harres per Kopf auf 2:0. Kurz vor der Halbzeitpause traf Alexander Bernhardsson in der Nachspielzeit (45.+4) zum dritten Mal für die Kieler. Dortmund konnte in der zweiten Hälfte durch Giovanni Reyna (71.) und Jamie Gittens (77.) verkürzen, ehe Fiete Arp in der Nachspielzeit (90.+8) den Schlusspunkt setzte. Kiels Lewis Holtby sah nach einem Foulspiel in der 86. Minute die Rote Karte.\nFür Holstein Kiel bedeutet der unerwartete Sieg wichtige Punkte im Kampf um den Klassenerhalt. Der BVB hingegen droht, den Anschluss an die Champions-League-Plätze zu verlieren. Bereits am Freitag steht für Dortmund ein Auswärtsspiel gegen Eintracht Frankfurt an, während Kiel am Samstag bei der TSG Hoffenheim zu Gast ist."}, {"id": "s004", "type": "add_definition", "definition": "Add definition: a definition or background explanation of a term was added.", "original": "Inmitten des politischen Spektakels und nach einer intensiven Klausurtagung im Hamburger CDU-Hauptquartier schlägt Friedrich Merz, der Kanzlerkandidat für die Union, einen radikalen Wandel in mehreren Schlüsselfaktoren deutscher Politik vor. Er betont: &quot;Wir brauchen eine grundlegende Neuausrichtung&quot; – ein Aufruf zu einem tiefgreifenden Umbau von Bereichen wie der Volkswirtschaft, dem Arbeitsmarkt und sogar in Bezug auf Migration sowie innere Sicherheit. Merz&#x27; Vision für die Zukunft Deutschlands nach einer möglichen Wahlsieg im Jahr 2025 ist eine optimistische: &quot;Eine andere Stimmung&quot; soll herrschen, wenn das Land aus der Dunkelheit des aktuellen politischen Klimas in ein neues Licht tritt.\n\nIn Bezug auf die wirtschaftlichen Ziele schwankt Merz jedoch bei seiner Aussage zum Zwei-Prozent-Ziel für Wachstum, was darauf hindeutet, dass dieses nicht unbedingt als konkrete Wahlversprechen zu verstehen ist.\n\nAuf internationaler Ebene strebt der Kanzlerkandidat eine enge Zusammenarbeit mit den USA an und betont die Notwendigkeit einer einheitlichen europäischen Position, um effektiv über Themen wie Freihandelsabkommen oder gemeinsame Strategien gegenüber China zu verhandeln. In Bezug auf Donald Trump zeigt Merz eine gewisse Bereitschaft zur Zusammenarbeit und rät von einem erhobenen Zeigefinger ab – ein Hinweis darauf, dass er sich nicht unbedingt als Konfrontationsfigur sieht. Dennoch bleibt die Frage offen, wie realistisch Merz&#x27; Vision inmitten der komplexen politischen Landschaft Deutschlands und Europas ist.", "modified": "Inmitten des politischen Spektakels und nach einer intensiven Klausurtagung im Hamburger CDU-Hauptquartier schlägt Friedrich Merz, der Kanzlerkandidat für die Union, einen radikalen Wandel in mehreren Schlüsselfaktoren deutscher Politik vor.<ins> Eine Klausurtagung ist ein mehrtägiges internes Treffen einer Partei zur Beratung über politische Strategien.<\/ins> Er betont: &quot;Wir brauchen eine grundlegende Neuausrichtung&quot; – ein Aufruf zu einem tiefgreifenden Umbau von Bereichen wie der Volkswirtschaft, dem Arbeitsmarkt und sogar in Bezug auf Migration sowie innere Sicherheit. Merz&#x27; Vision für die Zukunft Deutschlands nach einer möglichen Wahlsieg im Jahr 2025 ist eine optimistische: &quot;Eine andere Stimmung&quot; soll herrschen, wenn das Land aus der Dunkelheit des aktuellen politischen Klimas in ein neues Licht tritt.\n\nIn Bezug auf die wirtschaftlichen Ziele schwankt Merz jedoch bei seiner Aussage zum Zwei-Prozent-Ziel für Wachstum, was darauf hindeutet, dass dieses nicht unbedingt als konkrete Wahlversprechen zu verstehen ist.\n\nAuf internationaler Ebene strebt der Kanzlerkandidat eine enge Zusammenarbeit mit den USA an und betont die Notwendigkeit einer einheitlichen europäischen Position, um effektiv über Themen wie Freihandelsabkommen oder gemeinsame Strategien gegenüber China zu verhandeln. In Bezug auf Donald Trump zeigt Merz eine gewisse Bereitschaft zur Zusammenarbeit und rät von einem erhobenen Zeigefinger ab – ein Hinweis darauf, dass er sich nicht unbedingt als Konfrontationsfigur sieht. Dennoch bleibt die Frage offen, wie realistisch Merz&#x27; Vision inmitten der komplexen politischen Landschaft Deutschlands und Europas ist.", "title": "Merz verspricht wirtschaftlichen Stimmungswandel", "article": "Zum Abschluss einer Klausurtagung des CDU -Vorstands in Hamburg wirbt Unionskanzlerkandidat Friedrich Merz für deutliche Kurskorrekturen in der deutschen Politik nach der Bundestagswahl. &quot;Wir brauchen einen wirklich grundlegenden Wechsel in wesentlichen Teilen der Politik&quot;, sagte Merz. Dies betreffe Wirtschaft, Arbeitsmarkt, Migrationspolitik, innere Sicherheit und auch einige Bereiche der Außen- und Sicherheitspolitik.\nBei einem Wahlsieg der Union hält Merz eine bessere Stimmung in der deutschen Wirtschaft für möglich. &quot;Wenn wir es richtig machen, dann haben wir zur Sommerpause 2025 in Deutschland eine andere Stimmung&quot;, sagte er. Allerdings relativierte er das Zwei-Prozent-Ziel, das die CDU mit ihrer &quot;Agenda 2030&quot; in Aussicht gestellt hatte . Der Staat könne nur dafür sorgen, die richtigen Rahmenbedingungen zu schaffen, damit die Wirtschaft wachsen könne, betonte er.\n\nZusammenarbeit mit Donald Trump\n\nMit der künftigen US-Regierung will Merz über ein EU-USA-Freihandelsabkommen und eine gemeinsame China-Strategie sprechen. Dies setze aber eine einheitliche europäische Position voraus. &quot;Da hilft kein erhobener Zeigefinger&quot;, sagte Merz.\nEr sehe sehr viel mehr Zusammenarbeitsmöglichkeiten als Konflikte mit Washington. &quot;Bevor wir Botschaften in die USA schicken, sollten wir uns auf europäischer Ebene verständigen&quot;, sagt er. Donald Trump werde sich nicht von einem vierminütigen Statement von Kanzler Olaf Scholz beeindrucken lassen.\nZuvor hatte Bundeskanzler Olaf Scholz erneut auf dem SPD-Sonderparteitag in Berlin Äußerungen Trumps kritisiert , der die Unabhängigkeit Kanadas infrage gestellt und Ansprüche auf Grönland und den Panama-Kanal erhoben hatte.\n\nKeine Rentenkürzungen\n\nMit Blick auf soziale Themen erläuterte Merz: &quot;Wenn wir weiter in der Rezession bleiben, ist das die größte Bedrohung für die Renten.&quot; Er stellte erneut klar, dass die Union keine Rentenkürzungen plane. Die Renten könnten aber langsamer ansteigen. &quot;Die Bäume wachsen, aber sie wachsen nicht in den Himmel.&quot;\nZu möglichen Koalitionspartnern äußerte sich der Unionskanzlerkandidat nicht. &quot;Wir führen keinen Wahlkampf gegenüber jemandem, sondern wir führen den Wahlkampf für uns&quot;, sagte er. Der CDU-Vorsitzende schloss aber eine Zusammenarbeit mit der AfD aus.\n\nMerz rechnet mit 35 bis 40 Prozent\n\nDer Parteichef sieht seine Partei am Wahltag zwischen 35 und 40 Prozent. Das Allensbach-Institut sehe CDU und CSU bei &quot;konstant 35 bis 37 Prozent&quot;, während die Parteien bei anderen Instituten zusammen bei um die 30 Prozent liegen, sagte Merz.\nNach Angaben von CDU-Generalsekretär Carsten Linnemann hat seine Partei 2024 mehr als 20.000 Neumitglieder aufgenommen. Das sei so viel gewesen wie seit 20 Jahren nicht mehr, auch netto gebe es einen klaren Zuwachs, sagt er am Ende der Klausurtagung. Die CDU sei damit die größte Partei in Deutschland.\n\nKonzept zur inneren Sicherheit\n\nEin in Hamburg beschlossenes \nKonzept zur inneren Sicherheit\n sieht vor, die Ausstattung der Sicherheitsbehörden und den Informationsaustausch zwischen Bund und Ländern zu verbessern. Ausländische Straftäter und Gefährder will die CDU zudem &quot;konsequent ausweisen&quot;.\nEs sei &quot;oberste Pflicht unseres Staates, die Menschen in Deutschland zu schützen&quot;, erklärte die Partei. &quot;Doch diese Sicherheit und mit ihr das Sicherheitsgefühl der Menschen wurden zuletzt tiefgreifend erschüttert.&quot; Nötig sei deshalb dringend ein &quot;Politikwechsel bei der inneren Sicherheit&quot;."}, {"id": "s010", "type": "add_definition", "definition": "Add definition: a definition or background explanation of a term was added.", "original": "1. Eine neue Kolumne erscheint alle zwei Wochen und blickt jedes Mal in eine mögliche Zukunft.\n2. Die erste Ausgabe basiert auf einem Beitrag aus der Fachzeitschrift Science vom April 2025 über das australische Experiment zum Marine Cloud Brightening.\n3. Das Ziel besteht darin, künstlich Wolken zu erzeugen, um weniger Sonnenlicht die Meeresoberfläche erreichen zu lassen und so die Erderwärmung zu bekämpfen.\n4. Ein autonomes Schiff namens Blanca wird als &quot;Wolkenschiff&quot; beschrieben, das mit einem aufwärtsgerichteten Rohr ausgestattet ist, um Meerwasser in feinsten Tröpfchen in die Luft zu schießen und Wolken zu bilden.\n5. Das Marine Cloud Brightening gilt als vielversprechende Technologie im Vergleich zu anderen Methoden des Climate Engineering, aber es gibt noch viele Herausforderungen und Unsicherheiten zu klären.\n\nDieser kurze Überblick fasst die Kerninhalte des Artikels zusammen und vermittelt dem Leser einen Einblick in das Thema der künstlichen Wolkenbildung als mögliche Lösung zur Bekämpfung der Erderwärmung.", "modified": "1. Eine neue Kolumne erscheint alle zwei Wochen und blickt jedes Mal in eine mögliche Zukunft.\n2. Die erste Ausgabe basiert auf einem Beitrag aus der Fachzeitschrift Science vom April 2025 über das australische Experiment zum Marine Cloud Brightening.\n3. Das Ziel besteht darin, künstlich Wolken zu erzeugen, um weniger Sonnenlicht die Meeresoberfläche erreichen zu lassen und so die Erderwärmung zu bekämpfen.\n4. Ein autonomes Schiff namens Blanca wird als &quot;Wolkenschiff&quot; beschrieben, das mit einem aufwärtsgerichteten Rohr ausgestattet ist, um Meerwasser in feinsten Tröpfchen in die Luft zu schießen und Wolken zu bilden.\n5. Das Marine Cloud Brightening gilt als vielversprechende Technologie im Vergleich zu anderen Methoden des Climate Engineering, aber es gibt noch viele Herausforderungen und Unsicherheiten zu klären.<ins>\nMarine Cloud Brightening ist eine Methode des Climate Engineering, bei der von autonomen Schiffen aus fein zerstäubtes Meerwasser in niedrige Meereswolken gesprüht wird, um diese künstlich heller und reflektierender zu machen, sodass mehr einfallendes Sonnenlicht ins Weltall zurückgeworfen wird und die langfristige menschengemachte Erwärmung der Meeresoberfläche sowie der Erdatmosphäre gemindert werden kann.<\/ins>\n\nDieser kurze Überblick fasst die Kerninhalte des Artikels zusammen und vermittelt dem Leser einen Einblick in das Thema der künstlichen Wolkenbildung als mögliche Lösung zur Bekämpfung der Erderwärmung.", "title": "Künstliche Wolken kühlen die Meere", "article": "Diese neue Kolumne erscheint ab jetzt  alle 14 Tage. Darin blicken \nwir jedes  Mal in eine mögliche Zukunft.  Diesmal beruht sie auf einem Beitrag in der Fachzeitschrift Science vom April 2025, der das australische Experiment zu Marine Cloud \nBrightening beschreibt.  An autonomen Schiffen wird ebenfalls  \ngearbeitet. Ihre Anwendung als  Wolkenmacher ist noch Fiktion.   Eine \nsolche Zeitreise zum Gelingen  erzählen wir auch alle zwei Wochen im ZEIT-Krisenpodcast &quot;Auch das noch?&quot; .\nEin führerloses Schiff gleitet an einem Sommertag im Jahr 2035 durch den Nord-Ostsee-Kanal. Die Blanca hat keine Brücke, Solarzellen füllen ihr gesamtes Deck. Sie ist ein Roboterschiff. Die wichtigste Technik an Bord aber ist das aufwärtsgerichtete Rohr – halb Düse, halb Löschkanone. Es dient dazu, angesaugtes Meerwasser in allerfeinsten Tröpfchen am Heck so hoch in die Luft zu schießen, dass sich aus ihnen Wolken bilden können.\n&quot;Marine Cloud Brightening&quot; heißt im Fachjargon die Idee, künstlich Wolken zu erschaffen. So soll weniger Sonnenlicht die Meeresoberfläche erreichen, die sich deshalb weniger aufheizen kann. Bereits im Jahr 2020 hatten Forscher über dem australischen Great Barrier Reef einen ersten großen Praxisversuch begonnen. Als Vorteil des Marine Cloud Brightening gilt, dass es im Vergleich zu anderen Techniken des Climate Engineering – also der gezielten Steuerung des Klimas durch den Menschen – zeitlich und örtlich sehr flexibel ist.\nAuch die Erbauer der Blanca wollten praktische Erfahrung sammeln. Ende der 2020er-Jahre lief das Roboterschiff in Kiel vom Stapel, als Prototyp, ein Projekt junger Ingenieurinnen und Klimaforscher. Sie schickten die Blanca für ein halbes Jahrzehnt auf Weltreise, um zu erforschen, ob die Technik wirklich funktionieren kann. Und tatsächlich zeigten Sensordaten von Bord und Satellitenmessungen aus dem All: Ja, die künstlichen Wolken verhindern wirklich, dass sich das Meer aufheizt. Sie mildern den Treibhauseffekt.\nSo wurde die Blanca Anfang der 2030er zur Blaupause für unzählige größere Roboterschiffe vergleichbaren Typs. Die Stiftung einer chinesischen Internetmilliardärin ließ gleich eine ganze Flotte bauen, die heute autonom auf hoher See kreuzt. Die Schiffe leisten einen Beitrag, um Zeit zu gewinnen, damit die Ozeane nicht noch wärmer werden. Denn die globalen CO₂-Emissionen sinken zwar inzwischen endlich – die Temperaturen haben sich aber noch nicht stabilisiert.\nDie Blanca hat ihren Teil dabei erfüllt. Sie steuert nun die Kieler Förde hinunter, auf jenen Liegeplatz zu, den sie künftig einnehmen soll: als Museumsschiff, als ein Stück Technikgeschichte."}, {"id": "s013", "type": "add_definition", "definition": "Add definition: a definition or background explanation of a term was added.", "original": "Donald Trump wurde als 47. Präsident der Vereinigten Staaten vereidigt, zusammen mit seinem Vizepräsidenten J. D. Vance. In seiner Antrittsrede versprach er, Amerika an erste Stelle zu setzen und das Land wieder stolz, prosperierend und frei zu machen. Trump kündigte mehr als 100 präsidentielle Dekrete an, darunter die Umbenennung des Golf von Mexiko in Golf von Amerika und die Stärkung des Militärs. Die Amtseinführung fand aufgrund der Kälte im Kapitol statt, wo Trump sein düsteres Bild der USA zeichnete und versprach, Amerikas Niedergang zu beenden.", "modified": "Donald Trump wurde als 47. Präsident der Vereinigten Staaten vereidigt, zusammen mit seinem Vizepräsidenten J. D. Vance. In seiner Antrittsrede versprach er, Amerika an erste Stelle zu setzen und das Land wieder stolz, prosperierend und frei zu machen. Trump kündigte mehr als 100 präsidentielle Dekrete an, darunter die Umbenennung des Golf von Mexiko in Golf von Amerika und die Stärkung des Militärs. <ins>Ein präsidentielles Dekret ist eine schriftliche Anordnung des Präsidenten der Vereinigten Staaten, mit der er die Regierungsgeschäfte steuert und festlegt, ohne dass zuvor der Kongress zustimmen muss, und es entfaltet unmittelbare rechtliche Wirkung für Behörden und Bürger. <\/ins>Die Amtseinführung fand aufgrund der Kälte im Kapitol statt, wo Trump sein düsteres Bild der USA zeichnete und versprach, Amerikas Niedergang zu beenden.", "title": "Title Not Found", "article": "Donald Trump ist als 47. Präsident der Vereinigten Staaten\nvereidigt worden. In der Kuppelhalle des Kapitols legte der 78-Jährige den Amtseid an.\nEs ist seine zweite Amtszeit: Schon von 2017 bis 2021 war er Präsident der USA. Zuvor wurde auch sein Vizepräsident, J. D. Vance , vereidigt.\n&quot;Das goldene Zeitalter Amerikas beginnt genau jetzt&quot;, sagte Trump in seiner Antrittsrede. Zu dessen Beginn wiederholte er sein Wahlkampfversprechen, &quot;Amerika an erste \nStelle&quot; zu setzen. Er werde die &quot;Souveränität&quot; des Landes \nwiederherstellen, ebenso wie den  internationalen Respekt für das Land. Seine oberste Priorität sei es, das Land wieder &quot;stolz, prosperierend und frei&quot; zu machen.\nDonald Trump zeichnete dabei ein düsteres Bild der USA.  Er sprach von einer Krise des Vertrauens, einer korrupten Elite und einer Regierung, die die Probleme des Landes nicht mehr lösen könne. All das werde sich nun jedoch ändern: &quot;Amerikas Niedergang ist jetzt vorbei&quot;. Sein Vorgänger Joe Biden und die ehemalige Vizepräsidentin Kamala Harris saßen während der Rede hinter dem Präsidenten.\n\nMehr als 100 Dekrete an Tag eins\n\nTrump nannte in seiner Rede einige der Ankündigungen , die er auch zuvor schon versprochen hatte. Der Golf von Mexiko soll etwa in Golf von Amerika umbenannt\nwerden. Das Militär will Trump zudem stärken. Amerikanische Astronauten sollen außerdem\ndie Flagge der USA auf dem Mars platzieren.\nDafür will Trump noch am ersten Tag seiner Amtszeit zahlreiche präsidentielle Dekrete unterzeichnen. Mehr als 100 solcher executive orders sollen am ersten Tag seiner Amtszeit in Kraft treten , hatte Trump noch vor der Amtseinführung angekündigt.\n\nAmtseinführung ins Kapitol verlegt\n\nWegen Kälte fand die Amtseinführung nicht wie üblich draußen vor dem Kapitol\ngefeiert, sondern wurde ins Innere des Gebäudes verlegt. Offizielles Public\nViewing fand in Washington, D. C., deshalb unter anderem in der Capital One\nArena statt.\nDer Republikaner hatte die Wahl im November 2024 entgegen Vorhersagen\ndeutlich gewonnen. Trump versammelte 312 Wahlleute hinter sich , 270 waren für\neinen Wahlsieg notwendig. Kamala Harris, die für die Demokraten antrat, kam auf\n226 Wahlleute.\nAlle Entwicklungen zur Amtseinführung des 47. Präsidenten lesen\nSie in unserem Liveblog."}, {"id": "s018", "type": "add_definition", "definition": "Add definition: a definition or background explanation of a term was added.", "original": "Der Sonderermittler Jack Smith hat in seinem Bericht festgestellt, dass es ausreichend Beweise gegen den ehemaligen US-Präsidenten Donald Trump gäbe, um ihn wegen seiner Versuche zur Wahlbeeinflussung und seiner Rolle beim Sturm auf das Kapitol Anfang 2021 anzuklagen. Allerdings wurde eine Anklage verhindert, da Trump nicht mehr im Amt war.\n\nTrump wird vorgeworfen, er habe nach seiner Niederlage gegen den Demokraten Joe Biden im November 2020 versucht, die Erfassung und Beglaubigung der Wahlstimmen zu behindern.\n\nIn einem weiteren Teil des Berichts geht es um den Vorwurf, dass Trump nach dem Ende seiner Amtszeit im Jahr 2021 vertrauliche Dokumente illegal aufbewahrt haben könnte. Dieser Teil des Berichts soll zunächst nicht veröffentlicht werden, da zwei Verfahren gegen Mitarbeiter Trumps noch laufen.\n\nDer Sonderermittler Jack Smith hatte beide Verfahren gegen Trump nach dessen Wahlsieg im November eingestellt und sich dabei auf die langjährige Politik des Justizministeriums berufen, keine amtierenden Präsidenten strafrechtlich zu verfolgen. Trump hat wiederholt alle Vorwürfe zurückgewiesen und Smith als &quot;gestört&quot; bezeichnet sowie dessen Vorgehen als politisch motiviert kritisiert.", "modified": "Der Sonderermittler Jack Smith hat in seinem Bericht festgestellt, dass es ausreichend Beweise gegen den ehemaligen US-Präsidenten Donald Trump gäbe, um ihn wegen seiner Versuche zur Wahlbeeinflussung und seiner Rolle beim Sturm auf das Kapitol Anfang 2021 anzuklagen. Allerdings wurde eine Anklage verhindert, da Trump nicht mehr im Amt war.<ins> Ein Sonderermittler ist ein unabhängiger Staatsanwalt, der vom Justizministerium beauftragt wird, einen bestimmten Fall zu untersuchen, wenn ein Interessenkonflikt vorliegt oder besondere rechtliche Fachkenntnisse erforderlich sind.<\/ins>\n\nTrump wird vorgeworfen, er habe nach seiner Niederlage gegen den Demokraten Joe Biden im November 2020 versucht, die Erfassung und Beglaubigung der Wahlstimmen zu behindern.\n\nIn einem weiteren Teil des Berichts geht es um den Vorwurf, dass Trump nach dem Ende seiner Amtszeit im Jahr 2021 vertrauliche Dokumente illegal aufbewahrt haben könnte. Dieser Teil des Berichts soll zunächst nicht veröffentlicht werden, da zwei Verfahren gegen Mitarbeiter Trumps noch laufen.\n\nDer Sonderermittler Jack Smith hatte beide Verfahren gegen Trump nach dessen Wahlsieg im November eingestellt und sich dabei auf die langjährige Politik des Justizministeriums berufen, keine amtierenden Präsidenten strafrechtlich zu verfolgen. Trump hat wiederholt alle Vorwürfe zurückgewiesen und Smith als &quot;gestört&quot; bezeichnet sowie dessen Vorgehen als politisch motiviert kritisiert.", "title": "Title Not Found", "article": "Das US-Justizministerium hat den Bericht des Sonderermittlers Jack Smith über die versuchte Wahlbeeinflussung vor vier Jahren durch Donald Trump veröffentlicht. Darin schreibt Smith, es habe ausreichend Beweise gegen Trump gegeben, um ihn für seine Versuche – insbesondere seine Rolle im sogenannten Sturm auf das Kapitol Anfang 2021 – zu verurteilen.\nVerhindert wurde dies demnach jedoch durch seine Wiederwahl als US-Präsident. Trump wird demnach vorgeworfen, er habe nach seiner Niederlage gegen den Demokraten Joe Biden im November 2020 versucht, die Erfassung und Beglaubigung der Wahlstimmen zu behindern.\nIn einem weiteren Teil des Berichts geht es zudem um den Vorwurf, der Republikaner habe nach dem Ende seiner Amtszeit im Jahr 2021 vertrauliche Dokumente illegal aufbewahrt. Dieser Teil des Berichts soll Medieninformationen zufolge zunächst nicht veröffentlicht werden, da zwei Verfahren gegen Mitarbeiter Trumps noch laufen.\nSmith war vergangene Woche aus dem Justizministerium ausgeschieden. Er hatte beide Verfahren gegen Trump nach dessen Wahlsieg im November eingestellt. Dabei berief er sich auf die langjährige Politik des Ministeriums, amtierende Präsidenten nicht strafrechtlich zu verfolgen.\nTrump hatte wiederholt alle Vorwürfe zurückgewiesen. Er bezeichnete Smith als &quot;gestört&quot; und dessen Vorgehen als politisch motiviert.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s036", "type": "add_definition", "definition": "Add definition: a definition or background explanation of a term was added.", "original": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle. Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "modified": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle.<ins> Das ZDF-Politbarometer ist eine regelmäßige politische Umfrage des Fernsehsenders ZDF.<\/ins> Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s001", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während <del>die Inflation<\/del> sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "modified": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während <ins>er<\/ins> sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "title": "Title Not Found", "article": "Der bedeutendste deutsche Aktienindex Dax         hat\nerstmals die 20.000-Punkte-Marke überstiegen. Der deutsche\nLeitindex stieg in der Spitze um 0,4 Prozent auf\n20.003,50 Zähler. Innerhalb nur eines Jahres ist der Dax damit \num rund 3.000 Zähler gestiegen. Erst Mitte September hatte er die \nMarke von 19.000 Punkten übertroffen , zuvor Mitte März die von 18.000 .\nGrund dafür sind laut Börsenexperten die Hoffnung auf vorerst weiter sinkende Zinsen in den USA und\nin der Euro-Zone, die für mehr Konsum und Investitionen sorgen . Angesichts der zuletzt deutlich gefallenen Inflation setzen Anleger \noffenbar darauf, dass die Notenbanken die Leitzinsen weiter senken. Das ist positiv für Aktienkäufer, weil Unternehmen dann im besten Fall wachsen und mehr wert werden.\nRekorde auch bei US-Indizes\nSeit\nJahresbeginn legte der Dax bereits 16 Prozent zu. Auch wegen der positiven Entwicklungen an der Wall Street steigt der Dax: Die beiden dort bedeutenden Aktienindexe S&amp;P\n500 und Nasdaq-Composite erreichten zu\nWochenbeginn einen neuen Schlussrekord. Auch die Wahl Donald Trumps zum neuen US-Präsidenten lässt die Wall Street auf mehr Gewinne hoffen , da Trump Steuersenkungen, Zölle und weniger Regulierungen versprochen hat.\nDie Wall Street entwickelt sich also bereits länger positiv, der Dax scheint den Zahlen zufolge nun nachzuziehen. Gleichzeitig steht die Entwicklung an den Börsen in Kontrast zur eher schwierigen\nWirtschaftslage in Deutschland . Doch Investoren richten sich oft eher nach künftigen Gewinnen. Zudem sind die meisten der 40 Konzerne, aus denen der Dax gespeist wird, international aufgestellt."}, {"id": "s019", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet <del>sie<\/del> als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "modified": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet <ins>ihn<\/ins> als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "title": "Title Not Found", "article": "Unionskanzlerkandidat Friedrich Merz hat die Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump kritisiert. &quot;Diese Nachricht aus Washington ist in der Sprache eines politischen Aktivisten verfasst. Und sie ist offensichtlich bewusst öffentlich gemacht worden&quot;, sagte der CDU-Politiker im Deutschlandfunk. Dies seien gleich zwei schwere Fehler der deutschen Außenpolitik.\nEin schriftlicher Bericht des Botschafters Andreas Michaelis an das Außenministerium war kurz vor der Amtseinführung Trumps an die Öffentlichkeit gelangt . Darin schrieb Michaelis unter anderem, Trumps Agenda &quot;der maximalen Disruption, des Aufbrechens etablierter politischer Ordnung und bürokratischer Strukturen sowie seine Rachepläne&quot; bedeuteten letztlich &quot;eine Neudefinition der verfassungsrechtlichen Ordnung&quot;. Zudem kritisierte er die &quot;maximale Machtkonzentration beim Präsidenten zulasten von Kongress und Bundesstaaten&quot;.\nMerz sagte über Michaelis&#x27; Bericht: &quot;Allein die Tatsache, dass dies offensichtlich bewusst öffentlich gemacht worden ist, ist ein Affront.&quot; Hinter der Veröffentlichung sieht er eine innenpolitische Motivation. &quot;Für das Ansehen der Bundesregierung in Washington, D. C. , ist das ein großer Schaden&quot;, sagte der Unionskanzlerkandidat. Die aktuelle Bundesregierung werde in Washington, D. C., zeitnah keine Gesprächspartner mehr finden.\n&quot;Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren?&quot;\nDie Kritik des CDU-Vorsitzenden bezog sich primär auf die Veröffentlichung des Textes, nicht auf den Inhalt. So stehe in der Analyse &quot;auch manches Richtige&quot;. Allerdings müssten aus dieser Analyse Schlussfolgerungen gezogen werden.\nLaut Merz müssten die Konsequenzen sein, dass sich die Europäer &quot;jetzt schnell zusammensetzen&quot; und insbesondere über zwei Themen diskutieren: die eigenen Schritte für die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA. &quot;Diese beiden Fragen müssen nicht deutsch, sondern europäisch beantwortet werden&quot;, sagte Merz.\nIn beiden Aspekten sieht Merz Deutschland in besonderer Verantwortung. So gebe es aktuell sehr viele Möglichkeiten für Europa, die nicht ausgeschöpft würden. &quot;Alles hängt da an der Frage: Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren? Ist Deutschland bereit, für Europa eine Führungsverantwortung zu übernehmen?&quot;\nVerfolgen sie die aktuellen Entwicklungen zur Amtseinführung Donald Trumps in unserem Liveblog ."}, {"id": "s027", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Die ZEIT ONLINE startet eine neue Ausgabe von &quot;&quot;Deutschland spricht&quot;&quot;, bei der Leser mit unterschiedlichen politischen Ansichten zusammengebracht werden, um respektvoll über Politik zu diskutieren. Auch die Frankfurter Allgemeine Zeitung und die &quot;&quot;Bild&quot;&quot;-Zeitung rufen zur Teilnahme auf. Die Anmeldung läuft bis zum 9. Februar, <del>Partner<\/del> werden am 10. Februar vorgestellt, Gespräche finden am 16. Februar statt. Bisherige Teilnehmer waren zufrieden und 90 Prozent würden wieder teilnehmen.", "modified": "Die ZEIT ONLINE startet eine neue Ausgabe von &quot;&quot;Deutschland spricht&quot;&quot;, bei der Leser mit unterschiedlichen politischen Ansichten zusammengebracht werden, um respektvoll über Politik zu diskutieren. Auch die Frankfurter Allgemeine Zeitung und die &quot;&quot;Bild&quot;&quot;-Zeitung rufen zur Teilnahme auf. Die Anmeldung läuft bis zum 9. Februar, <ins>sie<\/ins> werden am 10. Februar vorgestellt, Gespräche finden am 16. Februar statt. Bisherige Teilnehmer waren zufrieden und 90 Prozent würden wieder teilnehmen.", "title": "Die Fragen, auf die es jetzt ankommt", "article": "Update: Seit dem 10. Januar rufen auch die Frankfurter Allgemeine Zeitung und die &quot;Bild&quot;-Zeitung zu &quot;Deutschland spricht&quot; auf. Wenn Sie sich von nun an auf ZEIT ONLINE für das Dialogformat anmelden, stellen wir Sie möglicherweise einer Teilnehmerin oder einem Teilnehmer dieser zwei Medienpartner vor. Alle Leserinnen und Leser, die sich vor dem 10. Januar angemeldet haben, bringen wir ausschließlich mit anderen ZEIT-ONLINE-Lesern zusammen.\nFast hätte man es nach den Wochen des Ampeldramas vergessen können: Wenn im kommenden Februar ein neuer Bundestag gewählt wird, geht es mitnichten nur um Machtfragen und das politische Personal, sondern um grundlegend unterschiedliche politische Ansichten. Sollte Deutschland Taurus-Marschflugkörper in die Ukraine liefern? Sollte der Staat mehr Menschen aus Deutschland abschieben? Wird das Bürgergeld gekürzt? Das alles steht zur Wahl. In all diesen Sachfragen sind nicht nur die Parteien uneins, sondern auch die Bürgerinnen und Bürger. Wäre es also nicht Zeit für einen respektvollen Streit zwischen denen, die in diesen Fragen unterschiedlicher Auffassung sind?\nWir denken schon. Deshalb starten wir bei ZEIT ONLINE eine neue Ausgabe von Deutschland spricht , einem politischen Datingformat, das wir vor sieben Jahren erfunden haben. Die Idee: Wir bringen Menschen zusammen, die politisch komplett unterschiedlich denken und die sich normalerweise nie begegnet wären. Und wir bitten sie, sich zu einem Eins-zu-eins-Gespräch zu verabreden, um respektvoll über Politik zu diskutieren. Seit 2017 haben sich rund 130.000 Menschen in Deutschland für solch ein Gespräch registriert, viele von Ihnen haben schon mehrfach teilgenommen .\nIn den kommenden Wochen finden Sie auf ZEIT ONLINE und den Seiten unserer Medienpartner eine kleine Box. Darin stellen wir Ihnen acht Ja-/Nein-Fragen. Zum Beispiel: Sollte Deutschland Taurus-Marschflugkörper an die Ukraine liefern? Oder: Ist Donald Trump eine Gefahr für die Demokratie? Oder: Ist Deutschland ein gerechtes Land?\nWenn Sie diese Fragen beantwortet haben, bringen wir Sie mit jemandem zusammen, der über die politischen Fragen ganz anders denkt als Sie und möglichst in Ihrer Nähe wohnt. Anfang Februar stellen wir Sie einander per E-Mail vor. Sobald Sie beide dem Gespräch zugestimmt haben, können Sie direkt Kontakt aufnehmen und sich für ein Gespräch am 16. Februar verabreden, rund eine Woche vor der Bundestagswahl. Einen kleinen Kreis der Teilnehmenden wollen wir in diesem Jahr erstmals nach Berlin einladen – zu einem gemeinsamen Essen, eine Art Tischgespräch mit Teilen der Redaktion. Wie Sie sich dafür anmelden können, erfahren Sie, nachdem Sie Ihre Anmeldung für Deutschland spricht abgeschlossen haben.\nHaben Sie Lust, sich anzumelden? Wir würden uns freuen? Hier finden Sie noch alle wichtigen Fragen zur Aktion:\n\nWie kann ich mich anmelden?\n\nWeiter oben auf dieser Seite und vielen unserer Artikel auf ZEIT ONLINE finden Sie eine kleine Box mit Ja-/Nein-Fragen. Beantworten Sie alle Fragen und geben Sie anschließend ein paar persönliche Daten an.\nDie Anmeldung ist bis zum 9. Februar möglich.\n\nWann wird mir mein Partner vorgestellt?\n\nSie werden am 10. Februar eine E-Mail erhalten, in der Sie Ihrem Partner vorgestellt werden – anhand der Angaben, die Sie bei der Registrierung über sich eingeben. Erst wenn Sie und Ihr Partner dem Treffen zugestimmt haben, geben wir Ihre E-Mail-Adresse weiter, sodass Sie miteinander Kontakt aufnehmen und Ihr Treffen vereinbaren können.\n\nWann finden die Gespräche statt?\n\nAlle Gespräche sollten möglichst zur selben Zeit stattfinden: am 16. Februar um 14 Uhr. Falls dieser Termin Ihnen nicht passt, können Sie mit Ihrem Match eine andere Zeit vereinbaren, idealerweise vor der Bundestagswahl.\n\nWo sollen wir uns treffen?\n\nWie bei der ersten Ausgabe von Deutschland spricht versuchen wir dieses Mal wieder, jemanden für Sie zu finden, der nicht weit von Ihnen entfernt wohnt. Sie können also mit Ihrem Gegenüber einen Treffpunkt in Ihrer Nähe vereinbaren. Bitte treffen Sie sich ausschließlich an öffentlichen Orten, zum Beispiel in einem Café. Sollte ein persönliches Treffen nicht möglich sein, können Sie auch ein Telefonat oder einen Videocall vereinbaren.\n\nIch möchte meinen Gesprächspartner / meine Gesprächspartnerin nicht treffen\n\nDeutschland spricht ist ein Experiment, und wir hoffen, dass Sie offen sind, mit jemand Neuem zu sprechen. Es steht Ihnen aber selbstverständlich frei, ob Sie das Treffen mit Ihrem Gesprächspartner bestätigen und miteinander in Kontakt treten. Bitte beachten Sie aber, dass wir Ihnen in dieser Ausgabe von Deutschland spricht nur einen Gesprächspartner vorstellen können.\n\nWelche Erfahrungen haben die bisherigen Teilnehmenden gemacht?\n\nIn der Vergangenheit haben 90 Prozent der Teilnehmenden uns mitgeteilt, dass sie mit ihrem Gespräch zufrieden waren und wieder bei Deutschland spricht teilnehmen würden. 60 Prozent wollen mit ihrem Gesprächspartner in Kontakt bleiben, und 55 Prozent sagen, dass ihr Partner ein überzeugendes Argument zu einer oder mehreren der Diskussionsfragen vorgebracht hat.\nEine Studie zweier Forscher der Universitäten Harvard und Stanford hat zudem gezeigt, dass Deutschland spricht- Gespräche dazu beitragen können, das Misstrauen gegenüber politisch Andersdenkenden zu verringern."}, {"id": "s040", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Die Waffenruhe zwischen Israel und der Hamas gibt den Palästinensern im Gazastreifen Hoffnung, dass die Bombenangriffe endlich vorbei sind. Die Zerstörung nach dem 496 Tage dauernden Krieg ist immens, mit fast 60 Prozent der Gebäude erheblich beschädigt. Trotz israelischer Behauptungen, keine Zivilisten anzugreifen, sind laut dem Gesundheitsministerium der Hamas über 46.000 Palästinenser getötet worden. Die Menschen sollen nun in den nördlichen Teil des Gazastreifens zurückkehren dürfen, wo <del>sie<\/del> jedoch auf weit verbreitete Zerstörung <del>treffen.<\/del>", "modified": "Die Waffenruhe zwischen Israel und der Hamas gibt den Palästinensern im Gazastreifen Hoffnung, dass die Bombenangriffe endlich vorbei sind. Die Zerstörung nach dem 496 Tage dauernden Krieg ist immens, mit fast 60 Prozent der Gebäude erheblich beschädigt. Trotz israelischer Behauptungen, keine Zivilisten anzugreifen, sind laut dem Gesundheitsministerium der Hamas über 46.000 Palästinenser getötet worden. Die Menschen sollen nun in den nördlichen Teil des Gazastreifens zurückkehren dürfen, wo <ins>er<\/ins> jedoch auf weit verbreitete Zerstörung <ins>trifft.<\/ins>", "title": "Title Not Found", "article": "Die\nzwischen Israel und der Terrororganisation Hamas vereinbarte Waffenruhe lässt die Palästinenser darauf hoffen, dass die letzten Bomben im Gazastreifen gefallen sind. Was bleibt, ist die Zerstörung. Nach dem beispiellosen Angriff der Hamas auf Israel am 7. Oktober 2023 startete das israelische Militär noch am selben Tag Raketenangriffe auf den Küstenstreifen. Wenige Tage später folgte eine Bodenoffensive. Die Zerstörung im Gazastreifen ist heute, 496 Tage\nnach Beginn des Krieges, immens.\nFast 60 Prozent der Gebäude in der Region sind erheblich beschädigt. Das zeigen Daten der Oregon State University und der City University of New York. Ausgewertet\nwurden dafür Satellitenbilder des Küstenstreifens vor dem 7. Oktober und danach.\nDer Großteil der Gebäude in Städten wie Gaza, Chan Junis\noder Rafah wurde den Daten zufolge bereits in den ersten Monaten des Krieges zerstört. Schon im\nJanuar des vergangenen Jahres war demnach mehr als die Hälfte der Häuser im gesamten\nGazastreifen zerstört.\nDas israelische Militär teilte stets mit, keine Zivilisten anzugreifen.\nZiel waren demnach die Stellungen der Hamas, die sich nach Militärangaben auch in\noder unter Schulen oder Krankenhäusern befunden haben sollen. Nach Angaben des\nder Terrororganisation unterstehenden Gesundheitsministeriums sind seit dem 7. Oktober\nmehr als 46.000 Palästinenser getötet worden. Zahlreiche Menschen sind vor den Bomben geflohen, ihre Wohnungen sind zerstört.\nMit einem möglichen Beginn der Waffenruhe sollen die Menschen nun in den Norden des Gazastreifens zurückkehren dürfen. Was dort\nauf sie wartet, ist Zerstörung. Mehr als 70 Prozent der Gebäude in Gaza-Stadt und der umliegenden Region sind beschädigt."}, {"id": "s049", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Bundesgesundh
