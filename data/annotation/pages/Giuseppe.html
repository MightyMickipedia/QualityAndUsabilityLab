const ITEMS = [{"id": "s015", "summary": "Ein betrunkener und/oder drogenbetäubter Lkw-Fahrer hat auf mehreren nordrhein-westfälischen Autobahnen eine Serie von Unfällen verursacht, bei denen 26 Menschen verletzt wurden, acht davon schwer. <del title=\"removed\">Ein Mensch schwebt in Lebensgefahr.<\/del> Der 30-jährige Fahrer wurde festgenommen und befindet sich nun in einer psychiatrischen Einrichtung. Die Polizei geht von rund 50 betroffenen Fahrzeugen aus; die Strecke des Mannes erstreckte sich über etwa 60 Kilometer. Ein Alkohol- und Drogentest bei der Festnahme war positiv.", "original": "Ein betrunkener und/oder drogenbetäubter Lkw-Fahrer hat auf mehreren nordrhein-westfälischen Autobahnen eine Serie von Unfällen verursacht, bei denen 26 Menschen verletzt wurden, acht davon schwer. Ein Mensch schwebt in Lebensgefahr. Der 30-jährige Fahrer wurde festgenommen und befindet sich nun in einer psychiatrischen Einrichtung. Die Polizei geht von rund 50 betroffenen Fahrzeugen aus; die Strecke des Mannes erstreckte sich über etwa 60 Kilometer. Ein Alkohol- und Drogentest bei der Festnahme war positiv.", "title": "Lkw-Fahrer verursacht Unfälle mit 50 Fahrzeugen – 19 Verletzte", "article": "Ein Lkw-Fahrer, der vermutlich unter Alkohol oder Drogen stand, hat auf mehreren Autobahnen in Nordrhein-Westfalen eine Vielzahl an Unfällen verursacht. 26 Verkehrsteilnehmer wurden verletzt, acht davon schwer, wie die Polizei in Düsseldorf mitteilte. Ein Mensch befindet sich demnach in Lebensgefahr.\nDer 30 Jahre alte Lkw-Fahrer sei zunächst mit Verletzungen ins Krankenhaus gebracht worden und sollte so bald wie möglich vernommen werden. Inzwischen befindet er sich in einer psychiatrischen Einrichtung.\nInsgesamt sind der Polizei bislang 50 Fahrzeuge bekannt, die von den Unfällen betroffen waren. Die Fahrt des Mannes zog sich nach ersten Meldungen über etwa 60 Kilometer. Nach seiner Festnahme hatte bei dem Fahrer ein Alkohol- und Drogentest angeschlagen.\n&quot;Auffallend unsichere Fahrweise&quot;\nAm Samstagnachmittag sei den Beamten ein Lkw mit polnischem Kennzeichen gemeldet worden, der in auffallend unsicherer Fahrweise auf der A 46 im Bereich Neuss unterwegs gewesen sei, teilte die Polizei weiter mit. Der Fahrer habe die Anhaltezeichen der Autobahnpolizei missachtet und sei mit deutlich erhöhter Geschwindigkeit und in Schlangenlinien über die A 46 in den Wuppertaler Raum gefahren. Weitere Verkehrsteilnehmer wurden aufgefordert, die Autobahnen in dem Gebiet möglichst schnell zu verlassen.\nNachdem der Lkw in den Gegenverkehr geraten war, kam er laut Polizei nach der Kollision mit anderen Fahrzeugen quer zur Fahrbahn zum Stillstand. An dieser Unfallstelle sei der Fahrer dann verhaftet worden. Am Samstagabend errichtete die Polizei mehrere Sperrungen in dem Gebiet. Sie sollten voraussichtlich bis Sonntagmittag aufrechterhalten bleiben."}, {"id": "s020", "summary": "Die Chefs von SAP und Siemens fordern eine Überarbeitung der europäischen KI-Gesetze, um Innovationen zu fördern. Die KI-Verordnung wird als hinderlich kritisiert, da sie mit bestehenden Gesetzen kollidiert. Siemens plädiert für eine substanzielle Veränderung anstatt eines Moratoriums. <ins>Ein Moratorium ist das zeitlich begrenzte Aussetzen von Gesetzen oder Regeln.<\/ins> US-Konzerne kritisieren fehlende Leitlinien im AI Act. Die EU-Kommission verzögert die Veröffentlichung eines Verhaltenskodex, lehnt jedoch eine Verschiebung des Gesetzes ab.", "original": "Die Chefs von SAP und Siemens fordern eine Überarbeitung der europäischen KI-Gesetze, um Innovationen zu fördern. Die KI-Verordnung wird als hinderlich kritisiert, da sie mit bestehenden Gesetzen kollidiert. Siemens plädiert für eine substanzielle Veränderung anstatt eines Moratoriums. US-Konzerne kritisieren fehlende Leitlinien im AI Act. Die EU-Kommission verzögert die Veröffentlichung eines Verhaltenskodex, lehnt jedoch eine Verschiebung des Gesetzes ab.", "title": "Chefs von Siemens und SAP fordern Umbau europäischer KI-Gesetze", "article": "Die Chefs der deutschen Technologiekonzerne SAP und Siemens fordern eine grundlegende Überarbeitung der europäischen Gesetze zur künstlichen Intelligenz . In einem gemeinsamen Interview mit der Frankfurter Allgemeinen Zeitung plädieren Christian Klein von SAP und Roland Busch von Siemens für ein neues Rahmenwerk. Dieses solle Innovationen fördern, anstatt sie zu behindern.\nDie europäische KI-Verordnung (AI Act) sei einer der Gründe, &quot;warum wir hier nicht Vollgas geben können&quot;, sagte Busch einem Vorabbericht zufolge. Die Regularien seien teilweise widersprüchlich und überschnitten sich mit bestehenden Gesetzen. Die im September dieses Jahres in Kraft tretende Datenverordnung (Data Act) bezeichnete Busch als &quot;toxisch für die Entwicklung digitaler Geschäftsmodelle&quot;.\nEr habe einen Brandbrief von Industrievertretern an die EU-Kommission, der ein Moratorium der Regeln fordert, bewusst nicht unterzeichnet, sagte Busch, &quot;weil er mir nicht weit genug ging&quot;. Er plädiert dafür, das Gesetz substanziell zu verändern, anstatt nur für eine Weile auszusetzen. Neue Datenregeln sollten dabei Vorrang vor Investitionen in \nRechenzentren haben. &quot;Wir sitzen in Europa auf einem Datenschatz, \nkriegen den aber noch nicht gehoben&quot;, sagte Busch.\nSAP-Chef Klein warnte zudem davor, die Strategie der USA zu \nkopieren und primär in Infrastruktur zu investieren. Bislang sei kein \nKI-Projekt an fehlender Rechenkapazität gescheitert.\n\nUS-Konzerne kritisieren fehlende Leitlinien\n\nDas EU-Parlament hatte den AI Act, Europas Rechtsrahmen für künstliche Intelligenz, im Jahr 2024 verabschiedet. Er ordnet KI-Anwendungen in Risikoklassen ein, wonach Anbieter bestimmte Sicherheits- und Transparenzanforderungen erfüllen müssen. Nun geht es um die Umsetzung der Verordnung. Doch US-Konzerne wie Alphabet und Meta sowie die europäischen Unternehmen Mistral und ASML hatten zuletzt eine Aufschiebung gefordert und dies mit fehlenden Leitlinien begründet.\nDie EU-Kommission teilte zwar Anfang Juli mit, dass sich die Veröffentlichung eines entsprechenden Verhaltenskodex bis Ende 2025 verzögern könnte. Eine Verschiebung der Einführung des gesamten Gesetzes lehnte die Brüsseler Behörde jedoch ab. Eine Stellungnahme der EU-Kommission zu den Forderungen von Siemens und SAP lag zunächst nicht vor."}, {"id": "s022", "summary": "US-Präsident Donald Trump kündigte das Stargate-Projekt an, ein Infrastrukturprojekt zur künstlichen Intelligenz, das Investitionen von mindestens 500 Milliarden Dollar in den USA anziehen soll. Mehr als 100.000 Arbeitsplätze sollen <del title=\"removed\">geschaffen<\/del> <ins>abgebaut<\/ins> werden, während OpenAI, Softbank und Oracle das Projekt tragen. Trump hob zudem ein Dekret seines Vorgängers Joe Biden zur Regulierung von KI auf, wodurch die USA nun keine staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr haben.", "original": "US-Präsident Donald Trump kündigte das Stargate-Projekt an, ein Infrastrukturprojekt zur künstlichen Intelligenz, das Investitionen von mindestens 500 Milliarden Dollar in den USA anziehen soll. Mehr als 100.000 Arbeitsplätze sollen geschaffen werden, während OpenAI, Softbank und Oracle das Projekt tragen. Trump hob zudem ein Dekret seines Vorgängers Joe Biden zur Regulierung von KI auf, wodurch die USA nun keine staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr haben.", "title": "", "article": "US-Präsident Donald Trump hat den Start eines Infrastrukturprojekts zur künstlichen Intelligenz (KI) namens Stargate bekannt gegeben, das Investitionen von &quot;mindestens 500 Milliarden Dollar&quot; (479,6 Milliarden Euro) in den USA nach sich ziehen soll. Das Geld werde in &quot;KI-Infrastruktur in den USA investiert&quot;, sagte Trump. Auf diese Weise würden mehr als 100.000 Arbeitsplätze geschaffen.\nDer Republikaner machte die Ankündigung im Beisein der Chefs des KI-Entwicklers OpenAI, des japanischen Softbank-Konzerns sowie des US-Software- und Hardware-Herstellers Oracle. Die drei Unternehmen sollen das Stargate-Projekt tragen. &quot;Dieses monumentale Unterfangen ist eine überwältigende Vertrauenserklärung in Amerikas Potenzial unter einem neuen Präsidenten&quot;, sagte Trump.\nStargate werde die Infrastruktur aufbauen, darunter &quot;kolossale Datenzentren&quot;, um die Fortschritte bei der Weiterentwicklung von KI-Anwendungen voranzutreiben, sagte der Präsident. Medienberichten zufolge wollen die drei Unternehmen Mittel in das Projekt einbringen, das mit einem ersten Rechenzentrum in Texas beginnen solle.\n\nUSA haben keine KI-Regulierung mehr\n\nTrump hatte zuvor ein Dekret seines Vorgängers Joe Biden zur Regulierung von künstlicher Intelligenz aufgehoben. Die USA, in denen die bedeutendsten KI-Entwickler tätig sind, haben somit keine gültigen staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr.\nDas US-Regelwerk sah vor, dass große KI-Entwickler wie OpenAI und Google ihre Sicherheitsbewertungen und weitere zentrale Informationen an Bundesbehörden weitergeben. Es beruhte jedoch weitgehend auf der freiwilligen Mitarbeit der Unternehmen. Große Technologiekonzerne unterstützten die Regelung, kleinere KI-Firmen – von denen viele Trump unterstützten – waren dagegen."}, {"id": "s023", "summary": "Die CDU präsentiert mit &quot;Agenda 2030&quot; ein Wirtschaftsprogramm für die Bundestagswahl, <del title=\"removed\">das<\/del> <ins>die<\/ins> Firmen und Bürgern Steuererleichterungen verspricht, um Wachstumsquoten zu erhöhen; das Programm sieht eine große Steuerreform in vier Schritten vor, die Einkommensteuerbelastung soll sinken und der Spitzensteuersatz erst ab 80.000 Euro greifen; zudem will die Partei das Arbeitszeitgesetz flexibilisieren, den Solidaritätszuschlag abschaffen und das Bürgergeld in eine &quot;Neue Grundsicherung&quot; überführen.", "original": "Die CDU präsentiert mit &quot;Agenda 2030&quot; ein Wirtschaftsprogramm für die Bundestagswahl, das Firmen und Bürgern Steuererleichterungen verspricht, um Wachstumsquoten zu erhöhen; das Programm sieht eine große Steuerreform in vier Schritten vor, die Einkommensteuerbelastung soll sinken und der Spitzensteuersatz erst ab 80.000 Euro greifen; zudem will die Partei das Arbeitszeitgesetz flexibilisieren, den Solidaritätszuschlag abschaffen und das Bürgergeld in eine &quot;Neue Grundsicherung&quot; überführen.", "title": "CDU plant Steuerentlastungen mit Wirtschaftsprogramm &quot;Agenda 2030&quot;", "article": "Die CDU will mit einem Wirtschaftsprogramm namens &quot;Agenda 2030&quot; in die Bundestagswahl ziehen. Darin verspricht die Partei nach übereinstimmenden Berichten Firmen und Bürgern Steuererleichterungen\nund in der Folge höhere Wachstumsquoten.\n&quot;Mit dieser Agenda 2030 setzen wir uns für\nDeutschland ein wirtschaftspolitisches Zwei-Prozent-Ziel: Wir wollen wieder\nWachstumsraten von mindestens zwei Prozent erreichen&quot;, heißt es in dem\nzwölfseitigen Entwurf, der auf der Klausurtagung des CDU-Bundesvorstands in\nHamburg beschlossen werden soll. Die Nachrichtenagenturen dpa und Reuters sowie das Portal table.news zitierten aus dem Papier.\nDie Partei schlägt eine große Steuerreform in vier\nJahresschritten vor, die Anfang 2026 starten soll. Zudem soll die Einkommensteuerbelastung sinken, der Spitzensteuersatz erst ab 80.000 Euro greifen, der\nGrundfreibetrag jährlich steigen.\n\nKeine täglichen Höchstarbeitszeiten mehr\n\nDie Partei will das Arbeitszeitgesetz flexibler gestalten. Statt einer täglichen soll es nur noch eine wöchentliche Höchstarbeitszeit geben. Der Solidaritätszuschlag\nsoll komplett abgeschafft werden, das Bürgergeld in eine &quot;Neue Grundsicherung&quot;\nüberführt werden, diese Forderung findet sich auch im gemeinsamen Wahlprogramm\nvon CDU und CSU.\nÜberstundenzuschläge sollen bei Vollzeitbeschäftigung\nsteuerfrei gestellt werden. Für Rentner, die freiwillig weiterarbeiten, sollen\nVerdienste bis 2.000 Euro im Monat steuerfrei bleiben. Zur Anwerbung ausländischer Fachkräfte soll eine digitale Bundesagentur für\nFachkräfteeinwanderung geschaffen werden.\n\nPartei will Verbrennerverbot rückgängig machen\n\nBei den Strompreisen fordert die CDU eine Entlastung von mindestens fünf Cent je\nKilowattstunde. Stromsteuer und Netzentgelte sollen sinken. Um die\nAutomobilindustrie zu stärken, will die Partei das Verbrenneraus rückgängig\nmachen . Die CDU will Gründer in der Startphase weitgehend von Bürokratie\nentlasten sowie Digitalisierung und KI-Anwendungen vorantreiben. Forschung und\nEntwicklung sollen vorangetrieben werden, als Ziel nennt die CDU jährlich 3,5\nProzent des Bruttoinlandsprodukts bis 2030.\nFesthalten will die Partei zudem an der Schuldenbremse. Laut dem Papier will die CDU alle Bundesausgaben und die unter der Ampelkoalition gestiegenen Subventionen prüfen. Auf dem Parteitag am 3. Februar will die CDU Maßnahmen\nbeschließen, die im Fall einer Regierungsverantwortung unmittelbar umgesetzt werden sollen.\nDer Name &quot;Agenda 2030&quot; erinnert an Reformpläne des früheren SPD-Bundeskanzlers Gerhard Schröder für den Sozial- und Arbeitsmarkt. Mit seiner Agenda 2010 wurden später vor allem die umstrittenen Hartz-IV-Reformen verbunden.\nTransparenzhinweis: In einer früheren Version der Meldung stand im Teaser, die CDU wolle den Spitzensteuersatz anheben. Sie will ihn jedoch erst bei höheren Einkommen greifen lassen. Wir haben das korrigiert und bitten den Fehler zu entschuldigen."}, {"id": "s004", "summary": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht. <ins>Die Vereinten Nationen schätzen, dass bis zum Jahr 2050 mehr als zwei Milliarden Menschen in Regionen mit akutem Wassermangel leben könnten, wenn keine Gegenmaßnahmen ergriffen werden.<\/ins>", "original": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.", "title": "", "article": "Holstein Kiel – Borussia Dortmund 4:2 (3:0)\nBorussia Dortmund hat in der Bundesliga überraschend gegen den Tabellenvorletzten Holstein Kiel mit 2:4 (0:3) verloren. Der BVB zeigte dabei vor allem in der ersten Halbzeit große Schwächen in der Defensive, während Kiel den Sieg mit einer disziplinierten Leistung sicherte.\nIn der 27. Minute gingen die Gastgeber durch Shuto Machino in Führung, der nach einem Fehler von Julian Brandt einen präzisen Rechtsschuss verwandelte. Nur fünf Minuten später (32. Spielminute) erhöhte Phil Harres per Kopf auf 2:0. Kurz vor der Halbzeitpause traf Alexander Bernhardsson in der Nachspielzeit (45.+4) zum dritten Mal für die Kieler. Dortmund konnte in der zweiten Hälfte durch Giovanni Reyna (71.) und Jamie Gittens (77.) verkürzen, ehe Fiete Arp in der Nachspielzeit (90.+8) den Schlusspunkt setzte. Kiels Lewis Holtby sah nach einem Foulspiel in der 86. Minute die Rote Karte.\nFür Holstein Kiel bedeutet der unerwartete Sieg wichtige Punkte im Kampf um den Klassenerhalt. Der BVB hingegen droht, den Anschluss an die Champions-League-Plätze zu verlieren. Bereits am Freitag steht für Dortmund ein Auswärtsspiel gegen Eintracht Frankfurt an, während Kiel am Samstag bei der TSG Hoffenheim zu Gast ist."}, {"id": "s024", "summary": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende <del title=\"removed\">Trump-Anhänger<\/del> <ins>Biden-Anhänger<\/ins> eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "original": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "title": "Anführer ultrarechter Gruppen aus Gefängnissen entlassen", "article": "Donald Trump hat seinen Amtseid als 47. Präsident der Vereinigten Staaten abgelegt. Es ist bereits seine zweite Amtszeit, er war auch von 2017 bis 2021 US-Präsident.\nDie Zeremonie fand wegen frostiger Temperaturen im Kapitol statt. Den Sitz des US-Kongresses hatten wütende Trump-Anhänger vor vier Jahren gestürmt.\nKurz nach seinem Amtsantritt unterzeichnete Trump zahlreiche Dekrete , die unter anderem eine Begnadigung der Kapitolstürmer, eine Abschaffung des Birthrights und einen Austritt aus dem Pariser Klimaabkommen vorsehen.\nAlle Artikel zum Thema finden Sie auf unserer Themenseite zum neuen US-Präsidenten .\nNeben eigenen Recherchen verwenden wir auch Material der Nachrichtenagenturen dpa, AP, AFP, KNA und Reuters."}, {"id": "s006", "summary": "<del title=\"removed\">Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;.<\/del> Die Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "original": "Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;. Die Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "title": "&quot;Biodeutsch&quot; ist Unwort des Jahres 2024", "article": "&quot;Biodeutsch&quot; ist das Unwort des Jahres 2024. Das Wort werde vor allem in den Sozialen Medien in rassistischer und nationalistischer Weise gebraucht, teilte die Jury der Sprachaktion in Marburg zur Begründung ihrer Wahl mit. &quot;Die mit dem Gebrauch von biodeutsch einhergehende Unterteilung in angeblich &#x27;echte&#x27; Deutsche und in Deutsche zweiter Klasse ist eine Form von Alltagsrassismus&quot;, erklärte die Jury. Mehr in Kürze hier auf ZEIT ONLINE"}, {"id": "s011", "summary": "Der Naturschutzbund in Niedersachsen hat das Aussterben der Vogelart Dünnschnabel-Brachvogel bekannt gegeben, die als erste Vogelart auf europäischem Festland in der Neuzeit als ausgestorben gilt. Die Hauptursachen für das Aussterben sind die Zerstörung von Küstenfeuchtgebieten und die intensive Nutzung von Mooren und Sümpfen. Der Nabu betont die Bedeutung des Umweltschutzes und <del title=\"removed\">kritisiert<\/del> <ins>unterstützt<\/ins> die Klimapolitik der EU. Der Dünnschnabel-Brachvogel war ursprünglich in Westsibirien beheimatet und brütete zwischen 1914 und 1924 in der Region Tara.", "original": "Der Naturschutzbund in Niedersachsen hat das Aussterben der Vogelart Dünnschnabel-Brachvogel bekannt gegeben, die als erste Vogelart auf europäischem Festland in der Neuzeit als ausgestorben gilt. Die Hauptursachen für das Aussterben sind die Zerstörung von Küstenfeuchtgebieten und die intensive Nutzung von Mooren und Sümpfen. Der Nabu betont die Bedeutung des Umweltschutzes und kritisiert die Klimapolitik der EU. Der Dünnschnabel-Brachvogel war ursprünglich in Westsibirien beheimatet und brütete zwischen 1914 und 1924 in der Region Tara.", "title": "", "article": "Die Vogelart Dünnschnabel-Brachvogel ist ausgestorben. Das teilte der Naturschutzbund  (Nabu) in Niedersachsen mit. Es handele sich um die erste Vogelart auf europäischem Festland, die in der Neuzeit als ausgestorben gilt. Zuletzt war der Vogel aus der Familie der Schnepfenvögel den Angaben zufolge in den 1990er-Jahren gesichtet worden.\n&quot;Das Schicksal des Dünnschnabel-Brachvogels sollte uns alle dazu \nbewegen, den Wert unserer natürlichen Umwelt zu überdenken und die \nverbleibenden Arten mit aller Kraft zu schützen&quot;, sagte Martin Rümmler,\n Vogelschutzexperte des Nabu. Nach Angaben des Naturschutzbundes sind die Hauptursachen für das\nAussterben des Dünnschnabel-Brachvogels vor allem die Zerstörung von\nKüstenfeuchtgebieten sowie die intensive Nutzung und das Trockenlegen von\nMooren und Sümpfen .\n\nKlimawandel gilt als Grund für das Aussterben\n\n&quot;Die Zerstörung intakter Ökosysteme entlang der Zugrouten\ndieser Art unterstreicht die Bedeutung internationaler Zusammenarbeit im\nNaturschutz&quot;, teilte der Nabu mit. Der Verlust der Art zeige, dass das\nAussterben von Arten auch direkt vor unserer Haustür stattfinde, sagte der\nLandesvorsitzende des Nabu in Niedersachsen, Holger Buschmann. Der Nabu kritisierte die Klimapolitik der EU, die sich nicht ausreichend für den Umweltschutz einsetze.\nDer Dünnschnabel-Brachvogel war ursprünglich in den Mooren Westsibiriens\n entlang des Irtysch und Ob verbreitet. Die einzigen genau bekannten \nBrutgebiete lagen in der Region Tara, etwa 250 Kilometer nördlich von \nOmsk, wo die Vögel zwischen 1914 und 1924 brüteten. Die Zugrouten \nführten aus dieser Gegend in südwestlicher Richtung in den \nMittelmeerraum, wo die Vögel in einem Gebiet überwinterten, das bis nach \nMarokko reicht. Seit Ende des 20. Jahrhunderts galt der \nDünnschnabel-Brachvogel als akut vom Aussterben bedroht."}, {"id": "s017", "summary": "Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten. Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber <ins>nicht<\/ins> zuversichtlich, dass eine Lösung gefunden wird.", "original": "Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten. Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber zuversichtlich, dass eine Lösung gefunden wird.", "title": "SPD-Politiker werfen Olaf Scholz Blockade der Ukrainehilfen vor", "article": "Mehrere SPD-Politiker haben Bundeskanzler Olaf Scholz&#x27; Weigerung kritisiert, noch vor der Bundestagswahl weitere Unterstützung für die Ukraine in Höhe von drei Milliarden Euro für Waffenlieferungen auf den Weg zu bringen. Kriege richteten sich nicht nach Wahlen, zitiert der Spiegel den SPD -Haushalts- und Verteidigungspolitiker Andreas Schwarz: &quot;Wenn es unter den demokratischen Kräften im Bundestag eine Mehrheit gibt für ein zusätzliches Hilfspaket für die Ukraine, sollten wir das noch vor der Bundestagswahl beschließen.&quot;\nSchwarz forderte einen Schulterschluss im Parlament auch mit CDU und CSU: &quot;Allerdings sollte sich dann auch die Union klar dazu bekennen, die überplanmäßige Ausgabe von drei Milliarden Euro mitzutragen&quot;, sagte er. Schwarz ist im Haushaltsausschuss Berichterstatter für den Etat des Verteidigungsministeriums und das Sondervermögen Bundeswehr und gehört als stellvertretendes Mitglied dem Verteidigungsausschuss an.\nScholz lehnt Einsparungen an anderer Stelle für die Finanzierung weiterer Waffenlieferungen in die Ukraine ab.\nSchäfer: Nicht auf Zeit spielen\nDer SPD-Verteidigungspolitiker Kristian Klinck sagte dem Magazin, nur die Kombination aus Unterstützung der Ukraine und Diplomatie werde einen stabilen Waffenstillstand näherbringen. &quot;Ich rate dazu, das Hilfspaket auf den Weg zu bringen.&quot; Ob dies durch eine außerplanmäßige Ausgabe aus dem Bundeshaushalt geschehe oder durch die Nutzung des von den G7-Staaten zur Verfügung gestellten Kredits geschehe, &quot;sollte aufgrund rein sachlicher Erwägungen entschieden werden&quot;.\nDer Grünenpolitiker Sebastian Schäfer forderte Scholz und den SPD-Fraktionsvorsitzenden Rolf Mützenich auf, ihre Blockadehaltung zu überdenken. &quot;In dieser Frage auf Zeit zu spielen, ist angesichts der Lage in der Ukraine schlicht verantwortungslos&quot;, sagte Schäfer, der Mitglied im Haushaltsausschuss und stellvertretender Vorsitzender des Gremiums zum Sondervermögen für die Bundeswehr ist.\nVerteidigungsminister Boris Pistorius nahm seinen Parteifreund Scholz hingegen in Schutz. &quot;Ich sehe keinerlei Grund anzunehmen, dass der Bundeskanzler hier bremst&quot;, sagte er in den ARD- Tagesthemen . Pistorius verwies darauf, dass es für 2025 noch keinen regulären Bundeshaushalt gebe und der Bund daher mit einer vorläufigen Haushaltsführung agiere. &quot;Es ist nicht trivial, das Geld aufzutreiben&quot;, sagte er im heute-journal des ZDF. Zudem zeigte Pistorius sich zuversichtlich, dass zeitnah eine Lösung gefunden werde. Er hoffe darauf in den nächsten Tagen, sagte er."}, {"id": "s008", "summary": "Die chinesische Regierung erwägt angeblich den Verkauf der US-Sparte von TikTok an Elon Musk, um einem Verbot in den USA zu entgehen.\n\nTikTok soll am 19. Januar aus den App-Stores von Apple und Google verbannt werden, wenn die US-Sparte nicht bis dahin verkauft wird.\n\nDer potenzielle Verkauf an den Tech-Milliardär wurde von <del title=\"removed\">TikTok<\/del> <ins>ihr<\/ins> als &quot;reine Fiktion&quot; abgestritten.\n\nEin Verbot der populären App stößt sowohl bei Nutzern als auch auf beiden Seiten des politischen Spektrums auf Widerstand.\n\nZwei demokratische Abgeordnete drängen den Kongress und Präsident Joe Biden, die Frist zu verlängern, um ein Verbot zu vermeiden.", "original": "Die chinesische Regierung erwägt angeblich den Verkauf der US-Sparte von TikTok an Elon Musk, um einem Verbot in den USA zu entgehen.\n\nTikTok soll am 19. Januar aus den App-Stores von Apple und Google verbannt werden, wenn die US-Sparte nicht bis dahin verkauft wird.\n\nDer potenzielle Verkauf an den Tech-Milliardär wurde von TikTok als &quot;reine Fiktion&quot; abgestritten.\n\nEin Verbot der populären App stößt sowohl bei Nutzern als auch auf beiden Seiten des politischen Spektrums auf Widerstand.\n\nZwei demokratische Abgeordnete drängen den Kongress und Präsident Joe Biden, die Frist zu verlängern, um ein Verbot zu vermeiden.", "title": "", "article": "Chinesische Behörden ziehen einem Bericht zufolge den Verkauf des US-Geschäfts von TikTok an Techmilliardär und Trump-Berater Elon Musk in Betracht. Das berichtet die Agentur Bloomberg unter Berufung auf mit der Angelegenheit vertraute Personen. TikTok soll am 19. Januar laut Gesetz in den USA aus den App-Stores von Apple und Google verbannt werden, wenn die US-Sparte der App bis dahin nicht vom chinesischen Inhaber ByteDance verkauft wurde. Außerdem soll der Zugang über Webbrowser verhindert werden. TikTok bezeichnete die Berichte um einen Verkauf an Tesla-Chef Elon Musk, dem auch der Kurznachrichtendienst X (ehemals Twitter) gehört, gegenüber der britischen BBC als &quot;reine Fiktion&quot;.\nDer erzwungene Verkauf oder das Verbot der von 170 Millionen Amerikanern genutzten App stieß nicht nur bei Nutzern, sondern auch auf beiden Seiten des politischen Spektrums auf Widerstand. Zwei demokratische Abgeordnete drängten den Kongress und Präsident Joe Biden am Montag, die Frist zu verlängern. &quot;Ein Verbot würde ein einzigartiges Informations- und Kultursystem zerschlagen und Millionen von Menschen zum Schweigen bringen&quot;, sagte Senator Edward Markey.\nEin TikTok-Verbot habe schwerwiegende Folgen für Millionen von Amerikanern, die auf die App für soziale Kontakte und ihren wirtschaftlichen Lebensunterhalt angewiesen seien. Der designierte Präsident Donald Trump hatte den Obersten Gerichtshof gebeten , die Umsetzung des Gesetzes zu verzögern, um nach seinem Amtsantritt am 20. Januar Zeit für eine &quot;politische Lösung&quot; des Problems zu haben.\nTikTok-Nutzer in den USA wollen sich darauf aber nicht offenbar verlassen und suchen bereits nach Alternativen. Eine scheint das ebenfalls chinesische Netzwerk Xiaohongshu zu sein, das unter dem englischen Namen Red Note bekannt ist. Die App zählte am Montag zu den am meisten heruntergeladenen Anwendungen im App-Store des US-Tech-Giganten Apple. Laut der US-Zeitung USA Today ähnelt das Layout von Red Note dem der Anwendung Pinterest und werde oft als chinesische Version von Instagram bezeichnet."}, {"id": "s028", "summary": "Erstmals in der Geschichte des Vatikans wurde eine Frau, die italienische Ordensschwester Simona Brambilla, zur Leiterin einer großen Vatikanbehörde ernannt. Papst Franziskus beauftragte sie mit der Leitung des Dikasteriums für die <del title=\"removed\">Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens,<\/del> <ins>Kommunikation,<\/ins> was mit der Verantwortung einer Ministerin vergleichbar ist. Brambilla, eine Missionarin, Krankenschwester und Doktorin der Psychologie, ist die erste Präfektin des katholischen Kirchenstaates. Diese Ernennung ist Teil von Franziskus&#x27; Bemühungen, Frauen stärker in Kirchenämter einzubeziehen, und folgt auf die Öffnung von Spitzenämtern für Frauen im Vatikan im Jahr 2022.", "original": "Erstmals in der Geschichte des Vatikans wurde eine Frau, die italienische Ordensschwester Simona Brambilla, zur Leiterin einer großen Vatikanbehörde ernannt. Papst Franziskus beauftragte sie mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens, was mit der Verantwortung einer Ministerin vergleichbar ist. Brambilla, eine Missionarin, Krankenschwester und Doktorin der Psychologie, ist die erste Präfektin des katholischen Kirchenstaates. Diese Ernennung ist Teil von Franziskus&#x27; Bemühungen, Frauen stärker in Kirchenämter einzubeziehen, und folgt auf die Öffnung von Spitzenämtern für Frauen im Vatikan im Jahr 2022.", "title": "Papst ernennt erstmals eine Frau zur Leiterin einer Vatikanbehörde", "article": "Erstmals in der Geschichte des Vatikans ist eine Frau zur Leiterin einer großen Vatikanbehörde ernannt worden. Papst Franziskus beauftragte die italienische Ordensschwester Simona Brambilla mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens. Das Amt lässt sich mit der Verantwortung einer Ministerin vergleichen.\nDie 59-Jährige ist laut Angaben des Presseamts die erste Präfektin des katholischen Kirchenstaates. In ihrem Dikasterium hatte sie zuvor bereits als Sekretärin die zweithöchste Position inne, seit 2019 gehörte sie der Behörde an. Das Dikasterium strukturiert, fördert und verwaltet die Institutionen in der katholischen Kirche, die sich dem &quot;geweihten&quot; und dem apostolischen Leben innerhalb der Gemeinschaft widmen.\n\nMissionarin, Krankenschwester und Doktorin der Psychologie\n\nBrambilla ist Teil der Consolata-Missionsschwestern und war früher als Krankenschwester und Missionarin in dem westafrikanischen Staat Mosambik tätig. Zudem hat sie einen Doktortitel in Psychologie. Von 2011 bis Mai 2023 war sie Generalsuperiorin ihrer Ordensgemeinschaft.\nDie Dikasterien im Vatikan sind mit den Ministerien in einer Regierung vergleichbar. Sie werden nicht von einem Minister, sondern von einem Präfekten geleitet. Der zweite Rang, der in einem Ministerium von einem Staatssekretär bekleidet wird, heißt im Vatikan Sekretär. In seiner Arbeit wird dieser von Untersekretären unterstützt.\nIn der Katholischen Kirche gibt es immer wieder Diskussionen darüber, Frauen mehr an Kirchenämtern zu beteiligen, insbesondere über die Weihe von Frauen zu Diakoninnen oder später einmal auch zu Priesterinnen. Dazu brachte auch die jüngste Weltsynode unter Leitung des Papstes keinen Durchbruch.\n\nKurienreform 2022 öffnete Spitzenämter für Frauen\n\nFranziskus vergab in seinem mittlerweile zwölf Jahre andauernden Pontifikat bisher zweimal hochrangige Ämter an Frauen. 2016 ernannte er die italienische Kunsthistorikerin Barbara Jatta zur Direktorin der Vatikanischen Museen, einer der wichtigsten Einnahmequellen des Kirchenstaats. 2022 wurde die italienische Ordensschwester Raffaella Petrini im Vatikan Generalsekretärin – ein Amt, das üblicherweise ein Bischof innehatte.\nBis 2022 war es nur Bischöfen – und somit nur Männern – möglich, die Leitung einer Vatikanbehörde zu übernehmen. Mit seiner Kurienreform vor zwei Jahren öffnete der Papst diese Ämter dann auch für Katholikinnen und Katholiken ohne Bischofstitel. Die Katholische Kirche zählt weltweit rund 1,4 Milliarden Mitglieder."}, {"id": "s013", "summary": "Der Ausbruch der Maul- und Klauenseuche in Brandenburg hat bereits wirtschaftliche Schäden von über einer Milliarde Euro verursacht, schätzt der Deutsche Raiffeisenverband. Unternehmen meiden Ware aus Deutschland, was zu einem Umsatzverlust entlang der Wertschöpfungskette führt. Länder wie Südkorea, Mexiko und Großbritannien haben die Einfuhr von Fleisch- und Milchprodukten gestoppt. Innerhalb der EU gibt es kleinere Einschränkungen im Handel, aber auch hier meiden Unternehmen Ware aus Deutschland. Bisher sind keine Fälle außerhalb von Brandenburg bestätigt. <ins>Der Verband fordert deshalb eine bundesweite Entschädigung für Betriebe, die ihre Milchproduktion vorsorglich drosseln.<\/ins>", "original": "Der Ausbruch der Maul- und Klauenseuche in Brandenburg hat bereits wirtschaftliche Schäden von über einer Milliarde Euro verursacht, schätzt der Deutsche Raiffeisenverband. Unternehmen meiden Ware aus Deutschland, was zu einem Umsatzverlust entlang der Wertschöpfungskette führt. Länder wie Südkorea, Mexiko und Großbritannien haben die Einfuhr von Fleisch- und Milchprodukten gestoppt. Innerhalb der EU gibt es kleinere Einschränkungen im Handel, aber auch hier meiden Unternehmen Ware aus Deutschland. Bisher sind keine Fälle außerhalb von Brandenburg bestätigt.", "title": "Maul- und Klauenseuche verursacht bereits Milliardenschaden", "article": "Der Ausbruch der Maul- und Klauenseuche hat bereits milliardenschwere wirtschaftliche Schäden verursacht. Das schätzt der Deutsche Raiffeisenverband. &quot;Entlang der Wertschöpfungskette gehen wir davon aus, dass bereits jetzt ein Umsatzverlust von mehr als einer Milliarde Euro existiert&quot;, sagte der Hauptgeschäftsführer des Verbands, Jörg Migende.\nUnternehmen mieden demnach aus Unsicherheit Ware aus Deutschland, um den Import der Maul- und Klauenseuche, die in Brandenburg ausgebrochen war, zu verhindern. Der Verband geht deshalb davon aus, dass die wirtschaftlichen Einbußen noch deutlich höher werden.\nDer bisherige Schaden sei unter anderem dadurch entstanden, dass Länder wie Südkorea, Mexiko und Großbritannien die Einfuhr von Fleisch- und Milchprodukten aus Deutschland gestoppt haben. Innerhalb der Europäischen Union läuft der Handel nach einer Entscheidung der EU-Kommission vom Mittwoch mit kleineren Einschränkungen weiter. Doch auch Unternehmen innerhalb der EU würden gerade Ware aus ganz Deutschland meiden, sagte Verbandschef Migende.\nDie Maul- und Klauenseuche ist eine hochansteckende Viruserkrankung. Es erkranken vor allem Klauentiere wie Rinder, Schweine und Ziegen. Die Seuche war am Freitag auf einem Hof in Brandenburg festgestellt worden, nachdem es zuvor in Deutschland jahrzehntelang keine Fälle gegeben hatte. Fälle außerhalb von Brandenburg wurden bisher nicht bestätigt."}];
const SAMPLE = "b51867da";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
