const ITEMS = [{"id": "s003", "type": "PredE", "definition": "Predicate error: the action or state (usually the verb) contradicts the article. The participants are right, but what they do is wrong.", "original": "Vor fast genau zehn Jahren wurde die Mietpreisbremse eingeführt, um den rasanten Anstieg der Mieten in den großen Städten zu dämpfen. Seitdem sind die Mieten in Deutschland durchschnittlich um 45 Prozent gestiegen, was höher ist als die allgemeine Inflation und Lohnentwicklung. Ob die Mietpreisbremse verlängert wird, hängt von der neuen Regierung ab, obwohl es verfassungsrechtliche Bedenken gibt. Die Regelung gilt in Gebieten mit angespannten Wohnungsmärkten, die in den letzten zehn Jahren kontinuierlich <del>erweitert<\/del> wurden. Die Wirksamkeit der Mietpreisbremse wird unterschiedlich bewertet, aber Mieter müssen selbst aktiv werden, um sie anzuwenden.", "modified": "Vor fast genau zehn Jahren wurde die Mietpreisbremse eingeführt, um den rasanten Anstieg der Mieten in den großen Städten zu dämpfen. Seitdem sind die Mieten in Deutschland durchschnittlich um 45 Prozent gestiegen, was höher ist als die allgemeine Inflation und Lohnentwicklung. Ob die Mietpreisbremse verlängert wird, hängt von der neuen Regierung ab, obwohl es verfassungsrechtliche Bedenken gibt. Die Regelung gilt in Gebieten mit angespannten Wohnungsmärkten, die in den letzten zehn Jahren kontinuierlich <ins>verringert<\/ins> wurden. Die Wirksamkeit der Mietpreisbremse wird unterschiedlich bewertet, aber Mieter müssen selbst aktiv werden, um sie anzuwenden.", "title": "Title Not Found", "article": "Vor fast genau zehn Jahren ist in der Bundesrepublik ein wohnungspolitisches Instrument beschlossen worden, das es zuvor in dieser Form nicht gab. Im März 2015 entschied eine Koalition aus Union und SPD mit Kanzlerin Angela Merkel an der Spitze, eine Mietpreispreisbremse einzuführen. Sie sollte vor allem in den großen Städten und den Ballungsgebieten den rasanten Anstieg der Mietpreise dämpfen, indem die Preise dort höchstens zehn Prozent über der ortsüblichen Vergleichsmiete liegen dürfen. ZEIT ONLINE hat nun erstmals bundesweit erfasst, in welchen Regionen die Mietpreisbremse inzwischen gilt und wie sich die Preise in den  betroffenen Gebieten entwickelt haben.\nSeit dem Jahr 2015 sind in ganz \nDeutschland die Mieten durchschnittlich um 45 Prozent gestiegen. \nHeruntergebrochen auf jedes Jahr ergibt sich damit ein Anstieg von durchschnittlich 4,5 Prozent. Das\nhört sich zunächst nach wenig an, aber der Zuwachs ist höher als die allgemeine Inflation in diesem Zeitraum und auch höher als \ndie durchschnittliche Lohnentwicklung.\nDieses Missverhältnis erklärt, warum die Mietpreisbremse immer noch gilt, obwohl sie eigentlich nur als vorübergehendes Instrument gedacht war. Die politische Idee dahinter war schließlich, dass man mit ihr nur etwas Zeit gewinnen wollte, bis genügend neuer Wohnraum geschaffen wurde, um dadurch die Preisentwicklung zu dämpfen. Das aber ist größtenteils nicht eingetreten, die Mieten stiegen weiterhin stark an und die Mietpreisbremse wurde immer wieder verlängert – bis jetzt.\nEnde dieses Jahres aber läuft die Regelung aus. Nun hängt es von der neuen Regierung ab, ob sie das Instrument weiterführen will. Kürzlich sprachen sich mehrere Landesregierungen dafür aus, die Mietpreise bremse zu verlängern, auch wenn es verfassungsrechtliche Bedenken gibt.\nDie Bundesländer legen jene Städte und Gemeinden fest, in denen die Mietpreisbremse gilt. Diese &quot;Gebiete mit angespannten Wohnungsmärkten&quot;, wie es im Gesetz dazu heißt, wurden in den vergangenen zehn Jahren kontinuierlich ausgeweitet. Niedersachsen beispielsweise hat zu Beginn dieses Jahres die Zahl der Städte und Gemeinden, in denen die Mietpreisbremse angewendet werden muss, von 18 auf 57 erhöht.\nDer Grund dafür liegt auf der Hand: Die Mieten waren stark gestiegen, und zwar nicht allein in den Großstädten. Häufig werden Werte erreicht, die weit über den durchschnittlichen 45 Prozent liegen, oft sind es eher mehr als 70 oder 80 Prozent. In der Region um Berlin herum ist die Miete sogar um mehr als 100 Prozent gestiegen. Auch in anderen Teilen Deutschlands gibt es vereinzelt extreme Steigerungen. Oft passiert dies in Ortschaften, die im Speckgürtel größerer Metropolen liegen. In solchen Regionen bewegten sich die Mieten vor einem Jahrzehnt noch auf einem verhältnismäßig niedrigen Niveau. Nicht selten lag die Nettomiete pro Quadratmeter bei rund fünf bis sechs Euro, jetzt sind es meist zehn bis zwölf Euro.\nUm die Mietpreisbremse in einer Region anzuwenden, müssen die Bundesländer laut Gesetz vier Kriterien beachten: Die Mieten müssen erstens deutlich stärker steigen als im bundesweiten Durchschnitt. Zweites muss die durchschnittliche Mietbelastung der Haushalte deutlich über dem bundesweiten Durchschnitt liegen. Außerdem darf es drittens nur einen geringen Leerstand bei hoher Nachfrage geben. Und viertens muss festgestellt werden, dass die Neubautätigkeit nicht ausreicht, um den Bedarf der Wohnbevölkerung zu decken, wenn diese wächst.\nDie Frage, ob die Mietpreisbremse ihren Zweck erfüllt und tatsächlich dämpfend wirkt, wird unterschiedlich bewertet. In einer Reihe von wissenschaftlichen Untersuchungen haben sich diverse Forschungsinstitute daran versucht – mit unterschiedlichen Ergebnissen. Mal wird kaum eine Wirkung attestiert, mal wird festgestellt, dass die Preisbremse den Markt schädige und die Neubautätigkeit hemme. Und dadurch wiederum eher steigende Mieten begünstigt habe.\nFest steht jedoch, dass Mieterinnen und Mieter zunächst selbst handeln müssen, um das Gesetz anzuwenden. Sie müssen nachweisen, dass ihre Miete zehn Prozent über der ortsüblichen Vergleichsmiete liegt und gegebenenfalls rechtlich gegen ihren Vermieter oder ihre Vermieterin vorgehen, um eine Absenkung durchzusetzen. Vor diesem Schritt jedoch dürfte die Mehrheit der Mieterinnen und Mieter bisher zurückschrecken."}, {"id": "s009", "type": "PredE", "definition": "Predicate error: the action or state (usually the verb) contradicts the article. The participants are right, but what they do is wrong.", "original": "US-Präsident Donald Trump kündigte das Stargate-Projekt an, ein Infrastrukturprojekt zur künstlichen Intelligenz, das Investitionen von mindestens 500 Milliarden Dollar in den USA anziehen soll. Mehr als 100.000 Arbeitsplätze sollen <del>geschaffen<\/del> werden, während OpenAI, Softbank und Oracle das Projekt tragen. Trump hob zudem ein Dekret seines Vorgängers Joe Biden zur Regulierung von KI auf, wodurch die USA nun keine staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr haben.", "modified": "US-Präsident Donald Trump kündigte das Stargate-Projekt an, ein Infrastrukturprojekt zur künstlichen Intelligenz, das Investitionen von mindestens 500 Milliarden Dollar in den USA anziehen soll. Mehr als 100.000 Arbeitsplätze sollen <ins>abgebaut<\/ins> werden, während OpenAI, Softbank und Oracle das Projekt tragen. Trump hob zudem ein Dekret seines Vorgängers Joe Biden zur Regulierung von KI auf, wodurch die USA nun keine staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr haben.", "title": "Title Not Found", "article": "US-Präsident Donald Trump hat den Start eines Infrastrukturprojekts zur künstlichen Intelligenz (KI) namens Stargate bekannt gegeben, das Investitionen von &quot;mindestens 500 Milliarden Dollar&quot; (479,6 Milliarden Euro) in den USA nach sich ziehen soll. Das Geld werde in &quot;KI-Infrastruktur in den USA investiert&quot;, sagte Trump. Auf diese Weise würden mehr als 100.000 Arbeitsplätze geschaffen.\nDer Republikaner machte die Ankündigung im Beisein der Chefs des KI-Entwicklers OpenAI, des japanischen Softbank-Konzerns sowie des US-Software- und Hardware-Herstellers Oracle. Die drei Unternehmen sollen das Stargate-Projekt tragen. &quot;Dieses monumentale Unterfangen ist eine überwältigende Vertrauenserklärung in Amerikas Potenzial unter einem neuen Präsidenten&quot;, sagte Trump.\nStargate werde die Infrastruktur aufbauen, darunter &quot;kolossale Datenzentren&quot;, um die Fortschritte bei der Weiterentwicklung von KI-Anwendungen voranzutreiben, sagte der Präsident. Medienberichten zufolge wollen die drei Unternehmen Mittel in das Projekt einbringen, das mit einem ersten Rechenzentrum in Texas beginnen solle.\n\nUSA haben keine KI-Regulierung mehr\n\nTrump hatte zuvor ein Dekret seines Vorgängers Joe Biden zur Regulierung von künstlicher Intelligenz aufgehoben. Die USA, in denen die bedeutendsten KI-Entwickler tätig sind, haben somit keine gültigen staatlichen Richtlinien zur Entwicklung von KI-Modellen mehr.\nDas US-Regelwerk sah vor, dass große KI-Entwickler wie OpenAI und Google ihre Sicherheitsbewertungen und weitere zentrale Informationen an Bundesbehörden weitergeben. Es beruhte jedoch weitgehend auf der freiwilligen Mitarbeit der Unternehmen. Große Technologiekonzerne unterstützten die Regelung, kleinere KI-Firmen – von denen viele Trump unterstützten – waren dagegen."}, {"id": "s030", "type": "PredE", "definition": "Predicate error: the action or state (usually the verb) contradicts the article. The participants are right, but what they do is wrong.", "original": "Am Morgen nach einer brutalen Attacke auf einen Schüler der Friedrich-Bergius-Schule in Berlin-Friedenau steht ein Polizeiwagen vor dem Schulportal. Die Beamten sind da, um zu verhindern, dass sich ähnliche Szenen wiederholen wie am Vortag, als eine Gruppe von rund 90 Jugendlichen mit Messern, Schlagringen und Baseballschlägern einen Siebtklässler jagte und ihn bedrohte. Der Junge rettete sich in einen Supermarkt, die Polizei rückte mit einer Hundertschaft an. Die Schule hatte zuvor auch ein Drohschreiben auf Arabisch erhalten, doch ob und wie diese Vorfälle zusammenhängen, ist Gegenstand laufender Ermittlungen.", "modified": "Am Morgen nach einer brutalen Attacke auf einen Schüler der Friedrich-Bergius-Schule in Berlin-Friedenau steht ein Polizeiwagen vor dem Schulportal. Die Beamten sind da, um zu verhindern, dass sich ähnliche Szenen wiederholen wie am Vortag, als eine Gruppe von rund 90 Jugendlichen mit Messern, Schlagringen und Baseballschlägern einen Siebtklässler jagte und ihn bedrohte. Der Junge rettete sich in einen Supermarkt, die Polizei rückte mit einer Hundertschaft an. Die Schule hatte zuvor auch ein Drohschreiben auf Arabisch erhalten, doch ob und wie diese Vorfälle zusammenhängen, ist <ins>nicht <\/ins>Gegenstand laufender Ermittlungen.", "title": "Title Not Found", "article": "Vor dem Portal der Friedrich-Bergius-Schule hängt noch ein gelber Herrnhuter Stern, ein Überbleibsel aus der besinnlichen Weihnachtszeit. In den Klassenzimmern im Hochparterre der Sekundarschule im Berliner Stadtteil Friedenau wird offenkundig konzentriert gelernt. Smartboards flimmern an der Stirnseite der Räume. Am Morgen stand hier noch ein Polizeiwagen. Die Beamten waren gerufen worden, damit sich hier nicht Szenen wiederholen können, wie sie sich am Vortag abgespielt haben.\nAm Mittwoch wurde ein Siebtklässler der Schule, sobald er das Schulgelände verlassen hatte, von einer großen Gruppe Jugendlicher gejagt. &quot;Wir stechen dich ab&quot;, sollen einige der rund 90 Jugendlichen gerufen haben, die laut Polizei offenbar schulfremd waren. Sie hatten Messer, Schlagringe und Baseballschläger dabei. So steht es in einer Mail ans Lehrerkollegium, die dem Berliner Tagesspiegel vorliegt. Der Junge rettete sich in einen Supermarkt, die Polizei rückte mit einer Hundertschaft an.\nDer Verfolgung des Jungen war eine &quot;Bedrohungslage&quot; gegen einen anderen Schüler innerhalb der Schule vorausgegangen, wie es in der Mail heißt. Die Schule hatte zuvor außerdem ein Drohschreiben auf Arabisch erhalten. Ob und inwieweit die Vorfälle zusammenhängen, wer die Täter sind, woher sie kamen und auf welche Schulen sie gingen – das alles ist Gegenstand polizeilicher Ermittlungen.\nDie Friedenauer Schule mit etwa 400 Schülern und 40 Lehrern ist für Probleme bekannt. Die Integrierte Sekundarschule – eine Schulform, die in Berlin seit 2010 frühere Haupt-, Real- und Gesamtschulen vereint – geriet deutschlandweit im November in die Schlagzeilen. Das Kollegium hatte einen Brandbrief an die zuständige Schulaufsicht geschrieben. Man habe große Probleme mit aggressiven Schülern aus bildungsfernen Familien, heißt es darin. Explizit wird in dem Brief auch erwähnt, dass das Umfeld der Schule unter der Schülerschaft leide: &quot;Es vergeht kein Tag ohne (...) zunehmende Beschwerden von Friedenauer BürgerInnen, die im Umfeld der Schule wohnen, oder gegen unsere SchülerInnen verhängtes Hausverbot seitens der Pächter der EDEKA-Filiale.&quot; Viele überregionale Medien berichteten, auch ZEIT und ZEIT ONLINE .\nIm Viertel nahe dem S-Bahnhof Bundesplatz reihen sich gepflegte Gründerzeitvillen aneinander, es gibt Kinderläden mit bunt beklebten Fenstern, ein kleines Kino, Cafés. Es ist der bürgerliche Westen Berlins. Zwei Straßen weiter wohnten früher die Schriftsteller Günter Grass und Uwe Johnson. Eine Schule mit Gewaltproblem, ausgerechnet hier? Die Bergius-Schule ist auf dem Weg, sich deutschlandweit einen ebenso berüchtigten Ruf einzuhandeln wie die Neuköllner Rütli-Schule Mitte der 2000er-Jahre.\nAuch die hatte damals einen Brandbrief geschrieben und wurde zu einem Symbol für vieles, was an so vielen Schulen falsch lief und immer noch falsch läuft: Gewalt auf dem Schulhof, interkulturelle und religiöse Konflikte in der Schülerschaft, Unterricht, der kaum mehr möglich war, überforderte Lehrkräfte. Heute ist der Rütli-Campus, wie er jetzt heißt, ein Vorzeigeprojekt. Türkisch- und arabischsprachige Sozialpädagogen wurden eingestellt, Eltern bekommen einen Hausbesuch gleich bei der Einschulung ihrer Kinder. Auf dem Campus ist die Schule vernetzt mit Kitas, einem Jugendfreizeitheim, einer Sporthalle, einer Volkshochschule, einer Musikschule, dem Kinder- und Jugendgesundheitsdienst und einem sozialpädagogischen Dienst.\n\n&quot;Alle haben Angst: Schüler, Lehrer und Eltern&quot;\n\nEiner, der sich dafür einsetzt, dass sich auch an der Bergius-Schule der Wind dreht, ist Andreas Thewalt. Er ist Gesamtelternvertreter der Schule und ehrenamtlicher Vormund für einen Jungen, der Schüler an der Bergius-Schule ist. Wer mit der Berichterstattung über den Brandbrief vertraut ist, der kennt auch seinen Namen. &quot;Ich bin der Einzige, der die Klappe aufmachen kann&quot;, sagt Thewalt an diesem Donnerstagvormittag.\nWährend des Telefonats mit ZEIT ONLINE ist er gerade auf dem Weg zur Schule, um dort mit Lehrerinnen und der Schulleiterin zu sprechen. Danach will er eine Mail an die Eltern schreiben, denn die seien jetzt sehr verunsichert, sagt er. Von dem Vorfall am Vortag habe er von einer ehemaligen Kollegin erfahren, die in der Nähe der Schule wohnt. Bei WhatsApp habe sie ihm geschrieben: &quot;Deine Schule hat schon wieder die Polizei rufen müssen.&quot; Seine Reaktion, als er verstand, was geschehen war: &quot;Was muss denn noch alles passieren, damit endlich was passiert?&quot;\nZwar sei bei diesem Vorfall &quot;nur&quot; das Opfer ein Schüler der Bergius-Schule gewesen, sagt Thewalt, die anderen Jugendlichen kamen wohl von anderen Schulen. Trotzdem seien alle Schüler, Lehrer und Eltern der Bergius-Schule unmittelbar von den Geschehnissen betroffen. Es gebe etliche Eltern, die ihre Kinder am Donnerstag vom Schulbesuch abgemeldet hätten. \n&quot;Alle haben Angst: Schüler, Lehrer und Eltern&quot;\n, sagt Thewalt. &quot;Und das verstehe ich auch.&quot;\nFür diejenigen Schüler und Lehrer, die am Donnerstag trotzdem gekommen sind, stand am Morgen der Polizeiwagen vor dem Gelände. Zum &quot;Schutz der Schüler&quot;, wie eine Vertreterin der Schulleitung der dpa sagte. Am späteren Vormittag ist von uniformierter Polizei oder Einsatzwagen bereits nichts mehr zu sehen. Auf Anfrage von ZEIT ONLINE teilte die Leiterin der Bergius-Schule mit, sie könne sich &quot;aus dienstrechtlichen Gründen&quot; zu schulischen Belangen nicht öffentlich äußern.\nNach dem Brandbrief, sagt Thewalt, da habe er mal kurz gedacht, dass sich die Lage an der Schule bessern könnte. CDU-Schulrätin Katharina Günther-Wünsch hatte Ende vergangenen Jahres die Schule besucht und unter anderem personelle Verstärkung versprochen. &quot;Doch es war der übliche Politikerbesuch: ein paar freundliche Worte und Versprechen – das war’s&quot;, sagt Thewalt. Vor rund einer Woche legte Thewalt dem Schulausschuss der Bezirksverordnetenversammlung Tempelhof-Schöneberg ein Schreiben vor , das den Verantwortlichen vorwirft, weiterhin untätig geblieben zu sein. Zentrale Forderungen aus dem Brandbrief seien bis jetzt nicht umgesetzt worden.\nNach dem Vorfall am Mittwoch machte die Schulsenatorin Günther-Wünsch der Schulleitung ihrerseits Vorwürfe : Sie habe Hilfsangebote verweigert, so sei ihr etwa mehrfach die Einführung eines Wachschutzes angeboten worden, was abgelehnt worden sei. Andreas Thewalt sagt, ein Wachschutz sei aber nie gefordert worden, sondern ein Pförtner, der Schüler am Verlassen des Geländes während des Unterrichts hindere. &quot;Ich bin enttäuscht&quot;, sagt Thewalt.\n\nDie Gegend sei eigentlich eine gute, &quot;nur die Schule ist schlecht&quot;\n\nDie &quot;schlimmste Schule Berlins&quot; sei das, sagt der Wirt des Cafés gegenüber der Friedrich-Bergius-Schule. Auch in seinen Vorgarten hätten Schüler schon Flaschen geschmissen. Er selbst wohne 700 Meter von hier. Die Gegend sei eigentlich eine gute. &quot;Nur die Schule ist schlecht&quot;, sagt er. Seine eigenen Kinder gingen auf eine andere in der Gegend, er würde sie nie auf die Bergius-Schule schicken, sagt er.\nEin junger Mann führt mit seiner Partnerin einen Corgi durch den Park. Er stamme aus Russland sagt er, er antwortet auf Englisch. Von den Geschehnissen am Vortag weiß er noch nichts. Aber die früheren Berichte kennt er. &quot;Wenn die Schüler aus der Schule kommen, fühle ich mich in ihrer Nähe ängstlich. Sie sind laut, im Supermarkt und hier draußen, und es sind sehr viele.&quot; Dabei fühle er sich in der Nachbarschaft sonst sehr sicher.\n&quot;Die Schüler passen nicht in die Gegend&quot;, sagt auch ein weiterer Anwohner, er kommt gerade aus dem Supermarkt, eine geöffnete Dose mit einem Energydrink in der Hand. Viele Schülerinnen und Schüler kämen morgens mit der S-Bahn an, aus anderen Teilen der Stadt. Auch er erwähnt die Lautstärke der Schülergruppen. Seit etwa drei, vier Jahren merke er das, auch wenn er schon weitaus länger hier lebe. Dass Berliner Schüler eine weiterführende Schule besuchen, die nicht in der Nähe ihres Wohnorts liegt, ist nicht unüblich. Die Konkurrenz um Plätze ab der siebten Klasse – die Berliner Grundschule geht bis zur sechsten – ist groß, oft müssen Jugendliche einen weiten Weg zu ihrer weiterführenden Schule zurücklegen.\n&quot;Die Schule hat einen Ruf weg&quot;, sagt der Anwohner vor dem Supermarkt. &quot;Die neue Rütli-Schule.&quot; Aggressionen ihm gegenüber habe er nie erlebt, höchstens der Schüler untereinander. Er berichtet von einem Zettel, der eine Weile am Supermarkt-Eingang gehangen habe, wonach den Schülern der Schule generell der Zutritt zum Markt verboten wurde. Allerdings nicht durch die Betreiber der Filiale, sondern von der Schulleitung. Es klingt nach verzweifelten Versuchen, die Lage in den Griff zu bekommen.\nSolch ein Vorfall, knapp einen Monat vor der Bundestagswahl, ist auch politisch brisant. Denn er berührt einige der größten gegenwärtigen Konfliktthemen: Migration und Kriminalität. Tatsächlich ist die Gewaltkrimininalität unter Kindern zuletzt gestiegen , deutschlandweit um 17 Prozent. Und das, nachdem die Zahlen vor allem in den späten Nuller- und frühen Zehnerjahren lange rückläufig waren.\nDie Gründe: psychische Belastungen unter Jugendlichen, die nach der Pandemie auch in Straftaten ein Ventil suchen. Eine erhöhte Zuwanderung. Da überwiegend männliche Geflüchtete und Einwanderer nach Deutschland kommen und junge Männer die für Gewaltkriminalität am stärksten anfällige Gruppe bilden, sind Zuwanderer in der Kriminalstatistik überrepräsentiert.\nDabei lässt sich der viel geäußerte Eindruck, auch an Schulen nehme Gewalt zu, im Gegensatz zur tatsächlich gestiegenen Jugendkriminalität statistisch noch gar nicht abbilden. Hier sind die Fallzahlen seit Jahren auf einem niedrigen Niveau. Aufsehen erregen vor allem heftige Einzelfälle – wie jetzt dieser vor der Friedrich-Bergius-Schule."}, {"id": "s034", "type": "PredE", "definition": "Predicate error: the action or state (usually the verb) contradicts the article. The participants are right, but what they do is wrong.", "original": "Die Debatte über soziale Netzwerke dreht sich darum, was noch gesagt werden darf, mit Instagram und Facebook als zentrale Akteure. Mark Zuckerberg plant, die Moderation von Inhalten zu <del>lockern,<\/del> da laut ihm Regierungen und Medien zu viel Einfluss ausüben. User Rights GmbH in Berlin-Kreuzberg ermöglicht es Nutzern, gegen die Löschung ihrer Beiträge vorzugehen. Kritiker wie Anwalt Joachim Steinhöfel sehen im Digital Services Act der EU eine zu starke Einschränkung der Meinungsfreiheit. Die Automatisierung von Löschentscheidungen führt zu vielen Fehlern, wie die Erfahrungen von User Rights zeigen. Die geplante Lockerung der Moderationspraxis durch Zuckerberg könnte die Situation weiter verschärfen.", "modified": "Die Debatte über soziale Netzwerke dreht sich darum, was noch gesagt werden darf, mit Instagram und Facebook als zentrale Akteure. Mark Zuckerberg plant, die Moderation von Inhalten zu <ins>verschärfen,<\/ins> da laut ihm Regierungen und Medien zu viel Einfluss ausüben. User Rights GmbH in Berlin-Kreuzberg ermöglicht es Nutzern, gegen die Löschung ihrer Beiträge vorzugehen. Kritiker wie Anwalt Joachim Steinhöfel sehen im Digital Services Act der EU eine zu starke Einschränkung der Meinungsfreiheit. Die Automatisierung von Löschentscheidungen führt zu vielen Fehlern, wie die Erfahrungen von User Rights zeigen. Die geplante Lockerung der Moderationspraxis durch Zuckerberg könnte die Situation weiter verschärfen.", "title": "Title Not Found", "article": "Die Debatte über soziale Netzwerke dreht sich ja meistens darum, was alles noch gesagt werden darf. Was gerade noch okay ist und was nicht mehr. Wo bei Facebook und Instagram die Grenze verläuft. Hier mal drei Fälle:\n&quot;Wie in jeder Krise hat sich der Deutsche Staat  als allwissender Retter der Bevölkerung  geriert und Zweifler zum Schweigen gebracht.  Die Deutschen werden nie aufhören das zu fressen, was vom Staat kommt,  ob im 3.Reich, in der DDR oder heute.&quot;\n(29. September 2024, entfernt auf Grundlage  von Instagrams Richtlinie zu Spam)\nFünf Beiträge, die Füße in weißen  Socken zeigen und mit den Schlagworten  #fetisch und #feetslovers versehen sind\n(5. August 2024, entfernt aufgrund  von Instagrams Richtlinie zu sexuell motivierter Kontaktaufnahme durch Erwachsene)\n&quot;Die Pager der Hisbollah in die Luft zu jagen, wäre ein entscheidender Wendepunkt in einem Krieg zugunsten Israels gewesen. Aber jetzt  haben sie diesen Trick verschwendet, um einen Krieg hinauszuzögern, von dem sie wissen,  dass sie ihn nicht gewinnen können. (...) Die Hisbollah hat sich nicht abschrecken lassen, (...) und die Hamas ist noch immer quicklebendig. Jetzt warten wir auf die Antwort.&quot;\n(24. September 2024, entfernt aufgrund von Instagrams Richtlinie zu gefährlichen Organisationen)\nGlaubt man Mark Zuckerberg, dem Chef des Meta-Konzerns, zu dem Instagram und Facebook gehören, dann mussten diese und andere Beiträge verschwinden, weil die EU das so will. &quot;Regierungen und etablierte Medien haben uns gedrängt, immer mehr zu zensieren&quot;, sagte der Facebook-Gründer vergangene Woche in einem Video, &quot;vieles davon ist eindeutig politisch motiviert&quot;. Man habe in den vergangenen Jahren &quot;komplexe Systeme&quot; für die Moderation von Inhalten entwickelt. Diese würden jedoch Menschen ausschließen und Meinungen unterdrücken. Zuckerberg will das nun rückabwickeln, Faktenchecks abschaffen und Moderatoren entmachten , die ihm plötzlich zu &quot;biased&quot; sind, zu voreingenommen.\nDa schwingt viel Opportunismus mit, kurz bevor Donald Trump zum zweiten Mal Präsident wird . Aber könnte es sein, dass Zuckerberg einen Punkt hat? Dass seine Netzwerke tatsächlich zu stark eingreifen in die freie Rede?\nVon Oktober 2023 bis Oktober 2024 haben Facebook und Instagram in der EU 168 Millionen Beiträge gelöscht. In 8,7 Millionen Fällen reichten Nutzer dagegen Beschwerde ein. Mehr als zwei Millionen Posts wurden daraufhin wiederhergestellt. Jeden vierten dieser Beiträge hatte Meta folglich zu Unrecht gelöscht. Offenbar gibt es also ein Problem.\nNun ist Meinungsfreiheit eigentlich etwas, das Staat und Bürger untereinander ausmachen. Aber weil Facebook und andere Firmen einen so großen Teil der öffentlichen Debatte abbilden und bei sich versammeln, entscheiden die Löschpraktiken auch über gesellschaftliche Teilhabe. Seit einem Jahr gibt der Digital Services Act (DSA) der EU deshalb einige Regeln vor. Löschen müssen die Plattformen eindeutig Illegales, wie Kinderpornografie und Aufrufe zu Gewalttaten. Darüber hinaus sollen sie grundsätzlich sichere Orte sein. Was die Plattformen darunter verstehen, legen sie in ihren Hausregeln fest.\nOb sie dabei zu weit gehen, wird auch in einem Erdgeschoss in Berlin-Kreuzberg verhandelt, im Büro der User Rights GmbH. Niklas Eder, 34, und Raphael Kneer, 36, beide Juristen, sind die Geschäftsführer. Ihr Team ist vor wenigen Tagen erst eingezogen, bisher stehen nur ein paar Schreibtische und Bildschirme, es gibt noch keine Kaffeemaschine und kein Klingelschild. An Arbeit mangelt es aber nicht. Seit vergangenem August können Nutzer bei User Rights Beschwerde einlegen gegen Instagram, TikTok und LinkedIn, bald auch gegen alle übrigen Plattformen. Etwa wenn man einen Post gemeldet hat, der gelöscht werden sollte, und Meta nicht reagiert. Oder wenn der eigene Account gesperrt oder Beiträge entfernt wurden.\nÜber 500 Verfahren laufen schon, sagt Kneer, &quot;es melden sich bisher vor allem die, deren Beiträge zu Unrecht moderiert wurden&quot;. Der Mann, der sich in DDR-Verhältnissen wähnt und das dann, wie zur Bestätigung, online nicht sagen darf. Der Fußfetischist, dessen Bilder eigentlich harmlos sind. Oder der Nutzer, der Bedenken äußern wollte an Israels Kriegsführung. In allen drei Fällen hat User Rights Instagram aufgefordert, die Beiträge wiederherzustellen.\nNach dem europäischen Digital Services Act müssen die Konzerne offenlegen, warum sie Beiträge entfernen oder eben nicht – und sie müssen zeitnah auf Widerspruch reagieren. Dafür sieht der DSA Schlichtungsstellen vor. Dort entscheiden Juristen, ob eine Maßnahme gerechtfertigt war. User Rights ist eine der ersten in der EU und die bisher einzige in Deutschland.\nEin erstes Fazit nach vier Monaten? &quot;Es kommt wirklich oft zu Fehlern&quot;, sagt Kneer. Das liege auch daran, dass die Plattformen einen Großteil der Regelverstöße mithilfe von künstlicher Intelligenz ahnden, um Kosten und Zeit zu sparen und Mitarbeiter vor verstörenden Bildern zu schützen. Ist also die Technik ursächlich für die vielen falschen Entscheidungen, nicht die Regulierungswut der EU? Zuletzt lag Metas Automatisierungsquote bei 95 Prozent. &quot;Das ist ein Problem&quot;, sagt Kneer, &quot;die Fälle, die uns erreichen, sind viel zu komplex, um sie nur mit KI zu prüfen.&quot;\nZum Beispiel: In Beiträgen, in denen die Namen &quot;Hisbollah&quot; und &quot;Hamas&quot; fallen, wird mit erhöhter Wahrscheinlichkeit eine Terrororganisation gelobt. Wenn es nach der KI geht, also nur nach Statistik und unter Missachtung von Nuancen, sind Äußerungen zum Krieg im Nahen Osten oft nicht möglich.\nOder der Mann, der auf TikTok Naziparodien hochlädt. Selbst Raphael Kneer hat die Videos erst auf den zweiten Blick als erlaubte  Satire erkannt. Wie soll das einem Algorithmus gelingen? Und natürlich weiß jeder, was gemeint ist, wenn unter dem Video einer Transfrau &quot;Nutti&quot; kommentiert wird oder junge Rechte Plakate mit der Aufschrift &quot;Alles für DE&quot; posten – nur die Software eben nicht.\nStatt die Systeme zu verbessern, nutzt Zuckerberg nun das politische Klima, um sie in Teilen abzuschalten. In den USA dürfen Frauen jetzt wieder als &quot;Haushaltsinventar&quot; bezeichnet werden und Homosexuelle als &quot;geisteskrank&quot;. Bisher ließen Facebook und Instagram solche Aussagen nicht zu.\nOb diese Plattformpolitik auch in der EU möglich wäre, ist noch offen. Im DSA stehen dazu einige schwammige, beinahe unbeholfene Formulierungen. Da ist zum Beispiel die Rede von &quot;systemischen Risiken&quot; für die Demokratie, die es zu verhindern gilt, ohne dass sich daraus konkrete Pflichten ergeben. Und wann ist die Vorgabe erfüllt, Nutzer zu schützen, die besonders gefährdet sind, &quot;Opfer von Hassreden&quot; zu werden? Kritiker der Verordnung sagen, in solchen juristischen Grauzonen würde im Zweifel eher zu viel gelöscht als zu wenig. Einer von ihnen ist der Anwalt Joachim Steinhöfel. Vor Gericht war er in den vergangenen Jahren der vermutlich hartnäckigste Gegner von Meta in Deutschland. Über hundertmal ist Steinhöfel dagegen vorgegangen, dass Beiträge gelöscht wurden, die legal und im Rahmen der Meinungsfreiheit erlaubt sind. Sein Buch Die digitale Bevormundung wurde Spiegel - Bestseller. Für Zuckerbergs Kehrtwende hat Steinhöfel – wenig überraschend – nur Lob übrig. In der Gesellschaft gebe es ohnehin &quot;einen Überdruss an einem sprachlichen Korsett, das durch den DSA viel enger ist als das, was gesetzlich eigentlich erlaubt ist&quot;.\nMan kann sich Metas Moderationspraxis in etwa vorstellen wie ein Fischernetz. Bisher war es recht engmaschig, viele Raubfische gingen ins Netz, Beifang wurde in liberalen Demokratien hingenommen für ein halbwegs gesittetes Miteinander. Diesen Konsens gibt es in den USA nicht mehr, und auch in Europa wird die Kritik daran lauter. Wenn also bald die Maschen größer werden, dann geraten zwar nicht mehr so oft die Falschen ins Netz. Dafür erwischt man aber auch weniger von den Richtigen.\nZuckerberg macht damit vieles rückgängig, was Meta in den vergangenen Jahren aufgebaut hat. Das Faktencheckprogramm, bei dem externe Organisationen Falschmeldungen korrigieren, war eine Reaktion auf Desinformation im US-Wahlkampf 2016. &quot;Aber anders als 2016 ist Trump jetzt kein Unfall mehr&quot;, sagt ein ehemaliger Meta-Mitarbeiter. Zuckerberg sehe darin auch die Chance, endlich die Gesetze der EU auszuhebeln. Der Meta-Chef macht kein Geheimnis daraus: Er wolle mit Donald Trump zusammenarbeiten , &quot;um die Regierungen weltweit unter Druck zu setzen&quot;, sagte er in seiner Videobotschaft.\nNoch arbeitet Meta in der EU mit Faktenprüfern zusammen, unter anderem mit dem Recherchenetzwerk Correctiv und der Deutschen Presse-Agentur. Sie können allerdings keine Beiträge löschen, sie verpassen ihnen nur einen Hinweis, wenn sie &quot;Fehlinformationen&quot; enthalten, und hängen ihre Recherchen an. Es gibt Studien, die nahelegen, dass solche Warnhinweise wirken. Aber wenn sie etwas zu Unrecht beanstanden, können sie auch Vertrauen zerstören. Steinhöfel hat bereits mehrfach Verfahren gegen die Faktenchecks angestrengt. In einem Fall bewertete das Oberlandesgericht Karlsruhe den Hinweis &quot;fehlender Kontext&quot; von Correctiv unter einem Facebook-Beitrag zur Pandemie als mögliche Irreführung. Die Begründung: Correctiv habe keine Tatsachenbehauptung infrage gestellt, den Beitrag lediglich kritisch bewertet.\nDie Europäische Kommission steht nun vor der Frage, wie wirksam der Digital Services Act noch ist, wenn Firmen wie Meta und X jede Selbstverpflichtung aufheben. &quot;Mark Zuckerberg verändert gerade die Geschäftsgrundlage&quot;, sagt Klaus Müller, Chef der Bundesnetzagentur. Er überwacht die Umsetzung des DSA. &quot;Neben der Meinungsfreiheit gibt es auch andere Grundrechte, die gewahrt werden müssen.&quot;\nDenn selbst durch ein enges Netz ist bisher noch sehr viel durchgekommen, das eigentlich verboten ist. Welche verheerenden Folgen das hat, zeigt eine Studie der Technischen Universität München und der gemeinnützigen Organisation HateAid, die an diesem Mittwoch veröffentlicht wird. Befragt wurden 742 Politikerinnen und Politiker aus Kommunen, Land und Bund. Die Umfrage ist nicht repräsentativ, gibt aber einen Einblick in die Probleme. Fast ein Viertel der von digitaler Gewalt betroffenen Frauen gab an, ihnen sei online schon einmal mit Vergewaltigung gedroht worden, bei den Männern berichtet die Hälfte, dass ihnen mit Schlägen gedroht wurde oder mit Mord. Ein erheblicher Teil hat schon einmal erwogen, deswegen aus der Politik auszuscheiden.\n&quot;Diesen Politikerinnen und Politikern geht es nicht um normale Beleidigungen und Kritik, damit können sie umgehen. Aber einige von ihnen erleben tägliche Angriffe auf ihre Menschenwürde&quot;, sagt Anna-Lena Hodenberg, die Geschäftsführerin von HateAid. Hodenberg weist angesichts ihrer Erfahrung mit Opfern die Vorstellung zurück, es werde zu viel gelöscht und in die Meinungsfreiheit eingegriffen. Nur kann eben beides wahr sein: Die Moderation funktioniert an beiden Enden des Spektrums nicht gut genug. Oft wird übersehen, was hätte gelöscht werden müssen – und entfernt, was von der Meinungsfreiheit gedeckt ist. Das liegt derzeit vor allem an den automatischen Systemen. Mark Zuckerberg kann gerade nichts damit gewinnen, sie zu verbessern.\n* Bei 161 Millionen von den 168 Millionen Beiträge traf eine künstliche Intelligenz die Entscheidung."}, {"id": "s038", "type": "PredE", "definition": "Predicate error: the action or state (usually the verb) contradicts the article. The participants are right, but what they do is wrong.", "original": "Die Kurzvideoplattform TikTok ist nach eigenen Angaben in den USA wieder online, nachdem der künftige Präsident Donald Trump versprochen hatte, keine Strafen für die US-Dienstleister der App z
