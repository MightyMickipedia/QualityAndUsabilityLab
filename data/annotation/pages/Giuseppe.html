ttacke gelassen: &quot;Es war leider nicht Sahne, sondern nur Seife&quot;, sagte er und setzte seine Rede fort.\nDer Landesvorsitzende der Linken in Mecklenburg-Vorpommern distanzierte sich von dem Vorfall und betonte, dass Gewalt keine Lösung sei.", "title": "Title Not Found", "article": "Bundesgesundheitsminister Karl Lauterbach (SPD) hat den Wurf einer Schaumtorte auf den ehemaligen Finanzminister Christian Lindner (FDP) deutlich kritisiert. &quot;Es fängt mit der Torte an und hört mit Steinen oder mit Sprengsätzen auf&quot;, sagte Lauterbach. Gewalt sei immer abzulehnen, daher verurteile er diesen Angriff auf Lindner.\n&quot;Das dürfen wir nicht akzeptieren&quot;, sagte der SPD-Politiker. &quot;Verrohung des politischen Prozesses beschädigt die Demokratie. Von daher muss das bestraft werden, das ist kein Kavaliersdelikt.&quot;\nAuch der Kanzlerkandidat der Grünen, Robert Habeck, kritisierte den Wurf einer Schaumtorte auf Lindner. &quot;Tätliche Angriffe jedweder Art haben im Ringen um die besten Lösungen für dieses Land nichts zu suchen!&quot;, schrieb Habeck auf der Plattform X.\nDer FDP-Vorsitzende Christian Lindner war bei einem Wahlkampfauftritt in Greifswald von einer Lokalpolitikerin der Linken mit einer schaumartigen Substanz beworfen worden. Der Wurf traf den früheren Finanzminister direkt ins Gesicht.\nLindner probierte den Schaum und setzte \nseine Rede fort. &quot;Es war leider nicht Sahne, sondern nur Seife&quot;, sagte \ner. &quot;Wenigstens das hätten Sie besser machen können, dann hätte ich auch\n was davon gehabt.&quot; Eine lokale FDP-Sprecherin und Augenzeugin sagte, es habe sich um eine Pseudo-Torte aus Rasierschaum gehandelt.\nLinken-Landeschef distanziert sich\nDer Landesvorsitzende der Linken in Mecklenburg-Vorpommern, Hennis Herbst, bestätigte, dass die junge Frau seiner Partei angehört, und distanzierte sich von der Tat. &quot;Derartige Aktionen gehören für die Linke MV nicht zur politischen Auseinandersetzung und sind konsequent abzulehnen&quot;, sagte Herbst.\nEs gehe darum, die inhaltliche Debatte mit der politischen Konkurrenz zu führen, auch mit der FDP, sagte der Linken-Landeschef. &quot;Derartige Störaktionen anderer Wahlkampfauftritte gehören nicht dazu und tragen nicht zum Vorbringen berechtigter Kritik an der Politik der FDP bei.&quot;\nDer FDP-Chef setzte unterdessen seinen Wahlkampf ohne Unterbrechung fort. Am frühen Nachmittag trat er auf dem Universitätsplatz in Rostock vor mehreren Hundert Menschen auf. Bei seiner Ankunft sagte Lindner: &quot;Mich bringt nichts aus der Ruhe.&quot;\nBereits im vergangenen Jahr gab es mehrere Angriffe auf Politiker in Deutschland. Unter anderem wurde bei einer Wahlkampfveranstaltung des BSW im August die Parteichefin Sahra Wagenknecht mit roter Farbe bespritzt . Für Empörung sorgte ein Angriff auf den SPD-Europaabgeordneten Matthias Ecke, der im Mai von \nmehreren jungen Männern schwer verletzt wurde."}, {"id": "s007", "type": "LinkE", "definition": "Discourse link error: statements are linked wrongly, for example a wrong order in time or a wrong cause.", "original": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert und ihm in einem Brief ein starkes Mandat für Führung attestiert. Merz verspricht, im Falle seiner Kanzlerschaft an einer Stärkung der Beziehungen zwischen Deutschland und den USA zu arbeiten. <del>Während<\/del> keine hohen Vertreter der Bundesregierung zur Amtseinführung Trumps nach Washington reisen, äußert sich Merz zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps als seine Konkurrenten. Trotz Warnungen des deutschen Botschafters in Washington vor der Politik des neuen US-Präsidenten betont Merz, dass Europa die Herausforderung durch Trump annehmen könne, wenn es zusammenstehe.", "modified": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert und ihm in einem Brief ein starkes Mandat für Führung attestiert. Merz verspricht, im Falle seiner Kanzlerschaft an einer Stärkung der Beziehungen zwischen Deutschland und den USA zu arbeiten. <ins>Weil<\/ins> keine hohen Vertreter der Bundesregierung zur Amtseinführung Trumps nach Washington reisen, äußert sich Merz zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps als seine Konkurrenten. Trotz Warnungen des deutschen Botschafters in Washington vor der Politik des neuen US-Präsidenten betont Merz, dass Europa die Herausforderung durch Trump annehmen könne, wenn es zusammenstehe.", "title": "Title Not Found", "article": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert. &quot;Ihr Wahlsieg ist wahrlich bemerkenswert&quot;, schreibt Merz in dem sechszeiligen Brief, der ZEIT ONLINE vorliegt. Er attestiert Trump und dessen Republikanern darin ein &quot;starkes Mandat für Führung&quot;.\nMerz hat im ZEIT-Podcast Alles gesagt? bekannt gegeben , er habe Trump einen handschriftlichen Brief verfasst, der diesem am heutigen Montag übergeben werden soll. Der CDU-Vorsitzende, der vor seiner Rückkehr in die Politik unter anderem für den US-Vermögensverwalter BlackRock gearbeitet hat und Vorsitzender der transatlantischen Vereinigung Atlantik-Brücke war, schreibt: &quot;Ich habe einen beträchtlichen Teil meiner beruflichen Karriere und meines politischen Lebens der Stärkung der Beziehungen unserer beiden Länder gewidmet.&quot; Sollte er Bundeskanzler werden, verspricht Merz Trump, werde eine seiner Prioritäten sein, &quot;mit Ihnen auf ein neues Kapitel in unserer Beziehung hinzuarbeiten&quot;.\nZur Amtseinführung Trumps reisen keine hohen Vertreter der Bundesregierung aus Deutschland nach Washington. SPD, Grüne und FDP sind nicht anwesend, während der CDU-Außenpolitiker und frühere Transatlantik-Koordinator Jürgen Hardt eine Einladung erhielt. Von der AfD ist unter anderem Parteichef Tino Chrupalla vor Ort.\nMerz hat sich wiederholt zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps geäußert als seine Konkurrenten Bundeskanzler Olaf Scholz (SPD) und Vizekanzler Robert Habeck (Grüne). Der deutsche Botschafter in Washington, Andreas Michaelis, warnte in einem vertraulichen Schreiben an die Bundesregierung in deutlichen Worten vor der Politik des neuen US-Präsidenten.\nMerz hingegen sagte in einer Videobotschaft zu Trumps Amtseinführung am Montag: Es gebe für die Europäer &quot;keinen Grund, ängstlich nach Washington zu schauen&quot;. Die Herausforderung durch Trump könne Europa annehmen, wenn es zusammenstehe. &quot;Wir sind 450 Millionen Europäer – mehr als die USA und Kanada zusammen.&quot; Europa müsse sich wegen Trump stärker abstimmen, sagte Merz kürzlich. Er schaue auf eine Amtszeit von Trump nicht &quot;wie das Kaninchen auf die Schlange&quot;. Zudem berichtete Merz im ZEIT-Podcast, er berate sich regelmäßig mit Nato-Generalsekretär Mark Rutte, der Trump gut kenne und von ihm respektiert werde."}, {"id": "s024", "type": "LinkE", "definition": "Discourse link error: statements are linked wrongly, for example a wrong order in time or a wrong cause.", "original": "DIE ZEIT und ZEIT ONLINE haben verschiedene Autorinnen und Autoren gebeten, über die Notwendigkeit, wehrhaft zu werden, nachzudenken. Angesichts des russischen Angriffskriegs in der Ukraine und der Zeitenwende, die dies ausgelöst hat, wird die Frage aufgeworfen, ob ein kriegstüchtiges Deutschland wirklich die Lösung ist. Die soziale Militarisierung der Gesellschaft und die Abwesenheit von Widerspruch gegen Aufrüstung und Kriegstüchtigkeit werden kritisch betrachtet. Es wird betont, dass Widerspruch und Protest gegen Krieg und Militarisierung wichtig sind, <del>auch wenn<\/del> sie in einer Atmosphäre der Angst und Repression stattfinden.", "modified": "DIE ZEIT und ZEIT ONLINE haben verschiedene Autorinnen und Autoren gebeten, über die Notwendigkeit, wehrhaft zu werden, nachzudenken. Angesichts des russischen Angriffskriegs in der Ukraine und der Zeitenwende, die dies ausgelöst hat, wird die Frage aufgeworfen, ob ein kriegstüchtiges Deutschland wirklich die Lösung ist. Die soziale Militarisierung der Gesellschaft und die Abwesenheit von Widerspruch gegen Aufrüstung und Kriegstüchtigkeit werden kritisch betrachtet. Es wird betont, dass Widerspruch und Protest gegen Krieg und Militarisierung wichtig sind, <ins>weil<\/ins> sie in einer Atmosphäre der Angst und Repression stattfinden.", "title": "Title Not Found", "article": "Wie, wir sollen wehrhaft werden? Und: Wollen wir\nüberhaupt kämpfen? Diese Fragen stellt man sich überall in Europa. DIE ZEIT und\nZEIT ONLINE haben deshalb unterschiedliche Autorinnen und Autoren gebeten,\ndarüber nachzudenken.\nWer in meinem Alter ist, hat die Kriege des 20. Jahrhunderts\nnicht miterlebt, kennt die Spannungen des Kalten Kriegs nur aus Büchern und war\nam 11. September 2001 gerade geboren. Für die Mehrheit junger Menschen in\nDeutschland ohne Flucht- und Migrationserfahrung ist Krieg deshalb vor allem abstrakte\nGeschichte, eine coole Videospielgrundlage oder moralische Projektionsfläche.\nVielleicht dreht sich deshalb seit Kriegsbeginn in der\nUkraine der mediale Diskurs so sehr darum, ob man(n) Waffen, Kämpfen und Krieg\npersönlich toll findet oder nicht und mit wie viel paternalistischer Argumentation\nman dies verteidigen kann.\nDas wird dem Ausmaß dessen, was es bedeutet, wenn Boris\nPistorius sagt: &quot;kriegstüchtig werden&quot;, aber nicht gerecht. Die Konsequenzen\ndieser Kriegstüchtigkeit sind zu groß, um dem Plan des Verteidigungsministers nicht\nzu widersprechen. In erster Linie, weil Krieg in Menschenleben bezahlt wird.\nAber auch weil die Zeitenwende nicht nur Budgets und Auslandseinsätze ändert,\nsondern die Art, wie wir in Deutschland Konflikte verhandeln. Einiges deutet\ndarauf hin, dass wir hierzulande bereits mit der ersten Konsequenz dieser ersehnten\nKriegstüchtigkeit leben: Auf Gegenstimmen folgen nicht mehr nur Diskussion und\nStreit, sondern auch Repression, manchmal auch Gewalt.\nEs bedarf deshalb einer zeitgerechten Antikriegsposition,\ndie mehr anbieten kann als einen vereinfachten Pazifismus, dessen Argumentation\nbei &quot;Krieg ist blöd, Gewalt mag ich nicht&quot; aufhört.\n\nKrieg wofür?\n\nAnhänger des Realismus, der theoretischen Grundlage der internationalen\nBeziehungen, würden argumentieren, dass Chaos und Krieg ein Naturzustand sind –\nund dass allein militärische Allianzen und ein internationales\nMachtgleichgewicht Eskalation verhindern können. Kritische, feministische oder\nmarxistische Theoretikerinnen würden Krieg als ein Element des herrschenden\nSystems einordnen – ein Kampf um Macht, Dominanz und Ressourcen. Für sie liegt\nKrieg nicht in der Natur des Menschen, sondern in der Natur des Systems.\nAus dem Widerstand gegen solche Formen von Krieg, vor dem\nHintergrund des Ersten Weltkriegs, entstand durch Menschen wie Rosa Luxemburg\nund Karl Liebknecht die Antikriegsbewegung. Für sie galt kein vereinfachter\nPazifismus à la &quot;Krieg ist blöd und ich habe keine Lust drauf&quot;. Es ging immer\ndarum, wessen Krieg geführt wurde, in welchem Interesse, mit welchen\nAkteuren und Zielen. Und mit welchen Opfern. In dem Versuch, heute eine\nAntikriegsposition zu formulieren, bleiben diese die zentralen Fragen.\nDenn es gibt Kriege und bewaffnete Konflikte, die dem\ndominanten Muster nicht entsprechen, die die Frage komplizierter machen. Der\nSieg gegen den deutschen Faschismus gehört hierzu ebenso wie antikoloniale\nBefreiungskämpfe und bewaffnete Aufstände unter Kolonialherrschaft. Auch heute\nsind es beispielsweise bewaffnete kurdische Einheiten, die den Kampf\ngegen den IS maßgeblich voranbringen.\nEine zeitgerechte Antikriegsposition darf &quot;Nie wieder Krieg&quot;\nfordern und sollte dennoch Platz machen für diese komplizierteren,\nwiderständigen Kriegsformen. Für Kämpfe gegen Faschismus, gegen\n(Fremd-)Herrschaft, für Kämpfe von unten. Das zu fordern, ist nicht naiv und blendet\nauch die Konsequenzen von Gewalt und Krieg nicht aus. Eine zeitgerechte\nAntikriegsposition erkennt die Widersprüche im Spannungsfeld zwischen\npolitischer Notwendigkeit und brutalen Folgen an.\n\nRisiko: Deutschland\n\nDer russische Angriffskrieg in der Ukraine begründet die\nsogenannte Zeitenwende und das 2022 verabschiedete Sonderbudget der Bundeswehr.\nEin kriegstüchtiges Deutschland soll abschrecken und Nato-Staaten bei der Abwehr\nRusslands unterstützen. Deutschland soll darauf vorbereitet sein, dass der\nKrieg sich ausweiten und tiefer in Richtung Westeuropa bewegen könnte.\nWas davon in den kommenden Jahren eintreten wird, ob\nüberhaupt etwas, können wir nicht wissen. Klar ist nur, dass sich dieser Krieg\nschon zu viele Jahre zieht. Gerade bei einem so langwierigen Konflikt, einem\nscheinbar endlosen Kampf, ist es doch sinnvoll, zu fragen, ob der Weg zu einem\nKriegsende wirklich nur aus Wettrüsten, aus noch mehr Krieg bestehen kann. Ob\nim Widerstand gegen Fremdherrschaft, gegen den Angriff Russlands, ein militärischer\nSieg wirklich die einzige Lösung ist. Diese Fragen sind nicht als prorussische\nPosition zu verstehen, sie sind ein grundlegender Bestandteil der Friedens- und\nKonfliktforschung.\nDer Krieg in der Ukraine mag ein konkreter Anlass für den Wunsch\nnach mehr Wehrhaftigkeit sein, denn für viele Menschen ist dieser Krieg,\ngeografisch und persönlich, die nächste Gefahr. Doch deutsche Aufrüstung und\nWehrtüchtigkeit bringen Risiken mit sich, die ganz unabhängig vom weiteren\nKriegsverlauf in der Ukraine bestehen.\nEtwa ein kriegstüchtiges Deutschland unter einer Regierung,\ndie sich weiter von der AfD beeinflussen lässt und, wie in der\nMigrationspolitik, auch bei Fragen der Innen- und Außenpolitik weiter nach\nrechts driftet.\nSchon heute verhält sich die Regierung nicht unbedingt so,\nals würde ihr an Menschenleben oder dem Ende von Kriegen ernsthaft etwas liegen.\nDas zeigt sich mit jeder Abschiebung nach Afghanistan, von Jesiden in den Irak.\nMit Waffenlieferungen an Israel, die\nfür Kriegsverbrechen genutzt werden könnten . Mit jeder Kooperation mit\nStaaten wie den Vereinigten Arabischen Emiraten, deren Unterstützung der Rapid\nSupport Forces, also der Miliz im Krieg mit dem sudanesischen Militär,\nderzeit die größte Hunger-, Flucht- und Gesundheitskrise weltweit befördert.\nUnd trotzdem fehlt der Widerspruch. Es gibt kaum Gegenstimmen\nin der Gesellschaft, Demonstrationen, gar öffentlichen Streit über die\nKonsequenzen von Kriegstüchtigkeit. Die Tendenz scheint sogar gegenteilig.\nUmfragen zufolge ist Boris Pistorius der beliebteste Politiker Deutschlands,\nund auch die Wiedereinführung der Wehrpflicht wird von den meisten Menschen unterstützt.\nDie Angst eines erweiterten Russlandkriegs mag ein Grund für diese Zahlen sein.\nDass aber plötzlich alle Menschen überzeugte Kriegsunterstützerinnen geworden\nsind, kann und möchte ich nicht glauben. Woran liegt die Abwesenheit von\nWiderspruch dann?\n\nKriegstüchtigkeit nach außen heißt Angst nach innen\n\nWenn nach außen aufgerüstet wird, geht das immer mit einer\nMilitarisierung der Gesellschaft nach innen einher. Diese soziale\nMilitarisierung wird meist am Beispiel autoritärer Staaten definiert, doch es\ngibt sie auch in Demokratien. Dort ist sie nur subtiler. Soziale\nMilitarisierung geschieht, wenn die Dauerpräsenz des Militärs im Alltag normal\nwird: in der Schule, der Universität, im Arbeitsamt. An der Bahnstation, im\nBriefkasten, in den sozialen Medien. Wenn die Bundeswehr eine normale Berufsoption\nwird, in der Gewalt und Töten nur Randnotizen sind.\nSoziale Militarisierung zeigt sich auch in der Abwesenheit\nvon Widerspruch und Streit. Sie beeinflusst gesellschaftliche Diskussionen, bis\ndie Gefahr nicht mehr nur vom Feind ausgeht, sondern von allen, die überhaupt\nKritik an der Militarisierung äußern. Menschen, die 2022 fragten, warum\ninmitten einer Pandemie Milliarden für die Bundeswehr übrig waren, für\nKrankenhauspersonal aber nur geklatscht werden konnte, galten als naiv. Wer die verherrlichende\nKriegsrhetorik einiger Politiker und Journalisten einfach nicht angebracht fand, galt als Verräter . Wer\nsich für ein Kriegsende einsetzen wollte, ohne sich mit einem Milieu aus prorussischen\nPositionen und Coronaleugnern und den Parteien, die ihnen nahestehen, gemein\nzu machen, fand kaum öffentliche Repräsentation.\nWenn es um den Ukrainekrieg geht, dann ist die Dynamik vor\nallem in der Sprache zu spüren, im Mangel an Platz für Debatten. Dass in\nKriegszeiten der Ton strenger, ausgrenzender und gewaltvoller wird, ist nichts Neues.\nDoch in zahlreichen anderen Konflikten wird der Umgang brutaler, wird legitime\nKritik als Gefahr, als Sicherheitsrisiko an sich behandelt.\nAm stärksten zeigt sich das in innerdeutschen Reaktionen auf\nIsraels Kriegsführung in Palästina und im Libanon. An den Anfeindungen gegen\nund Kündigungen von einer ganzen Reihe an Stimmen, die Kritik äußern am\nendlosen Töten, an der brutalen Siedlungs- und Besatzungspolitik der\nisraelischen Regierung, an den Waffenlieferungen Deutschlands an Israel. Im\nAusmaß an Polizeigewalt, mit dem bisher auf Proteste gegen den Krieg reagiert wurde,\nund mit dem suggeriert wurde, alle Demonstrierenden wären pauschal\nantisemitisch oder islamistisch.\nNatürlich ist Polizeigewalt keine Kriegsführung, doch dass\nsie sich ausgerechnet bei Antikriegsprotesten entlädt, zeigt, was\nMilitarisierung im Inneren heißen kann. Die Polizeigewalt auf den\nDemonstrationen markiert, dass es sich bei den Forderungen und Ängsten der meisten\nProtestierenden nicht etwa um berechtigte Anliegen handeln könnte, sondern dass\njede Demonstrationsteilnehmerin an sich schon als Terrorgefahr, als Täterin zu\nbehandeln ist.\nGeht es um den Ukrainekrieg, wird Kritik – beispielsweise an\ndeutschen Waffenlieferungen – als prorussisch diskreditiert. Geht es um die\nisraelischen Angriffe in Palästina und im Libanon – oder auch die anhaltenden\ntürkischen Angriffe auf kurdische Gebiete –, wird Kritik als Terror behandelt. Dann\nwerden Widerspruch und Protest nicht als das gesehen, was sie eigentlich sind –\nwichtige, notwendige Debattenbeiträge, die bei einem so großen Thema wie Krieg\nessenziell sind. Stattdessen werden sie wie radikale Randerscheinungen bestraft,\nals Gefahr behandelt.\nIn einer solchen Atmosphäre der Angst und der Repression\nkönnen Entscheidung wie die Stationierung von US-Marschflugkörpern in\nDeutschland, die zu anderen Zeiten sicherlich auf massive Proteste der\nBevölkerung gestoßen wären (und die es 1983 gegen die Stationierung von\nPershing-II-Raketen auch gab), einfach so beschlossen werden.\nStattdessen wächst das Autoritäre, wächst die reale Gefahr,\nWiderspruch zu äußern. Doch Schweigen kostet dennoch zu viel: Tote, die\nKürzungen von Sozial- und Bildungsbudgets, der massive Klimaschaden. Dagegen darf\nman laut sein, dagegen darf es Widerspruch geben. Sich gegen Krieg zu stellen,\nzu widersprechen, zu protestieren, zu streiken, ist keine unerhörte Position.\nIn einer vorherigen Version dieses Artikels stand, dass ein Leipziger Schüler seiner Schule verwiesen worden wäre, weil er gegen einen Unterrichtsbesuch der Bundeswehr protestiert hatte. Einer Stellungnahme der Schulleitung ist inzwischen zu entnehmen, dass der Schüler nicht suspendiert wurde."}, {"id": "s028", "type": "LinkE", "definition": "Discourse link error: statements are linked wrongly, for example a wrong order in time or a wrong cause.", "original": "Sommer, Sonne, Pastis und Pétanque: In der provenzalischen Stadt Bormes-les-Mimosas treffen sich die Einheimischen zum entspannten Boule-Spiel auf dem Marktplatz. Mit einem Glas Pastis in der Hand und dem Duft von Lavendel in der Nase wird das Spiel zur gemütlichen Tradition. Die Spieler werfen ihre Metallkugeln behutsam Richtung Cochonnet, <del>während<\/del> die Zuschauer am Rand mit einem Rinquinquin in der Hand das Geschehen verfolgen. Der süße Pfirsichwein aus der Provence ist die perfekte Alternative für diejenigen, die kein Fan von Anis sind. Ob pur, mit Tonic oder als Cocktail gemischt - Rinquinquin verkörpert das süße und klebrige Lebensgefühl des Südens.", "modified": "Sommer, Sonne, Pastis und Pétanque: In der provenzalischen Stadt Bormes-les-Mimosas treffen sich die Einheimischen zum entspannten Boule-Spiel auf dem Marktplatz. Mit einem Glas Pastis in der Hand und dem Duft von Lavendel in der Nase wird das Spiel zur gemütlichen Tradition. Die Spieler werfen ihre Metallkugeln behutsam Richtung Cochonnet, <ins>bevor<\/ins> die Zuschauer am Rand mit einem Rinquinquin in der Hand das Geschehen verfolgen. Der süße Pfirsichwein aus der Provence ist die perfekte Alternative für diejenigen, die kein Fan von Anis sind. Ob pur, mit Tonic oder als Cocktail gemischt - Rinquinquin verkörpert das süße und klebrige Lebensgefühl des Südens.", "title": "Wie der erste Biss in einen reifen Pfirsich", "article": "Je höher die Temperaturen, desto erfrischender der Drink. Mit Schirmchen am Meer, zum Aperitivo in der Stadt oder auf der Picknickdecke am Badesee: Unsere Sommerkolumne nimmt Sie mit zu den besten Getränken an den schönsten Urlaubsorten.\nWenn die provenzalische Sonne am späten Nachmittag nicht\nmehr ganz so beißend scheint, verwandelt sich der kieselige Marktplatz von\nBormes-les-Mimosas am südöstlichen französischen Zipfel in einen magischen\nOrt.\nMit dem Zusammenklappen der Verkaufstische an der Place Saint-François schaut der Händler am Wochenmarkt nicht mehr ganz so genau auf die\nWaage und gibt augenzwinkernd einen zusätzlichen Löffel Tomatentapenade in die\nPlastikschale. So viel wie möglich will verkauft sein, bevor die Marktleute mit\nihren Campingstühlen und alten Renaults den Platz frei machen für eine Aktivität,\ndie von allen schönen Dingen Südfrankreichs vielleicht die allerschönste ist: pétanque et pastis!\nPétanque ist eine provenzalische Variante aus der\nweitläufigen Familie der Boule-Spiele. Und sie ist die gemütlichste von allen.\nDavon zeugt schon der Name. Der stammt vom Begriff der pieds tanqués ab,\nder geschlossenen Füße. Im provenzalischen Dialekt: ped tanco . Bloß\nkeinen Schritt zu viel!\nNur wenige Kilometer vom Meer entfernt, in den Hügeln des\nDépartement du Var, wandelt sich der Marktplatz entsprechend gemächlich in ein\nBoulodrome. Die Prozession der zumeist älteren Herren von ihren schattigen Balkonen\nhin zur Dorfmitte, jeder einzelne beladen mit drei handlichen Metallkugeln,\njede etwa 700 bis 800 Gramm schwer, und einem leeren Glas: Sie beginnt langsam\nund behutsam. Der honigfarbene Pastis wird ins mitgebrachte Gläschen\neingeschenkt und mit Wasser verdünnt. Sobald die ersten Tropfen auf den Schnaps\ntreffen, verwandelt sich die Farbe, es entsteht eine magisch-milchige\nFlüssigkeit, die einem den Atem abschneidet, aber wunderbar abkühlt. Sie ist\nErfrischung und Zielwasser zugleich.\nAuf der Place Saint-François gibt es gleich 24 Bahnen, je vier\nMeter breit und 15 Meter lang, der Untergrund ist grau-weißer Schotter. Nach\nden alten Herren finden sich irgendwann auch Spielerinnen jeglichen Alters ein.\nGespielt wird in flexibel großen Mannschaften. Wer seine Boules am nächsten an\ndie kleine, hölzerne Zielkugel, den Cochonnet, das Schweinchen, heranwirft,\nbekommt den Punkt. Es wird geschaut, es wird kommentiert, es wird gescherzt und\ngelacht. Es gibt kleine Magnete, an Schnüren befestigt, damit sich zum Aufheben\nder Kugeln nicht mal gebückt werden muss.\nEs liegt an der gemütlichen Natur des Spiels, dass viel Zeit\nfür spielbegleitenden Genuss bleibt. Die Zigarette gehört zum Boulodrome und\nden sonnengegerbten Händen dazu, doch sie soll an dieser Stelle nicht empfohlen\nwerden. Der Pastis allerdings schon – natürlich in Maßen.\nPastis und Pétanque, was ein Duo! Wenn der Spieler denn Anis\nmag, die lakritzig-krautige Note der Spezialität, dem Sambuca oder dem Arak\nnicht unähnlich, schmeckt schließlich nicht allen. Ein kaltes Bier lassen die\nDorfältesten allerdings auch durchgehen, wer dazu noch ein paar Oliven und\nsalzige Chips am Rand der Boule-Bahn aufstellt, darf davon ausgehen, dass Roger\noder Jean-Luc oder Robert – am Boulodrome sind Freundschaften schnell\ngeschlossen – zulangen.\nDer Geheimtipp an der Place Saint-François für\nPastis-Skeptiker ist Rinquinquin, ein vin de pêche, Pfirsichwein. Hergestellt wird der Rinquinquin aus vorrangig\nprovenzalischen Zutaten: Weißwein aus dem Luberon wird monatelang mit\nPfirsichen und Pfirsichblättern eingewässert, dann mit Zucker und weiteren\nAromen angereichert, abschließend gefiltert und abgefüllt. Nach rund einem Jahr\nProduktion ist der Aperitif mit knapp 15 Prozent Alkoholgehalt fertig.\nRinquinquin ist süß und klebrig, wie der Sommer in Südfrankreich. Und er ist wandelbar. Ob eiskalt und pur, mit Tonic auf Eis oder\nmit Gin, Zuckersirup, Thymian und Zitronensaft zu einem frischen Cocktail\ngemischt – c&#x27;est l&#x27;art de vivre!\nHinweis: In einer früheren Version dieses Textes hieß es, die Stadt Bormes-les-Mimosas liege im südwestlichen Zipfel Frankreichs. Die Stadt liegt im Südosten. Die Textstelle haben wir angepasst."}, {"id": "s032", "type": "LinkE", "definition": "Discourse link error: statements are linked wrongly, for example a wrong order in time or a wrong cause.", "original": "Friedrich Merz warnt vor einem Erfolg rechtsgerichteter Parteien in den Wahlen 2029 und 2033 in Deutschland, falls kein politischer Kurswechsel in der Wirtschafts- und Migrationspolitik erfolgt. Er betont, dass er im Falle eines Wahlsiegs der Union einen solchen Wechsel durchsetzen will, den mögliche Koalitionspartner mittragen müssen. Merz warnt davor, Rechtspopulisten hoffähig zu machen, <del>und<\/del> betont, dass es mit ihm keine Zusammenarbeit mit der AfD geben wird. Markus Söder unterstützt Merz als Kanzlerkandidaten und warnt vor einem schleichenden Abstieg des Landes beim Wohlstand, der die Demokratie gefährden könnte.", "modified": "Friedrich Merz warnt vor einem Erfolg rechtsgerichteter Parteien in den Wahlen 2029 und 2033 in Deuts const KEY = "annotation-" + NAME;
const QUESTIONS = [
  {id: "q1", text: "1. How many changes are there?", hint: "Several words can be one change, if they belong to one error. A second, unrelated edit is \"more than one\".", opts: ["one", "none", "more than one"]},
  {id: "q2", text: "2. Is the change of the asked error type?", hint: "For faithfulness types the changed statement must also be wrong compared to the article. A weaker but still true statement is \"no\".", opts: ["yes", "no", "unclear"]},
  {id: "q3", text: "3. Is the changed part correct German?", hint: "Grammar and spelling of the changed or added words.", opts: ["yes", "no"]},
  {id: "q4", text: "4. How severe is the error?", hint: "high: changes the main claim. medium: a wrong secondary fact. low: a small detail. For coverage types: how important is the deleted sentence, or how much does the added sentence distract.", opts: ["low", "medium", "high"]},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

// Which questions need an answer: none after "none" in question 1, and no German check for GramE (it is wrong on purpose).
function asked(item, a) {
  return QUESTIONS.filter(q => q.id === "q1" || (a.q1 !== "none" && !(q.id === "q3" && item.type === "GramE")));
}
function complete(item) {
  const a = answers[item.id] || {};
  return asked(item, a).every(q => a[q.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const need = asked(item, a).map(q => q.id);
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Output ${pos + 1} of ${ITEMS.length} · ${done} done`;
  let h = `<div class="type">Asked error type: <b>${item.type}</b><br>${item.definition}</div>`;
  h += `<h2>Modified summary (new words marked)</h2><div class="text">${item.modified}</div>`;
  h += `<h2>Original summary (removed words marked)</h2><div class="text">${item.original}</div>`;
  h += `<h2>Article</h2><details><summary>${item.title || "Show the article"}</summary><div class="article">${item.article}</div></details>`;
  for (const q of QUESTIONS) {
    const on = need.includes(q.id);
    h += `<div class="q${on ? "" : " skip"}"><p>${q.text}</p><small>${on ? q.hint : "Not needed for this output."}</small><div class="opts">`;
    for (const o of q.opts) h += `<button data-q="${q.id}" data-o="${o}" class="${a[q.id] === o && on ? "on" : ""}" ${on ? "" : "disabled"}>${o}</button>`;
    h += `</div></div>`;
  }
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All outputs done.</span>' : `${ITEMS.length - done} outputs left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {}, row = {};
    for (const q of asked(item, a)) if (a[q.id]) row[q.id] = a[q.id];
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  const id = ITEMS[pos].id;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: b.dataset.o});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
render();
