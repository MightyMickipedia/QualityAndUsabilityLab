const ITEMS = [{"id": "s008", "summary": "Die chinesische Regierung erwägt angeblich den Verkauf der US-Sparte von TikTok an Elon Musk, um einem Verbot in den USA zu entgehen.\n\nTikTok soll am 19. Januar aus den App-Stores von Apple und Google verbannt werden, wenn die US-Sparte nicht bis dahin verkauft wird.\n\nDer potenzielle Verkauf an den Tech-Milliardär wurde von <del title=\"removed\">TikTok<\/del> <ins>ihr<\/ins> als &quot;reine Fiktion&quot; abgestritten.\n\nEin Verbot der populären App stößt sowohl bei Nutzern als auch auf beiden Seiten des politischen Spektrums auf Widerstand.\n\nZwei demokratische Abgeordnete drängen den Kongress und Präsident Joe Biden, die Frist zu verlängern, um ein Verbot zu vermeiden.", "original": "Die chinesische Regierung erwägt angeblich den Verkauf der US-Sparte von TikTok an Elon Musk, um einem Verbot in den USA zu entgehen.\n\nTikTok soll am 19. Januar aus den App-Stores von Apple und Google verbannt werden, wenn die US-Sparte nicht bis dahin verkauft wird.\n\nDer potenzielle Verkauf an den Tech-Milliardär wurde von TikTok als &quot;reine Fiktion&quot; abgestritten.\n\nEin Verbot der populären App stößt sowohl bei Nutzern als auch auf beiden Seiten des politischen Spektrums auf Widerstand.\n\nZwei demokratische Abgeordnete drängen den Kongress und Präsident Joe Biden, die Frist zu verlängern, um ein Verbot zu vermeiden.", "title": "", "article": "Chinesische Behörden ziehen einem Bericht zufolge den Verkauf des US-Geschäfts von TikTok an Techmilliardär und Trump-Berater Elon Musk in Betracht. Das berichtet die Agentur Bloomberg unter Berufung auf mit der Angelegenheit vertraute Personen. TikTok soll am 19. Januar laut Gesetz in den USA aus den App-Stores von Apple und Google verbannt werden, wenn die US-Sparte der App bis dahin nicht vom chinesischen Inhaber ByteDance verkauft wurde. Außerdem soll der Zugang über Webbrowser verhindert werden. TikTok bezeichnete die Berichte um einen Verkauf an Tesla-Chef Elon Musk, dem auch der Kurznachrichtendienst X (ehemals Twitter) gehört, gegenüber der britischen BBC als &quot;reine Fiktion&quot;.\nDer erzwungene Verkauf oder das Verbot der von 170 Millionen Amerikanern genutzten App stieß nicht nur bei Nutzern, sondern auch auf beiden Seiten des politischen Spektrums auf Widerstand. Zwei demokratische Abgeordnete drängten den Kongress und Präsident Joe Biden am Montag, die Frist zu verlängern. &quot;Ein Verbot würde ein einzigartiges Informations- und Kultursystem zerschlagen und Millionen von Menschen zum Schweigen bringen&quot;, sagte Senator Edward Markey.\nEin TikTok-Verbot habe schwerwiegende Folgen für Millionen von Amerikanern, die auf die App für soziale Kontakte und ihren wirtschaftlichen Lebensunterhalt angewiesen seien. Der designierte Präsident Donald Trump hatte den Obersten Gerichtshof gebeten , die Umsetzung des Gesetzes zu verzögern, um nach seinem Amtsantritt am 20. Januar Zeit für eine &quot;politische Lösung&quot; des Problems zu haben.\nTikTok-Nutzer in den USA wollen sich darauf aber nicht offenbar verlassen und suchen bereits nach Alternativen. Eine scheint das ebenfalls chinesische Netzwerk Xiaohongshu zu sein, das unter dem englischen Namen Red Note bekannt ist. Die App zählte am Montag zu den am meisten heruntergeladenen Anwendungen im App-Store des US-Tech-Giganten Apple. Laut der US-Zeitung USA Today ähnelt das Layout von Red Note dem der Anwendung Pinterest und werde oft als chinesische Version von Instagram bezeichnet."}, {"id": "s010", "summary": "Südkoreas Polizei und die Antikorruptionsbehörde haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen, nachdem er sich geweigert hatte, zur Vernehmung zu erscheinen. Yoon ist das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde. <del title=\"removed\">Er<\/del> <ins>Ihn<\/ins> wird wegen Machtmissbrauchs und Aufruhrs untersucht, nachdem er kurzzeitig das Kriegsrecht ausgerufen hatte. Trotzdem verteidigt Yoon diese Maßnahme als legitim und kündigt an, bis zum Ende zu kämpfen.", "original": "Südkoreas Polizei und die Antikorruptionsbehörde haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen, nachdem er sich geweigert hatte, zur Vernehmung zu erscheinen. Yoon ist das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde. Er wird wegen Machtmissbrauchs und Aufruhrs untersucht, nachdem er kurzzeitig das Kriegsrecht ausgerufen hatte. Trotzdem verteidigt Yoon diese Maßnahme als legitim und kündigt an, bis zum Ende zu kämpfen.", "title": "", "article": "Südkoreas Polizei und Mitarbeiter der Antikorruptionsbehörde (CIO) haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen. Yoon sei am \nMittwochmorgen aus seinem Wohnsitz abgeführt worden, um ihn zur Staatsanwaltschaft zu \nbringen, berichtete Südkoreas amtliche Nachrichtenagentur Yonhap. Damit ist Yoon das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde.\nYoon soll wegen der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember vernommen werden, hatte sich bisher aber geweigert, zur Vernehmung zu erscheinen. Ein erster Versuch, einen Haftbefehl umzusetzen, war Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert . An der nun erfolgreichen Festnahme waren Tausende Einsatzkräfte beteiligt.\n\nMit Leitern in Yoons Residenz\n\nEinigen Polizisten gelang es Beobachtern zufolge, mithilfe von Leitern in die Residenz einzudringen. Zunächst kam es zu gewalttätigen Auseinandersetzungen, wie die südkoreanische Nachrichtenagentur Yonhap berichtete.\nYoons Anwälte hatten bekannt gegeben, dieser sei bereit, bei der Behörde zu erscheinen. &quot;Präsident Yoon hat entschieden, \nheute persönlich bei der Korruptionsermittlungsbehörde zu erscheinen&quot;, schrieb Yoons Anwalt Seok Dong Hyeon auf Facebook. Yoon werde überdies später \nam Tag eine Rede halten, schrieb Seok weiter.\nGegen Yoon Suk Yeol wird wegen Machtmissbrauchs und Aufruhrs ermittelt, nachdem er am 3. Dezember im Zuge eines Haushaltsstreits mit der Opposition kurzzeitig das Kriegsrecht ausgerufen hatte. Das Parlament stimmte daraufhin für seine Amtsenthebung. In den kommenden Wochen prüft das Verfassungsgericht nun diese Entscheidung.\nYoon, der sich wochenlang in seiner Residenz verschanzt hatte, verteidigte die Ausrufung des Kriegsrechts als legitime Maßnahme, nachdem die Opposition in einem Haushaltsstreit Yoons politische Pläne im Parlament verhindert hatte. Er werde gegen die Versuche, ihn aus dem Amt zu drängen, &quot;bis zum Ende kämpfen&quot;, sagte Yoon. Als Reaktion auf die Ausrufung des Kriegsrechts demonstrierten Zehntausende Menschen gegen Yoon und für den Erhalt der Demokratie in Südkorea, aber auch Unterstützer Yoons organisierten Proteste."}, {"id": "s025", "summary": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. <ins>Der Haftbefehl war am 5. Januar erlassen worden.<\/ins> Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen Machtmissbrauchs und Aufruhrs angeklagt werden.", "original": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen rsuche, ihn aus dem Amt zu drängen, &quot;bis zum Ende kämpfen&quot;, sagte Yoon. Als Reaktion auf die Ausrufung des Kriegsrechts demonstrierten Zehntausende Menschen gegen Yoon und für den Erhalt der Demokratie in Südkorea, aber auch Unterstützer Yoons organisierten Proteste."}, {"id": "s007", "summary": "Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;. <del title=\"removed\">Die<\/del> <ins>Der<\/ins> Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "original": "Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;. Die Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "title": "&quot;Biodeutsch&quot; ist Unwort des Jahres 2024", "article": "&quot;Biodeutsch&quot; ist das Unwort des Jahres 2024. Das Wort werde vor allem in den Sozialen Medien in rassistischer und nationalistischer Weise gebraucht, teilte die Jury der Sprachaktion in Marburg zur Begründung ihrer Wahl mit. &quot;Die mit dem Gebrauch von biodeutsch einhergehende Unterteilung in angeblich &#x27;echte&#x27; Deutsche und in Deutsche zweiter Klasse ist eine Form von Alltagsrassismus&quot;, erklärte die Jury. Mehr in Kürze hier auf ZEIT ONLINE"}, {"id": "s005", "summary": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während <del title=\"removed\">die Inflation<\/del> <ins>er<\/ins> sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "original": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während die Inflation sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "title": "", "article": "Der bedeutendste deutsche Aktienindex Dax         hat\nerstmals die 20.000-Punkte-Marke überstiegen. Der deutsche\nLeitindex stieg in der Spitze um 0,4 Prozent auf\n20.003,50 Zähler. Innerhalb nur eines Jahres ist der Dax damit \num rund 3.000 Zähler gestiegen. Erst Mitte September hatte er die \nMarke von 19.000 Punkten übertroffen , zuvor Mitte März die von 18.000 .\nGrund dafür sind laut Börsenexperten die Hoffnung auf vorerst weiter sinkende Zinsen in den USA und\nin der Euro-Zone, die für mehr Konsum und Investitionen sorgen . Angesichts der zuletzt deutlich gefallenen Inflation setzen Anleger \noffenbar darauf, dass die Notenbanken die Leitzinsen weiter senken. Das ist positiv für Aktienkäufer, weil Unternehmen dann im besten Fall wachsen und mehr wert werden.\nRekorde auch bei US-Indizes\nSeit\nJahresbeginn legte der Dax bereits 16 Prozent zu. Auch wegen der positiven Entwicklungen an der Wall Street steigt der Dax: Die beiden dort bedeutenden Aktienindexe S&amp;P\n500 und Nasdaq-Composite erreichten zu\nWochenbeginn einen neuen Schlussrekord. Auch die Wahl Donald Trumps zum neuen US-Präsidenten lässt die Wall Street auf mehr Gewinne hoffen , da Trump Steuersenkungen, Zölle und weniger Regulierungen versprochen hat.\nDie Wall Street entwickelt sich also bereits länger positiv, der Dax scheint den Zahlen zufolge nun nachzuziehen. Gleichzeitig steht die Entwicklung an den Börsen in Kontrast zur eher schwierigen\nWirtschaftslage in Deutschland . Doch Investoren richten sich oft eher nach künftigen Gewinnen. Zudem sind die meisten der 40 Konzerne, aus denen der Dax gespeist wird, international aufgestellt."}, {"id": "s019", "summary": "Die Feuerwehr in Kalifornien hat nach langen und heftigen Waldbränden erste Erfolge erzielt, aber Meteorologen warnen vor weiteren Böen am Wochenende.\n\nUnd hier sind die nächsten vier Sätze:\n\nDie Rettungskräfte haben offenbar eine Pause bei den heftigen Winden genutzt, die die Brände angefacht hatten. Meteorologen warnen <del title=\"removed\">jedoch<\/del> <ins>deshalb<\/ins> davor, dass starke Böen zurückkehren könnten und die Situation weiter verschlimmern. Die Bedingungen mit niedriger Luftfeuchtigkeit und trockener Vegetation sind immer noch kritisch, aber eine Abschwächung der Winde könnte den Feuerwehrleuten entscheidende Unterstützung aus der Luft bringen. Insgesamt haben fünf Brandherde im Bezirk Los Angeles auf einer Fläche von rund 13.750 Hektar gewütet, bei denen fast 10.000 Gebäude zerstört und mindestens zehn Menschen ums Leben gekommen sind.", "original": "Die Feuerwehr in Kalifornien hat nach langen und heftigen Waldbränden erste Erfolge erzielt, aber Meteorologen warnen vor weiteren Böen am Wochenende.\n\nUnd hier sind die nächsten vier Sätze:\n\nDie Rettungskräfte haben offenbar eine Pause bei den heftigen Winden genutzt, die die Brände angefacht hatten. Meteorologen warnen jedoch davor, dass starke Böen zurückkehren könnten und die Situation weiter verschlimmern. Die Bedingungen mit niedriger Luftfeuchtigkeit und trockener Vegetation sind immer noch kritisch, aber eine Abschwächung der Winde könnte den Feuerwehrleuten entscheidende Unterstützung aus der Luft bringen. Insgesamt haben fünf Brandherde im Bezirk Los Angeles auf einer Fläche von rund 13.750 Hektar gewütet, bei denen fast 10.000 Gebäude zerstört und mindestens zehn Menschen ums Leben gekommen sind.", "title": "", "article": "Im Kampf gegen\ndie schwersten Waldbrände in der Geschichte Kaliforniens hat die Feuerwehr offenbar erste Erfolge erzielt. Eigenen Angaben zufolge kam den Rettungskräften dabei eine\nPause bei den heftigen Winden zugute, die die Feuer angefacht\nhatten. Meteorologen warnen jedoch davor, dass starke Böen am\nWochenende zurückkehren könnten.\nDie Windverhältnisse im Gebiet\nvon Los Angeles werden sich nach Angaben des Nationalen\nWetterdienstes bis zum Wochenende verbessern. &quot;Es\nist nicht mehr so böig, was den Feuerwehrleuten hoffentlich\nhelfen wird&quot;, sagte die NWS-Meteorologin Allison Santorelli. Die\nBedingungen mit niedriger Luftfeuchtigkeit und trockener\nVegetation seien aber immer noch kritisch.\nEine Abschwächung der Winde dürfte den Feuerwehrleuten am\nBoden entscheidende Unterstützung aus der Luft bringen, da die\nFlugzeuge Wasser und Löschmittel auf die brennenden Hügel\nabwerfen können. &quot;Es gibt ein paar gute Nachrichten, wenn\nüberhaupt&quot;, sagte Santorelli.\nAm Vormittag gab es in Los\nAngeles noch drei größere Brände. Insgesamt hatten fünf\nBrandherde im Bezirk Los Angeles auf einer Fläche von rund\n13.750 Hektar – so groß wie rund 19.000 Fußballfelder – gewütet. Bislang wurden fast 10.000 Gebäude zerstört , 180.000 Personen\nmussten die gefährdeten Gebiete verlassen. Inzwischen sind\nmindestens zehn Menschen bei den Bränden ums Leben gekommen. Der\nprivate Wetter-Vorhersagedienst AccuWeather schätzte den Schaden\nund den wirtschaftlichen Verlust durch die Brände auf 135 bis\n150 Milliarden Dollar.\n\nAusgangssperren wegen Plünderungen\n\nIn den Brandgebieten im Großraum Los Angeles mussten Menschen auf \nBehördenanordnung ihre Häuser verlassen. Das Eigentum ist nicht nur \nvom Feuer bedroht, sondern auch von Plünderern. Deshalb haben die \nBehörden teilweise für die Abend- und Nachtstunden eine Ausgangssperre verhängt. Die Ausgangssperren gelten für\n zwei Gebiete. &quot;Sie dürfen sich nicht in diesen \nbetroffenen Gebieten aufhalten. Wenn Sie es doch tun, werden Sie \nverhaftet&quot;, sagte Sheriff Robert Luna bei einer Pressekonferenz. &quot;Wir \ntun das, um die Strukturen und die Häuser zu schützen, die Menschen auf unsere \nAnordnung hin verlassen haben.&quot;\nDie Ausgangssperre \nsei bereits in der vergangenen Nacht in Kraft gewesen und gelte auch \nheute von 18 Uhr bis 6 Uhr (Ortszeit), sagte Luna. Angeordnet ist \nsie für Gebiete, die vom Palisades Fire und Eaton Fire betroffen \nsind."}, {"id": "s030", "summary": "Erstmals in der Geschichte des Vatikans wurde eine Frau, die italienische Ordensschwester Simona Brambilla, zur Leiterin einer großen Vatikanbehörde ernannt. Papst Franziskus beauftragte sie mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens, was mit der Verantwortung einer Ministerin vergleichbar ist. Brambilla, eine Missionarin, Krankenschwester und Doktorin der Psychologie, ist die erste Präfektin des katholischen Kirchenstaates. Diese Ernennung ist Teil von Franziskus&#x27; Bemühungen, Frauen stärker in Kirchenämter einzubeziehen, und folgt auf die Öffnung von Spitzenämtern für Frauen im Vatikan im Jahr <del title=\"removed\">2022.<\/del> <ins>2020.<\/ins>", "original": "Erstmals in der Geschichte des Vatikans wurde eine Frau, die italienische Ordensschwester Simona Brambilla, zur Leiterin einer großen Vatikanbehörde ernannt. Papst Franziskus beauftragte sie mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens, was mit der Verantwortung einer Ministerin vergleichbar ist. Brambilla, eine Missionarin, Krankenschwester und Doktorin der Psychologie, ist die erste Präfektin des katholischen Kirchenstaates. Diese Ernennung ist Teil von Franziskus&#x27; Bemühungen, Frauen stärker in Kirchenämter einzubeziehen, und folgt auf die Öffnung von Spitzenämtern für Frauen im Vatikan im Jahr 2022.", "title": "Papst ernennt erstmals eine Frau zur Leiterin einer Vatikanbehörde", "article": "Erstmals in der Geschichte des Vatikans ist eine Frau zur Leiterin einer großen Vatikanbehörde ernannt worden. Papst Franziskus beauftragte die italienische Ordensschwester Simona Brambilla mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens. Das Amt lässt sich mit der Verantwortung einer Ministerin vergleichen.\nDie 59-Jährige ist laut Angaben des Presseamts die erste Präfektin des katholischen Kirchenstaates. In ihrem Dikasterium hatte sie zuvor bereits als Sekretärin die zweithöchste Position inne, seit 2019 gehörte sie der Behörde an. Das Dikasterium strukturiert, fördert und verwaltet die Institutionen in der katholischen Kirche, die sich dem &quot;geweihten&quot; und dem apostolischen Leben innerhalb der Gemeinschaft widmen.\n\nMissionarin, Krankenschwester und Doktorin der Psychologie\n\nBrambilla ist Teil der Consolata-Missionsschwestern und war früher als Krankenschwester und Missionarin in dem westafrikanischen Staat Mosambik tätig. Zudem hat sie einen Doktortitel in Psychologie. Von 2011 bis Mai 2023 war sie Generalsuperiorin ihrer Ordensgemeinschaft.\nDie Dikasterien im Vatikan sind mit den Ministerien in einer Regierung vergleichbar. Sie werden nicht von einem Minister, sondern von einem Präfekten geleitet. Der zweite Rang, der in einem Ministerium von einem Staatssekretär bekleidet wird, heißt im Vatikan Sekretär. In seiner Arbeit wird dieser von Untersekretären unterstützt.\nIn der Katholischen Kirche gibt es immer wieder Diskussionen darüber, Frauen mehr an Kirchenämtern zu beteiligen, insbesondere über die Weihe von Frauen zu Diakoninnen oder später einmal auch zu Priesterinnen. Dazu brachte auch die jüngste Weltsynode unter Leitung des Papstes keinen Durchbruch.\n\nKurienreform 2022 öffnete Spitzenämter für Frauen\n\nFranziskus vergab in seinem mittlerweile zwölf Jahre andauernden Pontifikat bisher zweimal hochrangige Ämter an Frauen. 2016 ernannte er die italienische Kunsthistorikerin Barbara Jatta zur Direktorin der Vatikanischen Museen, einer der wichtigsten Einnahmequellen des Kirchenstaats. 2022 wurde die italienische Ordensschwester Raffaella Petrini im Vatikan Generalsekretärin – ein Amt, das üblicherweise ein Bischof innehatte.\nBis 2022 war es nur Bischöfen – und somit nur Männern – möglich, die Leitung einer Vatikanbehörde zu übernehmen. Mit seiner Kurienreform vor zwei Jahren öffnete der Papst diese Ämter dann auch für Katholikinnen und Katholiken ohne Bischofstitel. Die Katholische Kirche zählt weltweit rund 1,4 Milliarden Mitglieder."}, {"id": "s029", "summary": "FDP-Generalsekretär Bijan Djir-Sarai tritt nach Skandal um Ampelkoalitions-Austritt <ins>mit sofortiger Wirkung<\/ins> zurück; er habe von Strategiepapier keine Kenntnis gehabt und die Öffentlichkeit unwissentlich falsch informiert.", "original": "FDP-Generalsekretär Bijan Djir-Sarai tritt nach Skandal um Ampelkoalitions-Austritt zurück; er habe von Strategiepapier keine Kenntnis gehabt und die Öffentlichkeit unwissentlich falsch informiert.", "title": "", "article": "FDP-Generalsekretär Bijan Djir-Sarai hat in Folge des Skandals um den Austritt der FDP aus der Ampelkoalition sein Amt niedergelegt. Er habe von dem am Donnerstag veröffentlichten Strategiepapier &quot;keine Kenntnis&quot; gehabt und die Öffentlichkeit infolgedessen &quot;unwissentlich falsch informiert&quot;, sagte er in einer kurzen Stellungnahme in der FDP-Parteizentrale in Berlin. Für einen solchen Vorgang der der Generalsekretär verantwortlich. Um Schaden von seiner Partei und seiner Glaubwürdigkeit abzuwenden, habe er die Parteiführung daher über seinen Rücktritt informiert.\nDjir-Sarai zieht damit letztlich die Konsequenzen aus den &quot;D-Day&quot;-Enthüllungen, wonach die Partei gezielt und länger vorbereitet den Austritt aus der Ampelkoalition geplant hatte. Nachdem eine Recherche der ZEIT die Planung des Regierungsbruches durch die FDP öffentlich gemacht hatte, hatte die FDP am Donnerstag selbst Dateien zu besagter Planung veröffentlicht. Darin ist von einem &quot;D-Day&quot; die Rede, an dem die FDP aus der Koalition austritt. In der Folge wird von einer &quot;Feldschlacht&quot; gesprochen, um den Schritt offensiv zu kommunizieren.\nDie FDP hatte nach der ZEIT-Veröffentlichung versucht, die Enthüllungen herunterzuspielen, die Berichte aber grundsätzlich nicht dementiert. Djir-Sarai hatte allerdings in einem TV-Interview dementiert, dass in dem Zusammenhang der Begriff &quot;D-Day&quot; verwendet wurde, den die Alliierten im Zweiten Weltkrieg für den Tag der Landung in der Normandie verwendet hatten. Kritiker hatten der FDP daraufhin vorgeworfen, Olaf Scholz indirekt mit Adolf Hitler verglichen zu haben. Auch andere Liberale hatten das Vorgehen der Partei zunächst verteidigt.\nNach den Veröffentlichungen von Donnerstag war allerdings auch aus der Partei Kritik an dem Vorgehen gekommen. Die Vorsitzende der Jungen Liberalen hatte Djir-Sarai daraufhin zum Rücktritt aufgefordert. &quot;Als Generalsekretär trägt Bijan Djir-Sarai die politische Verantwortung für die Inhalte und die Ausrichtung der Partei. Um weiteren Schaden von der Partei abzuwenden, habe ich Bijan Djir-Sarai als JuLi-Bundesvorsitzende dazu aufgefordert, von seinem Amt zurückzutreten&quot;, hatte die Vorsitzende der Jungen Liberalen, Franziska Brandmann, auf X geschrieben.\nKnapp drei Monate vor der Bundestagswahl steht die FDP somit ohne Generalsekretär da, der üblicherweise für die Organisation des Wahlkampfs zuständig ist. Als möglicher Nachfolger wird der ehemalige Bundesjustizminister Marco Buschmann gehandelt. Djir-Sarai hatte das Amt im April 2022 offiziell von Volker Wissing übernommen, der in der Ampelkoalition Verkehrsminister geworden war. Seit Amtsübernahme der Ampel hatte Djir-Sarai das Amt bereits kommissarisch übernommen.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s001", "summary": "Der rbb <del title=\"removed\">hat<\/del> <ins>wird<\/ins> sämtliche Beiträge zu Belästigungsvorwürfen gegen den Grünenbundestagsabgeordneten Stefan Gelbhaar zurückgezogen, da Zweifel an der Identität der beschuldigenden Frau bestehen.\nEs wird vermutet, dass eine Grünenbezirkspolitikerin unter falschem Namen die Vorwürfe erhoben hat.\nGelbhaar bestreitet die Anschuldigungen und spricht von einer geplanten Aktion gegen ihn.\nDie Berliner Grünen fordern, Falschaussagen konsequent zu ahnden, und erwägen auch parteirechtliche Schritte.\nEhemalige Parteimitglieder wie Kerstin Müller unterstützen Gelbhaar und vermuten eine Intrige, um ihn zu schaden.", "original": "Der rbb hat sämtliche Beiträge zu Belästigungsvorwürfen gegen den Grünenbundestagsabgeordneten Stefan Gelbhaar zurückgezogen, da Zweifel an der Identität der beschuldigenden Frau bestehen. Es wird vermutet, dass eine Grünenbezirkspolitikerin unter falschem Namen die Vorwürfe erhoben hat. Gelbhaar bestreitet die Anschuldigungen und spricht von einer geplanten Aktion gegen ihn. Die Berliner Grünen fordern, Falschaussagen konsequent zu ahnden, und erwägen auch parteirechtliche Schritte. Ehemalige Parteimitglieder wie Kerstin Müller unterstützen Gelbhaar und vermuten eine Intrige, um ihn zu schaden.", "title": "", "article": "Der Sender rbb hat nach eigenen Angaben sämtliche Beiträge,\nin denen es um Belästigungsvorwürfe gegen den Grünenbundestagsabgeordneten Stefan\nGelbhaar geht, zurückgezogen. Es gebe Zweifel an der Identität einer Frau,\ndie zentrale Vorwürfe gegen Gelbhaar erhoben habe, teilte der Sender mit . &quot;Mit hoher\nWahrscheinlichkeit existiert diese Frau gar nicht.&quot;\nWeitere Recherchen hätten zu einer\nGrünenbezirkspolitikerin geführt, die sich als die betroffene Frau ausgegeben\nhaben und unter falschem Namen die eidesstattliche Versicherung abgegeben haben\nsoll. Der Sender erstattete Strafanzeige gegen die Politikerin.\n\nGelbhaar bestreitet Vorwürfe\n\n&quot;Nicht alle Vorwürfe, über die wir berichtet haben,\nsind damit automatisch nichtig – ein wesentlicher Vorwurf allerdings\nschon&quot;, teilte der rbb mit. Der Sender hatte auf Grundlage mehrerer eidesstattlicher Versicherungen\n von Frauen über die Vorwürfe gegen Gelbhaar berichtet. Zudem gab es demnach anonyme \nMeldungen an die Ombudsstelle der Grünen.\nGelbhaar hatte zuvor die Vorwürfe\ngegen ihn bestritten und ging von einer &quot;geplanten Aktion&quot; gegen\nseine Person aus, wie er auf seiner Website schrieb.\nDie Spitze der Berliner\nGrünen zeigte sich &quot;erschüttert über den Bericht des rbb&quot; und fordert, etwaige Falschaussagen konsequent zu ahnden. &quot;Eine falsche eidesstattliche Erklärung abzugeben ist\neine Straftat&quot;, zitiert die Nachrichtenagentur dpa die Landesvorsitzenden Nina Stahr und Philmon Ghirmai. Auch parteirechtlich könnte es Folgen\ngeben: &quot;Wenn sich der Vorwurf bewahrheitet und klar ist, wer die betroffene\nPerson ist, werden wir auch parteirechtliche Schritte einleiten.&quot;\nKerstin Müller, ehemalige Vorsitzende der Grünenbundestagsfraktion und inzwischen einfaches Parteimitglied in Berlin-Pankow, stellte sich hinter Stefan Gelbhaar. &quot;Es bestätigt sich immer mehr, dass hier wahrscheinlich mit einer Intrige eine nicht genehme Person beschädigt und aus dem Verkehr gezogen werden sollte&quot;, sagte sie dem RedaktionsNetzwerk Deutschland  (RND) . &quot;Es kann kein Zufall sein, dass einen Tag vor der Listenaufstellung die Beschwerden bei der Ombudsstelle auflaufen und das auch noch der Presse gesteckt wird.&quot;\nGelbhaar, der seit 2017 für\ndie Grünen im Bundestag sitzt, war bei einer ersten\nWahlversammlung im November mit 98,4 Prozent der Stimmen zum\nDirektkandidaten gewählt worden. Nachdem Mitte Dezember die Vorwürfe gegen ihn bekannt wurden, setzte der Kreisverband Pankow eine\nWiederholung an . Als neue Direktkandidatin wurde dort Julia Schneider gewählt."}, {"id": "s024", "summary": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende <del title=\"removed\">Trump-Anhänger<\/del> <ins>Biden-Anhänger<\/ins> eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "original": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "title": "Anführer ultrarechter Gruppen aus Gefängnissen entlassen", "article": "Donald Trump hat seinen Amtseid als 47. Präsident der Vereinigten Staaten abgelegt. Es ist bereits seine zweite Amtszeit, er war auch von 2017 bis 2021 US-Präsident.\nDie Zeremonie fand wegen frostiger Temperaturen im Kapitol statt. Den Sitz des US-Kongresses hatten wütende Trump-Anhänger vor vier Jahren gestürmt.\nKurz nach seinem Amtsantritt unterzeichnete Trump zahlreiche Dekrete , die unter anderem eine Begnadigung der Kapitolstürmer, eine Abschaffung des Birthrights und einen Austritt aus dem Pariser Klimaabkommen vorsehen.\nAlle Artikel zum Thema finden Sie auf unserer Themenseite zum neuen US-Präsidenten .\nNeben eigenen Recherchen verwenden wir auch Material der Nachrichtenagenturen dpa, AP, AFP, KNA und Reuters."}, {"id": "s028", "summary": "Erstmals in der Geschichte des Vatikans wurde eine Frau, die italienische Ordensschwester Simona Brambilla, zur Leiterin einer großen Vatikanbehörde ernannt. Papst Franziskus beauftragte sie mit der Leitung des Dikasteriums für die <del title=\"removed\">Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens,<\/del> <ins>Kommunikation,<\/ins> was mit der Verantwortung einer Ministerin vergleichbar ist. Brambilla, eine Missionarin, Krankenschwester und Doktorin der Psychologie, ist die erste Präf rste Spieler, der 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "original": "Im Titelduell zwischen Ding Liren und Herausforderer Gukesh steht es nach dem vierten Remis in Serie weiterhin unentschieden, 3,5 zu 3,5. Gukesh überraschte Ding mit einem Turmmanöver, doch Ding rettete sich mit einer kunstvollen Verteidigung. Das WM-Duell ist auf bis zu vierzehn Partien angesetzt, der erste Spieler, der 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "title": "", "article": "Am Dienstag überraschte Gukesh den Weltmeister Ding Liren im 7. Zug mit einem Turmmanöver. Ding war geschockt, wie er später sagte, doch er rettete sich dank einer kunstvollen Verteidigungsleistung. Es war das vierte Remis in Serie. Damit steht es \nim Titelduell zwischen Ding Liren und\n dem Herausforderer Gukesh weiter unentschieden, 3,5 zu 3,5. Angesetzt\n ist das WM-Duell auf bis zu vierzehn \nPartien. Für jeden Sieg gibt es einen Punkt, für jedes Remis einen \nhalben. Weltmeister wird der Spieler, der zuerst 7,5 Punkte erreicht.\nBei uns können Sie alle Partien mit den Experten von chess.com live verfolgen, hier ab 10 Uhr die achte Partie dieser WM.\nUnser Reporter Ulrich Stock schreibt vom Ort des Geschehens. Alle Texte aus Singapur lesen Sie hier . Der Großmeister Niclas Huschenbeth liefert für ZEIT ONLINE Videoanalysen aller Partien zu."}];

  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
