const NAME = "Malte";
const ITEMS = [{"id": "s021", "summary": "<del title=\"removed\">Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten.<\/del> Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber zuversichtlich, dass eine Lösung gefunden wird.", "original": "Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten. Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber zuversichtlich, dass eine Lösung gefunden wird.", "title": "SPD-Politiker werfen Olaf Scholz Blockade der Ukrainehilfen vor", "article": "Mehrere SPD-Politiker haben Bundeskanzler Olaf Scholz&#x27; Weigerung kritisiert, noch vor der Bundestagswahl weitere Unterstützung für die Ukraine in Höhe von drei Milliarden Euro für Waffenlieferungen auf den Weg zu bringen. Kriege richteten sich nicht nach Wahlen, zitiert der Spiegel den SPD -Haushalts- und Verteidigungspolitiker Andreas Schwarz: &quot;Wenn es unter den demokratischen Kräften im Bundestag eine Mehrheit gibt für ein zusätzliches Hilfspaket für die Ukraine, sollten wir das noch vor der Bundestagswahl beschließen.&quot;\nSchwarz forderte einen Schulterschluss im Parlament auch mit CDU und CSU: &quot;Allerdings sollte sich dann auch die Union klar dazu bekennen, die überplanmäßige Ausgabe von drei Milliarden Euro mitzutragen&quot;, sagte er. Schwarz ist im Haushaltsausschuss Berichterstatter für den Etat des Verteidigungsministeriums und das Sondervermögen Bundeswehr und gehört als stellvertretendes Mitglied dem Verteidigungsausschuss an.\nScholz lehnt Einsparungen an anderer Stelle für die Finanzierung weiterer Waffenlieferungen in die Ukraine ab.\nSchäfer: Nicht auf Zeit spielen\nDer SPD-Verteidigungspolitiker Kristian Klinck sagte dem Magazin, nur die Kombination aus Unterstützung der Ukraine und Diplomatie werde einen stabilen Waffenstillstand näherbringen. &quot;Ich rate dazu, das Hilfspaket auf den Weg zu bringen.&quot; Ob dies durch eine außerplanmäßige Ausgabe aus dem Bundeshaushalt geschehe oder durch die Nutzung des von den G7-Staaten zur Verfügung gestellten Kredits geschehe, &quot;sollte aufgrund rein sachlicher Erwägungen entschieden werden&quot;.\nDer Grünenpolitiker Sebastian Schäfer forderte Scholz und den SPD-Fraktionsvorsitzenden Rolf Mützenich auf, ihre Blockadehaltung zu überdenken. &quot;In dieser Frage auf Zeit zu spielen, ist angesichts der Lage in der Ukraine schlicht verantwortungslos&quot;, sagte Schäfer, der Mitglied im Haushaltsausschuss und stellvertretender Vorsitzender des Gremiums zum Sondervermögen für die Bundeswehr ist.\nVerteidigungsminister Boris Pistorius nahm seinen Parteifreund Scholz hingegen in Schutz. &quot;Ich sehe keinerlei Grund anzunehmen, dass der Bundeskanzler hier bremst&quot;, sagte er in den ARD- Tagesthemen . Pistorius verwies darauf, dass es für 2025 noch keinen regulären Bundeshaushalt gebe und der Bund daher mit einer vorläufigen Haushaltsführung agiere. &quot;Es ist nicht trivial, das Geld aufzutreiben&quot;, sagte er im heute-journal des ZDF. Zudem zeigte Pistorius sich zuversichtlich, dass zeitnah eine Lösung gefunden werde. Er hoffe darauf in den nächsten Tagen, sagte er."}, {"id": "s027", "summary": "Die bekannte Psychologin Stefanie Stahl ist zu Gast bei Alles gesagt?, dem unendlichen Podcast, wo sie über Neurosen, Einsamkeit, Selbstreflexion, Rechtspopulismus und mehr spricht. <ins>Ein Podcast ist ein digitales Audioformat.<\/ins> Stahl, geboren 1963 in Hamburg, ist Autorin des Bestsellers &quot;Das Kind in dir muss Heimat finden&quot; und Gastgeberin des Podcasts &quot;Stahl aber herzlich&quot;. In der 4-stündigen Folge teilt sie ihre Erfahrungen mit Patienten, analysiert die Gesellschaft in Deutschland und betont, dass Männer ihre schwierigste Zielgruppe sind.", "original": "Die bekannte Psychologin Stefanie Stahl ist zu Gast bei Alles gesagt?, dem unendlichen Podcast, wo sie über Neurosen, Einsamkeit, Selbstreflexion, Rechtspopulismus und mehr spricht. Stahl, geboren 1963 in Hamburg, ist Autorin des Bestsellers &quot;Das Kind in dir muss Heimat finden&quot; und Gastgeberin des Podcasts &quot;Stahl aber herzlich&quot;. In der 4-stündigen Folge teilt sie ihre Erfahrungen mit Patienten, analysiert die Gesellschaft in Deutschland und betont, dass Männer ihre schwierigste Zielgruppe sind.", "title": "Podcast &quot;Alles gesagt?&quot;: Stefanie Stahl, was will das Kind in uns?", "article": "Die bekannteste Psychologin Deutschlands, die Bestsellerautorin und Podcasterin Stefanie Stahl ist zu Gast bei Alles gesagt?, dem unendlichen Podcast.\nStefanie Stahl spricht über Neurosen und Einsamkeit, Selbstreflexion und Rechtspopulismus, Hausgeister und Psychotainment, über ihre, wie sie sagt, &quot;unspießigen Eltern&quot; – und über ihre glückliche Kindheit, die schlagartig vorbei war, als das Haus ihrer Eltern abbrannte.\nStefanie Stahl wurde 1963 in Hamburg geboren, sie heißt mit zweitem Vornamen Desiree, &quot;weil ich ein Wunschkind war&quot;. Stahl lebt seit ihrem Studium in den 1980er-Jahren in Trier. Seit 1994 führt sie dort eine Praxis für Psychotherapie. Ihr Buch Das Kind in dir muss Heimat finden erschien 2015 und wurde zu einem der erfolgreichsten Sachbücher der vergangenen zehn Jahre, es hat sich bis mehr als 3,8 Millionen mal verkauft und wurde in 36 Ländern veröffentlicht. Seit 2021 ist sie auch Gastgeberin des Podcast Stahl aber herzlich .\nIm Podcast erzählt Stefanie Stahl von ihren Erfahrungen mit Patientinnen und Patienten, den psychologischen Folgen der Pandemie, gestressten Kindern und jungen Eltern, von ihrer Analyse der Gesellschaft in Deutschland, und sie beantwortet die Frage, ob wir in unserem Leben immer dieselbe Person sind. Ihre schwierigste Zielgruppe? &quot;Männer.&quot; Nach 4 Stunden und 40 Minuten beendet Stefanie Stahl das Gespräch, denn das kann bei Alles gesagt? nur die Gästin.\nProduktion: Pool Artists Redaktion: Hannah Schraven, Vincent Mank, Sophie Hübner, Sophia Hubel Gästemanagement: Anna Vahldick\nAlle Folgen unseres Podcasts finden Sie hier . Fragen, Kritik, Anregungen? Schreiben Sie eine Mail an allesgesagt@zeit.de ."}, {"id": "s014", "summary": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle. Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab. <ins>Die nächste Erhebung des Politbarometers ist für die Woche nach der Bundestagswahl vorgesehen.<\/ins>", "original": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle. Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s003", "summary": "Die EU-Kommission ermöglicht unter bestimmten Voraussetzungen direkte staatliche Subventionen zur Strompreissenkung für energieintensive Unternehmen, um die Einführung eines Industriestrompreises zu ermöglichen. <ins>Der Mond umkreist die Erde.<\/ins>\n\nDie Regierungen der 27 EU-Staaten dürfen die Strompreise für energieintensive Branchen wie die Chemieindustrie oder die Zementherstellung deckeln und mit Staatshilfen querfinanzieren, Voraussetzung ist jedoch ein Invest in die Umstellung auf eine klimafreundlichere Produktion.\n\nDie Wettbewerbskommissarin Teresa Ribera sieht das neue Instrument als Möglichkeit, den Klimaschutz voranzutreiben, die Widerstandsfähigkeit Europas zu stärken und sicherzustellen, dass die europäische Industrie weltweit wettbewerbsfähig bleibt.\n\nDieser Artikel wird weiter aktualisiert.", "original": "Die EU-Kommission ermöglicht unter bestimmten Voraussetzungen direkte staatliche Subventionen zur Strompreissenkung für energieintensive Unternehmen, um die Einführung eines Industriestrompreises zu ermöglichen.\n\nDie Regierungen der 27 EU-Staaten dürfen die Strompreise für energieintensive Branchen wie die Chemieindustrie oder die Zementherstellung deckeln und mit Staatshilfen querfinanzieren, Voraussetzung ist jedoch ein Invest in die Umstellung auf eine klimafreundlichere Produktion.\n\nDie Wettbewerbskommissarin Teresa Ribera sieht das neue Instrument als Möglichkeit, den Klimaschutz voranzutreiben, die Widerstandsfähigkeit Europas zu stärken und sicherzustellen, dass die europäische Industrie weltweit wettbewerbsfähig bleibt.\n\nDieser Artikel wird weiter aktualisiert.", "title": "EU-Kommission erlaubt subventionierten Industriestrompreis", "article": "Die EU-Kommission gestattet zukünftig unter bestimmten Voraussetzungen direkte staatliche \nSubventionen zu Strompreissenkung zur Entlastung energieintensiver Unternehmen. Damit ermöglicht die Kommission grundsätzlich die Einführung eines Industriestrompreises, den die \nschwarz-rote Bundesregierung im Koalitionsvertrag angekündigt hatte.\nKonkret dürfen die \nRegierungen der 27 EU-Staaten die \nStrompreise für energieintensive Branchen wie die Chemieindustrie oder \ndie Zementherstellung deckeln und mit Staatshilfen querfinanzieren, teilte die EU-Kommission mit. Voraussetzung ist demnach jedoch, dass die Unternehmen in die Umstellung auf eine \nklimafreundlichere Produktion investieren. &quot;Es ist ein Instrument, um den Klimaschutz voranzutreiben, die Widerstandsfähigkeit Europas\n zu stärken und sicherzustellen, dass unsere Industrie weltweit \nwettbewerbsfähig bleibt&quot;, sagte Wettbewerbskommissarin Teresa Ribera in \nBrüssel.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s018", "summary": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. <ins>Ein Handelsembargo ist ein staatliches Handelsverbot gegen ein anderes Land.<\/ins> Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.", "original": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.", "title": "", "article": "Nach der Ankündigung eines US-Regierungsvertreters, Kuba von der US-Terrorliste zu streichen , hat die Regierung in Havanna die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt.\nDie Entscheidung der Vereinigten Staaten sei ein Schritt in die richtige\n Richtung, komme aber zu spät, kritisierte Außenminister Bruno Rodríguez in einer Mitteilung . \nGleichzeitig forderte er ein Ende des US-Handelsembargos gegen Kuba , das seit 1962 in Kraft ist.\nWie der US-Regierungsvertreter mitgeteilt hatte, soll \ndiese &quot;Geste des guten Willens&quot; die Verhandlungen über die Freilassung \neiner &quot;bedeutenden Zahl politischer Gefangener&quot; befördern. Es bestehe die\n Hoffnung, dass die Freilassung noch vor dem Amtsantritt von Donald \nTrump am kommenden Montag erfolgen könne, dessen Republikanische Partei \ngegenüber den Behörden im kommunistischen Kuba traditionell eine harte \nLinie verfolgt.\nDie katholische Kirche treibe das Abkommen voran, das \nvor allem Menschen betrifft, die bei den regierungskritischen Protesten \nim Sommer 2021 in Kuba festgenommen wurden.\n\nTrump könnte die Entscheidung von Biden zurücknehmen\n\nVor vier Jahren hatte Trump \nKuba auf die US-Liste der Terrorunterstützer gesetzt, auf der auch \nSyrien, der Iran und Nordkorea verzeichnet sind. Nach seinem Amtsantritt\n könnte er die Entscheidung Bidens sofort wieder rückgängig machen.\n&quot;Kuba hätte niemals in die \nwillkürliche Liste der staatlichen Sponsoren des Terrorismus aufgenommen\n werden dürfen&quot;, schrieb Rodríguez auf der Plattform X. Die US-Politik \nder harten Sanktionen gegen Kuba habe schwerwiegende Folgen für die \nBevölkerung von elf Millionen Menschen, schade der Wirtschaft des \nInselstaates und fördere die Migration in die USA.\n\nKuba hatte Hunderte Menschen nach friedlichen Protesten verhaftet\n\nDie\n geplante Freilassung von Häftlingen, die wegen verschiedener Straftaten\n verurteilt worden waren, soll nach Angaben des kubanischen \nAußenministeriums schrittweise erfolgen. Wegen ihrer Teilnahme an \nfriedlichen Protesten sind Hunderte Menschen auf Kuba inhaftiert, unter ihnen auch der deutsche Staatsbürger Luis Frómeta Compte. Wer \nfreikommen dürfte, war zunächst unklar.\nNach offiziellen Angaben wurden in Kuba rund 500 Menschen wegen ihrer \nTeilnahme an den Protesten im Juli 2021 zu Haftstrafen \nverurteilt, die teils bis zu 25 Jahre betrugen. Es waren die größten \nProteste gegen die Regierung in Havanna seit der Kubanischen Revolution \n1959.\nAnfang Januar habe \nStaatspräsident Miguel Díaz-Canel Papst Franziskus in einem Schreiben \nüber die Entscheidung informiert, teilte die kubanische Regierung mit. \nDie Freilassungen seien im Geiste des von der katholischen Kirche \nausgerufenen Jubeljahres 2025 beschlossen worden. Zuvor habe Díaz-Canel \nim Juni 2023 bei einem Besuch im Vatikan mit dem Papst über die \nSituation der Häftlinge und die Auswirkungen der US-Sanktionen \ngesprochen."}, {"id": "s020", "summary": "Die Chefs von SAP und Siemens fordern eine Überarbeitung der europäischen KI-Gesetze, um Innovationen zu fördern. Die KI-Verordnung wird als hinderlich kritisiert, da sie mit bestehenden Gesetzen kollidiert. Siemens plädiert für eine substanzielle Veränderung anstatt eines Moratoriums. <ins>Ein Moratorium ist das zeitlich begrenzte Aussetzen von Gesetzen oder Regeln.<\/ins> US-Konzerne kritisieren fehlende Leitlinien im AI Act. Die EU-Kommission verzögert die Veröffentlichung eines Verhaltenskodex, lehnt jedoch eine Verschiebung des Gesetzes ab.", "original": "Die Chefs von SAP und Siemens fordern eine Überarbeitung der europäischen KI-Gesetze, um Innovationen zu fördern. Die KI-Verordnung wird als hinderlich kritisiert, da sie mit bestehenden Gesetzen kollidiert. Siemens plädiert für eine substanzielle Veränderung anstatt eines Moratoriums. US-Konzerne kritisieren fehlende Leitlinien im AI Act. Die EU-Kommission verzögert die Veröffentlichung eines Verhaltenskodex, lehnt jedoch eine Verschiebung des Gesetzes ab.", "title": "Chefs von Siemens und SAP fordern Umbau europäischer KI-Gesetze", "article": "Die Chefs der deutschen Technologiekonzerne SAP und Siemens fordern eine grundlegende Überarbeitung der europäischen Gesetze zur künstlichen Intelligenz . In einem gemeinsamen Interview mit der Frankfurter Allgemeinen Zeitung plädieren Christian Klein von SAP und Roland Busch von Siemens für ein neues Rahmenwerk. Dieses solle Innovationen fördern, anstatt sie zu behindern.\nDie europäische KI-Verordnung (AI Act) sei einer der Gründe, &quot;warum wir hier nicht Vollgas geben können&quot;, sagte Busch einem Vorabbericht zufolge. Die Regularien seien teilweise widersprüchlich und überschnitten sich mit bestehenden Gesetzen. Die im September dieses Jahres in Kraft tretende Datenverordnung (Data Act) bezeichnete Busch als &quot;toxisch für die Entwicklung digitaler Geschäftsmodelle&quot;.\nEr habe einen Brandbrief von Industrievertretern an die EU-Kommission, der ein Moratorium der Regeln fordert, bewusst nicht unterzeichnet, sagte Busch, &quot;weil er mir nicht weit genug ging&quot;. Er plädiert dafür, das Gesetz substanziell zu verändern, anstatt nur für eine Weile auszusetzen. Neue Datenregeln sollten dabei Vorrang vor Investitionen in \nRechenzentren haben. &quot;Wir sitzen in Europa auf einem Datenschatz, \nkriegen den aber noch nicht gehoben&quot;, sagte Busch.\nSAP-Chef Klein warnte zudem davor, die Strategie der USA zu \nkopieren und primär in Infrastruktur zu investieren. Bislang sei kein \nKI-Projekt an fehlender Rechenkapazität gescheitert.\n\nUS-Konzerne kritisieren fehlende Leitlinien\n\nDas EU-Parlament hatte den AI Act, Europas Rechtsrahmen für künstliche Intelligenz, im Jahr 2024 verabschiedet. Er ordnet KI-Anwendungen in Risikoklassen ein, wonach Anbieter bestimmte Sicherheits- und Transparenzanforderungen erfüllen müssen. Nun geht es um die Umsetzung der Verordnung. Doch US-Konzerne wie Alphabet und Meta sowie die europäischen Unternehmen Mistral und ASML hatten zuletzt eine Aufschiebung gefordert und dies mit fehlenden Leitlinien begründet.\nDie EU-Kommission teilte zwar Anfang Juli mit, dass sich die Veröffentlichung eines entsprechenden Verhaltenskodex bis Ende 2025 verzögern könnte. Eine Verschiebung der Einführung des gesamten Gesetzes lehnte die Brüsseler Behörde jedoch ab. Eine Stellungnahme der EU-Kommission zu den Forderungen von Siemens und SAP lag zunächst nicht vor."}, {"id": "s009", "summary": "Israel und die Hamas haben sich auf eine Waffenruhe und die Freilassung von Geiseln geeinigt, Details müssen noch festgelegt werden. Die Vereinbarung soll am Sonntag in Kraft treten, in einer ersten Phase sollen 33 Geiseln freigelassen werden. Israel geht von 98 Verschleppten aus, darunter Personen mit Deutschlandbezug. Im Gegenzug sollen palästinensische Häftlinge freikommen. Die Waffenruhe umfasst drei Phasen, darunter die Rückkehr von Vertriebenen und die Lieferung von Hilfsgütern nach Gaza. Der Grenzübergang Rafah soll bereits am Donnerstagmorgen geöffnet werden. Das Rote Kreuz und die UN bieten Unterstützung bei der Umsetzung der Waffenruhe an. <ins>Die Vereinbarung sieht außerdem vor, dass internationale Beobachter an den Übergängen die Verteilung der Hilfsgüter dokumentieren.<\/ins>", "original": "Israel und die Hamas haben sich auf eine Waffenruhe und die Freilassung von Geiseln geeinigt, Details müssen noch festgelegt werden. Die Vereinbarung soll am Sonntag in Kraft treten, in einer ersten Phase sollen 33 Geiseln freigelassen werden. Israel geht von 98 Verschleppten aus, darunter Personen mit Deutschlandbezug. Im Gegenzug sollen palästinensische Häftlinge freikommen. Die Waffenruhe umfasst drei Phasen, darunter die Rückkehr von Vertriebenen und die Lieferung von Hilfsgütern nach Gaza. Der Grenzübergang Rafah soll bereits am Donnerstagmorgen geöffnet werden. Das Rote Kreuz und die UN bieten Unterstützung bei der Umsetzung der Waffenruhe an.", "title": "", "article": "Nach der grundsätzlichen Einigung zwischen Israel und der Hamas auf eine Waffenruhe und die Freilassung von Geiseln müssen Details der Absprache noch festgezurrt werden. An letzten Einzelheiten des Abkommens wurde nach Worten des\n israelischen Regierungschefs Benjamin Netanjahu noch in der Nacht gearbeitet. Die \nVereinbarung muss am Donnerstag auch noch von der israelischen Regierung und \ndem Sicherheitskabinett gebilligt werden. Israels Staatspräsident Izchak Herzog hat dazu aufgerufen, dem Waffenruheabkommen mit der Hamas zuzustimmen. Dies ist bisher bekannt:\nDie Vereinbarung soll laut Katars Ministerpräsident Mohammed Al Thani am 466. Tag nach Kriegsbeginn in Kraft treten und in einer ersten Phase 42 Tage dauern. Das ist  am Sonntag um 12.15 Uhr (11.15 Uhr MEZ).\nIn diesen ersten sechs Wochen sollen 33 der Geiseln aus der Gewalt der Hamas freigelassen werden, darunter Frauen, Soldatinnen, Minderjährige sowie ältere und kranke Menschen. Israels Streitkräfte sollen sich teilweise aus dem Gazastreifen zurückziehen, vertriebene Palästinenser in den Norden des Gebiets heimkehren dürfen. In späteren Schritten soll es zur Freilassung der verbleibenden Geiseln und zum dauerhaften Waffenstillstand kommen. Israel geht noch von 98 \nVerschleppten im Gazastreifen  aus, von denen mindestens 34 tot sein dürften. Dem Auswärtigen Amt in Berlin zufolge ist unter den Geiseln auch eine\n &quot;niedrige zweistellige Anzahl von Personen mit Deutschlandbezug&quot;.\nIm Gegenzug sollen erneut palästinensische Häftlinge aus israelischen Gefängnissen freikommen. Al Thani nannte dazu bisher keine Zahl. Ein israelischer Regierungsvertreter hatte von Hunderten Häftlingen gesprochen, die freikommen sollten.\n\nWaffenruhe umfasst drei Phasen\n\nIn der ersten der insgesamt drei Phasen sollen Vertriebene in ihre Wohnorte in dem Küstengebiet zurückkehren können und mehr der dringend benötigten Hilfsgüter nach Gaza geliefert werden, sagte Al Thani. Die humanitäre Hilfe soll umgehend deutlich aufgestockt werden. Auf Details der zweiten und dritten Phase wollen sich die Konfliktparteien Al Thani zufolge während der ersten Phase einigen.\nDer Grenzübergang Rafah zwischen Ägypten und dem Gazastreifen soll Sicherheitskreisen zufolge bereits an diesem Donnerstagmorgen wieder eröffnet werden. Einem Vertreter des ägyptischen Roten Halbmonds im Nord-Sinai zufolge wiesen die Behörden die ägyptische und palästinensische Seite an, den Grenzübergang von beiden Seiten zu öffnen. 600 Lastwagen mit Hilfslieferungen seien für die Einfuhr vorbereitet worden.\nDas Rote Kreuz bot seine Unterstützung bei der Umsetzung des neuen Waffenruheabkommens an. Während einer ersten Waffenruhe im November 2023 hatte das IRK als  neutrale Instanz die Rückkehr von 109 Hamas-Geiseln nach Israel und die Freilassung von 154 palästinensischen Häftlingen aus israelischen Gefängnissen unterstützt.\nDie Vereinten Nationen boten ebenfalls an, Israel und die Hamas bei der Umsetzung der vereinbarten Waffenruhe zu unterstützen. Die UN würden &quot;die Lieferung von anhaltender humanitärer Hilfe  an die unzähligen Palästinenser, die weiter leiden, hochfahren&quot;, sagte UN-Generalsekretär António Guterres.\nVerfolgen Sie weitere Entwicklungen zur Situation in Nahost in unserem Liveblog ."}, {"id": "s012", "summary": "In der Demokratischen Republik Kongo ist die Zahl der Toten durch eine unbekannte Krankheit auf 131 gestiegen. Medizinische Teams sind in betroffenen Ortschaften im Südwesten des Landes im Einsatz und haben zwei weitere Dörfer mit mindestens 60 Toten entdeckt. Epidemiologen unterstützen Ärzte bei der Behandlung der Patienten und ermitteln die Art der Krankheit, von der bisher 382 Menschen betroffen sind. Besonders Kinder bis 15 Jahre sind betroffen, Symptome sind Fieber, Kopfschmerzen, Atemprobleme und Anämie. Expertenteams werden Proben entnehmen und die Bevölkerung zu Hygiene- und Abstandsmaßnahmen aufrufen, <del title=\"removed\">da<\/del> <ins>obwohl<\/ins> die Übertragungswege der Krankheit noch unbekannt sind.", "original": "In der Demokratischen Republik Kongo ist die Zahl der Toten durch eine unbekannte Krankheit auf 131 gestiegen. Medizinische Teams sind in betroffenen Ortschaften im Südwesten des Landes im Einsatz und haben zwei weitere Dörfer mit mindestens 60 Toten entdeckt. Epidemiologen unterstützen Ärzte bei der Behandlung der Patienten und ermitteln die Art der Krankheit, von der bisher 382 Menschen betroffen sind. Besonders Kinder bis 15 Jahre sind betroffen, Symptome sind Fieber, Kopfschmerzen, Atemprobleme und Anämie. Expertenteams werden Proben entnehmen und die Bevölkerung zu Hygiene- und Abstandsmaßnahmen aufrufen, da die Übertragungswege der Krankheit noch unbekannt sind.", "title": "", "article": "Die Zahl der Toten durch eine unbekannte Krankheit in der Demokratischen\nRepublik Kongo ist gestiegen. Nach Angaben der örtlichen Gesundheitsbehörden starben\ninzwischen 131 Menschen.\nSeit Dienstag sind medizinische Teams in\nbetroffenen Ortschaften im Südwesten des Landes unterwegs. Sie hätten inzwischen zwei\nweitere Dörfer gefunden, in denen mindestens 60 Tote verzeichnet worden seien,\nteilte der Gesundheitsminister der Provinz Kwango, Apollinaire Yumba, mit.\nIn den vergangenen Tagen waren Epidemiologen in\ndie zu Kwango gehörende Region Panzi gereist. Sie sollen dort Ärzte bei der\nBehandlung der Patienten unterstützen und ermitteln, um was für eine Art\nvon Krankheit es sich handelt. Bisher wurden nach Angaben Yumbas 382 Menschen\nmit Symptomen der Krankheit registriert.\n\nFieber,\nKopfschmerzen, Atemprobleme und Anämie\n\nÜber die Krankheit ist derzeit nur wenig bekannt. Besonders\noft betroffen sind offenbar Kinder bis 15 Jahre. Zu den Symptomen zählen \nFieber,\nKopfschmerzen, Atemprobleme und Anämie\n.\nDer Minister kündigte die Entsendung weiterer Expertenteams an.\nSie sollen den Angaben zufolge Proben entnehmen und die\nBevölkerung zu Hygiene- und Abstandsmaßnahmen aufrufen. Ob die Krankheit nur\ndurch körperlichen Kontakt oder auch über andere Wege übertragen werden kann,\nist bisher nicht bekannt."}, {"id": "s029", "summary": "FDP-Generalsekretär Bijan Djir-Sarai tritt nach Skandal um Ampelkoalitions-Austritt <ins>mit sofortiger Wirkung<\/ins> zurück; er habe von Strategiepapier keine Kenntnis gehabt und die Öffentlichkeit unwissentlich falsch informiert.", "original": "FDP-Generalsekretär Bijan Djir-Sarai tritt nach Skandal um Ampelkoalitions-Austritt zurück; er habe von Strategiepapier keine Kenntnis gehabt und die Öffentlichkeit unwissentlich falsch informiert.", "title": "", "article": "FDP-Generalsekretär Bijan Djir-Sarai hat in Folge des Skandals um den Austritt der FDP aus der Ampelkoalition sein Amt niedergelegt. Er habe von dem am Donnerstag veröffentlichten Strategiepapier &quot;keine Kenntnis&quot; gehabt und die Öffentlichkeit infolgedessen &quot;unwissentlich falsch informiert&quot;, sagte er in einer kurzen Stellungnahme in der FDP-Parteizentrale in Berlin. Für einen solchen Vorgang der der Generalsekretär verantwortlich. Um Schaden von seiner Partei und seiner Glaubwürdigkeit abzuwenden, habe er die Parteiführung daher über seinen Rücktritt informiert.\nDjir-Sarai zieht damit letztlich die Konsequenzen aus den &quot;D-Day&quot;-Enthüllungen, wonach die Partei gezielt und länger vorbereitet den Austritt aus der Ampelkoalition geplant hatte. Nachdem eine Recherche der ZEIT die Planung des Regierungsbruches durch die FDP öffentlich gemacht hatte, hatte die FDP am Donnerstag selbst Dateien zu besagter Planung veröffentlicht. Darin ist von einem &quot;D-Day&quot; die Rede, an dem die FDP aus der Koalition austritt. In der Folge wird von einer &quot;Feldschlacht&quot; gesprochen, um den Schritt offensiv zu kommunizieren.\nDie FDP hatte nach der ZEIT-Veröffentlichung versucht, die Enthüllungen herunterzuspielen, die Berichte aber grundsätzlich nicht dementiert. Djir-Sarai hatte allerdings in einem TV-Interview dementiert, dass in dem Zusammenhang der Begriff &quot;D-Day&quot; verwendet wurde, den die Alliierten im Zweiten Weltkrieg für den Tag der Landung in der Normandie verwendet hatten. Kritiker hatten der FDP daraufhin vorgeworfen, Olaf Scholz indirekt mit Adolf Hitler verglichen zu haben. Auch andere Liberale hatten das Vorgehen der Partei zunächst verteidigt.\nNach den Veröffentlichungen von Donnerstag war allerdings auch aus der Partei Kritik an dem Vorgehen gekommen. Die Vorsitzende der Jungen Liberalen hatte Djir-Sarai daraufhin zum Rücktritt aufgefordert. &quot;Als Generalsekretär trägt Bijan Djir-Sarai die politische Verantwortung für die Inhalte und die Ausrichtung der Partei. Um weiteren Schaden von der Partei abzuwenden, habe ich Bijan Djir-Sarai als JuLi-Bundesvorsitzende dazu aufgefordert, von seinem Amt zurückzutreten&quot;, hatte die Vorsitzende der Jungen Liberalen, Franziska Brandmann, auf X geschrieben.\nKnapp drei Monate vor der Bundestagswahl steht die FDP somit ohne Generalsekretär da, der üblicherweise für die Organisation des Wahlkampfs zuständig ist. Als möglicher Nachfolger wird der ehemalige Bundesjustizminister Marco Buschmann gehandelt. Djir-Sarai hatte das Amt im April 2022 offiziell von Volker Wissing übernommen, der in der Ampelkoalition Verkehrsminister geworden war. Seit Amtsübernahme der Ampel hatte Djir-Sarai das Amt bereits kommissarisch übernommen.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s004", "summary": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht. <ins>Die Vereinten Nationen schätzen, dass bis zum Jahr 2050 mehr als zwei Milliarden Menschen in Regionen mit akutem Wassermangel leben könnten, wenn keine Gegenmaßnahmen ergriffen werden.<\/ins>", "original": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.", "title": "", "article": "Holstein Kiel – Borussia Dortmund 4:2 (3:0)\nBorussia Dortmund hat in der Bundesliga überraschend gegen den Tabellenvorletzten Holstein Kiel mit 2:4 (0:3) verloren. Der BVB zeigte dabei vor allem in der ersten Halbzeit große Schwächen in der Defensive, während Kiel den Sieg mit einer disziplinierten Leistung sicherte.\nIn der 27. Minute gingen die Gastgeber durch Shuto Machino in Führung, der nach einem Fehler von Julian Brandt einen präzisen Rechtsschuss verwandelte. Nur fünf Minuten später (32. Spielminute) erhöhte Phil Harres per Kopf auf 2:0. Kurz vor der Halbzeitpause traf Alexander Bernhardsson in der Nachspielzeit (45.+4) zum dritten Mal für die Kieler. Dortmund konnte in der zweiten Hälfte durch Giovanni Reyna (71.) und Jamie Gittens (77.) verkürzen, ehe Fiete Arp in der Nachspielzeit (90.+8) den Schlusspunkt setzte. Kiels Lewis Holtby sah nach einem Foulspiel in der 86. Minute die Rote Karte.\nFür Holstein Kiel bedeutet der unerwartete Sieg wichtige Punkte im Kampf um den Klassenerhalt. Der BVB hingegen droht, den Anschluss an die Champions-League-Plätze zu verlieren. Bereits am Freitag steht für Dortmund ein Auswärtsspiel gegen Eintracht Frankfurt an, während Kiel am Samstag bei der TSG Hoffenheim zu Gast ist."}, {"id": "s015", "summary": "Ein betrunkener und/oder drogenbetäubter Lkw-Fahrer hat auf mehreren nordrhein-westfälischen Autobahnen eine Serie von Unfällen verursacht, bei denen 26 Menschen verletzt wurden, acht davon schwer. <del title=\"removed\">Ein Mensch schwebt in Lebensgefahr.<\/del> Der 30-jährige Fahrer wurde festgenommen und befindet sich nun in einer psychiatrischen Einrichtung. Die Polizei geht von rund 50 betroffenen Fahrzeugen aus; die Strecke des Mannes erstreckte sich über etwa 60 Kilometer. Ein Alkohol- und Drogentest bei der Festnahme war positiv.", "original": "Ein betrunkener und/oder drogenbetäubter Lkw-Fahrer hat auf mehreren nordrhein-westfälischen Autobahnen eine Serie von Unfällen verursacht, bei denen 26 Menschen verletzt wurden, acht davon schwer. Ein Mensch schwebt in Lebensgefahr. Der 30-jährige Fahrer wurde festgenommen und befindet sich nun in einer psychiatrischen Einrichtung. Die Polizei geht von rund 50 betroffenen Fahrzeugen aus; die Strecke des Mannes erstreckte sich über etwa 60 Kilometer. Ein Alkohol- und Drogentest bei der Festnahme war positiv.", "title": "Lkw-Fahrer verursacht Unfälle mit 50 Fahrzeugen – 19 Verletzte", "article": "Ein Lkw-Fahrer, der vermutlich unter Alkohol oder Drogen stand, hat auf mehreren Autobahnen in Nordrhein-Westfalen eine Vielzahl an Unfällen verursacht. 26 Verkehrsteilnehmer wurden verletzt, acht davon schwer, wie die Polizei in Düsseldorf mitteilte. Ein Mensch befindet sich demnach in Lebensgefahr.\nDer 30 Jahre alte Lkw-Fahrer sei zunächst mit Verletzungen ins Krankenhaus gebracht worden und sollte so bald wie möglich vernommen werden. Inzwischen befindet er sich in einer psychiatrischen Einrichtung.\nInsgesamt sind der Polizei bislang 50 Fahrzeuge bekannt, die von den Unfällen betroffen waren. Die Fahrt des Mannes zog sich nach ersten Meldungen über etwa 60 Kilometer. Nach seiner Festnahme hatte bei dem Fahrer ein Alkohol- und Drogentest angeschlagen.\n&quot;Auffallend unsichere Fahrweise&quot;\nAm Samstagnachmittag sei den Beamten ein Lkw mit polnischem Kennzeichen gemeldet worden, der in auffallend unsicherer Fahrweise auf der A 46 im Bereich Neuss unterwegs gewesen sei, teilte die Polizei weiter mit. Der Fahrer habe die Anhaltezeichen der Autobahnpolizei missachtet und sei mit deutlich erhöhter Geschwindigkeit und in Schlangenlinien über die A 46 in den Wuppertaler Raum gefahren. Weitere Verkehrsteilnehmer wurden aufgefordert, die Autobahnen in dem Gebiet möglichst schnell zu verlassen.\nNachdem der Lkw in den Gegenverkehr geraten war, kam er laut Polizei nach der Kollision mit anderen Fahrzeugen quer zur Fahrbahn zum Stillstand. An dieser Unfallstelle sei der Fahrer dann verhaftet worden. Am Samstagabend errichtete die Polizei mehrere Sperrungen in dem Gebiet. Sie sollten voraussichtlich bis Sonntagmittag aufrechterhalten bleiben."}, {"id": "s002", "summary": "Im Titelduell zwischen Ding Liren und Herausforderer Gukesh steht es nach dem vierten Remis in Serie weiterhin unentschieden, 3,5 zu 3,5. Gukesh überraschte Ding mit einem Turmmanöver, <del title=\"removed\">doch Ding<\/del> <ins>deshalb<\/ins> rettete sich <ins>Ding<\/ins> mit einer kunstvollen Verteidigung. Das WM-Duell ist auf bis zu vierzehn Partien angesetzt, der erste Spieler, der 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "original": "Im Titelduell zwischen Ding Liren und Herausforderer Gukesh steht es nach dem vierten Remis in Serie weiterhin unentschieden, 3,5 zu 3,5. Gukesh überraschte Ding mit einem Turmmanöver, doch Ding rettete sich mit einer kunstvollen Verteidigung. Das WM-Duell ist auf bis zu vierzehn Partien angesetzt, der erste Spieler, der 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "title": "", "article": "Am Dienstag überraschte Gukesh den Weltmeister Ding Liren im 7. Zug mit einem Turmmanöver. Ding war geschockt, wie er später sagte, doch er rettete sich dank einer kunstvollen Verteidigungsleistung. Es war das vierte Remis in Serie. Damit steht es \nim Titelduell zwischen Ding Liren und\n dem Herausforderer Gukesh weiter unentschieden, 3,5 zu 3,5. Angesetzt\n ist das WM-Duell auf bis zu vierzehn \nPartien. Für jeden Sieg gibt es einen Punkt, für jedes Remis einen \nhalben. Weltmeister wird der Spieler, der zuerst 7,5 Punkte erreicht.\nBei uns können Sie alle Partien mit den Experten von chess.com live verfolgen, hier ab 10 Uhr die achte Partie dieser WM.\nUnser Reporter Ulrich Stock schreibt vom Ort des Geschehens. Alle Texte aus Singapur lesen Sie hier . Der Großmeister Niclas Huschenbeth liefert für ZEIT ONLINE Videoanalysen aller Partien zu."}];
const SAMPLE = "b51867da";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
