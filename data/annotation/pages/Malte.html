const NAME = "Malte";
const ITEMS = [{"id": "s011", "type": "delete_sentence", "definition": "Delete sentence: one sentence with important information was removed from the summary.", "original": "Ein Jahr nach dem Start des Jobturbo-Programms der Bundesregierung zeigt die Bundesagentur für Arbeit Fortschritte bei der Arbeitsmarktintegration von Ukrainern in Deutschland.<del> Von den 768.000 erwerbsfähigen Ukrainern haben im Vergleich zum Vorjahr mehr einen Job angenommen, insgesamt sind nun 272.400 Ukrainer in Arbeit.<\/del> Obwohl das Ziel von 200.000 vermittelten Jobs nicht erreicht wurde, steigt die monatliche Zahl der Arbeitsaufnahmen. Trotz Diskussionen über Bürgergeld für ukrainische Flüchtlinge sehen Experten andere Faktoren wie den Zugang zu Kinderbetreuung und Gesundheitsversorgung als entscheidend für die Arbeitsaufnahme.", "modified": "Ein Jahr nach dem Start des Jobturbo-Programms der Bundesregierung zeigt die Bundesagentur für Arbeit Fortschritte bei der Arbeitsmarktintegration von Ukrainern in Deutschland. Obwohl das Ziel von 200.000 vermittelten Jobs nicht erreicht wurde, steigt die monatliche Zahl der Arbeitsaufnahmen. Trotz Diskussionen über Bürgergeld für ukrainische Flüchtlinge sehen Experten andere Faktoren wie den Zugang zu Kinderbetreuung und Gesundheitsversorgung als entscheidend für die Arbeitsaufnahme.", "title": "Mehr ukrainische Flüchtlinge nehmen Arbeit auf", "article": "Etwa ein Jahr nach Start des sogenannten Jobturbos der Bundesregierung sieht die Bundesagentur für Arbeit (BA) Fortschritte bei der Arbeitsmarktintegration von Ukrainern. &quot;Mit dem Jobturbo haben wir einen Schritt nach vorne gemacht&quot;, sagte BA-Vorstand Daniel Terzenbach dem RedaktionsNetzwerk Deutschland (RND).\nNach Angaben der Bundesagentur für Arbeit ( PDF ) lebten laut Ausländerzentralregister Ende August 2024 1,3 Millionen Ukrainerinnen und Ukrainer in Deutschland. Die große Mehrheit sind Kriegsflüchtlinge. Von den geflüchteten Ukrainern sind nach Zahlen der Bundesagentur für Arbeit, aus denen die Bundesregierung im Oktober zitierte ,\n\n 768.000 im \nerwerbsfähigen Alter.\nVon diesen knapp 770.000 Ukrainern im erwerbsfähigen Alter haben nach neuen BA-Daten im Vergleich zum Vorjahr mehr einen Job angenommen. Im August 2023 – damals lag die Zahl aller Ukrainer in Deutschland noch bei 1,2 Millionen – zählte die Behörde noch 197.660 Ukrainer in Arbeit, ein Jahr später waren insgesamt 272.400 Ukrainer in geringfügigen und sozialversicherungspflichtigen Jobs.\n\n&quot;Jobturbo&quot; sollte 200.000 Ukrainer in Jobs bringen\n\nAuch die monatliche Zahl von Ukrainern, die aus der Arbeitslosigkeit in \nJobs auf dem sogenannten ersten Arbeitsmarkt gewechselt sind, ist \ndemnach gestiegen. 2023 zählte die BA insgesamt 36.661 Abgänge \nukrainischer Staatsangehöriger in den Arbeitsmarkt. 2024 (bis \neinschließlich Oktober) waren es 62.810 Abgänge. Darunter fallen auch \n(außer-)betriebliche Ausbildungen und Selbstständigkeit.\nMit diesem Anstieg von bislang insgesamt etwa 137.000 Arbeitsaufnahmen im Jahr 2024 zeichnet sich ein geringerer Anstieg ab, als sich die Bundesregierung von ihrem sogenannten Jobturbo-Programm für ukrainische Flüchtlinge vorgenommen hatte. Bundesarbeitsminister Hubertus Heil hatte vor einem Jahr angekündigt, mit dem Programm sollten im Jahr 2024 200.000 Ukrainer direkt in einen Job vermittelt und 500 Millionen Euro gespart werden.\n&quot;Es ist heute viel wahrscheinlicher, dass Ukrainerinnen und Ukrainer in \nArbeit kommen als vor dem Jobturbo&quot;, sagte BA-Vorstand Terzenbach, der auch \nSonderbeauftragter für die Arbeitsmarktintegration Geflüchteter war. &quot;Aber es gibt auch noch Luft nach oben.&quot;\n\nStreit über Bürgergeld für Ukraine-Flüchtlinge\n\nNach Zahlen des Instituts für Arbeitsmarkt- und Berufsforschung (IAB) vom August liegt Deutschland bei der Beschäftigungsquote geflüchteter Ukrainer\n im europäischen Mittelfeld: 27 Prozent von ihnen gingen demnach einer Arbeit \nnach . Am höchsten sei die Quote in Litauen, Dänemark und Polen mit \njeweils 57, 53 und 48 Prozent. Finnland, Norwegen und Spanien \nverzeichnen hingegen niedrige Quoten unter 20 Prozent, in Rumänien \narbeiten demnach nur sieben Prozent der Geflüchteten.\nDie große Mehrheit der in Deutschland lebenden ukrainischen Flüchtlinge bekommt Bürgergeld. Darüber gab es in der Politik immer wieder Streit. Heil hatte damals gesagt, es sei &quot;an der Zeit, eine Arbeit aufzunehmen&quot;, das Bürgergeld kein &quot;bedingungsloses \nGrundeinkommen&quot;.\nIm Sommer, vor den Landtagswahlen in Sachsen, Thüringen und Brandenburg, kam die Diskussion erneut auf. Die damals noch im Bund mitregierende FDP und die größte Oppositionsfraktion Union hatten gefordert, geflüchteten Ukrainern statt Bürgergeld geringere Sozialleistungen nach dem Asylbewerberleistungsgesetz zu zahlen.\nAber auch Brandenburgs Ministerpräsident Dietmar Woidke von der SPD hatte das B ürgergeld für ukrainische Flüchtlinge infrage gestellt . Sein Innenminister Michael Stübgen (CDU) argumentierte, das Bürgergeld sei zum &quot;Bremsschuh für die Arbeitsaufnahme&quot; geworden. Die Bundesregierung wies die Kürzungsforderungen damals zurück .\nDie Autoren der IAB-Studie vom Sommer sehen das Bürgergeld nicht als entscheidenden Grund, der ukrainische Flüchtlinge an einer Arbeitsaufnahme hindere . Vielmehr seien unter anderem Fragen, wie stark der Arbeitsmarkt reguliert ist, und der Zugang zu Kinderbetreuung und Gesundheitsversorgung entscheidende Faktoren. Die große Mehrheit der ukrainischen Kriegsflüchtlinge sind Frauen und Kinder."}, {"id": "s022", "type": "delete_sentence", "definition": "Delete sentence: one sentence with important information was removed from the summary.", "original": "<del>Der Einsatz eines Polizeihundes während der Proteste gegen den AfD-Parteitag in Riesa hat zu einem Strafverfahren geführt, nachdem eine Anzeige wegen des Vorfalls eingereicht wurde. <\/del>Rund 10.000 Demonstranten hatten sich am Samstag versammelt und standen teils konfrontativ zur Polizei gegenüber. Ein Video aus sozialen Medien zeigt einen Polizisten, der seinen Hund auf einen Demonstranten stoßen lässt, um ihn über eine Straße zu drängen. Der Beamte drückt den Hund mehrfach mit seiner Schnauze auf den Mann, während dieser über die Leitplanken steigt. Bei der gleichen Demonstration wurde der sächsische Landtagsabgeordnete Nam Duy Nguyen (Die Linke) von der Polizei offenbar bewusstlos geschlagen. Sein Begleiter erlitt Verletzungen im Gesicht. Gegen den beschuldigten Beamten läuft bereits ein Ermittlungsverfahren wegen Körperverletzung.", "modified": "Rund 10.000 Demonstranten hatten sich am Samstag versammelt und standen teils konfrontativ zur Polizei gegenüber. Ein Video aus sozialen Medien zeigt einen Polizisten, der seinen Hund auf einen Demonstranten stoßen lässt, um ihn über eine Straße zu drängen. Der Beamte drückt den Hund mehrfach mit seiner Schnauze auf den Mann, während dieser über die Leitplanken steigt. Bei der gleichen Demonstration wurde der sächsische Landtagsabgeordnete Nam Duy Nguyen (Die Linke) von der Polizei offenbar bewusstlos geschlagen. Sein Begleiter erlitt Verletzungen im Gesicht. Gegen den beschuldigten Beamten läuft bereits ein Ermittlungsverfahren wegen Körperverletzung.", "title": "Title Not Found", "article": "Der Einsatz eines Polizeihundes während der Proteste gegen den AfD-Parteitag in Riesa hat Folgen. Die Polizei ermittelt nun wegen des Vorfalls. Da inzwischen eine Anzeige vorliege, werde es ein Strafverfahren geben, sagte Polizeisprecher Thomas Geithner. Vor Abschluss des Verfahrens könne er jedoch keine Bewertung zu dem Fall abgeben.\nRund 10.000 Menschen hatten am Samstag gegen den AfD-Bundesparteitag demonstriert . Die Stimmung war teils aufgeheizt. Demonstrierende und Polizei standen sich vielerorts gegenüber. Zu den Demonstrationen hatte das Bündnis Widersetzen aufgerufen und im Netz wochenlang mobilisiert. Zahlreiche Vereine und Organisationen waren dem Aufruf gefolgt.\nAuf einem Video, das in den sozialen Medien geteilt wurde , ist zu sehen, wie ein Polizist seinen Hund auf einen Demonstranten stößt, um den Mann über eine Straße zu drängen. Der Beamte drückt den Hund mehrfach mit seiner Schnauze auf den Mann, während dieser über die Leitplanken steigt.\nBei der gleichen Demonstration wurde der sächsische Landtagsabgeordnete Nam Duy Nguyen (Die Linke) von der Polizei offenbar bewusstlos geschlagen . Er war als parlamentarischer Beobachter auf der Demonstration. Sein Begleiter habe Verletzungen im Gesicht erlitten, schrieb Nguyen. Der Pressesprecher der Polizei bestätigte den Vorfall. Gegen den beschuldigten Beamten sei bereits ein Ermittlungsverfahren wegen Körperverletzung im Amt eingeleitet worden.\n&quot;Der Polizei tut es sehr leid, dass der Abgeordnete im Einsatz zu Schaden gekommen ist. Wir werden alles tun, um das zu erhellen&quot;, sagte der Polizeisprecher. Aufseiten der Polizei sind nach eigenen Angaben sechs Beamte leicht verletzt worden."}, {"id": "s043", "type": "delete_sentence", "definition": "Delete sentence: one sentence with important information was removed from the summary.", "original": "<del>Die Autorin reflektiert über ihre Vorsätze für das neue Jahr, insbesondere über das Ausmisten ihres begehbaren Kleiderschranks. <\/del>Trotz sentimentaler Bindungen zu vielen Kleidungsstücken erkennt sie, dass sie zu viel besitzt und sich von einigen trennen muss. Sie reflektiert über die Gründe für ihre vielen Einkäufe und kommt zu dem Schluss, dass sie das meiste davon nicht braucht. Sie beginnt, sich darüber klar zu werden, wie sehr sie den Kauf-Mich-Verführungen erlegen ist und dass das Aufräumen im Kopf der erste Schritt zur Veränderung ist.", "modified": "Trotz sentimentaler Bindungen zu vielen Kleidungsstücken erkennt sie, dass sie zu viel besitzt und sich von einigen trennen muss. Sie reflektiert über die Gründe für ihre vielen Einkäufe und kommt zu dem Schluss, dass sie das meiste davon nicht braucht. Sie beginnt, sich darüber klar zu werden, wie sehr sie den Kauf-Mich-Verführungen erlegen ist und dass das Aufräumen im Kopf der erste Schritt zur Veränderung ist.", "title": "Title Not Found", "article": "Neues Jahr, gute Vorsätze. Und: Es muss jetzt sein. Es muss weniger werden. Alles. Wenn ich nur wüsste, wo ich anfangen soll. Wenn ich nur wüsste, wohin mit den Sachen, die ich aussortieren möchte . Der Speicher mit all den Briefen, Ordnern, Tagebüchern, Zeitungsausschnitten, Programmheften – was für ein Albtraum. Nein, für den Speicher brauche ich mal ein paar freie Monate. Irgendwann. Hatte ich je freie Monate? Kriege ich je freie Monate? Egal, das geht jetzt nicht, bloß nicht den Speicher.\nDie Küche? Manchmal braucht man eben Geschirr für zehn Personen, ich könnte ja ein paar Teller einfach im Keller zwischenlagern. Und von den Tassen kann ich doch keine wegwerfen, die sind alle aus Museumsshops, so schöne Sprüche drauf, von Louise Bourgeois, von Francis Picabia, nein, Küche nicht. Küche überfordert mich jetzt echt.\n\nSechs schwarze! Fünf rote! Drei blaue!\n\nKleiderschrank. Ich fange beim Kleiderschrank an. Ich habe einen sogenannten begehbaren, einen offenen Kleiderschrank, und das lieben die Motten. Die wohnen da. Jeder Pullover hat Löcher, und jetzt kommen Sie mir ja nicht mit Lavendelsäckchen oder Zedernholzringen, ich habe das alles versucht, meine Motten lachen sich darüber kaputt. Habe ich eben Löcher, na und. Es sind sowieso viel zu viele Pullover. Was sich da alles ansammelt im Lauf der Jahre! \nSechs schwarze! Fünf rote! Drei blaue!\n Die gestreiften gar nicht mehr zu zählen. Aber eben verschiedenes Blau. Und die roten mit Rundhals oder V-Ausschnitt, man braucht doch beides, die schwarzen mal lässig, mal elegant, Löcher auch meist nur am Ärmelbündchen, kann ich mit Nähseide schnell zuziehen. (Mach ich, gleich morgen.) (Mach ich nie.)\nSo viele Jacken? Na ja, für fein, für nicht so fein, von Anuschka gestrickt, mit Glitzer dran für Lesungen auf Bühnen, die ganz, ganz teure mit den aufgestickten Blumen, ach, die ganz alte aus Chenille, nein, die Jacken bleiben. Was ist mit diesen Samtjacken? Ha, die rote, dreißig Jahre alt, sechs Jahre lang habe ich sie in jeder &quot;Lesen!&quot;-Sendung im ZDF getragen, damit die blöden Diskussionen darüber aufhörten, was ich wohl im Fernsehen anziehe – immer dieselbe rote Samtjacke, sechs Jahre lang, das soll mir mal eine nachmachen. Das war ein Knaller! Die Jacke behalte ich.\nDie schwarze zweireihige ist meine Glücksjacke, wenn ich die anhabe, geht immer alles gut. Die Armani-Jacke war die allererste teure, die ich mir gekauft habe, einmal Armani! Das muss 1995 oder so gewesen sein, ich hatte einen ersten Bestseller gelandet, damals trug ich noch Größe 36. Was bei Armani 40 ist. Heute habe ich Größe 42, so was Riesiges stellt Armani gar nicht mehr her. Ich kann doch keine Armani-Jacke wegschmeißen, nur weil sie vorn nicht mehr zugeht! Die Jacke muss bleiben. Dinge, die eine Geschichte haben, die mit mir und meiner Entwicklung zu tun haben, von denen kann ich mich nicht trennen.\n\nVielleicht brauche ich das noch!\n\nKleider – wann trage ich schon mal Kleider? Nie. Aber einmal hatte ich das Zebrakleid an, und er, der Herrlichste von allen, sagte: Wie schön du darin aussiehst! Nie, nie werde ich mich von dem Zebrakleid trennen. Das mit den Blumen ist ein bisschen spießig, aber irgendwie auch schön, so fröhlich. Lasst mich noch älter werden, lasst mich 85 werden, und dann komm ich euch mit dem Blumenkleid, dann guckt ihr aber! Das Blumenkleid muss bleiben. Warum habe ich es damals eigentlich angeschafft? Ach, das wird einer dieser traurigen Tage gewesen sein, an denen ich mich mit irgendwas belohnen oder trösten musste – der Grund für viele sinnlose Einkäufe. Jetzt, mit über 80, passiert mir so etwas nicht mehr. Es kommt also nichts mehr, fast nichts mehr dazu. Aber wie kriegt man es hin, dass etwas wegkommt? Einkaufen ist leicht, sich dann wieder trennen dagegen schwer.\nWas ist mit den Röcken? Einen Prinzessinnenrock mit viel Tüll braucht jede. Oder? Nein, eigentlich nicht. Der mit den Rosen war so irrsinnig teuer, meine Güte, hat der ein Geld gekostet, ich darf es gar nicht sagen (über 500 Mark!). So was gibt man doch nicht weg, und überhaupt, wohin denn? In den Kleidersack? Damit sie Putzlappen draus machen? Ich lass den mal lieber hier. Die beiden Samtröcke hatte ich lange nicht an, ein langer roter, ein kurzer schwarzer. Ob die noch passen? Das probiere ich mal, aber nicht jetzt, lieber morgen. Ach, morgen fahre ich ja weg. Egal. Ich lass sie hängen. Was ist mit dem Pünktchenrock? Der hat echt noch meiner Mutter gehört. Der muss sechzig Jahre alt sein, nein, mehr. Ich trag ihn nie, aber ich freu mich, wenn ich ihn sehe, er erinnert mich an so vieles. Dieses Kaschmirkleid! So weich! Es ist ein bisschen eng am Bauch, dazu brauche ich einen strammen Hüfthalter drunter, und zu so was hab ich natürlich keine Lust. Aber im Alter werde ich sicher dürrer und klappriger, dann sieht das wieder gut aus, ich behalte das mal lieber.\nDie Frage ist auch hier: Warum habe ich es eigentlich gekauft? Warum kaufen wir alle überhaupt so viel, wenn die Schränke doch sowieso voll sind? Jetzt endlich beginne ich, beginnen wir, darüber nachzudenken und uns klarzumachen, wie sehr wir in all den Jahren diesen Kauf-mich-Verführungen erlegen sind. Wir brauchen das alles nicht, und es zu kaufen, tröstet gerade mal zehn Minuten, wenn überhaupt. Das einzusehen, ist doch schon das halbe Aufräumen, will sagen: Vielleicht kommt jetzt, heute, aus Sentimentalität noch nicht genug weg, aber ganz sicher kommt in den nächsten Jahren nichts mehr oder nicht mehr viel dazu. Das Aufräumen im Kopf, das hat durchaus schon begonnen. Und das, finde ich, ist letztlich das Wichtigste. Denn so fängt sie an, die Veränderung. Wenn der Kopf erst mal aufgeräumt ist, klappt das mit den Schränken auch. Hoffentlich!"}, {"id": "s046", "type": "delete_sentence", "definition": "Delete sentence: one sentence with important information was removed from the summary.", "original": "<del>Drei ehemalige Anwälte von Alexej Nawalny wurden in Russland wegen &quot;&quot;Extremismus&quot;&quot; zu Haftstrafen zwischen dreieinhalb und fünfeinhalb Jahren verurteilt. <\/del>Die Anwälte wurden im Oktober 2023 festgenommen. Nawalny, ein prominenter Kritiker von Präsident Putin, verstarb im Februar 2024 unter mysteriösen Umständen in einem Straflager in der Arktis.", "modified": "Die Anwälte wurden im Oktober 2023 festgenommen. Nawalny, ein prominenter Kritiker von Präsident Putin, verstarb im Februar 2024 unter mysteriösen Umständen in einem Straflager in der Arktis.", "title": "Title Not Found", "article": "Ein Gericht in Russland hat drei frühere Anwälte des verstorbenen Oppositionspolitikers Alexej Nawalny wegen &quot;Extremismus&quot;-Vorwürfen zu mehrjährigen Haftstrafen verurteilt. Die Strafen liegen zwischen dreieinhalb und fünfeinhalb Jahren, berichteten Reporter der Nachrichtenagentur AFP aus dem Gerichtssaal.\nDie Anwälte waren im Oktober 2023 festgenommen worden. Nawalny war einer der größten Kritiker des russischen Präsidenten Wladimir Putin. Er starb im Februar 2024 unter unbekannten Umständen in einem Straflager in der Arktis.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s051", "type": "delete_sentence", "definition": "Delete sentence: one sentence with important information was removed from the summary.", "original": "<del>Bundesgesundheitsminister Karl Lauterbach (SPD) hat den Wurf einer Schaumtorte auf den ehemaligen Finanzminister Christian Lindner (FDP) als Gewalt und Angriff auf die Demokratie verurteilt. <\/del>&quot;Es fängt mit der Torte an und hört mit Steinen oder mit Sprengsätzen auf&quot;, sagte Lauterbach, der eine Verrohung des politischen Prozesses sieht und eine Bestrafung fordert.\nAuch der Kanzlerkandidat der Grünen, Robert Habeck, kritisierte den Vorfall scharf: &quot;Tätliche Angriffe jedweder Art haben im Ringen um die besten Lösungen für dieses Land nichts zu suchen!&quot;, schrieb er auf der Plattform X.\nDer FDP-Vorsitzende Christian Lindner wurde bei einem Wahlkampfauftritt in Greifswald von einer Lokalpolitikerin der Linken mit einer schaumartigen Substanz beworfen. Der Wurf traf den früheren Finanzminister direkt ins Gesicht, doch Lindner nahm die Attacke gelassen: &quot;Es war leider nicht Sahne, sondern nur Seife&quot;, sagte er und setzte seine Rede fort.\nDer Landesvorsitzende der Linken in Mecklenburg-Vorpommern distanzierte sich von dem Vorfall und betonte, dass Gewalt keine Lösung sei.", "modified": "&quot;Es fängt mit der Torte an und hört mit Steinen oder mit Sprengsätzen auf&quot;, sagte Lauterbach, der eine Verrohung des politischen Prozesses sieht und eine Bestrafung fordert.\nAuch der Kanzlerkandidat der Grünen, Robert Habeck, kritisierte den Vorfall scharf: &quot;Tätliche Angriffe jedweder Art haben im Ringen um die besten Lösungen für dieses Land nichts zu suchen!&quot;, schrieb er auf der Plattform X.\nDer FDP-Vorsitzende Christian Lindner wurde bei einem Wahlkampfauftritt in Greifswald von einer Lokalpolitikerin der Linken mit einer schaumartigen Substanz beworfen. Der Wurf traf den früheren Finanzminister direkt ins Gesicht, doch Lindner nahm die Attacke gelassen: &quot;Es war leider nicht Sahne, sondern nur Seife&quot;, sagte er und setzte seine Rede fort.\nDer Landesvorsitzende der Linken in Mecklenburg-Vorpommern distanzierte sich von dem Vorfall und betonte, dass Gewalt keine Lösung sei.", "title": "Title Not Found", "article": "Bundesgesundheitsminister Karl Lauterbach (SPD) hat den Wurf einer Schaumtorte auf den ehemaligen Finanzminister Christian Lindner (FDP) deutlich kritisiert. &quot;Es fängt mit der Torte an und hört mit Steinen oder mit Sprengsätzen auf&quot;, sagte Lauterbach. Gewalt sei immer abzulehnen, daher verurteile er diesen Angriff auf Lindner.\n&quot;Das dürfen wir nicht akzeptieren&quot;, sagte der SPD-Politiker. &quot;Verrohung des politischen Prozesses beschädigt die Demokratie. Von daher muss das bestraft werden, das ist kein Kavaliersdelikt.&quot;\nAuch der Kanzlerkandidat der Grünen, Robert Habeck, kritisierte den Wurf einer Schaumtorte auf Lindner. &quot;Tätliche Angriffe jedweder Art haben im Ringen um die besten Lösungen für dieses Land nichts zu suchen!&quot;, schrieb Habeck auf der Plattform X.\nDer FDP-Vorsitzende Christian Lindner war bei einem Wahlkampfauftritt in Greifswald von einer Lokalpolitikerin der Linken mit einer schaumartigen Substanz beworfen worden. Der Wurf traf den früheren Finanzminister direkt ins Gesicht.\nLindner probierte den Schaum und setzte \nseine Rede fort. &quot;Es war leider nicht Sahne, sondern nur Seife&quot;, sagte \ner. &quot;Wenigstens das hätten Sie besser machen können, dann hätte ich auch\n was davon gehabt.&quot; Eine lokale FDP-Sprecherin und Augenzeugin sagte, es habe sich um eine Pseudo-Torte aus Rasierschaum gehandelt.\nLinken-Landeschef distanziert sich\nDer Landesvorsitzende der Linken in Mecklenburg-Vorpommern, Hennis Herbst, bestätigte, dass die junge Frau seiner Partei angehört, und distanzierte sich von der Tat. &quot;Derartige Aktionen gehören für die Linke MV nicht zur politischen Auseinandersetzung und sind konsequent abzulehnen&quot;, sagte Herbst.\nEs gehe darum, die inhaltliche Debatte mit der politischen Konkurrenz zu führen, auch mit der FDP, sagte der Linken-Landeschef. &quot;Derartige Störaktionen anderer Wahlkampfauftritte gehören nicht dazu und tragen nicht zum Vorbringen berechtigter Kritik an der Politik der FDP bei.&quot;\nDer FDP-Chef setzte unterdessen seinen Wahlkampf ohne Unterbrechung fort. Am frühen Nachmittag trat er auf dem Universitätsplatz in Rostock vor mehreren Hundert Menschen auf. Bei seiner Ankunft sagte Lindner: &quot;Mich bringt nichts aus der Ruhe.&quot;\nBereits im vergangenen Jahr gab es mehrere Angriffe auf Politiker in Deutschland. Unter anderem wurde bei einer Wahlkampfveranstaltung des BSW im August die Parteichefin Sahra Wagenknecht mit roter Farbe bespritzt . Für Empörung sorgte ein Angriff auf den SPD-Europaabgeordneten Matthias Ecke, der im Mai von \nmehreren jungen Männern schwer verletzt wurde."}, {"id": "s020", "type": "add_in_domain_sentence", "definition": "Add in-domain sentence: one sentence was added that sounds fitting but does not belong to this article.", "original": "Belohnungen wie Süßigkeiten, Geld oder Mediennutzungszeiten können Kinder dazu bringen, im Haushalt mitzuhelfen, aber laut Familientherapeutin Christine Ordnung schaden sie der Beziehung zum Kind und dem Kind selbst. Belohnungssysteme lenken Kinder von ihrer inneren Motivation ab und machen sie abhängig. Stattdessen sollten Eltern auf Kooperation setzen und das Kind als wertvolles Mitglied der Familie betrachten, das gerne mitarbeitet. Lob und Belohnungen sollten vermieden werden, stattdessen ist es wichtig, Anerkennung auszusprechen und gemeinsam Freude an den erledigten Aufgaben zu haben.", "modified": "Belohnungen wie Süßigkeiten, Geld oder Mediennutzungszeiten können Kinder dazu bringen, im Haushalt mitzuhelfen, aber laut Familientherapeutin Christine Ordnung schaden sie der Beziehung zum Kind und dem Kind selbst. Belohnungssysteme lenken Kinder von ihrer inneren Motivation ab und machen sie abhängig. Stattdessen sollten Eltern auf Kooperation setzen und das Kind als wertvolles Mitglied der Familie betrachten, das gerne mitarbeitet. Lob und Belohnungen sollten vermieden werden, stattdessen ist es wichtig, Anerkennung auszusprechen und gemeinsam Freude an den erledigten Aufgaben zu haben.<ins> Ordnung rät Eltern, für gemeinsame Aufgaben feste Wochenpläne mit kleinen Symbolkarten zu gestalten.<\/ins>", "title": "&quot;Belohnen korrumpiert das Kind&quot;", "article": "Wie bringt man das Kind dazu, im Haushalt mitzuhelfen, oder Aufgaben, die es erledigen soll, auch tatsächlich zu erledigen? Indem man es motiviert. Süßigkeiten, Geld oder Mediennutzungszeiten bieten solche Anreize. Positives Handeln mit etwas Positivem zu belohnen, erscheint vielen Eltern einleuchtend. Es schadet jedoch dem Kind und der Beziehung zum Kind, erklärt die Familientherapeutin Christine Ordnung in unserer aktuellen Folge der Serie &quot; Familienrat &quot;.\nZEIT ONLINE: Süßigkeiten, ein paar Cent, mehr Handyzeit: Wann machen Belohnungen Sinn?\nChristine Ordnung: Wenn ich will, dass mein Kind funktioniert und gehorcht. Und deshalb gehören sie zu den ganz veralteten Erziehungsmethoden und eigentlich ins Museum.\nZEIT ONLINE : Stimmt es denn nicht, dass mit einer Belohnung etwas Positives verstärkt wird?\nOrdnung: Das war die ursprüngliche Idee. In meiner Kindheit war Gehorsam eine Tugend. Und Gehorsam erreiche ich durch entsprechende Strafmaßnahmen – oder durch Belohnungen. Es sind zwei Seiten derselben Medaille. Ein Kind, das eine Belohnung erwartet und keine kriegt, empfindet das als Strafe.\nZEIT ONLINE : Nehmen wir das Beispiel Spülmaschine aus- und einräumen. Ich kenne Familien, in denen das mit Belohnungen verknüpft wird, damit die Kinder es erledigen. Die Eltern argumentieren mit Anreiz und Motivation. Das funktioniert aber gar nicht?\nOrdnung: Für diesen Anreiz und diese Motivation werden sie einen sehr hohen Preis zahlen. Wenn ich schon mit Zwei-, Drei- oder Vierjährigen anfange, Tätigkeiten wie Spielzeugwegräumen mit Belohnungen zu verknüpfen, orientiere ich das Kind nach außen. Ich lenke es ab von seiner inneren Wahrnehmung und seiner Lust, Teil der Gemeinschaft zu sein, mitzuarbeiten und dem Vorbild nachzuahmen. Ich mache das Kind zu einem Esel, der nur der Möhre nachläuft. Die Beziehung zwischen Kindern und Erwachsenen baut jedoch durchweg auf Kooperation und gemeinsamer Entwicklung. Diese Beziehung wird durch Belohnungssysteme korrumpiert, ja, regelrecht zerstört.\nZEIT ONLINE : Kooperation klingt wunderschön. Aber wie schaffe ich denn die intrinsische Motivation, die notwendig ist, damit das Kind voller Freude oder zumindest ganz selbstverständlich die Spülmaschine ausräumt? Der Job ist schließlich nicht der tollste, sondern ein bisschen langweilig und muss vor allem erledigt werden.\nOrdnung: Ich glaube, da handelt es sich um ein Missverständnis. Mit Kooperation ist nicht gemeint, dass meine Kinder genau das tun, was ich gern hätte, und das mit voller Freude. Kooperation beschreibt die Art, wie Kinder mit uns Erwachsenen interagieren. Dabei spielen auch unsere negativen Erwartungen eine Rolle – und alle Signale, die wir aussenden, auch die unbewussten. Hausarbeit macht wunderbar sichtbar, wie in einer Familie das Miteinander läuft. Auch ich kenne wenig Erwachsene, die mit guter Laune Putzlumpen wedelnd durch die Wohnung wuseln. Die Frage ist, was man vorlebt und welche Selbstverständlichkeit Haushalt, Putzen und Aufräumen haben. Wenn ich dem Kind Belohnungen zahle, damit es das überhaupt tut, weil ich davon ausgehe, dass es ohne nicht bereit ist, sich an den alltäglichen Arbeiten zu beteiligen, ignoriere ich die Bereitschaft des Kindes, seinen eigenen Beitrag für das Miteinander leisten zu wollen. Auch wenn die Verantwortung für all diese Alltagstätigkeiten beim Erwachsenen liegen: Kinder helfen gerne mit. Sie wollen ein wertvolles Mitglied der Familie sein. Früher haben Eltern oft mit Strafen oder Androhungen gearbeitet, heute mit Verlocken und Belohnungen. Das ist Bestechung. Ein heftiger Begriff, aber er macht deutlich, was Eltern aufs Spiel setzen: Auf Dauer korrumpiert Belohnen das Kind, und die Beziehung funktioniert nur noch darüber. Irgendwann haben wir dann Kinder, die sagen: &quot;Was kriege ich dafür?&quot;\nZEIT ONLINE : Das klingt fast nach Abhängigkeit.\nOrdnung: Ja, es ist wirklich eine Abhängigkeit. Handyspielen und Algorithmen wie hinter TikTok oder YouTube wird vorgeworfen, dass sie schnelle Anreize bieten, mein Belohnungssystem triggern und daher Suchtpotenzial haben. Letztendlich mache ich mit meiner Art, Kleinigkeiten zu belohnen, jedoch nichts anderes als Candy Crush. Belohnungen – egal ob Smileys, Handyzeit oder Geld – bahnen Abhängigkeiten an. Dem sollte ich durch mein eigenes Verhalten nicht noch Vorschub leisten. Solche Teufelskreise können wirklich absurde Ausmaße annehmen. Ein Kollege erzählte, dass ein Junge sich geweigert hat, auf die Toilette zu gehen, und immer in die Windel kackte. Die Eltern haben ihn dann jedes Mal dafür belohnt, wenn er auf die Toilette gegangen ist. Über lange Zeit ist das Kind dann nur auf die Toilette gegangen, wenn es eine Belohnung bekommen hat – und die musste immer größer werden. Denn auch das gilt es zu bedenken: 50 Cent reichen bald nicht mehr aus.\nZEIT ONLINE : Zurück zum Beispiel Spülmaschine. Wie versteht das Kind: Einer muss den Job machen und das könnte auch mal ich sein?\nOrdnung: Das muss nicht das Kind kapieren, sondern der Erwachsene. Falls die Mutter oder der Vater bislang mit Belohnungen gearbeitet hat, könnte sie oder er sagen: &quot;Es tut mir leid, ich habe dich bestochen. Jetzt hör ich damit auf.&quot; Und dann setzt man sich mit dem Kind auseinander und mutet sich ihm zu: &quot;Ich will, dass du die Spülmaschine ausräumst.&quot; Und gegebenenfalls: &quot;Du hast es nicht getan. Ich ärgere mich.&quot; Gut möglich, dass das Kind antwortet: &quot;Lass mich mit deiner Spülmaschine in Ruhe!&quot; Dann haben Sie einen Konflikt. Den gilt es miteinander zu klären: &quot;Was ist los, dass du dich unwohl fühlst und dich nicht beteiligen kannst oder willst?&quot; Es geht um die Frage, welche Fähigkeiten und Eigenschaften ich als Erwachsene entwickeln muss, damit ich unser Zusammenleben so gestalten kann, dass es für alle okay ist, daran teilzuhaben. Ich muss mich dafür interessieren, warum das Kind immer Nein sagt – und nicht denken, mit einer Tafel Schokolade oder mehr Handyzeit klappe das schon.\nZEIT ONLINE : Ich mache also transparent, was ich mir vom Kind wünsche und dass es schön wäre, wenn es Freude dabei empfindet, Teil dieser funktionierenden Familie zu sein, und auch mal mithilft. Nur klingt das für mich immer noch einfacher, als es sich im Alltag oft darstellt.\nOrdnung: Es braucht eine ganze Kindheit, bis sich das entwickelt. In jeder Altersstufe geht eine neue Auseinandersetzung los. Kinder bringen die besten Voraussetzungen jedoch mit: Wenn sie klein sind, wollen sie einfach immer dabei sein. Eltern sollten dann nicht sagen: &quot;Das kann ich besser, geh mal aus dem Weg.&quot; Es wäre ratsamer, das Kind einzubeziehen. Später folgt eine Phase, in der es für das Kind viel wichtigere Dinge gibt – spielen! –, als den Eltern zu helfen. Dann ist es in Ordnung, als Eltern zu sagen: &quot;Du kommst jetzt, und zwar sofort.&quot; Klar, dann wird das Kind maulen und sagen: &quot;Das ist ungerecht! Das ist Kinderarbeit!&quot; So eine Antwort bedeutet: Das Kind hat keine Angst und kann seinen Gefühlen Ausdruck verleihen. Prima. Jetzt kann ich antworten: &quot;Ja, ich weiß, du hast keinen Bock. Dann mach&#x27;s ohne Bock.&quot;\nZEIT ONLINE : Wie ertrage ich als Mutter oder Vater die Reaktion?\nOrdnung: Eine interessante Frage, denn sie spiegelt wider, was ich in den letzten Jahren immer häufiger beobachte: Eltern denken, ihr Kind müsste alles freiwillig tun – und falls nicht, sind sie eine schlechte Mutter oder ein schlechter Vater. Und falls sie es dann vom Kind verlangen, sind sie ebenfalls schlechte Eltern. Das ist eine sehr romantische Vorstellung! Auseinandersetzungen gibt es. Es darf sie auch geben. Sie bergen das Potenzial für Entwicklung. Jeder in der Familie kann den Konflikt nutzen und sich fragen: Ich will es nicht tun, aber wie fühlt es sich hinterher an, wenn ich es gegen meinen Willen doch getan habe? Vielleicht ärgere ich mich ein bisschen – blöd, ja –, aber dann habe ich womöglich ein gutes Gefühl: Ich hab&#x27;s geschafft und mitgearbeitet. Jesper Juul hat immer betont, dass jeder Mensch für die Gemeinschaft wertvoll sein will. Gleichzeitig ist Familie kein Club Med, wo immer alles für einen erledigt wird. Wir müssen darum miteinander ringen.\nZEIT ONLINE : Ist es schon Belohnung, also kontraproduktiv, wenn ich dem Kind vermittle, dass mich sein Aufräumen oder Mithelfen freut? Anders gefragt: Ist es nicht vielleicht doch eine Art guter Belohnung, wenn das Kind wahrnimmt, dass sein Tun mir Freude bereitet?\nOrdnung: Auch wenn es umgangssprachlich als Belohnung durchgeht, kann ich mich schon miteinander an etwas freuen, und ich kann mich selbstverständlich auch beim anderen bedanken. Wichtig ist allerdings: Die Verantwortung für meine Stimmung darf nicht zum Kind hinüberrutschen. Weder das Kind noch das unaufgeräumte Zimmer sind für den versauten Sonntag verantwortlich. Für meine Laune – auch für die schlechte – bin ich zuständig.\nZEIT ONLINE : Meine subjektive Wahrnehmung ist, dass es in der Kita eine größere Selbstverständlichkeit des Mithelfens gibt. Viele Eltern sind verblüfft, dass dort so Dinge wie Geschirrwegräumen funktionieren.\nOrdnung: Ja, aber wenn sie es zu Hause nicht hinkriegen, sollten Eltern nicht über einen Trick nachdenken, also Belohnung oder Lob.\nZEIT ONLINE : Lob ist genauso falsch wie Belohnung?\nOrdnung: Oh ja, es wird zu viel gelobt. Lob kommt wie die Belohnung von oben herab. Die Person, die mehr Macht hat, kann belohnen oder loben – oder eben nicht. Anerkennen ist viel wertvoller. Wenn das Kind lange geübt hat und endlich ein Rad oder einen Handstand schafft, kann ich sagen: &quot;Wow, das hast du wochenlang probiert, und jetzt klappt&#x27;s.&quot; Dann kann man sich gemeinsam freuen. Auch hier hilft es wieder, den eigenen Umgang mit dem Kind zu hinterfragen, und wenn ich nicht genauso auf einen Erwachsenen reagieren würde, sollte ich es auch nicht gegenüber dem Kind tun. Auch ein Kind überprüft, ob das, was jemand ihm sagt, zutrifft und ob es mit dem übereinstimmt, was es empfindet – oder ob ein Lob nur aufgepappt ist und an der Oberfläche bleibt. &quot;Super! Ganz toll!&quot; macht innerlich nicht satt, wenn es zu oft, zu beiläufig und für jeden Pups kommt."}, {"id": "s041", "type": "add_in_domain_sentence", "definition": "Add in-domain sentence: one sentence was added that sounds fitting but does not belong to this article.", "original": "Elon Musk mischt sich vermehrt in die Politik ein, unterstützt Donald Trump und äußert sich positiv zur AfD. Trotzdem steigen die Tesla-Aktien, aber einige Tesla-Fahrer distanzieren sich von Musks politischen Äußerungen. Es gibt drei Gruppen: Diejenigen, die Musk und Tesla weiterhin unterstützen, diejenigen, die sich von Musks Äußerungen distanzieren, aber Tesla als gutes Auto betrachten, und diejenigen, die sich von Musk und Tesla abwenden und sogar ihren Tesla verkaufen wollen. Experten warnen, dass Musks politische Äußerungen der Marke Tesla schaden könnten, aber Musk scheint diesen Schaden in Kauf zu nehmen, um politischen Erfolg zu erzielen.", "modified": "Elon Musk mischt sich vermehrt in die Politik ein, unterstützt Donald Trump und äußert sich positiv zur AfD. Trotzdem steigen die Tesla-Aktien, aber einige Tesla-Fahrer distanzieren sich von Musks politischen Äußerungen. Es gibt drei Gruppen: Diejenigen, die Musk und Tesla weiterhin unterstützen, diejenigen, die sich von Musks Äußerungen distanzieren, aber Tesla als gutes Auto betrachten, und diejenigen, die sich von Musk und Tesla abwenden und sogar ihren Tesla verkaufen wollen. Experten warnen, dass Musks politische Äußerungen der Marke Tesla schaden könnten, aber Musk scheint diesen Schaden in Kauf zu nehmen, um politischen Erfolg zu erzielen.<ins> In manchen Autohäusern wird inzwischen häufiger nach gebrauchten Elektroautos anderer Marken gefragt.<\/ins>", "title": "&quot;Ich will Herrn Musk ja nicht heiraten&quot;", "article": "An Elon Musk gibt es derzeit kaum ein Vorbeikommen. Erst bietet er dem zukünftigen republikanischen Präsidenten Donald Trump seine Unterstützung bei der Regierungsarbeit an , dann spricht er sich für die AfD als letzte Hoffnung für Deutschland aus , gibt Alice Weidel auf seiner Plattform X eine Bühne und mischt sich vermehrt auch in die Politik anderer Länder ein – ohne Berührungsängste mit Rechtspopulisten.\nDem Unternehmen Tesla, dessen CEO Musk ist und an dem er etwa 13 Prozent der Firmenanteile hält, scheint das bisher nicht zu schaden: Die monatlichen Neuzulassungen in Deutschland sind seit Ende 2022 zwar rückläufig, aber diese Absatzkrise teilen alle E-Autohersteller. Und seit bekannt ist, dass Musk an der Regierung Trump beteiligt sein wird, sind die Tesla-Aktien sogar von rund 220 US-Dollar auf nun rund 400 US-Dollar im Wert gestiegen.\nAber jubeln auch diejenigen, die im Alltag mit einem Tesla auf deutschen Straßen unterwegs sind? ZEIT ONLINE hat Tesla-Fahrerinnen und -Fahrer gefragt, über 600 Menschen haben sich zurückgemeldet. Das Ergebnis ist nicht repräsentativ für alle Teslabesitzer in Deutschland. Es gibt einen Eindruck davon, wie viel politisches Engagement einzelne Kundinnen und Kunden dem Firmengründer Musk erlauben. Und dass Tesla zumindest in Deutschland manche Kundinnen und Kunden verlieren könnte. Eine Annäherung in drei Gruppen:\nOhne Musk gäbe es Tesla nicht, er sei ein Techgenie, und daran würden auch seine politischen Äußerungen nichts ändern: So in etwa lassen sich die Aussagen derjenigen zusammenfassen, die trotz – oder gerade wegen – der Äußerungen von Musk auch zu einem seiner bekanntesten Produkte halten. Viele in dieser ersten Gruppe der Musk- und Teslafans spielen die mediale Aufregung um den Unternehmer herunter.\nAnders hingegen eine zweite Gruppe, die sich unter den Zuschriften ausmachen lässt: Sie distanzieren sich deutlich von Musks Äußerungen – sehen in ihrem Tesla aber weiterhin ein gutes Auto. Sie betonen, dass das Preis-Leistungs-Verhältnis zum Kaufzeitpunkt das beste war und Tesla der Konkurrenz noch immer überlegen ist. Diese pragmatischen Gründe stünden für sie im Vordergrund, weniger das politische Auftreten des Firmenchefs.\nUm ihre Distanz zu Elon Musk trotz ihres Tesla zu unterstreichen, wählen einige Besitzerinnen und Besitzer offenbar ein kreatives Mittel: Mehrere der Zuschriften, die bei ZEIT ONLINE eingegangen sind, berichten von Aufklebern, die sie sich anschaffen wollen oder die ihnen auf anderen Teslas aufgefallen sind, manche hängen Fotos an: &quot;Das Auto ist gut – Elon Musk nicht.&quot;\nEine dritte Gruppe distanziert sich deutlich von Elon Musk und schreibt, daraus auch einen Schluss über die Kaufentscheidung zu ziehen: Wer Tesla kauft, unterstütze damit indirekt auch Musk. Manche bereuten ihren Kauf deshalb, schämten sich für ihr Auto – eine Art &quot;Teslascham&quot;. Andere geben an, sogar einen Schritt weitergehen zu wollen: Sie planten, ihr Fahrzeug zu verkaufen oder zumindest nach Ende des Leasings nicht wieder einen Tesla zu wählen. Ob sie diesen Schritt tatsächlich gehen, kann nicht überprüft werden.\nDamit zeigt die nicht repräsentative Umfrage innerhalb der ZEIT-Leserschaft: Es gibt zumindest Anzeichen dafür, dass manche potenziellen Kundinnen und Kunden sich von Tesla abwenden.\nMusk gefährde damit die Marke Tesla, sagt Henrik Sattler,\nProfessor für Marketing und Branding sowie stellvertretender Dekan an der University of Hamburg Business School. &quot;Politische Äußerungen bergen immer die Gefahr, dass große\nKreise sich damit nicht identifizieren können&quot;, sagt Sattler. Deshalb\nverhielten sich Firmenchefs überwiegend öffentlich unpolitisch, vor allem in\nDeutschland. Nicht so Elon Musk. &quot;Er steht für die Marke Tesla. Seine extremen Äußerungen\nwerden deshalb einen kurz- bis mittelfristigen Schaden an der Marke verursachen.&quot;\nDas nehme Musk jedoch in Kauf. &quot;Ihm geht es jetzt um\npolitischen Erfolg. Und darüber kann er dann auch ökonomisch profitieren&quot;, sagt\nSattler. Am Aktienmarkt scheint diese Strategie bisher aufzugehen. Und auch könnte der Unternehmer mit seinen extremen Wahlempfehlungen einen ganz neuen Kundenkreis erschließen.\nMarketing-Experte Sattler fährt selbst Tesla. Doch aktuell\ngeht es ihm wie einigen der Leserinnen und Leser von ZEIT\nONLINE, die an der Befragung teilgenommen haben: Er würde sich nach eigenen Angaben wahrscheinlich nicht erneut für das Auto\nentscheiden – wegen Musks Verhalten.\nDieser Artikel wurde durch die Perspektiven unserer Leserschaft bereichert. Hier finden Sie alle Texte mit Stimmen aus der Community .\n*Die vollständigen Namen aller hier gezeigten Einreichungen sind der Redaktion bekannt. Manche baten darum, nur mit Vornamen oder unter Pseudonym veröffentlicht zu werden."}, {"id": "s045", "type": "add_in_domain_sentence", "definition": "Add in-domain sentence: one sentence was added that sounds fitting but does not belong to this article.", "original": "Junge Erwachsene in Deutschland sind zunehmend von Armut bedroht, wie der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit zeigt: 25 Prozent der 18- bis 24-Jährigen und 21 Prozent der unter 18-Jährigen lebten 2023 nahe der Armutsgrenze. Wohnen ist dabei ein wichtiger Faktor, da insbesondere Studierende und Auszubildende von hohen Mieten betroffen sind: Jeder dritte Studierende und jeder zweite Auszubildende gibt mehr als 40 Prozent ihres Einkommens für den Wohnraum aus. Die Wohnungsnot trifft somit vermehrt junge Menschen, was zu wachsender Sorge und Unsicherheit führt.", "modified": "Junge Erwachsene in Deutschland sind zunehmend von Armut bedroht, wie der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit zeigt: 25 Prozent der 18- bis 24-Jährigen und 21 Prozent der unter 18-Jährigen lebten 2023 nahe der Armutsgrenze. Wohnen ist dabei ein wichtiger Faktor, da insbesondere Studierende und Auszubildende von hohen Mieten betroffen sind: Jeder dritte Studierende und jeder zweite Auszubildende gibt mehr als 40 Prozent ihres Einkommens für den Wohnraum aus. Die Wohnungsnot trifft somit vermehrt junge Menschen, was zu wachsender Sorge und Unsicherheit führt.<ins> Kommunen könnten leer stehende Bürogebäude vorübergehend in kleine Wohnheime für Auszubildende umwandeln.<\/ins>", "title": "Title Not Found", "article": "Etwa jeder vierte junge Erwachsene in Deutschland ist armutsgefährdet . Zu diesem Ergebnis kommt der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit. Demnach lag die sogenannte Armutsgefährdungsquote in der Altersgruppe von 18 bis 24 Jahren 2023 bei 25 Prozent.\nBei den unter 18-Jährigen lag sie etwas niedriger: Dort waren 21 Prozent von Armut bedroht. Die Zahlen decken sich in etwa mit denen des Monitors Jugendarmut 2022 . Dem zufolge waren 2021 25,5 Prozent der 18- bis 25-Jährigen sowie 20,8 Prozent der Minderjährigen von Armut bedroht.\nIn die Kategorie Armut fallen Menschen, die mit weniger als 60 Prozent des mittleren Einkommens auskommen müssen. Das traf deutschlandweit auf rund zwölf Millionen Menschen zu. Nach Abzug von Steuern und Sozialabgaben lag das mittlere Einkommen für eine alleinlebende Person 2023 bei 1.310 Euro monatlich.\n\nWohnen birgt Armutsrisiko\n\nArmut geht laut dem Verband häufig mit Ängsten einher. Demnach sorgen sich 54 Prozent der Jugendlichen wegen hoher Mieten . Vor allem Studierende und Auszubildende fallen in die Risikogruppe . 50 Prozent der Auszubildenden sowie jeder dritte Studierende galten 2023 als &quot;durch Wohnkosten überlastet&quot;, mussten also mehr als 40 Prozent ihres Einkommens für den Wohnraum aufbringen.\nDie Wohnungsnot betrifft somit häufig junge Menschen. Dem Bericht zufolge waren 40 Prozent aller Wohnungslosen, die 2024 in einer Einrichtung untergebracht wurden, jünger als 25 Jahre. Die Bundesgemeinschaft wertet für den Bericht unter anderem vorliegende Daten des Statistischen Bundesamtes und anderer Studien aus."}, {"id": "s050", "type": "add_in_domain_sentence", "definition": "Add in-domain sentence: one sentence was added that sounds fitting but does not belong to this article.", "original": "Unionskanzlerkandidat Friedrich Merz wirbt bei einer Klausurtagung des CDU-Vorstands in Hamburg für Kurskorrekturen in der deutschen Politik nach der Bundestagswahl, insbesondere in den Bereichen Wirtschaft, Arbeitsmarkt, Migrationspolitik, innere Sicherheit und Außenpolitik. Er betont eine mögliche bessere Stimmung in der Wirtschaft bei einem Wahlsieg der Union, relativiert jedoch das Zwei-Prozent-Ziel. Merz plant eine Zusammenarbeit mit der künftigen US-Regierung, fordert jedoch eine einheitliche europäische Position. Er schließt eine Zusammenarbeit mit der AfD aus und rechnet mit 35 bis 40 Prozent für die CDU am Wahltag. Die Partei hat 2024 mehr als 20.000 Neumitglieder aufgenommen und ist damit die größte Partei in Deutschland. Ein beschlossenes Konzept zur inneren Sicherheit sieht eine bessere Ausstattung der Sicherheitsbehörden und konsequente Ausweisung ausländischer Straftäter vor.", "modified": "Unionskanzlerkandidat Friedrich Merz wirbt bei einer Klausurtagung des CDU-Vorstands in Hamburg für Kurskorrekturen in der deutschen Politik nach der Bundestagswahl, insbesondere in den Bereichen Wirtschaft, Arbeitsmarkt, Migrationspolitik, innere Sicherheit und Außenpolitik. Er betont eine mögliche bessere Stimmung in der Wirtschaft bei einem Wahlsieg der Union, relativiert jedoch das Zwei-Prozent-Ziel. Merz plant eine Zusammenarbeit mit der künftigen US-Regierung, fordert jedoch eine einheitliche europäische Position. Er schließt eine Zusammenarbeit mit der AfD aus und rechnet mit 35 bis 40 Prozent für die CDU am Wahltag. Die Partei hat 2024 mehr als 20.000 Neumitglieder aufgenommen und ist damit die größte Partei in Deutschland. Ein beschlossenes Konzept zur inneren Sicherheit sieht eine bessere Ausstattung der Sicherheitsbehörden und konsequente Ausweisung ausländischer Straftäter vor.<ins> Merz kündigte an, dass die CDU vor der Wahl eine zusätzliche bundesweite Wirtschaftskonferenz mit mittelständischen Betrieben veranstalten werde.<\/ins>", "title": "Merz verspricht wirtschaftlichen Stimmungswandel", "article": "Zum Abschluss einer Klausurtagung des CDU -Vorstands in Hamburg wirbt Unionskanzlerkandidat Friedrich Merz für deutliche Kurskorrekturen in der deutschen Politik nach der Bundestagswahl. &quot;Wir brauchen einen wirklich grundlegenden Wechsel in wesentlichen Teilen der Politik&quot;, sagte Merz. Dies betreffe Wirtschaft, Arbeitsmarkt, Migrationspolitik, innere Sicherheit und auch einige Bereiche der Außen- und Sicherheitspolitik.\nBei einem Wahlsieg der Union hält Merz eine bessere Stimmung in der deutschen Wirtschaft für möglich. &quot;Wenn wir es richtig machen, dann haben wir zur Sommerpause 2025 in Deutschland eine andere Stimmung&quot;, sagte er. Allerdings relativierte er das Zwei-Prozent-Ziel, das die CDU mit ihrer &quot;Agenda 2030&quot; in Aussicht gestellt hatte . Der Staat könne nur dafür sorgen, die richtigen Rahmenbedingungen zu schaffen, damit die Wirtschaft wachsen könne, betonte er.\n\nZusammenarbeit mit Donald Trump\n\nMit der künftigen US-Regierung will Merz über ein EU-USA-Freihandelsabkommen und eine gemeinsame China-Strategie sprechen. Dies setze aber eine einheitliche europäische Position voraus. &quot;Da hilft kein erhobener Zeigefinger&quot;, sagte Merz.\nEr sehe sehr viel mehr Zusammenarbeitsmöglichkeiten als Konflikte mit Washington. &quot;Bevor wir Botschaften in die USA schicken, sollten wir uns auf europäischer Ebene verständigen&quot;, sagt er. Donald Trump werde sich nicht von einem vierminütigen Statement von Kanzler Olaf Scholz beeindrucken lassen.\nZuvor hatte Bundeskanzler Olaf Scholz erneut auf dem SPD-Sonderparteitag in Berlin Äußerungen Trumps kritisiert , der die Unabhängigkeit Kanadas infrage gestellt und Ansprüche auf Grönland und den Panama-Kanal erhoben hatte.\n\nKeine Rentenkürzungen\n\nMit Blick auf soziale Themen erläuterte Merz: &quot;Wenn wir weiter in der Rezession bleiben, ist das die größte Bedrohung für die Renten.&quot; Er stellte erneut klar, dass die Union keine Rentenkürzungen plane. Die Renten könnten aber langsamer ansteigen. &quot;Die Bäume wachsen, aber sie wachsen nicht in den Himmel.&quot;\nZu möglichen Koalitionspartnern äußerte sich der Unionskanzlerkandidat nicht. &quot;Wir führen keinen Wahlkampf gegenüber jemandem, sondern wir führen den Wahlkampf für uns&quot;, sagte er. Der CDU-Vorsitzende schloss aber eine Zusammenarbeit mit der AfD aus.\n\nMerz rechnet mit 35 bis 40 Prozent\n\nDer Parteichef sieht seine Partei am Wahltag zwischen 35 und 40 Prozent. Das Allensbach-Institut sehe CDU und CSU bei &quot;konstant 35 bis 37 Prozent&quot;, während die Parteien bei anderen Instituten zusammen bei um die 30 Prozent liegen, sagte Merz.\nNach Angaben von CDU-Generalsekretär Carsten Linnemann hat seine Partei 2024 mehr als 20.000 Neumitglieder aufgenommen. Das sei so viel gewesen wie seit 20 Jahren nicht mehr, auch netto gebe es einen klaren Zuwachs, sagt er am Ende der Klausurtagung. Die CDU sei damit die größte Partei in Deutschland.\n\nKonzept zur inneren Sicherheit\n\nEin in Hamburg beschlossenes \nKonzept zur inneren Sicherheit\n sieht vor, die Ausstattung der Sicherheitsbehörden und den Informationsaustausch zwischen Bund und Ländern zu verbessern. Ausländische Straftäter und Gefährder will die CDU zudem &quot;konsequent ausweisen&quot;.\nEs sei &quot;oberste Pflicht unseres Staates, die Menschen in Deutschland zu schützen&quot;, erklärte die Partei. &quot;Doch diese Sicherheit und mit ihr das Sicherheitsgefühl der Menschen wurden zuletzt tiefgreifend erschüttert.&quot; Nötig sei deshalb dringend ein &quot;Politikwechsel bei der inneren Sicherheit&quot;."}, {"id": "s053", "type": "add_in_domain_sentence", "definition": "Add in-domain sentence: one sentence was added that sounds fitting but does not belong to this article.", "original": "Der Ausbruch der Maul- und Klauenseuche in Brandenburg hat bereits wirtschaftliche Schäden von über einer Milliarde Euro verursacht, schätzt der Deutsche Raiffeisenverband. Unternehmen meiden Ware aus Deutschland, was zu einem Umsatzverlust entlang der Wertschöpfungskette führt. Länder wie Südkorea, Mexiko und Großbritannien haben die Einfuhr von Fleisch- und Milchprodukten gestoppt. Innerhalb der EU gibt es kleinere Einschränkungen im Handel, aber auch hier meiden Unternehmen Ware aus Deutschland. Bisher sind keine Fälle außerhalb von Brandenburg bestätigt.", "modified": "Der Ausbruch der Maul- und Klauenseuche in Brandenburg hat bereits wirtschaftliche Schäden von über einer Milliarde Euro verursacht, schätzt der Deutsche Raiffeisenverband. Unternehmen meiden Ware aus Deutschland, was zu einem Umsatzverlust entlang der Wertschöpfungskette führt. Länder wie Südkorea, Mexiko und Großbritannien haben die Einfuhr von Fleisch- und Milchprodukten gestoppt. Innerhalb der EU gibt es kleinere Einschränkungen im Handel, aber auch hier meiden Unternehmen Ware aus Deutschland. Bisher sind keine Fälle außerhalb von Brandenburg bestätigt.<ins> Der Verband fordert deshalb eine bundesweite Entschädigung für Betriebe, die ihre Milchproduktion vorsorglich drosseln.<\/ins>", "title": "Maul- und Klauenseuche verursacht bereits Milliardenschaden", "article": "Der Ausbruch der Maul- und Klauenseuche hat bereits milliardenschwere wirtschaftliche Schäden verursacht. Das schätzt der Deutsche Raiffeisenverband. &quot;Entlang der Wertschöpfungskette gehen wir davon aus, dass bereits jetzt ein Umsatzverlust von mehr als einer Milliarde Euro existiert&quot;, sagte der Hauptgeschäftsführer des Verbands, Jörg Migende.\nUnternehmen mieden demnach aus Unsicherheit Ware aus Deutschland, um den Import der Maul- und Klauenseuche, die in Brandenburg ausgebrochen war, zu verhindern. Der Verband geht deshalb davon aus, dass die wirtschaftlichen Einbußen noch deutlich höher werden.\nDer bisherige Schaden sei unter anderem dadurch entstanden, dass Länder wie Südkorea, Mexiko und Großbritannien die Einfuhr von Fleisch- und Milchprodukten aus Deutschland gestoppt haben. Innerhalb der Europäischen Union läuft der Handel nach einer Entscheidung der EU-Kommission vom Mittwoch mit kleineren Einschränkungen weiter. Doch auch Unternehmen innerhalb der EU würden gerade Ware aus ganz Deutschland meiden, sagte Verbandschef Migende.\nDie Maul- und Klauenseuche ist eine hochansteckende Viruserkrankung. Es erkranken vor allem Klauentiere wie Rinder, Schweine und Ziegen. Die Seuche war am Freitag auf einem Hof in Brandenburg festgestellt worden, nachdem es zuvor in Deutschland jahrzehntelang keine Fälle gegeben hatte. Fälle außerhalb von Brandenburg wurden bisher nicht bestätigt."}, {"id": "s014", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Der neue französische Premierminister François Bayrou kündigte in seiner ersten Regierungserklärung an, die umstrittene Rentenreform durch die Sozialpartner neu zu verhandeln und die Staatsausgaben zu regeln, um das Schuldenproblem anzugehen. Bayrou betonte die Dringlichkeit der Rentenreform und die Notwendigkeit, das Staatsbudget zu überarbeiten. Er sprach sich für eine enge Zusammenarbeit mit den Sozialpartnern aus und betonte die Bedeutung von Investitionen und einer stärkeren europäischen Zusammenarbeit. Die Regierung plant außerdem Maßnahmen zur Stärkung der Demokratie, zur effektiveren Migrationskontrolle und zur Verbesserung der Gesundheitspolitik. Trotzdem droht der Regierung ein <del>Misstrauensvotum,<\/del> da sie keine eigene Mehrheit im Parlament hat.", "modified": "Der neue französische Premierminister François Bayrou kündigte in seiner ersten Regierungserklärung an, die umstrittene Rentenreform durch die Sozialpartner neu zu verhandeln und die Staatsausgaben zu regeln, um das Schuldenproblem anzugehen. Bayrou betonte die Dringlichkeit der Rentenreform und die Notwendigkeit, das Staatsbudget zu überarbeiten. Er sprach sich für eine enge Zusammenarbeit mit den Sozialpartnern aus und betonte die Bedeutung von Investitionen und einer stärkeren europäischen Zusammenarbeit. Die Regierung plant außerdem Maßnahmen zur Stärkung der Demokratie, zur effektiveren Migrationskontrolle und zur Verbesserung der Gesundheitspolitik. Trotzdem droht der Regierung ein <ins>Misstrauensvotum am 16. Januar 2025,<\/ins> da sie keine eigene Mehrheit im Parlament hat.", "title": "Title Not Found", "article": "In seiner ersten Regierungserklärung hat der neue französische Premierminister François Bayrou eine Neufassung der umstrittenen Rentenreform durch die Sozialpartner angekündigt. Außerdem wolle er die Ausgaben des französischen Staates neu regeln, um das Schuldenproblem anzupacken. Seine Regierung befinde sich in einer herausfordernden Situation. Ein großer Teil der Menschen in Frankreich gehe nicht davon aus, dass \ndie Regierung unter diesen Voraussetzungen länger an der Macht bleibe, sagte Bayrou. \nWenn alles verloren scheint, müsse man aber an Mut glauben. Die Menschen\n erwarteten, dass das Parlament und die Regierung nun ihre Kräfte \nbündelten.\nDringend sei vor allem die Neuregelung der Rente, sagte Bayrou. Das \nDefizit des Rentensystems sei besonders hoch. Diese Schulden seien auch \nein moralisches Problem, weil sie die Generationengerechtigkeit \nverletzten. Die aktuelle Fassung der Rentenreform wird jedoch im \nParlament weitgehend abgelehnt. &quot;Ich entscheide mich dafür, dieses Thema\n mit den Sozialpartnern für kurze Zeit und unter transparenten \nBedingungen erneut auf den Weg zu bringen&quot;, sagte Bayrou. Die \nSozialpartner sollten ab Freitag das Gesetz überarbeiten. Sollten sie zu\n einem Entwurf kommen, der im Parlament angenommen werde, werde dieser \numgesetzt – gebe es keine Übereinkunft, werde die aktuelle Reform \nverabschiedet.\nAuch im Staatsbudget solle eingespart werden,\n sagte Bayrou. Die Minister sollten ihre Haushaltspläne bis zum Frühling\n überarbeiten und vorlegen. Ein Spezialfonds solle eingerichtet \nwerden, der vor allem für die Neuordnung des Staates gedacht sei, \nkündigte Bayrou an. Dadurch seien hoffentlich auch Schulden abzubauen. Die Haushaltspläne sind besonders umstritten. Die \nVorgängerregierung war über den Sozialhaushaltsplan gestürzt.\n\nNeue Herausforderungen in der Welt\n\nAktuell müsse die hohe Staatsverschuldung angegangen werden . Es brauche eine Rückkehr zur Stabilität. Alle politischen Kräfte, die bisher an der Regierung waren, hätten dafür einen Teil der Verantwortung zu tragen, sagte Bayrou. Die Schulden seien &quot;ein Damoklesschwert&quot;, das über dem Land schwebe.\nDies sei besonders herausfordernd, da die Welt sich sehr verändert habe, mit dem Überfall Russlands auf die Ukraine und den Versuchen des russischen Präsidenten Wladimir Putin, auch weitere geopolitische Vorteile zu erlangen. Diese neue &quot;Unordnung der Welt&quot; zeige sich auch in der neuen Regierung der Vereinigten Staaten: der Techmilliardär Elon Musk und der designierte US-Präsident Donald Trump drohten unabhängigen Ländern mit der Annexion.\nFrankreich müsse nun seiner außenpolitischen Rolle gerecht werden. Wichtig sei es, dass Europa enger zusammenrücke. Es brauche die &quot;Europäische politische Gemeinschaft&quot;, die auch große Politiker aus Frankreich mitgestaltet hätten. Bayrou betonte, dass seine Regierung die Vorschläge des Italieners Mario Draghis unterstütze, gemeinsame Investitionen anzustrengen.\n\nMehr Demokratie, mehr Migrationskontrolle\n\nDas zweite große Ziel der Regierung soll die\n&quot;Versöhnung des französischen Volkes&quot; und die Stärkung der Demokratie sein. Unter anderem wolle er dafür eine &quot;Bank der Demokratie&quot;\nschaffen, damit politische Kampagnen nicht mehr von Privatbanken abhingen, sagte Bayrou. Er wolle\naußerdem die Wahlreform voranbringen und sprach sich für ein\nVerhältniswahlrecht aus. Dabei gehe es unter anderem um die Möglichkeit,\nmehrere Mandate gleichzeitig innezuhaben. Auch eine &quot;Entbürokratisierung&quot; wolle\ner vorantreiben und die Macht in die Regionen und Kommunen zurückverlagern.\nIn der Migrationspolitik wolle die neue Regierung mehr Effektivität schaffen und dafür das &quot;Interministerieller Ausschuss zur Kontrolle der Einwanderung&quot; wieder einberufen. Immigration sei eine Frage der Menge, um diejenigen, die bleiben sollen, auch integrieren zu können. Sicherheit spiele \nebenfalls eine wichtige Rolle, sagte Bayrou. Das Justizministerium und \ndas Innenministerium sollten deshalb eng zusammenarbeiten – etwa im \nBereich Terrorismus.\nIm Januar wolle er sich zudem mit den Ministern der Überseegebiete zusammensetzen und ihre Zukunft diskutieren, sagte Bayrou. Zuletzt hatten ein Sturm Mayotte im Indischen Ozean verwüstet und die zum Teil widrigen Lebensumstände vieler dort deutlich gemacht . Im vergangenen Jahr hatte es außerdem Widerstand gegen mehr französischen Einfluss in Neukaledonien im Pazifik gegeben . Ziel sei es, neue Politik- und Finanzierungspläne für die Inseln zu schaffen, und ihre Identitäten erhalten, sagte Bayrou.\nIm Gesundheitsbereich will Bayrou eine sozialere Politik verfolgen als seine Vorgänger. So kündigte er an, dass die Idee, die Kostenerstattung für bestimmte Medikamente und Konsultationen aufzuheben, nicht weiter verfolgt werde. Kosten für Rollstühle sollten bis 2025 unter anderem aber staatliche übernommen werden.\n\nNeuer Regierung droht Misstrauensvotum\n\nEs war Bayrous erste Regierungserklärung. Seine Regierung könnte jedoch direkt wieder über ein Misstrauensvotum stürzen .\n Die linkspopulistische Partei La France insoumise hatte schon kurz nach\n Bayrous Ernennung ein solches angekündigt. Es soll direkt nach der \nRegierungsansprache stattfinden. In der Nationalversammlung haben dann die verschiedenen Fraktionen das Wort.\nDie Grünen und die Sozialisten \nhatten angekündigt, einem Misstrauensvotum unter bestimmten Bedingungen zustimmen zu \nwollen – etwa, wenn Bayrou nicht die Rentenreform ändert oder Gesetze am\n Parlament vorbei durchsetzen will. Die Sozialisten verhandelten noch während der Regierungsansprache über eine Position zu einem möglichen Misstrauensvotum. Es wird nicht erwartet, dass sie sofort zustimmen.\n\nRegierung hat keine eigene Mehrheit\n\nFrankreichs Präsident Emmanuel Macron hatte Bayrou am 13. Dezember zum neuen Premierminister ernannt , der zentristische Politiker gilt als Vertrauter Macrons. Zuvor hatte das linke Bündnis aus Abgeordneten der Sozialisten, Kommunisten, Grünen und Linkspopulisten mit Zustimmung des rechtspopulistischen Rassemblement National die Regierung unter Premierminister Michel Barnier gestürzt . Streit hatte es vor allem um den Haushalt gegeben.\nErst zu Weihnachten hatte Bayrous Regierung ihre Regierungsgeschäfte aufgenommen . Wie Barnier hat auch Bayrou keine Mehrheit im Parlament. Das linke Bündnis hatte die Parlamentswahlen im Juli knapp gewonnen, stellt jedoch nur gut ein Drittel der Abgeordneten in der Nationalversammlung . Die Rechtspopulisten und die zentralistischen Parteien stellen jeweils ebenfalls ungefähr ein Drittel der Abgeordneten. Die Regierung muss also Kompromisse machen, um rechte oder linke Stimmen zu bekommen – eine brüchige Strategie."}, {"id": "s042", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Die CDU plant, mit einem Wirtschaftsprogramm namens &quot;&quot;Agenda 2030&quot;&quot; in die Bundestagswahl zu ziehen. Das Programm beinhaltet Steuererleichterungen für Firmen und Bürger, eine große Steuerreform in vier Jahresschritten ab 2026, die Abschaffung des Solidaritätszuschlags, eine flexiblere Arbeitszeitregelung, die Förderung der Automobilindustrie durch das Rückgängigmachen des Verbrennerverbots, die Entlastung von Gründern von Bürokratie, die Förderung von Digitalisierung und KI-Anwendungen sowie die Erhöhung der Forschung und Entwicklung auf 3,5 Prozent des BIP bis 2030. Die Partei will zudem an der Schuldenbremse festhalten und alle Bundesausgaben überprüfen.", "modified": "Die CDU plant, mit einem Wirtschaftsprogramm namens &quot;&quot;Agenda 2030&quot;&quot; in die Bundestagswahl zu ziehen. Das Programm beinhaltet Steuererleichterungen für Firmen und Bürger, eine große Steuerreform in vier Jahresschritten ab 2026, die Abschaffung des Solidaritätszuschlags, eine flexiblere Arbeitszeitregelung, die Förderung der Automobilindustrie durch das Rückgängigmachen des Verbrennerverbots, die Entlastung von Gründern von Bürokratie, die Förderung von Digitalisierung und KI-Anwendungen sowie die Erhöhung der Forschung und Entwicklung auf 3,5 Prozent des BIP bis 2030. Die Partei will zudem an der Schuldenbremse festhalten und alle Bundesausgaben überprüfen.<ins> Die CDU ist Mitglied der Europäischen Volkspartei.<\/ins>", "title": "CDU plant Steuerentlastungen mit Wirtschaftsprogramm &quot;Agenda 2030&quot;", "article": "Die CDU will mit einem Wirtschaftsprogramm namens &quot;Agenda 2030&quot; in die Bundestagswahl ziehen. Darin verspricht die Partei nach übereinstimmenden Berichten Firmen und Bürgern Steuererleichterungen\nund in der Folge höhere Wachstumsquoten.\n&quot;Mit dieser Agenda 2030 setzen wir uns für\nDeutschland ein wirtschaftspolitisches Zwei-Prozent-Ziel: Wir wollen wieder\nWachstumsraten von mindestens zwei Prozent erreichen&quot;, heißt es in dem\nzwölfseitigen Entwurf, der auf der Klausurtagung des CDU-Bundesvorstands in\nHamburg beschlossen werden soll. Die Nachrichtenagenturen dpa und Reuters sowie das Portal table.news zitierten aus dem Papier.\nDie Partei schlägt eine große Steuerreform in vier\nJahresschritten vor, die Anfang 2026 starten soll. Zudem soll die Einkommensteuerbelastung sinken, der Spitzensteuersatz erst ab 80.000 Euro greifen, der\nGrundfreibetrag jährlich steigen.\n\nKeine täglichen Höchstarbeitszeiten mehr\n\nDie Partei will das Arbeitszeitgesetz flexibler gestalten. Statt einer täglichen soll es nur noch eine wöchentliche Höchstarbeitszeit geben. Der Solidaritätszuschlag\nsoll komplett abgeschafft werden, das Bürgergeld in eine &quot;Neue Grundsicherung&quot;\nüberführt werden, diese Forderung findet sich auch im gemeinsamen Wahlprogramm\nvon CDU und CSU.\nÜberstundenzuschläge sollen bei Vollzeitbeschäftigung\nsteuerfrei gestellt werden. Für Rentner, die freiwillig weiterarbeiten, sollen\nVerdienste bis 2.000 Euro im Monat steuerfrei bleiben. Zur Anwerbung ausländischer Fachkräfte soll eine digitale Bundesagentur für\nFachkräfteeinwanderung geschaffen werden.\n\nPartei will Verbrennerverbot rückgängig machen\n\nBei den Strompreisen fordert die CDU eine Entlastung von mindestens fünf Cent je\nKilowattstunde. Stromsteuer und Netzentgelte sollen sinken. Um die\nAutomobilindustrie zu stärken, will die Partei das Verbrenneraus rückgängig\nmachen . Die CDU will Gründer in der Startphase weitgehend von Bürokratie\nentlasten sowie Digitalisierung und KI-Anwendungen vorantreiben. Forschung und\nEntwicklung sollen vorangetrieben werden, als Ziel nennt die CDU jährlich 3,5\nProzent des Bruttoinlandsprodukts bis 2030.\nFesthalten will die Partei zudem an der Schuldenbremse. Laut dem Papier will die CDU alle Bundesausgaben und die unter der Ampelkoalition gestiegenen Subventionen prüfen. Auf dem Parteitag am 3. Februar will die CDU Maßnahmen\nbeschließen, die im Fall einer Regierungsverantwortung unmittelbar umgesetzt werden sollen.\nDer Name &quot;Agenda 2030&quot; erinnert an Reformpläne des früheren SPD-Bundeskanzlers Gerhard Schröder für den Sozial- und Arbeitsmarkt. Mit seiner Agenda 2010 wurden später vor allem die umstrittenen Hartz-IV-Reformen verbunden.\nTransparenzhinweis: In einer früheren Version der Meldung stand im Teaser, die CDU wolle den Spitzensteuersatz anheben. Sie will ihn jedoch erst bei höheren Einkommen greifen lassen. Wir haben das korrigiert und bitten den Fehler zu entschuldigen."}, {"id": "s048", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen Machtmissbrauchs und Aufruhrs angeklagt werden.", "modified": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. <ins>Der Haftbefehl war am 5. Januar erlassen worden. <\/ins>Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen Machtmissbrauchs und Aufruhrs angeklagt werden.", "title": "Title Not Found", "article": "Südkoreas Polizei und Mitarbeiter der Antikorruptionsbehörde (CIO) haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen. Yoon sei am \nMittwochmorgen aus seinem Wohnsitz abgeführt worden, um ihn zur Staatsanwaltschaft zu \nbringen, berichtete Südkoreas amtliche Nachrichtenagentur Yonhap. Damit ist Yoon das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde.\nYoon soll wegen der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember vernommen werden, hatte sich bisher aber geweigert, zur Vernehmung zu erscheinen. Ein erster Versuch, einen Haftbefehl umzusetzen, war Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert . An der nun erfolgreichen Festnahme waren Tausende Einsatzkräfte beteiligt.\n\nMit Leitern in Yoons Residenz\n\nEinigen Polizisten gelang es Beobachtern zufolge, mithilfe von Leitern in die Residenz einzudringen. Zunächst kam es zu gewalttätigen Auseinandersetzungen, wie die südkoreanische Nachrichtenagentur Yonhap berichtete.\nYoons Anwälte hatten bekannt gegeben, dieser sei bereit, bei der Behörde zu erscheinen. &quot;Präsident Yoon hat entschieden, \nheute persönlich bei der Korruptionsermittlungsbehörde zu erscheinen&quot;, schrieb Yoons Anwalt Seok Dong Hyeon auf Facebook. Yoon werde überdies später \nam Tag eine Rede halten, schrieb Seok weiter.\nGegen Yoon Suk Yeol wird wegen Machtmissbrauchs und Aufruhrs ermittelt, nachdem er am 3. Dezember im Zuge eines Haushaltsstreits mit der Opposition kurzzeitig das Kriegsrecht ausgerufen hatte. Das Parlament stimmte daraufhin für seine Amtsenthebung. In den kommenden Wochen prüft das Verfassungsgericht nun diese Entscheidung.\nYoon, der sich wochenlang in seiner Residenz verschanzt hatte, verteidigte die Ausrufung des Kriegsrechts als legitime Maßnahme, nachdem die Opposition in einem Haushaltsstreit Yoons politische Pläne im Parlament verhindert hatte. Er werde gegen die Versuche, ihn aus dem Amt zu drängen, &quot;bis zum Ende kämpfen&quot;, sagte Yoon. Als Reaktion auf die Ausrufung des Kriegsrechts demonstrierten Zehntausende Menschen gegen Yoon und für den Erhalt der Demokratie in Südkorea, aber auch Unterstützer Yoons organisierten Proteste."}, {"id": "s054", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Die Mieten steigen bundesweit, doch das Ausmaß variiert stark nach Regionen: Während Mieter in Borgentreich noch mit 3,93 Euro pro Quadratmeter davonkommen, müssen Münchner mehr als viermal so viel bezahlen. Ein umfangreicher Datensatz offenbart die Preise und Entwicklungen seit 2012 in über 4.000 Städten und Gemeinden. Vier Faktoren beeinflussen die Mietpreise: Lage, Angebot, Nachfrage und lokale Gegebenheiten.", "modified": "Die Mieten steigen bundesweit, doch das Ausmaß variiert stark nach Regionen: Während Mieter in Borgentreich noch mit 3,93 Euro pro Quadratmeter davonkommen, müssen Münchner mehr als viermal so viel bezahlen. Ein umfangreicher Datensatz offenbart die Preise und Entwicklungen seit 2012 in über 4.000 Städten und Gemeinden. Vier Faktoren beeinflussen die Mietpreise: Lage, Angebot, Nachfrage und lokale Gegebenheiten.<ins> Experten erwarten für die kommenden Jahre in den meisten deutschen Städten weiter steigende Mieten.<\/ins>", "title": "Zahl der Baugenehmigungen für Wohnungen stagniert", "article": "Hohe Mieten, dreiste Vermieter, dazu die Angst, sich eine Wohnung bald nicht mehr leisten zu können: Der Mietmarkt bereitet dieser Tage vielen Menschen Sorgen und treibt auch die Politik mehr denn je um. Im Schwerpunkt &quot;Mieten am Limit&quot; beleuchtet ZEIT ONLINE die verschiedenen Facetten der Krise – mit Reportagen, Datenanalysen und Interviews.\nAuch wenn steigende Mieten ein bundesweites Thema sind: Das Ausmaß, in dem die Bevölkerung betroffen ist, variiert stark nach Regionen. In Borgentreich, einer kleinen Gemeinde zwischen Paderborn und Göttingen, zahlen Mieterinnen und Mieter mit 3,93 Euro pro Quadratmeter aktuell die deutschlandweit niedrigste Kaltmiete. In München – bundesweit nach wie vor das teuerste Pflaster – muss man dagegen nach einem Umzug mehr als viermal so viel Geld für eine neue Wohnung aufbringen (17,51 Euro).\nWie unterschiedlich stark Mieterinnen und Mieter zur Kasse gebeten werden, offenbart ein umfangreicher Datensatz, den die Immobiliendatenspezialisten von empirica regio ZEIT ONLINE exklusiv zur Verfügung gestellt haben. Anhand von Daten aus mehr als 4.000 Städten und Gemeinden – kleine Gemeinden wurden zu Gemeindeverbänden zusammengefasst – lässt sich detailliert ablesen, wie hoch die Preise für neu angemieteten Wohnraum sind und wie sich die Mietpreise seit 2012 bis heute entwickelt haben. Vier Faktoren lassen sich feststellen, die zu steigenden Mieten führen:\n\n1. Die Metropolen\n\nDa, wo viele leben wollen – ob berufsbedingt oder weil es hip und schön ist –, ist Wohnraum in der Regel besonders knapp. Entsprechend sind die Mieten in den vier deutschen Millionenstädten im Vergleich meist deutlich höher als in vielen Regionen auf dem Land. Mit 10,49 Euro pro Quadratmeter zahlt man beispielsweise in Berlin für eine neu angemietete Wohnung heute 42 Prozent mehr Miete als noch im Jahr 2012. Aber im Vergleich zu den anderen Millionenstädten wohnt man noch günstig: Hamburg liegt mit einer mittleren Miete von 11,59 Euro auf dem zweiten, Köln mit 11,13 Euro auf dem dritten Platz. Nirgends\n aber wohnt man so teuer wie in München (17,51 Euro).\nÜberhaupt Bayern. Beim Ranking der höchsten Mietniveaus in Deutschland fallen die Plätze zwei bis fünf ebenfalls ausschließlich auf Gemeinden rund um die \nbayerische Landeshauptstadt: Grünwald (16,67 Euro pro Quadratmeter), Neubiberg\n (16,36\nEuro), Unterföhring (16,03 Euro) und Oberschleißheim (16,00 Euro). Sogar bis Platz 27 finden sich (fast) ausschließlich bayerische Städte und Gemeinden – mit einer einzigen Ausnahme: die Nordseeinsel Sylt, die auf Platz neun landet.\nAuf das deutschlandweit niedrigste Mietniveau trifft man vor allem im Osten. So belegen die drei sächsischen Städte Elsterberg (4 Euro), Seifhennersdorf (4,07 Euro) und Großschönau-Hainewalde (4,15 Euro) hinter dem nordrhein-westfälischen Borgentreich Platz zwei bis vier im Ranking der Orte mit den günstigsten Mieten. Auf Platz fünf liegt Treffurt (4,17 Euro), eine Stadt im Wartburgkreis in Thüringen.\n\n2. Der Speckgürtel\n\nWer sich in den Metropolen keinen Wohnraum mehr\nleisten kann, beginnt nicht selten über einen Umzug an den Stadtrand nachzudenken – in der Hoffnung, dass die Mieten dort erschwinglicher sind. In der Tendenz stimmt das zwar, doch der sogenannte Speckgürteleffekt treibt auch in den oft ruhigen und grünen Randlagen die Mieten nach oben.\nBeispiel Berlin: Bestensee liegt rund 35 Kilometer vom Zentrum der Hauptstadt entfernt, also in typischer Pendeldistanz. Hier sind die mittleren Mieten seit 2012 um 83 Prozent auf aktuell 9 Euro pro Quadratmeter angestiegen. Im nur 15 Kilometer von Berlin-Mitte entfernten Teltow erreichten sie sogar 10,61 Euro – das ist mehr als die mittlere Miete in Berlin (10,49 Euro pro Quadratmeter).\nNatürlich ist das im Vergleich zu einem angesagten Berliner Bezirk wie Prenzlauer Berg noch überschaubar – dort lag die mittlere Miete in den ersten drei Quartalen des laufenden Jahres bei 13,25 Euro pro Quadratmeter. Die niedrigeren Mieten können all jene, die sich für einen Umzug weiter entfernt von der Arbeit entscheiden, allerdings auch gut brauchen: Pendeln kostet nicht nur Zeit, sondern auch Sprit und damit Geld. Auch deshalb kann ein deutlicher Mietpreisanstieg in den Randbezirken die Betroffenen an die Grenze des finanziell Leistbaren bringen.\nAm stärksten sind nach Berechnungen von ZEIT ONLINE die Mieten seit 2012 insgesamt im Speckgürtel rund um Berlin angestiegen (40,9 Prozent), gefolgt von Stuttgart (36,3 Prozent) und München (35,9 Prozent). Die Speckgürtel rund um Hamburg (plus 23,7 Prozent) und um Düsseldorf (plus 19,7 Prozent) verzeichneten im Vergleich der sieben größten deutschen Städte die moderatesten Mietsteigerungen. Berechnet wurde dies auf Basis der Mietdaten von empirica regio und Daten zu Speckgürteln vom Bundesinstitut für Bau-, Stadt- und Raumforschung (BBSR).\nMancherorts, so zeigt etwa ein Blick auf die Rhein-Main-Region, dehnt sich der Speckgürtel sogar noch weiter aus – und zwar entlang der Autobahnen und Bahnstrecken. Legt man das Verkehrsnetz\nauf die Mietkarte, lässt sich erkennen, dass vielerorts in Deutschland entlang der\nHauptverkehrsadern die Mieten höher sind als in den Regionen, die weniger gut angeschlossen sind. Ein Grund dafür könnte sein, dass die Orte gerade bei Pendlern beliebt sind, für deren Alltag eine gute Verkehrsanbindung essenziell ist – Vermieter können sich diese Zwangslage zunutze machen und allein wegen der \ngroßen Nachfrage höhere Mietpreise verlangen.\n\n3. Die Küsten\n\nEinen grandiosen Blick auf die Alpen, eine Wohnung auf einer Insel direkt am Meer oder auch die Nähe zur Lüneburger Heide lassen sich die Vermieter naturgemäß gut bezahlen.\nEntsprechend offenbart die Mietkarte auch, welche Regionen (nicht nur) touristisch betrachtet einen Aufwind erleben. Dazu gehört die Ostseeküste. Dass das ostdeutsche Bundesland Mecklenburg-Vorpommern seit Jahren versucht, mit dem Tourismus auch die Wirtschaft anzutreiben, spiegelt sich auch in den Mieten wider. Ob in Kühlungsborn (8,67 Euro pro Quadratmeter), Graal-Müritz (9,02 Euro) oder in Heringsdorf (8,91 Euro) – für den Quadratmeter Wohnraum muss man in den Küstenregionen heute schon fast doppelt so viel zahlen wie in den Regionen etwas weiter im Binnenland. Dort liegt etwa Franzburg-Richtenberg, wo die mittlere Miete bei nur 5 Euro pro Quadratmeter liegt.\n\n4. Die Grenzen\n\nAuch die Grenzen treiben die Mieten in Höhe – zumindest im Westen. Beispiel Luxemburg: Im Großherzogtum lebt es sich teuer, die Mieten dort gehören zu den höchsten, die man europaweit zahlen muss . Nicht wenige Luxemburgerinnen und Luxemburger entscheiden deshalb, ihren Wohnsitz jenseits der Grenze zu verlegen und zur Arbeit zu pendeln. In Perl etwa, einem kleinen Örtchen im Saarland, stellen die Luxemburger ein Viertel der Bevölkerung . Und es geht auch andersherum: Mehr als 40.000 Menschen pendeln täglich aus Deutschland nach Luxemburg . Und präferieren oft grenznahe Wohnungen, um die Pendlerzeiten möglichst kurz zu halten.\nDie höhere Nachfrage führt offenbar dazu, dass Vermieterinnen und Vermieter mehr Miete verlangen können. Im saarländischen Perl etwa stiegen die Quadratmeterpreise seit 2012 um 20 Prozent auf 9,52 Euro. Auch in den anderen Gemeinden nahe der Grenze muss man heute 7 Euro und mehr zahlen. Zum Vergleich: In Kell am See in Rheinland-Pfalz, 30 Kilometer entfernt von Perl, lie
