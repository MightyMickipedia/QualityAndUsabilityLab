const ITEMS = [{"id": "s014", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Der neue französische Premierminister François Bayrou kündigte in seiner ersten Regierungserklärung an, die umstrittene Rentenreform durch die Sozialpartner neu zu verhandeln und die Staatsausgaben zu regeln, um das Schuldenproblem anzugehen. Bayrou betonte die Dringlichkeit der Rentenreform und die Notwendigkeit, das Staatsbudget zu überarbeiten. Er sprach sich für eine enge Zusammenarbeit mit den Sozialpartnern aus und betonte die Bedeutung von Investitionen und einer stärkeren europäischen Zusammenarbeit. Die Regierung plant außerdem Maßnahmen zur Stärkung der Demokratie, zur effektiveren Migrationskontrolle und zur Verbesserung der Gesundheitspolitik. Trotzdem droht der Regierung ein <del>Misstrauensvotum,<\/del> da sie keine eigene Mehrheit im Parlament hat.", "modified": "Der neue französische Premierminister François Bayrou kündigte in seiner ersten Regierungserklärung an, die umstrittene Rentenreform durch die Sozialpartner neu zu verhandeln und die Staatsausgaben zu regeln, um das Schuldenproblem anzugehen. Bayrou betonte die Dringlichkeit der Rentenreform und die Notwendigkeit, das Staatsbudget zu überarbeiten. Er sprach sich für eine enge Zusammenarbeit mit den Sozialpartnern aus und betonte die Bedeutung von Investitionen und einer stärkeren europäischen Zusammenarbeit. Die Regierung plant außerdem Maßnahmen zur Stärkung der Demokratie, zur effektiveren Migrationskontrolle und zur Verbesserung der Gesundheitspolitik. Trotzdem droht der Regierung ein <ins>Misstrauensvotum am 16. Januar 2025,<\/ins> da sie keine eigene Mehrheit im Parlament hat.", "title": "Title Not Found", "article": "In seiner ersten Regierungserklärung hat der neue französische Premierminister François Bayrou eine Neufassung der umstrittenen Rentenreform durch die Sozialpartner angekündigt. Außerdem wolle er die Ausgaben des französischen Staates neu regeln, um das Schuldenproblem anzupacken. Seine Regierung befinde sich in einer herausfordernden Situation. Ein großer Teil der Menschen in Frankreich gehe nicht davon aus, dass \ndie Regierung unter diesen Voraussetzungen länger an der Macht bleibe, sagte Bayrou. \nWenn alles verloren scheint, müsse man aber an Mut glauben. Die Menschen\n erwarteten, dass das Parlament und die Regierung nun ihre Kräfte \nbündelten.\nDringend sei vor allem die Neuregelung der Rente, sagte Bayrou. Das \nDefizit des Rentensystems sei besonders hoch. Diese Schulden seien auch \nein moralisches Problem, weil sie die Generationengerechtigkeit \nverletzten. Die aktuelle Fassung der Rentenreform wird jedoch im \nParlament weitgehend abgelehnt. &quot;Ich entscheide mich dafür, dieses Thema\n mit den Sozialpartnern für kurze Zeit und unter transparenten \nBedingungen erneut auf den Weg zu bringen&quot;, sagte Bayrou. Die \nSozialpartner sollten ab Freitag das Gesetz überarbeiten. Sollten sie zu\n einem Entwurf kommen, der im Parlament angenommen werde, werde dieser \numgesetzt – gebe es keine Übereinkunft, werde die aktuelle Reform \nverabschiedet.\nAuch im Staatsbudget solle eingespart werden,\n sagte Bayrou. Die Minister sollten ihre Haushaltspläne bis zum Frühling\n überarbeiten und vorlegen. Ein Spezialfonds solle eingerichtet \nwerden, der vor allem für die Neuordnung des Staates gedacht sei, \nkündigte Bayrou an. Dadurch seien hoffentlich auch Schulden abzubauen. Die Haushaltspläne sind besonders umstritten. Die \nVorgängerregierung war über den Sozialhaushaltsplan gestürzt.\n\nNeue Herausforderungen in der Welt\n\nAktuell müsse die hohe Staatsverschuldung angegangen werden . Es brauche eine Rückkehr zur Stabilität. Alle politischen Kräfte, die bisher an der Regierung waren, hätten dafür einen Teil der Verantwortung zu tragen, sagte Bayrou. Die Schulden seien &quot;ein Damoklesschwert&quot;, das über dem Land schwebe.\nDies sei besonders herausfordernd, da die Welt sich sehr verändert habe, mit dem Überfall Russlands auf die Ukraine und den Versuchen des russischen Präsidenten Wladimir Putin, auch weitere geopolitische Vorteile zu erlangen. Diese neue &quot;Unordnung der Welt&quot; zeige sich auch in der neuen Regierung der Vereinigten Staaten: der Techmilliardär Elon Musk und der designierte US-Präsident Donald Trump drohten unabhängigen Ländern mit der Annexion.\nFrankreich müsse nun seiner außenpolitischen Rolle gerecht werden. Wichtig sei es, dass Europa enger zusammenrücke. Es brauche die &quot;Europäische politische Gemeinschaft&quot;, die auch große Politiker aus Frankreich mitgestaltet hätten. Bayrou betonte, dass seine Regierung die Vorschläge des Italieners Mario Draghis unterstütze, gemeinsame Investitionen anzustrengen.\n\nMehr Demokratie, mehr Migrationskontrolle\n\nDas zweite große Ziel der Regierung soll die\n&quot;Versöhnung des französischen Volkes&quot; und die Stärkung der Demokratie sein. Unter anderem wolle er dafür eine &quot;Bank der Demokratie&quot;\nschaffen, damit politische Kampagnen nicht mehr von Privatbanken abhingen, sagte Bayrou. Er wolle\naußerdem die Wahlreform voranbringen und sprach sich für ein\nVerhältniswahlrecht aus. Dabei gehe es unter anderem um die Möglichkeit,\nmehrere Mandate gleichzeitig innezuhaben. Auch eine &quot;Entbürokratisierung&quot; wolle\ner vorantreiben und die Macht in die Regionen und Kommunen zurückverlagern.\nIn der Migrationspolitik wolle die neue Regierung mehr Effektivität schaffen und dafür das &quot;Interministerieller Ausschuss zur Kontrolle der Einwanderung&quot; wieder einberufen. Immigration sei eine Frage der Menge, um diejenigen, die bleiben sollen, auch integrieren zu können. Sicherheit spiele \nebenfalls eine wichtige Rolle, sagte Bayrou. Das Justizministerium und \ndas Innenministerium sollten deshalb eng zusammenarbeiten – etwa im \nBereich Terrorismus.\nIm Januar wolle er sich zudem mit den Ministern der Überseegebiete zusammensetzen und ihre Zukunft diskutieren, sagte Bayrou. Zuletzt hatten ein Sturm Mayotte im Indischen Ozean verwüstet und die zum Teil widrigen Lebensumstände vieler dort deutlich gemacht . Im vergangenen Jahr hatte es außerdem Widerstand gegen mehr französischen Einfluss in Neukaledonien im Pazifik gegeben . Ziel sei es, neue Politik- und Finanzierungspläne für die Inseln zu schaffen, und ihre Identitäten erhalten, sagte Bayrou.\nIm Gesundheitsbereich will Bayrou eine sozialere Politik verfolgen als seine Vorgänger. So kündigte er an, dass die Idee, die Kostenerstattung für bestimmte Medikamente und Konsultationen aufzuheben, nicht weiter verfolgt werde. Kosten für Rollstühle sollten bis 2025 unter anderem aber staatliche übernommen werden.\n\nNeuer Regierung droht Misstrauensvotum\n\nEs war Bayrous erste Regierungserklärung. Seine Regierung könnte jedoch direkt wieder über ein Misstrauensvotum stürzen .\n Die linkspopulistische Partei La France insoumise hatte schon kurz nach\n Bayrous Ernennung ein solches angekündigt. Es soll direkt nach der \nRegierungsansprache stattfinden. In der Nationalversammlung haben dann die verschiedenen Fraktionen das Wort.\nDie Grünen und die Sozialisten \nhatten angekündigt, einem Misstrauensvotum unter bestimmten Bedingungen zustimmen zu \nwollen – etwa, wenn Bayrou nicht die Rentenreform ändert oder Gesetze am\n Parlament vorbei durchsetzen will. Die Sozialisten verhandelten noch während der Regierungsansprache über eine Position zu einem möglichen Misstrauensvotum. Es wird nicht erwartet, dass sie sofort zustimmen.\n\nRegierung hat keine eigene Mehrheit\n\nFrankreichs Präsident Emmanuel Macron hatte Bayrou am 13. Dezember zum neuen Premierminister ernannt , der zentristische Politiker gilt als Vertrauter Macrons. Zuvor hatte das linke Bündnis aus Abgeordneten der Sozialisten, Kommunisten, Grünen und Linkspopulisten mit Zustimmung des rechtspopulistischen Rassemblement National die Regierung unter Premierminister Michel Barnier gestürzt . Streit hatte es vor allem um den Haushalt gegeben.\nErst zu Weihnachten hatte Bayrous Regierung ihre Regierungsgeschäfte aufgenommen . Wie Barnier hat auch Bayrou keine Mehrheit im Parlament. Das linke Bündnis hatte die Parlamentswahlen im Juli knapp gewonnen, stellt jedoch nur gut ein Drittel der Abgeordneten in der Nationalversammlung . Die Rechtspopulisten und die zentralistischen Parteien stellen jeweils ebenfalls ungefähr ein Drittel der Abgeordneten. Die Regierung muss also Kompromisse machen, um rechte oder linke Stimmen zu bekommen – eine brüchige Strategie."}, {"id": "s042", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Die CDU plant, mit einem Wirtschaftsprogramm namens &quot;&quot;Agenda 2030&quot;&quot; in die Bundestagswahl zu ziehen. Das Programm beinhaltet Steuererleichterungen für Firmen und Bürger, eine große Steuerreform in vier Jahresschritten ab 2026, die Abschaffung des Solidaritätszuschlags, eine flexiblere Arbeitszeitregelung, die Förderung der Automobilindustrie durch das Rückgängigmachen des Verbrennerverbots, die Entlastung von Gründern von Bürokratie, die Förderung von Digitalisierung und KI-Anwendungen sowie die Erhöhung der Forschung und Entwicklung auf 3,5 Prozent des BIP bis 2030. Die Partei will zudem an der Schuldenbremse festhalten und alle Bundesausgaben überprüfen.", "modified": "Die CDU plant, mit einem Wirtschaftsprogramm namens &quot;&quot;Agenda 2030&quot;&quot; in die Bundestagswahl zu ziehen. Das Programm beinhaltet Steuererleichterungen für Firmen und Bürger, eine große Steuerreform in vier Jahresschritten ab 2026, die Abschaffung des Solidaritätszuschlags, eine flexiblere Arbeitszeitregelung, die Förderung der Automobilindustrie durch das Rückgängigmachen des Verbrennerverbots, die Entlastung von Gründern von Bürokratie, die Förderung von Digitalisierung und KI-Anwendungen sowie die Erhöhung der Forschung und Entwicklung auf 3,5 Prozent des BIP bis 2030. Die Partei will zudem an der Schuldenbremse festhalten und alle Bundesausgaben überprüfen.<ins> Die CDU ist Mitglied der Europäischen Volkspartei.<\/ins>", "title": "CDU plant Steuerentlastungen mit Wirtschaftsprogramm &quot;Agenda 2030&quot;", "article": "Die CDU will mit einem Wirtschaftsprogramm namens &quot;Agenda 2030&quot; in die Bundestagswahl ziehen. Darin verspricht die Partei nach übereinstimmenden Berichten Firmen und Bürgern Steuererleichterungen\nund in der Folge höhere Wachstumsquoten.\n&quot;Mit dieser Agenda 2030 setzen wir uns für\nDeutschland ein wirtschaftspolitisches Zwei-Prozent-Ziel: Wir wollen wieder\nWachstumsraten von mindestens zwei Prozent erreichen&quot;, heißt es in dem\nzwölfseitigen Entwurf, der auf der Klausurtagung des CDU-Bundesvorstands in\nHamburg beschlossen werden soll. Die Nachrichtenagenturen dpa und Reuters sowie das Portal table.news zitierten aus dem Papier.\nDie Partei schlägt eine große Steuerreform in vier\nJahresschritten vor, die Anfang 2026 starten soll. Zudem soll die Einkommensteuerbelastung sinken, der Spitzensteuersatz erst ab 80.000 Euro greifen, der\nGrundfreibetrag jährlich steigen.\n\nKeine täglichen Höchstarbeitszeiten mehr\n\nDie Partei will das Arbeitszeitgesetz flexibler gestalten. Statt einer täglichen soll es nur noch eine wöchentliche Höchstarbeitszeit geben. Der Solidaritätszuschlag\nsoll komplett abgeschafft werden, das Bürgergeld in eine &quot;Neue Grundsicherung&quot;\nüberführt werden, diese Forderung findet sich auch im gemeinsamen Wahlprogramm\nvon CDU und CSU.\nÜberstundenzuschläge sollen bei Vollzeitbeschäftigung\nsteuerfrei gestellt werden. Für Rentner, die freiwillig weiterarbeiten, sollen\nVerdienste bis 2.000 Euro im Monat steuerfrei bleiben. Zur Anwerbung ausländischer Fachkräfte soll eine digitale Bundesagentur für\nFachkräfteeinwanderung geschaffen werden.\n\nPartei will Verbrennerverbot rückgängig machen\n\nBei den Strompreisen fordert die CDU eine Entlastung von mindestens fünf Cent je\nKilowattstunde. Stromsteuer und Netzentgelte sollen sinken. Um die\nAutomobilindustrie zu stärken, will die Partei das Verbrenneraus rückgängig\nmachen . Die CDU will Gründer in der Startphase weitgehend von Bürokratie\nentlasten sowie Digitalisierung und KI-Anwendungen vorantreiben. Forschung und\nEntwicklung sollen vorangetrieben werden, als Ziel nennt die CDU jährlich 3,5\nProzent des Bruttoinlandsprodukts bis 2030.\nFesthalten will die Partei zudem an der Schuldenbremse. Laut dem Papier will die CDU alle Bundesausgaben und die unter der Ampelkoalition gestiegenen Subventionen prüfen. Auf dem Parteitag am 3. Februar will die CDU Maßnahmen\nbeschließen, die im Fall einer Regierungsverantwortung unmittelbar umgesetzt werden sollen.\nDer Name &quot;Agenda 2030&quot; erinnert an Reformpläne des früheren SPD-Bundeskanzlers Gerhard Schröder für den Sozial- und Arbeitsmarkt. Mit seiner Agenda 2010 wurden später vor allem die umstrittenen Hartz-IV-Reformen verbunden.\nTransparenzhinweis: In einer früheren Version der Meldung stand im Teaser, die CDU wolle den Spitzensteuersatz anheben. Sie will ihn jedoch erst bei höheren Einkommen greifen lassen. Wir haben das korrigiert und bitten den Fehler zu entschuldigen."}, {"id": "s048", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen Machtmissbrauchs und Aufruhrs angeklagt werden.", "modified": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. <ins>Der Haftbefehl war am 5. Januar erlassen worden. <\/ins>Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen Machtmissbrauchs und Aufruhrs angeklagt werden.", "title": "Title Not Found", "article": "Südkoreas Polizei und Mitarbeiter der Antikorruptionsbehörde (CIO) haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen. Yoon sei am \nMittwochmorgen aus seinem Wohnsitz abgeführt worden, um ihn zur Staatsanwaltschaft zu \nbringen, berichtete Südkoreas amtliche Nachrichtenagentur Yonhap. Damit ist Yoon das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde.\nYoon soll wegen der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember vernommen werden, hatte sich bisher aber geweigert, zur Vernehmung zu erscheinen. Ein erster Versuch, einen Haftbefehl umzusetzen, war Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert . An der nun erfolgreichen Festnahme waren Tausende Einsatzkräfte beteiligt.\n\nMit Leitern in Yoons Residenz\n\nEinigen Polizisten gelang es Beobachtern zufolge, mithilfe von Leitern in die Residenz einzudringen. Zunächst kam es zu gewalttätigen Auseinandersetzungen, wie die südkoreanische Nachrichtenagentur Yonhap berichtete.\nYoons Anwälte hatten bekannt gegeben, dieser sei bereit, bei der Behörde zu erscheinen. &quot;Präsident Yoon hat entschieden, \nheute persönlich bei der Korruptionsermittlungsbehörde zu erscheinen&quot;, schrieb Yoons Anwalt Seok Dong Hyeon auf Facebook. Yoon werde überdies später \nam Tag eine Rede halten, schrieb Seok weiter.\nGegen Yoon Suk Yeol wird wegen Machtmissbrauchs und Aufruhrs ermittelt, nachdem er am 3. Dezember im Zuge eines Haushaltsstreits mit der Opposition kurzzeitig das Kriegsrecht ausgerufen hatte. Das Parlament stimmte daraufhin für seine Amtsenthebung. In den kommenden Wochen prüft das Verfassungsgericht nun diese Entscheidung.\nYoon, der sich wochenlang in seiner Residenz verschanzt hatte, verteidigte die Ausrufung des Kriegsrechts als legitime Maßnahme, nachdem die Opposition in einem Haushaltsstreit Yoons politische Pläne im Parlament verhindert hatte. Er werde gegen die Versuche, ihn aus dem Amt zu drängen, &quot;bis zum Ende kämpfen&quot;, sagte Yoon. Als Reaktion auf die Ausrufung des Kriegsrechts demonstrierten Zehntausende Menschen gegen Yoon und für den Erhalt der Demokratie in Südkorea, aber auch Unterstützer Yoons organisierten Proteste."}, {"id": "s054", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "Die Mieten steigen bundesweit, doch das Ausmaß variiert stark nach Regionen: Während Mieter in Borgentreich noch mit 3,93 Euro pro Quadratmeter davonkommen, müssen Münchner mehr als viermal so viel bezahlen. Ein umfangreicher Datensatz offenbart die Preise und Entwicklungen seit 2012 in über 4.000 Städten und Gemeinden. Vier Faktoren beeinflussen die Mietpreise: Lage, Angebot, Nachfrage und lokale Gegebenheiten.", "modified": "Die Mieten steigen bundesweit, doch das Ausmaß variiert stark nach Regionen: Während Mieter in Borgentreich noch mit 3,93 Euro pro Quadratmeter davonkommen, müssen Münchner mehr als viermal so viel bezahlen. Ein umfangreicher Datensatz offenbart die Preise und Entwicklungen seit 2012 in über 4.000 Städten und Gemeinden. Vier Faktoren beeinflussen die Mietpreise: Lage, Angebot, Nachfrage und lokale Gegebenheiten.<ins> Experten erwarten für die kommenden Jahre in den meisten deutschen Städten weiter steigende Mieten.<\/ins>", "title": "Zahl der Baugenehmigungen für Wohnungen stagniert", "article": "Hohe Mieten, dreiste Vermieter, dazu die Angst, sich eine Wohnung bald nicht mehr leisten zu können: Der Mietmarkt bereitet dieser Tage vielen Menschen Sorgen und treibt auch die Politik mehr denn je um. Im Schwerpunkt &quot;Mieten am Limit&quot; beleuchtet ZEIT ONLINE die verschiedenen Facetten der Krise – mit Reportagen, Datenanalysen und Interviews.\nAuch wenn steigende Mieten ein bundesweites Thema sind: Das Ausmaß, in dem die Bevölkerung betroffen ist, variiert stark nach Regionen. In Borgentreich, einer kleinen Gemeinde zwischen Paderborn und Göttingen, zahlen Mieterinnen und Mieter mit 3,93 Euro pro Quadratmeter aktuell die deutschlandweit niedrigste Kaltmiete. In München – bundesweit nach wie vor das teuerste Pflaster – muss man dagegen nach einem Umzug mehr als viermal so viel Geld für eine neue Wohnung aufbringen (17,51 Euro).\nWie unterschiedlich stark Mieterinnen und Mieter zur Kasse gebeten werden, offenbart ein umfangreicher Datensatz, den die Immobiliendatenspezialisten von empirica regio ZEIT ONLINE exklusiv zur Verfügung gestellt haben. Anhand von Daten aus mehr als 4.000 Städten und Gemeinden – kleine Gemeinden wurden zu Gemeindeverbänden zusammengefasst – lässt sich detailliert ablesen, wie hoch die Preise für neu angemieteten Wohnraum sind und wie sich die Mietpreise seit 2012 bis heute entwickelt haben. Vier Faktoren lassen sich feststellen, die zu steigenden Mieten führen:\n\n1. Die Metropolen\n\nDa, wo viele leben wollen – ob berufsbedingt oder weil es hip und schön ist –, ist Wohnraum in der Regel besonders knapp. Entsprechend sind die Mieten in den vier deutschen Millionenstädten im Vergleich meist deutlich höher als in vielen Regionen auf dem Land. Mit 10,49 Euro pro Quadratmeter zahlt man beispielsweise in Berlin für eine neu angemietete Wohnung heute 42 Prozent mehr Miete als noch im Jahr 2012. Aber im Vergleich zu den anderen Millionenstädten wohnt man noch günstig: Hamburg liegt mit einer mittleren Miete von 11,59 Euro auf dem zweiten, Köln mit 11,13 Euro auf dem dritten Platz. Nirgends\n aber wohnt man so teuer wie in München (17,51 Euro).\nÜberhaupt Bayern. Beim Ranking der höchsten Mietniveaus in Deutschland fallen die Plätze zwei bis fünf ebenfalls ausschließlich auf Gemeinden rund um die \nbayerische Landeshauptstadt: Grünwald (16,67 Euro pro Quadratmeter), Neubiberg\n (16,36\nEuro), Unterföhring (16,03 Euro) und Oberschleißheim (16,00 Euro). Sogar bis Platz 27 finden sich (fast) ausschließlich bayerische Städte und Gemeinden – mit einer einzigen Ausnahme: die Nordseeinsel Sylt, die auf Platz neun landet.\nAuf das deutschlandweit niedrigste Mietniveau trifft man vor allem im Osten. So belegen die drei sächsischen Städte Elsterberg (4 Euro), Seifhennersdorf (4,07 Euro) und Großschönau-Hainewalde (4,15 Euro) hinter dem nordrhein-westfälischen Borgentreich Platz zwei bis vier im Ranking der Orte mit den günstigsten Mieten. Auf Platz fünf liegt Treffurt (4,17 Euro), eine Stadt im Wartburgkreis in Thüringen.\n\n2. Der Speckgürtel\n\nWer sich in den Metropolen keinen Wohnraum mehr\nleisten kann, beginnt nicht selten über einen Umzug an den Stadtrand nachzudenken – in der Hoffnung, dass die Mieten dort erschwinglicher sind. In der Tendenz stimmt das zwar, doch der sogenannte Speckgürteleffekt treibt auch in den oft ruhigen und grünen Randlagen die Mieten nach oben.\nBeispiel Berlin: Bestensee liegt rund 35 Kilometer vom Zentrum der Hauptstadt entfernt, also in typischer Pendeldistanz. Hier sind die mittleren Mieten seit 2012 um 83 Prozent auf aktuell 9 Euro pro Quadratmeter angestiegen. Im nur 15 Kilometer von Berlin-Mitte entfernten Teltow erreichten sie sogar 10,61 Euro – das ist mehr als die mittlere Miete in Berlin (10,49 Euro pro Quadratmeter).\nNatürlich ist das im Vergleich zu einem angesagten Berliner Bezirk wie Prenzlauer Berg noch überschaubar – dort lag die mittlere Miete in den ersten drei Quartalen des laufenden Jahres bei 13,25 Euro pro Quadratmeter. Die niedrigeren Mieten können all jene, die sich für einen Umzug weiter entfernt von der Arbeit entscheiden, allerdings auch gut brauchen: Pendeln kostet nicht nur Zeit, sondern auch Sprit und damit Geld. Auch deshalb kann ein deutlicher Mietpreisanstieg in den Randbezirken die Betroffenen an die Grenze des finanziell Leistbaren bringen.\nAm stärksten sind nach Berechnungen von ZEIT ONLINE die Mieten seit 2012 insgesamt im Speckgürtel rund um Berlin angestiegen (40,9 Prozent), gefolgt von Stuttgart (36,3 Prozent) und München (35,9 Prozent). Die Speckgürtel rund um Hamburg (plus 23,7 Prozent) und um Düsseldorf (plus 19,7 Prozent) verzeichneten im Vergleich der sieben größten deutschen Städte die moderatesten Mietsteigerungen. Berechnet wurde dies auf Basis der Mietdaten von empirica regio und Daten zu Speckgürteln vom Bundesinstitut für Bau-, Stadt- und Raumforschung (BBSR).\nMancherorts, so zeigt etwa ein Blick auf die Rhein-Main-Region, dehnt sich der Speckgürtel sogar noch weiter aus – und zwar entlang der Autobahnen und Bahnstrecken. Legt man das Verkehrsnetz\nauf die Mietkarte, lässt sich erkennen, dass vielerorts in Deutschland entlang der\nHauptverkehrsadern die Mieten höher sind als in den Regionen, die weniger gut angeschlossen sind. Ein Grund dafür könnte sein, dass die Orte gerade bei Pendlern beliebt sind, für deren Alltag eine gute Verkehrsanbindung essenziell ist – Vermieter können sich diese Zwangslage zunutze machen und allein wegen der \ngroßen Nachfrage höhere Mietpreise verlangen.\n\n3. Die Küsten\n\nEinen grandiosen Blick auf die Alpen, eine Wohnung auf einer Insel direkt am Meer oder auch die Nähe zur Lüneburger Heide lassen sich die Vermieter naturgemäß gut bezahlen.\nEntsprechend offenbart die Mietkarte auch, welche Regionen (nicht nur) touristisch betrachtet einen Aufwind erleben. Dazu gehört die Ostseeküste. Dass das ostdeutsche Bundesland Mecklenburg-Vorpommern seit Jahren versucht, mit dem Tourismus auch die Wirtschaft anzutreiben, spiegelt sich auch in den Mieten wider. Ob in Kühlungsborn (8,67 Euro pro Quadratmeter), Graal-Müritz (9,02 Euro) oder in Heringsdorf (8,91 Euro) – für den Quadratmeter Wohnraum muss man in den Küstenregionen heute schon fast doppelt so viel zahlen wie in den Regionen etwas weiter im Binnenland. Dort liegt etwa Franzburg-Richtenberg, wo die mittlere Miete bei nur 5 Euro pro Quadratmeter liegt.\n\n4. Die Grenzen\n\nAuch die Grenzen treiben die Mieten in Höhe – zumindest im Westen. Beispiel Luxemburg: Im Großherzogtum lebt es sich teuer, die Mieten dort gehören zu den höchsten, die man europaweit zahlen muss . Nicht wenige Luxemburgerinnen und Luxemburger entscheiden deshalb, ihren Wohnsitz jenseits der Grenze zu verlegen und zur Arbeit zu pendeln. In Perl etwa, einem kleinen Örtchen im Saarland, stellen die Luxemburger ein Viertel der Bevölkerung . Und es geht auch andersherum: Mehr als 40.000 Menschen pendeln täglich aus Deutschland nach Luxemburg . Und präferieren oft grenznahe Wohnungen, um die Pendlerzeiten möglichst kurz zu halten.\nDie höhere Nachfrage führt offenbar dazu, dass Vermieterinnen und Vermieter mehr Miete verlangen können. Im saarländischen Perl etwa stiegen die Quadratmeterpreise seit 2012 um 20 Prozent auf 9,52 Euro. Auch in den anderen Gemeinden nahe der Grenze muss man heute 7 Euro und mehr zahlen. Zum Vergleich: In Kell am See in Rheinland-Pfalz, 30 Kilometer entfernt von Perl, liegen die Quadratmetermieten bei gerade einmal 5,50 Euro.\nGanz anders ist die Lage im Osten des Landes: An der Grenze zu Polen und zur Tschechischen Republik verzeichnet das Gros der Städte und Orte kaum nennenswerte Mietsteigerungen. Die Mieten dümpeln bei 5 Euro für den Quadratmeter, mal etwas weniger, mal etwas mehr. Das dürfte auch daran liegen, dass die Regionen auf beiden Seiten der Grenze größtenteils eher ländlich geprägt und dünn besiedelt sind.\n\nIst Entspannung in Sicht?\n\nAngesichts der teils dramatischen Mietenanstiege versucht die Politik vielerorts, Gegenmaßnahmen zu entwickeln. So beschloss die Bundesregierung im Jahr 2015 die Mietpreisbremse: Das Gesetz sieht vor, dass in besonders angespannten Wohnungsmärkten die Miete bei Neuvermietungen maximal \nzehn Prozent über der ortsüblichen Vergleichsmiete liegen darf. Das Instrument zielt vor allem darauf, den Städten (und der Bevölkerung) eine Art Verschnaufpause zu gewähren – die sie idealerweise zum Wohnungsbau nutzen, um den Mietmarkt zu entlasten.\nAuch vier Jahre später sind sich Experten jedoch uneins, was genau für eine Entspannung sorgt: Ist es ein Mix aus Mietpreisbremse und verstärkten Bautätigkeiten? Oder ist jede staatliche Regulierung kontraproduktiv? Jüngsten Berechnungen zufolge stagnierten die Neuvertragsmieten im Bundesdurchschnitt zuletzt. Fachleute sind allerdings skeptisch, ob man anhand dessen bereits von einer Trendwende sprechen kann.\nWenn Sie genauer wissen wollen, ob die Mietpreisbremse wirkt: ZEIT ONLINE zieht in einem weiteren Teil des Schwerpunkts &quot;Mieten am Limit&quot; Bilanz zur Preisentwicklung in den fünf größten Städten, in denen es eine Mietpreisbremse gibt."}, {"id": "s055", "type": "OutE", "definition": "Out-of-article error: the summary contains information that is not in the article, even if it is true in reality.", "original": "FDP-Generalsekretär Bijan Djir-Sarai tritt nach Skandal um Ampelkoalitions-Austritt zurück; er habe von Strategiepapier keine Kenntnis gehabt und die Öffentlichkeit unwissentlich falsch informiert.", "modified": "FDP-Generalsekretär Bijan Djir-Sarai tritt nach Skandal um Ampelkoalitions-Austritt<ins> mit sofortiger Wirkung<\/ins> zurück; er habe von Strategiepapier keine Kenntnis gehabt und die Öffentlichkeit unwissentlich falsch informiert.", "title": "Title Not Found", "article": "FDP-Generalsekretär Bijan Djir-Sarai hat in Folge des Skandals um den Austritt der FDP aus der Ampelkoalition sein Amt niedergelegt. Er habe von dem am Donnerstag veröffentlichten Strategiepapier &quot;keine Kenntnis&quot; gehabt und die Öffentlichkeit infolgedessen &quot;unwissentlich falsch informiert&quot;, sagte er in einer kurzen Stellungnahme in der FDP-Parteizentrale in Berlin. Für einen solchen Vorgang der der Generalsekretär verantwortlich. Um Schaden von seiner Partei und seiner Glaubwürdigkeit abzuwenden, habe er die Parteiführung daher über seinen Rücktritt informiert.\nDjir-Sarai zieht damit letztlich die Konsequenzen aus den &quot;D-Day&quot;-Enthüllungen, wonach die Partei gezielt und länger vorbereitet den Austritt aus der Ampelkoalition geplant hatte. Nachdem eine Recherche der ZEIT die Planung des Regierungsbruches durch die FDP öffentlich gemacht hatte, hatte die FDP am Donnerstag selbst Dateien zu besagter Planung veröffentlicht. Darin ist von einem &quot;D-Day&quot; die Rede, an dem die FDP aus der Koalition austritt. In der Folge wird von einer &quot;Feldschlacht&quot; gesprochen, um den Schritt offensiv zu kommunizieren.\nDie FDP hatte nach der ZEIT-Veröffentlichung versucht, die Enthüllungen herunterzuspielen, die Berichte aber grundsätzlich nicht dementiert. Djir-Sarai hatte allerdings in einem TV-Interview dementiert, dass in dem Zusammenhang der Begriff &quot;D-Day&quot; verwendet wurde, den die Alliierten im Zweiten Weltkrieg für den Tag der Landung in der Normandie verwendet hatten. Kritiker hatten der FDP daraufhin vorgeworfen, Olaf Scholz indirekt mit Adolf Hitler verglichen zu haben. Auch andere Liberale hatten das Vorgehen der Partei zunächst verteidigt.\nNach den Veröffentlichungen von Donnerstag war allerdings auch aus der Partei Kritik an dem Vorgehen gekommen. Die Vorsitzende der Jungen Liberalen hatte Djir-Sarai daraufhin zum Rücktritt aufgefordert. &quot;Als Generalsekretär trägt Bijan Djir-Sarai die politische Verantwortung für die Inhalte und die Ausrichtung der Partei. Um weiteren Schaden von der Partei abzuwenden, habe ich Bijan Djir-Sarai als JuLi-Bundesvorsitzende dazu aufgefordert, von seinem Amt zurückzutreten&quot;, hatte die Vorsitzende der Jungen Liberalen, Franziska Brandmann, auf X geschrieben.\nKnapp drei Monate vor der Bundestagswahl steht die FDP somit ohne Generalsekretär da, der üblicherweise für die Organisation des Wahlkampfs zuständig ist. Als möglicher Nachfolger wird der ehemalige Bundesjustizminister Marco Buschmann gehandelt. Djir-Sarai hatte das Amt im April 2022 offiziell von Volker Wissing übernommen, der in der Ampelkoalition Verkehrsminister geworden war. Seit Amtsübernahme der Ampel hatte Djir-Sarai das Amt bereits kommissarisch übernommen.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s005", "type": "GramE", "definition": "Grammatical error: the grammar of a sentence is so broken that the sentence loses its meaning.", "original": "Im Jahr 2022 stiegen die Strompreise in Deutschland zeitweise auf über 70 Cent je Kilowattstunde, inzwischen sind sie für Neukunden deutlich gesunken. Nachdem Russland im Sommer 2022 die Gaslieferungen an Deutschland einstellte, schossen die Gaspreise in die Höhe und befinden sich nun wieder auf dem Niveau vor der Gaskrise im Herbst 2021. Die Benzin- und Dieselpreise unterliegen einem saisonalen Muster und sind in den Sommermonaten aufgrund der erhöhten Nachfrage besonders hoch. Auch geopolitische Ereignisse und die Wirtschaftslage in wichtigen Absatzmärkten wie den USA oder China haben Einfluss auf den Benzinpreis. Eine Karte zeigt jedes Windrad, das in diesem Jahr in Deutschland ans Netz gegangen ist, und verdeutlicht, dass Norddeutschland immer noch der Schwerpunkt des Ausbaus bleibt, auch wenn dort bereits die meisten Anlagen stehen. Bei der Solarenergie liegen die südlichen Bundesländer vorne, da <del>sie<\/del> relativ sonnenreich sind und über ausreichende finanzielle Mittel verfügen, um in erneuerbare Energien zu investieren.", "modified": "Im Jahr 2022 stiegen die Strompreise in Deutschland zeitweise auf über 70 Cent je Kilowattstunde, inzwischen sind sie für Neukunden deutlich gesunken. Nachdem Russland im Sommer 2022 die Gaslieferungen an Deutschland einstellte, schossen die Gaspreise in die Höhe und befinden sich nun wieder auf dem Niveau vor der Gaskrise im Herbst 2021. Die Benzin- und Dieselpreise unterliegen einem saisonalen Muster und sind in den Sommermonaten aufgrund der erhöhten Nachfrage besonders hoch. Auch geopolitische Ereignisse und die Wirtschaftslage in wichtigen Absatzmärkten wie den USA oder China haben Einfluss auf den Benzinpreis. Eine Karte zeigt jedes Windrad, das in diesem Jahr in Deutschland ans Netz gegangen ist, und verdeutlicht, dass Norddeutschland immer noch der Schwerpunkt des Ausbaus bleibt, auch wenn dort bereits die meisten Anlagen stehen. Bei der Solarenergie liegen die südlichen Bundesländer vorne, da <ins>ihnen<\/ins> relativ sonnenreich sind und über ausreichende finanzielle Mittel verfügen, um in erneuerbare Energien zu investieren.", "title": "Die wichtigsten Daten zur Energieversorgung – täglich aktualisiert", "article": "Im Energiekrisenjahr 2022 kostete Strom zeitweise mehr als 70 Cent je Kilowattstunde. Inzwischen sind die Preise für Neukunden deutlich gefallen.\nNachdem Russland im Sommer 2022 die Gaslieferungen an Deutschland über die Nord-Stream-Pipeline eingestellt hat, stiegen die Preise für Gas rasant an. Inzwischen sinken sie wieder auf das Niveau vor der Gaskrise, die mit den zunehmenden Spannungen zwischen Russland und der Ukraine im Herbst 2021 begonnen hat.\nDie Preise für Superbenzin und Diesel folgen einem saisonalen Muster: Zur Haupturlaubszeit in den Sommermonaten ist der Sprit üblicherweise besonders teuer. Zudem hängt der Benzinpreis aber auch von den Weltmarktpreisen für Rohöl ab. Dabei spielen geopolitische Ereignisse und die Wirtschaftslage in wichtigen Absatzmärkten wie den Vereinigten Staaten oder China eine Rolle.\nDie Karte zeigt jedes Windrad, das in Deutschland in diesem Jahr ans Netz gegangen ist. Obwohl in Norddeutschland bereits die meisten Anlagen stehen, findet dort immer noch ein Großteil des Zubaus statt. Bevor ein Windrad gebaut werden kann, müssen es die örtlichen Behörden erst einmal ihre Zusage erteilen. Ein Blick auf die Genehmigungen zeigt daher, wo sich in Zukunft zusätzliche Rotoren drehen könnten.\nBei der Solarenergie liegen die südlichen Bundesländer vorne. Sie sind relativ sonnenreich – und wohlhabend, was bei den Investitionen hilft.\nNie zuvor haben Deutschlands Elektriker mehr Solaranlagen angeschlossen als im Jahr 2023. Auch die Zahl neuer Windräder steigt von Jahr zu Jahr, liegt jedoch unter dem Spitzenjahr 2017, als ein anderes Fördermodell galt. In den kommenden Jahren will die Bundesregierung den Zubau weiter vorantreiben.\n\n\nDas Wetter hat einen großen Einfluss auf Deutschlands Stromversorgung. An wind- und sonnenreichen Tagen können erneuerbare Energiequellen den größten Teil der Versorgung decken. Wenn es nicht reicht, kommen fossile, teure Energieträger wie Gas- und Kohlekraftwerke dazu. Insgesamt ist der Anteil der erneuerbaren Energien in den vergangenen Jahren gewachsen, die Kohlekraft hat an Bedeutung verloren. Die letzten Kernkraftwerke gingen im April 2023 vom Netz.\nIn vielen Monaten kommt mehr als die Hälfte des in Deutschland erzeugten Stroms aus erneuerbaren Quellen wie Wind, Sonne, Wasser und Biomasse. Bis 2035 soll das Stromnetz komplett klimaneutral funktionieren, so plant es die Bundesregierung.\nMehr Grünstrom im Netz bedeutet auch größere Schwankungen bei der Energieerzeugung und den Börsenpreisen. Der Bau großer Batterieparks wird daher immer wichtiger für das Gelingen der Energiewende, die Akkus wirken wie eine Pufferzone: Sie laden auf, wenn gerade viel Wind weht und die Strompreise günstig sind. Und sie werden angezapft, wenn die Preise hoch sind und Strom dringend gebraucht wird.\nJahrelang stieg der Anteil der Fahrzeuge mit Elektromotor unter den Zulassungen. Doch zum Januar 2023 senkte die Bundesregierung die Subventionen beim Neukauf, das dämpft die Nachfrage. Anfang 2024 gehen die Fördersätze nochmals zurück.\nAb 2035 sollen keine neuen Verbrenner mehr zugelassen werden. Anders lässt sich die gesetzlich festgeschriebene Klimaneutralität bis 2045 nicht erreichen, denn Autos fahren im Schnitt zehn Jahre. Doch von diesem Ziel entfernt sich die Realität zunehmend, die Flotte von Benzin- und Dieselautos wächst.\n\nWer ein Haus hat, baut nicht so schnell ein neues. Die damit einhergehende Trägheit des Gebäudesektors zeigt ein Blick auf die Bestandsdaten. Obwohl die Wärmepumpe im Neubau weit vorne liegt, kommt sie insgesamt nur auf einen Anteil im einstelligen Prozentbereich aller Häuser in Deutschland.\nDer Blick auf die vergangenen Jahrzehnte zeigt, dass sich am Energiemix erstaunlich wenig verändert hat. Zwar spielen erneuerbare Quellen heute eine wichtige Rolle bei der Stromerzeugung, doch Strom macht nur einen kleinen Teil des gesamten Energieverbrauchs aus."}, {"id": "s012", "type": "GramE", "definition": "Grammatical error: the grammar of a sentence is so broken that the sentence loses its meaning.", "original": "Elon Musk sorgte bei seiner Rede auf der Veranstaltung zur Amtseinführung von Donald Trump für Irritationen, als er eine Geste zeigte, die dem Hitlergruß ähnelte.\n\nWährend seines Auftritts sprang und tanzte Musk über die Bühne und bedankte sich bei den Anhängern des neuen Präsidenten. Dann hielt er seine rechte Hand an sein Herz und streckte sie in einer schnellen Bewegung nach oben aus. Diese Geste wiederholte er noch einmal mit dem Rücken zum Publikum, während <del>er<\/del> rief: &quot;Mein Herz fliegt Euch zu.&quot;\n\nDie Geste löste auf Musks Onlineplattform X Diskussionen aus, da viele Nutzer darin einen Hitlergruß sahen. Der Nachrichtensender CNN zeigte die Szene mehrfach in seinem Programm und ließ es die Zuschauer selbst entscheiden, wie sie die Geste interpretieren wollten.\n\nVon Musk gab es zunächst keine Erklärung zu der umstrittenen Geste. Später teilte er auf seinem X-Account einen Mitschnitt seiner Rede vom Sender Fox News, in dem genau in dem Moment, als er die erste Geste zeigte, die Zuhörer eingeblendet wurden.\n\nWährend seines Auftritts hatte Musk auch gesagt, dass durch Trumps Wahl die &quot;Zukunft der Zivilisation gesichert&quot; worden sei und dass die ganze Menschheit an einer Weggabelung gewesen wäre.", "modified": "Elon Musk sorgte bei seiner Rede auf der Veranstaltung zur Amtseinführung von Donald Trump für Irritationen, als er eine Geste zeigte, die dem Hitlergruß ähnelte.\n\nWährend seines Auftritts sprang und tanzte Musk über die Bühne und bedankte sich bei den Anhängern des neuen Präsidenten. Dann hielt er seine rechte Hand an sein Herz und streckte sie in einer schnellen Bewegung nach oben aus. Diese Geste wiederholte er noch einmal mit dem Rücken zum Publikum, während <ins>ihm<\/ins> rief: &quot;Mein Herz fliegt Euch zu.&quot;\n\nDie Geste löste auf Musks Onlineplattform X Diskussionen aus, da viele Nutzer darin einen Hitlergruß sahen. Der Nachrichtensender CNN zeigte die Szene mehrfach in seinem Programm und ließ es die Zuschauer selbst entscheiden, wie sie die Geste interpretieren wollten.\n\nVon Musk gab es zunächst keine Erklärung zu der umstrittenen Geste. Später teilte er auf seinem X-Account einen Mitschnitt seiner Rede vom Sender Fox News, in dem genau in dem Moment, als er die erste Geste zeigte, die Zuhörer eingeblendet wurden.\n\nWährend seines Auftritts hatte Musk auch gesagt, dass durch Trumps Wahl die &quot;Zukunft der Zivilisation gesichert&quot; worden sei und dass die ganze Menschheit an einer Weggabelung gewesen wäre.", "title": "Title Not Found", "article": "Elon Musk hat nach der Amtseinführung Donald Trumps als neuer US-Präsident bei einer \nVeranstaltung in der Capital One Arena mit einer\n dem Hitlergruß ähnlich sehenden Geste für Irritationen gesorgt. Musk\n war einer der Redner auf der Bühne vor dem Eintreffen Trumps. In einem ungewöhnlichen Auftritt sprang und tanzte der Tesla-Gründer über die Bühne und bedankte sich bei den Anhängern des \nneuen Präsidenten. Dann hielt er seine rechte Hand an sein Herz und \nstreckte sie in einer schnellen Bewegung nach oben raus. Danach \nwiederholte er die Geste noch einmal mit dem Rücken zum Publikum. &quot;Mein Herz\n fliegt Euch zu&quot;, rief Musk.\nViele Nutzer auf Musks\n Onlineplattform X sahen in der Geste einen Hitlergruß. Der Nachrichtensender CNN wiederholte die Szene in seinem \nProgramm mehrfach. Die Zuschauer seien selbst klug genug, sich eine \nMeinung dazu zu bilden, sagte eine Moderatorin.\nVon Musk\n gab es zunächst keine Erklärung dazu. Auf seinem\n X-Account teilte er einen Mitschnitt seiner Rede vom Sender Fox News, in dem im \nMoment der ersten – und problematischer aussehenden – Geste die Zuhörer \neingeblendet wurden.\nBei seinem Auftritt sagte Musk noch, durch Trumps Wahl sei die &quot;Zukunft der Zivilisation gesichert&quot; worden. Die ganze Menschheit sei an einer Weggabelung gewesen."}, {"id": "s029", "type": "GramE", "definition": "Grammatical error: the grammar of a sentence is so broken that the sentence loses its meaning.", "original": "Elon Musk <del>mischt<\/del> sich vermehrt in die Politik <del>ein,<\/del> ohne Berührungsängste mit Rechtspopulisten zu haben. Dies wirft Fragen auf, insbesondere für Tesla-Kunden in Deutschland.", "modified": "Elon Musk <ins>wird<\/ins> sich vermehrt in die Politik <ins>eingemischt,<\/ins> ohne Berührungsängste mit Rechtspopulisten zu haben.\nDies wirft Fragen auf, insbesondere für Tesla-Kunden in Deutschland.", "title": "&quot;Ich will Herrn Musk ja nicht heiraten&quot;", "article": "An Elon Musk gibt es derzeit kaum ein Vorbeikommen. Erst bietet er dem zukünftigen republikanischen Präsidenten Donald Trump seine Unterstützung bei der Regierungsarbeit an , dann spricht er sich für die AfD als letzte Hoffnung für Deutschland aus , gibt Alice Weidel auf seiner Plattform X eine Bühne und mischt sich vermehrt auch in die Politik anderer Länder ein – ohne Berührungsängste mit Rechtspopulisten.\nDem Unternehmen Tesla, dessen CEO Musk ist und an dem er etwa 13 Prozent der Firmenanteile hält, scheint das bisher nicht zu schaden: Die monatlichen Neuzulassungen in Deutschland sind seit Ende 2022 zwar rückläufig, aber diese Absatzkrise teilen alle E-Autohersteller. Und seit bekannt ist, dass Musk an der Regierung Trump beteiligt sein wird, sind die Tesla-Aktien sogar von rund 220 US-Dollar auf nun rund 400 US-Dollar im Wert gestiegen.\nAber jubeln auch diejenigen, die im Alltag mit einem Tesla auf deutschen Straßen unterwegs sind? ZEIT ONLINE hat Tesla-Fahrerinnen und -Fahrer gefragt, über 600 Menschen haben sich zurückgemeldet. Das Ergebnis ist nicht repräsentativ für alle Teslabesitzer in Deutschland. Es gibt einen Eindruck davon, wie viel politisches Engagement einzelne Kundinnen und Kunden dem Firmengründer Musk erlauben. Und dass Tesla zumindest in Deutschland manche Kundinnen und Kunden verlieren könnte. Eine Annäherung in drei Gruppen:\nOhne Musk gäbe es Tesla nicht, er sei ein Techgenie, und daran würden auch seine politischen Äußerungen nichts ändern: So in etwa lassen sich die Aussagen derjenigen zusammenfassen, die trotz – oder gerade wegen – der Äußerungen von Musk auch zu einem seiner bekanntesten Produkte halten. Viele in dieser ersten Gruppe der Musk- und Teslafans spielen die mediale Aufregung um den Unternehmer herunter.\nAnders hingegen eine zweite Gruppe, die sich unter den Zuschriften ausmachen lässt: Sie distanzieren sich deutlich von Musks Äußerungen – sehen in ihrem Tesla aber weiterhin ein gutes Auto. Sie betonen, dass das Preis-Leistungs-Verhältnis zum Kaufzeitpunkt das beste war und Tesla der Konkurrenz noch immer überlegen ist. Diese pragmatischen Gründe stünden für sie im Vordergrund, weniger das politische Auftreten des Firmenchefs.\nUm ihre Distanz zu Elon Musk trotz ihres Tesla zu unterstreichen, wählen einige Besitzerinnen und Besitzer offenbar ein kreatives Mittel: Mehrere der Zuschriften, die bei ZEIT ONLINE eingegangen sind, berichten von Aufklebern, die sie sich anschaffen wollen oder die ihnen auf anderen Teslas aufgefallen sind, manche hängen Fotos an: &quot;Das Auto ist gut – Elon Musk nicht.&quot;\nEine dritte Gruppe distanziert sich deutlich von Elon Musk und schreibt, daraus auch einen Schluss über die Kaufentscheidung zu ziehen: Wer Tesla kauft, unterstütze damit indirekt auch Musk. Manche bereuten ihren Kauf deshalb, schämten sich für ihr Auto – eine Art &quot;Teslascham&quot;. Andere geben an, sogar einen Schritt weitergehen zu wollen: Sie planten, ihr Fahrzeug zu verkaufen oder zumindest nach Ende des Leasings nicht wieder einen Tesla zu wählen. Ob sie diesen Schritt tatsächlich gehen, kann nicht überprüft werden.\nDamit zeigt die nicht repräsentative Umfrage innerhalb der ZEIT-Leserschaft: Es gibt zumindest Anzeichen dafür, dass manche potenziellen Kundinnen und Kunden sich von Tesla abwenden.\nMusk gefährde damit die Marke Tesla, sagt Henrik Sattler,\nProfessor für Marketing und Branding sowie stellvertretender Dekan an der University of Hamburg Business School. &quot;Politische Äußerungen bergen immer die Gefahr, dass große\nKreise sich damit nicht identifizieren können&quot;, sagt Sattler. Deshalb\nverhielten sich Firmenchefs überwiegend öffentlich unpolitisch, vor allem in\nDeutschland. Nicht so Elon Musk. &quot;Er steht für die Marke Tesla. Seine extremen Äußerungen\nwerden deshalb einen kurz- bis mittelfristigen Schaden an der Marke verursachen.&quot;\nDas nehme Musk jedoch in Kauf. &quot;Ihm geht es jetzt um\npolitischen Erfolg. Und darüber kann er dann auch ökonomisch profitieren&quot;, sagt\nSattler. Am Aktienmarkt scheint diese Strategie bisher aufzugehen. Und auch könnte der Unternehmer mit seinen extremen Wahlempfehlungen einen ganz neuen Kundenkreis erschließen.\nMarketing-Experte Sattler fährt selbst Tesla. Doch aktuell\ngeht es ihm wie einigen der Leserinnen und Leser von ZEIT\nONLINE, die an der Befragung teilgenommen haben: Er würde sich nach eigenen Angaben wahrscheinlich nicht erneut für das Auto\nentscheiden – wegen Musks Verhalten.\nDieser Artikel wurde durch die Perspektiven unserer Leserschaft bereichert. Hier finden Sie alle Texte mit Stimmen aus der Community .\n*Die vollständigen Namen aller hier gezeigten Einreichungen sind der Redaktion bekannt. Manche baten darum, nur mit Vornamen oder unter Pseudonym veröffentlicht zu werden."}, {"id": "s037", "type": "GramE", "definition": "Grammatical error: the grammar of a sentence is so broken that the sentence loses its meaning.", "original": "Das Jahr 2024 war das wärmste seit Messbeginn, mit einer Durchschnittstemperatur von mehr als 1,5 Grad über dem vorindustriellen Mittel. Der Klimawandeldienst Copernicus berichtete von einer Erwärmung um 1,6 Grad Celsius. Trotzdem sei das Pariser Klimaabkommen noch nicht verfehlt, da <del>es<\/del> eine Überschreitung des Schwellenwerts über 20 Jahre erfordert. Die Rekordtemperaturen werden hauptsächlich durch die Anhäufung von Treibhausgasen verursacht. Copernicus-Chef Carlo Buontempo betonte die Bedeutung schnellen und entschlossenen Handelns, um die Klimaentwicklung zu beeinflussen.", "modified": "Das Jahr 2024 war das wärmste seit Messbeginn, mit einer Durchschnittstemperatur von mehr als 1,5 Grad über dem vorindustriellen Mittel. Der Klimawandeldienst Copernicus berichtete von einer Erwärmung um 1,6 Grad Celsius. Trotzdem sei das Pariser Klimaabkommen noch nicht verfehlt, da <ins>dem<\/ins> eine Überschreitung des Schwellenwerts über 20 Jahre erfordert. Die Rekordtemperaturen werden hauptsächlich durch die Anhäufung von Treibhausgasen verursacht. Copernicus-Chef Carlo Buontempo betonte die Bedeutung schnellen und entschlossenen Handelns, um die Klimaentwicklung zu beeinflussen.", "title": "Title Not Found", "article": "Das Jahr 2024 war das wärmste seit Messbeginn. Die Temperatur war im Durchschnitt mehr als 1,5 Grad wärmer als im vorindustriellen Mittel, wie der Klimawandeldienst des EU-Programms Copernicus berichtet. Das europäische Team berechnete eine Erwärmung von 1,6 Grad Celsius.\nIn den beiden vergangenen Jahren zusammen wurde die Erderwärmung im Schnitt um mehr als 1,5 Grad im Vergleich zur vorindustriellen Zeit überschritten. Dabei sei 2024 das erste Kalenderjahr, in dem die Durchschnittstemperatur mehr als 1,5 Grad höher war als im Vergleichszeitraum, teilte das Erdbeobachtungsprogramm weiter mit. Es bestätigte zudem frühere Annahmen, dass 2024 das heißeste Jahr seit Beginn der Aufzeichnungen Mitte des 19. Jahrhunderts war.\nDies bedeute noch nicht, dass das Ziel des Pariser Klimaabkommens verfehlt sei, erklärte Copernicus. Dieses beziehe sich auf eine Überschreitung des Schwellenwerts während mindestens 20 Jahren. &quot;Aber es macht deutlich, dass die globalen Temperaturen höher steigen, als die moderne Menschheit es je erlebt hat&quot;, hieß es weiter. &quot;Die Zukunft liegt in unserer Hand: Schnelles und entschlossenes Handeln kann die Entwicklung des Klimas noch beeinflussen&quot;, sagte Copernicus-Chef Carlo Buontempo.\nDer Hauptgrund für die Rekordtemperaturen ist die Anhäufung von Treibhausgasen in der Atmosphäre, &quot;die durch die Verbrennung von Kohle, Öl und Gas entstehen&quot;, sagte Samantha Burgess vom Corpernicus-Klimadienst. &quot;Da sich die Treibhausgase weiterhin in der Atmosphäre ansammeln, steigen die Temperaturen weiter an, auch im Meer, der Meeresspiegel steigt weiter an, und die Gletscher und Eisschilde schmelzen weiter.&quot;\n\nAuch Meeresoberfläche so heiß wie nie\n\nAuch bei der Erwärmung der Meeresoberfläche ist laut dem Klimawandeldienst ein neuer Höchstwert erreicht worden. Im vergangenen Jahr habe die Durchschnittstemperatur bei 20,9 Grad gelegen, etwa ein halbes Grad höher als in den Jahren zwischen 1990 und 2020.\nDie internationale Gemeinschaft hatte sich 2015 bei der Weltklimakonferenz in Paris darauf verständigt, die Erderwärmung auf möglichst 1,5 Grad im Vergleich zum vorindustriellen Zeitalter zu begrenzen. Die UN-Klimakonferenz in Baku, COP29, endete im vergangenen Jahr mit einem viel kritisierten Minimalkompromiss zur Klimafinanzierung. Neue Beschlüsse zur Abkehr von fossilen Energieträgern blieben aus."}, {"id": "s039", "type": "GramE", "definition": "Grammatical error: the grammar of a sentence is so broken that the sentence loses its meaning.", "original": "In Berlin haben Tausende Menschen auf einer Großdemonstration eine neue Agrarpolitik <del>von der<\/del> Bundesregierung gefordert, wobei das Bündnis &quot;&quot;Wir haben es satt&quot;&quot; von 9.000 Teilnehmern spricht, während die Polizei von 1.700 spricht. Die Protestaktion fand zum 15. Mal parallel zur Agrarmesse Grüne Woche statt und konzentrierte sich auf Forderungen nach kostendeckenden Erzeugerpreisen und Finanzierung von Tierschutz- und Umweltmaßnahmen. Das Motto war &quot;&quot;Gemeinwohl vor Konzerninteressen in der Agrarpolitik&quot;&quot;. Das Bündnis kritisierte die Tatenlosigkeit der Bundesregierung in der Agrarpolitik und forderte eine adäquate Unterstützung für bäuerliche Betriebe.", "modified": "In Berlin haben Tausende Menschen auf einer Großdemonstration eine neue Agrarpolitik <ins>die<\/ins> Bundesregierung gefordert, wobei das Bündnis &quot;&quot;Wir haben es satt&quot;&quot; von 9.000 Teilnehmern spricht, während die Polizei von 1.700 spricht. Die Protestaktion fand zum 15. Mal parallel zur Agrarmesse Grüne Woche statt und konzentrierte sich auf Forderungen nach kostendeckenden Erzeugerpreisen und Finanzierung von Tierschutz- und Umweltmaßnahmen. Das Motto war &quot;&quot;Gemeinwohl vor Konzerninteressen in der Agrarpolitik&quot;&quot;. Das Bündnis kritisierte die Tatenlosigkeit der Bundesregierung in der Agrarpolitik und forderte eine adäquate Unterstützung für bäuerliche Betriebe.", "title": "Title Not Found", "article": "In Berlin haben auf einer Großdemonstration mehrere Tausend Menschen eine neue Agrarpolitik von der Bundesregierung gefordert. Laut dem Bündnis &quot;Wir haben es satt&quot; nahmen 9.000 Menschen teil, laut der Polizei waren es 1.700. Die Protestaktion fand zum 15. Mal statt. Sie wird alljährlich parallel zur Agrarmesse Grüne Woche abgehalten .\nDieses Jahr standen besonders Forderungen nach verbindlichen Gesetzen für kostendeckende Erzeugerpreise und eine sichere Finanzierung von Tierschutz- und Umweltmaßnahmen im Fokus. Das Motto lautete: &quot;Gemeinwohl vor Konzerninteressen in der Agrarpolitik&quot;.\n&quot;Wir alle wollen gesunde Lebensmittel. Wir alle wollen Tierwohl, Umwelt- und Klimaschutz&quot;, sagte Anne Skambraks vom Bündnis &quot;Wir haben es satt&quot;. &quot;Die kommende Bundesregierung muss bäuerliche Betriebe dabei endlich adäquat unterstützen.&quot; Dafür brauche es ein &quot;zuverlässiges Bekenntnis und eine ambitionierte Förderung für eine bäuerlich-ökologischere Landwirtschaft&quot;.\n\nBündnis wirft Bundesregierung Tatenlosigkeit vor\n\nDas Bündnis wirft der Bundesregierung Tatenlosigkeit in der Agrarpolitik vor. Wie schon von vorangegangenen Regierungen seien &quot;der Umbau der Tierhaltung liegen gelassen und viel zu oft Konzerninteressen priorisiert&quot; worden, hieß es. Es fehlten weiterhin Gesetze, die Ackerland für die Nahrungsmittelproduktion sicherten, kritisierten die Organisatoren. Die Erzeugerinnen und Erzeuger würden zudem nicht ausreichend von den Preisen im Supermarkt profitieren .\nDie Kundgebung startete am Mittag vor dem Kanzleramt, später war noch ein Demonstrationszug durch das Regierungsviertel geplant. Dem Bündnis &quot;Wir haben es satt&quot; gehören nach eigenen Angaben rund 60 Organisationen aus Landwirtschaft und Gesellschaft an. Im vergangenen Jahr war der Protest aufgrund der angekündigten Streichung der Agrardieselsubventionen besonders groß ausgefallen.\nAm Samstag endete zudem die 17. Berliner Agrarministerkonferenz, zu der Bundeslandwirtschaftsminister Cem Özdemir Vertreterinnen und Vertreter aus 70 Ländern und 17 Organisation eingeladen hatte. Sie findet ebenfalls jährlich zeitgleich mit der Grünen Woche statt.\nDie Teilnehmer einigten sich darauf, gemeinsam eine nachhaltige Bioökonomie voranzutreiben. Zudem erklärten sie ihre Absicht, ein Projekt der Ernährungs- und Landwirtschaftsorganisation der Vereinten Nationen zur Ausgestaltung einer globalen Bioökonomiepartnerschaft zu finanzieren."}, {"id": "s001", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während <del>die Inflation<\/del> sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "modified": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während <ins>er<\/ins> sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "title": "Title Not Found", "article": "Der bedeutendste deutsche Aktienindex Dax         hat\nerstmals die 20.000-Punkte-Marke überstiegen. Der deutsche\nLeitindex stieg in der Spitze um 0,4 Prozent auf\n20.003,50 Zähler. Innerhalb nur eines Jahres ist der Dax damit \num rund 3.000 Zähler gestiegen. Erst Mitte September hatte er die \nMarke von 19.000 Punkten übertroffen , zuvor Mitte März die von 18.000 .\nGrund dafür sind laut Börsenexperten die Hoffnung auf vorerst weiter sinkende Zinsen in den USA und\nin der Euro-Zone, die für mehr Konsum und Investitionen sorgen . Angesichts der zuletzt deutlich gefallenen Inflation setzen Anleger \noffenbar darauf, dass die Notenbanken die Leitzinsen weiter senken. Das ist positiv für Aktienkäufer, weil Unternehmen dann im besten Fall wachsen und mehr wert werden.\nRekorde auch bei US-Indizes\nSeit\nJahresbeginn legte der Dax bereits 16 Prozent zu. Auch wegen der positiven Entwicklungen an der Wall Street steigt der Dax: Die beiden dort bedeutenden Aktienindexe S&amp;P\n500 und Nasdaq-Composite erreichten zu\nWochenbeginn einen neuen Schlussrekord. Auch die Wahl Donald Trumps zum neuen US-Präsidenten lässt die Wall Street auf mehr Gewinne hoffen , da Trump Steuersenkungen, Zölle und weniger Regulierungen versprochen hat.\nDie Wall Street entwickelt sich also bereits länger positiv, der Dax scheint den Zahlen zufolge nun nachzuziehen. Gleichzeitig steht die Entwicklung an den Börsen in Kontrast zur eher schwierigen\nWirtschaftslage in Deutschland . Doch Investoren richten sich oft eher nach künftigen Gewinnen. Zudem sind die meisten der 40 Konzerne, aus denen der Dax gespeist wird, international aufgestellt."}, {"id": "s019", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet <del>sie<\/del> als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "modified": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet <ins>ihn<\/ins> als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "title": "Title Not Found", "article": "Unionskanzlerkandidat Friedrich Merz hat die Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump kritisiert. &quot;Diese Nachricht aus Washington ist in der Sprache eines politischen Aktivisten verfasst. Und sie ist offensichtlich bewusst öffentlich gemacht worden&quot;, sagte der CDU-Politiker im Deutschlandfunk. Dies seien gleich zwei schwere Fehler der deutschen Außenpolitik.\nEin schriftlicher Bericht des Botschafters Andreas Michaelis an das Außenministerium war kurz vor der Amtseinführung Trumps an die Öffentlichkeit gelangt . Darin schrieb Michaelis unter anderem, Trumps Agenda &quot;der maximalen Disruption, des Aufbrechens etablierter politischer Ordnung und bürokratischer Strukturen sowie seine Rachepläne&quot; bedeuteten letztlich &quot;eine Neudefinition der verfassungsrechtlichen Ordnung&quot;. Zudem kritisierte er die &quot;maximale Machtkonzentration beim Präsidenten zulasten von Kongress und Bundesstaaten&quot;.\nMerz sagte über Michaelis&#x27; Bericht: &quot;Allein die Tatsache, dass dies offensichtlich bewusst öffentlich gemacht worden ist, ist ein Affront.&quot; Hinter der Veröffentlichung sieht er eine innenpolitische Motivation. &quot;Für das Ansehen der Bundesregierung in Washington, D. C. , ist das ein großer Schaden&quot;, sagte der Unionskanzlerkandidat. Die aktuelle Bundesregierung werde in Washington, D. C., zeitnah keine Gesprächspartner mehr finden.\n&quot;Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren?&quot;\nDie Kritik des CDU-Vorsitzenden bezog sich primär auf die Veröffentlichung des Textes, nicht auf den Inhalt. So stehe in der Analyse &quot;auch manches Richtige&quot;. Allerdings müssten aus dieser Analyse Schlussfolgerungen gezogen werden.\nLaut Merz müssten die Konsequenzen sein, dass sich die Europäer &quot;jetzt schnell zusammensetzen&quot; und insbesondere über zwei Themen diskutieren: die eigenen Schritte für die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA. &quot;Diese beiden Fragen müssen nicht deutsch, sondern europäisch beantwortet werden&quot;, sagte Merz.\nIn beiden Aspekten sieht Merz Deutschland in besonderer Verantwortung. So gebe es aktuell sehr viele Möglichkeiten für Europa, die nicht ausgeschöpft würden. &quot;Alles hängt da an der Frage: Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren? Ist Deutschland bereit, für Europa eine Führungsverantwortung zu übernehmen?&quot;\nVerfolgen sie die aktuellen Entwicklungen zur Amtseinführung Donald Trumps in unserem Liveblog ."}, {"id": "s027", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Die ZEIT ONLINE startet eine neue Ausgabe von &quot;&quot;Deutschland spricht&quot;&quot;, bei der Leser mit unterschiedlichen politischen Ansichten zusammengebracht werden, um respektvoll über Politik zu diskutieren. Auch die Frankfurter Allgemeine Zeitung und die &quot;&quot;Bild&quot;&quot;-Zeitung rufen zur Teilnahme auf. Die Anmeldung läuft bis zum 9. Februar, <del>Partner<\/del> werden am 10. Februar vorgestellt, Gespräche finden am 16. Februar statt. Bisherige Teilnehmer waren zufrieden und 90 Prozent würden wieder teilnehmen.", "modified": "Die ZEIT ONLINE startet eine neue Ausgabe von &quot;&quot;Deutschland spricht&quot;&quot;, bei der Leser mit unterschiedlichen politischen Ansichten zusammengebracht werden, um respektvoll über Politik zu diskutieren. Auch die Frankfurter Allgemeine Zeitung und die &quot;&quot;Bild&quot;&quot;-Zeitung rufen zur Teilnahme auf. Die Anmeldung läuft bis zum 9. Februar, <ins>sie<\/ins> werden am 10. Februar vorgestellt, Gespräche finden am 16. Februar statt. Bisherige Teilnehmer waren zufrieden und 90 Prozent würden wieder teilnehmen.", "title": "Die Fragen, auf die es jetzt ankommt", "article": "Update: Seit dem 10. Januar rufen auch die Frankfurter Allgemeine Zeitung und die &quot;Bild&quot;-Zeitung zu &quot;Deutschland spricht&quot; auf. Wenn Sie sich von nun an auf ZEIT ONLINE für das Dialogformat anmelden, stellen wir Sie möglicherweise einer Teilnehmerin oder einem Teilnehmer dieser zwei Medienpartner vor. Alle Leserinnen und Leser, die sich vor dem 10. Januar angemeldet haben, bringen wir ausschließlich mit anderen ZEIT-ONLINE-Lesern zusammen.\nFast hätte man es nach den Wochen des Ampeldramas vergessen können: Wenn im kommenden Februar ein neuer Bundestag gewählt wird, geht es mitnichten nur um Machtfragen und das politische Personal, sondern um grundlegend unterschiedliche politische Ansichten. Sollte Deutschland Taurus-Marschflugkörper in die Ukraine liefern? Sollte der Staat mehr Menschen aus Deutschland abschieben? Wird das Bürgergeld gekürzt? Das alles steht zur Wahl. In all diesen Sachfragen sind nicht nur die Parteien uneins, sondern auch die Bürgerinnen und Bürger. Wäre es also nicht Zeit für einen respektvollen Streit zwischen denen, die in diesen Fragen unterschiedlicher Auffassung sind?\nWir denken schon. Deshalb starten wir bei ZEIT ONLINE eine neue Ausgabe von Deutschland spricht , einem politischen Datingformat, das wir vor sieben Jahren erfunden haben. Die Idee: Wir bringen Menschen zusammen, die politisch komplett unterschiedlich denken und die sich normalerweise nie begegnet wären. Und wir bitten sie, sich zu einem Eins-zu-eins-Gespräch zu verabreden, um respektvoll über Politik zu diskutieren. Seit 2017 haben sich rund 130.000 Menschen in Deutschland für solch ein Gespräch registriert, viele von Ihnen haben schon mehrfach teilgenommen .\nIn den kommenden Wochen finden Sie auf ZEIT ONLINE und den Seiten unserer Medienpartner eine kleine Box. Darin stellen wir Ihnen acht Ja-/Nein-Fragen. Zum Beispiel: Sollte Deutschland Taurus-Marschflugkörper an die Ukraine liefern? Oder: Ist Donald Trump eine Gefahr für die Demokratie? Oder: Ist Deutschland ein gerechtes Land?\nWenn Sie diese Fragen beantwortet haben, bringen wir Sie mit jemandem zusammen, der über die politischen Fragen ganz anders denkt als Sie und möglichst in Ihrer Nähe wohnt. Anfang Februar stellen wir Sie einander per E-Mail vor. Sobald Sie beide dem Gespräch zugestimmt haben, können Sie direkt Kontakt aufnehmen und sich für ein Gespräch am 16. Februar verabreden, rund eine Woche vor der Bundestagswahl. Einen kleinen Kreis der Teilnehmenden wollen wir in diesem Jahr erstmals nach Berlin einladen – zu einem gemeinsamen Essen, eine Art Tischgespräch mit Teilen der Redaktion. Wie Sie sich dafür anmelden können, erfahren Sie, nachdem Sie Ihre Anmeldung für Deutschland spricht abgeschlossen haben.\nHaben Sie Lust, sich anzumelden? Wir würden uns freuen? Hier finden Sie noch alle wichtigen Fragen zur Aktion:\n\nWie kann ich mich anmelden?\n\nWeiter oben auf dieser Seite und vielen unserer Artikel auf ZEIT ONLINE finden Sie eine kleine Box mit Ja-/Nein-Fragen. Beantworten Sie alle Fragen und geben Sie anschließend ein paar persönliche Daten an.\nDie Anmeldung ist bis zum 9. Februar möglich.\n\nWann wird mir mein Partner vorgestellt?\n\nSie werden am 10. Februar eine E-Mail erhalten, in der Sie Ihrem Partner vorgestellt werden – anhand der Angaben, die Sie bei der Registrierung über sich eingeben. Erst wenn Sie und Ihr Partner dem Treffen zugestimmt haben, geben wir Ihre E-Mail-Adresse weiter, sodass Sie miteinander Kontakt aufnehmen und Ihr Treffen vereinbaren können.\n\nWann finden die Gespräche statt?\n\nAlle Gespräche sollten möglichst zur selben Zeit stattfinden: am 16. Februar um 14 Uhr. Falls dieser Termin Ihnen nicht passt, können Sie mit Ihrem Match eine andere Zeit vereinbaren, idealerweise vor der Bundestagswahl.\n\nWo sollen wir uns treffen?\n\nWie bei der ersten Ausgabe von Deutschland spricht versuchen wir dieses Mal wieder, jemanden für Sie zu finden, der nicht weit von Ihnen entfernt wohnt. Sie können also mit Ihrem Gegenüber einen Treffpunkt in Ihrer Nähe vereinbaren. Bitte treffen Sie sich ausschließlich an öffentlichen Orten, zum Beispiel in einem Café. Sollte ein persönliches Treffen nicht möglich sein, können Sie auch ein Telefonat oder einen Videocall vereinbaren.\n\nIch möchte meinen Gesprächspartner / meine Gesprächspartnerin nicht treffen\n\nDeutschland spricht ist ein Experiment, und wir hoffen, dass Sie offen sind, mit jemand Neuem zu sprechen. Es steht Ihnen aber selbstverständlich frei, ob Sie das Treffen mit Ihrem Gesprächspartner bestätigen und miteinander in Kontakt treten. Bitte beachten Sie aber, dass wir Ihnen in dieser Ausgabe von Deutschland spricht nur einen Gesprächspartner vorstellen können.\n\nWelche Erfahrungen haben die bisherigen Teilnehmenden gemacht?\n\nIn der Vergangenheit haben 90 Prozent der Teilnehmenden uns mitgeteilt, dass sie mit ihrem Gespräch zufrieden waren und wieder bei Deutschland spricht teilnehmen würden. 60 Prozent wollen mit ihrem Gesprächspartner in Kontakt bleiben, und 55 Prozent sagen, dass ihr Partner ein überzeugendes Argument zu einer oder mehreren der Diskussionsfragen vorgebracht hat.\nEine Studie zweier Forscher der Universitäten Harvard und Stanford hat zudem gezeigt, dass Deutschland spricht- Gespräche dazu beitragen können, das Misstrauen gegenüber politisch Andersdenkenden zu verringern."}, {"id": "s040", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Die Waffenruhe zwischen Israel und der Hamas gibt den Palästinensern im Gazastreifen Hoffnung, dass die Bombenangriffe endlich vorbei sind. Die Zerstörung nach dem 496 Tage dauernden Krieg ist immens, mit fast 60 Prozent der Gebäude erheblich beschädigt. Trotz israelischer Behauptungen, keine Zivilisten anzugreifen, sind laut dem Gesundheitsministerium der Hamas über 46.000 Palästinenser getötet worden. Die Menschen sollen nun in den nördlichen Teil des Gazastreifens zurü henden Gesundheitsministeriums sind seit dem 7. Oktober\nmehr als 46.000 Palästinenser getötet worden. Zahlreiche Menschen sind vor den Bomben geflohen, ihre Wohnungen sind zerstört.\nMit einem möglichen Beginn der Waffenruhe sollen die Menschen nun in den Norden des Gazastreifens zurückkehren dürfen. Was dort\nauf sie wartet, ist Zerstörung. Mehr als 70 Prozent der Gebäude in Gaza-Stadt und der umliegenden Region sind beschädigt."}, {"id": "s049", "type": "CorefE", "definition": "Coreference error: a pronoun or reference points to the wrong antecedent, or to none.", "original": "Bundesgesundheitsminister Karl Lauterbach (SPD) hat den Wurf einer Schaumtorte auf den ehemaligen Finanzminister Christian Lindner (FDP) als Gewalt und Angriff auf die Demokratie verurteilt. &quot;Es fängt mit der Torte an und hört mit Steinen oder mit Sprengsätzen auf&quot;, sagte Lauterbach, der eine Verrohung des politischen Prozesses sieht und eine Bestrafung fordert.\nAuch der Kanzlerkandidat der Grünen, Robert Habeck, kritisierte den Vorfall scharf: &quot;Tätliche Angriffe jedweder Art haben im Ringen um die besten Lösungen für dieses Land nichts zu suchen!&quot;, schrieb <del>er<\/del> auf der Plattform X.\nDer FDP-Vorsitzende Christian Lindner wurde bei einem Wahlkampfauftritt in Greifswald von einer Lokalpolitikerin der Linken mit einer schaumartigen Substanz beworfen. Der Wurf traf den früheren Finanzminister direkt ins Gesicht, doch Lindner nahm die Attacke gelassen: &quot;Es war leider nicht Sahne, sondern nur Seife&quot;, sagte er und setzte seine Rede fort.\nDer Landesvorsitzende der Linken in Mecklenburg-Vorpommern distanzierte sich von dem Vorfall und betonte, dass Gewalt keine Lösung sei.", "modified": "Bundesgesundheitsminister Karl Lauterbach (SPD) hat den Wurf einer Schaumtorte auf den ehemaligen Finanzminister Christian Lindner (FDP) als Gewalt und Angriff auf die Demokratie verurteilt. &quot;Es fängt mit der Torte an und hört mit Steinen oder mit Sprengsätzen auf&quot;
