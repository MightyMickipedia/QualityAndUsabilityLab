const ITEMS = [{"id": "s017", "summary": "Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten. Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber <ins>nicht<\/ins> zuversichtlich, dass eine Lösung gefunden wird.", "original": "Mehrere SPD-Politiker kritisieren Bundeskanzler Olaf Scholz&#x27; Weigerung, vor der Bundestagswahl weitere Unterstützung in Höhe von drei Milliarden Euro für Waffenlieferungen an die Ukraine zu leisten. Andreas Schwarz fordert eine Entscheidung im Parlament und einen Schulterschluss mit CDU und CSU. Kristian Klinck betont die Bedeutung von Unterstützung und Diplomatie für einen stabilen Waffenstillstand. Grünenpolitiker Sebastian Schäfer fordert Scholz auf, seine Blockadehaltung zu überdenken. Verteidigungsminister Boris Pistorius verteidigt Scholz und betont die Schwierigkeiten bei der Finanzierung, zeigt sich aber zuversichtlich, dass eine Lösung gefunden wird.", "title": "SPD-Politiker werfen Olaf Scholz Blockade der Ukrainehilfen vor", "article": "Mehrere SPD-Politiker haben Bundeskanzler Olaf Scholz&#x27; Weigerung kritisiert, noch vor der Bundestagswahl weitere Unterstützung für die Ukraine in Höhe von drei Milliarden Euro für Waffenlieferungen auf den Weg zu bringen. Kriege richteten sich nicht nach Wahlen, zitiert der Spiegel den SPD -Haushalts- und Verteidigungspolitiker Andreas Schwarz: &quot;Wenn es unter den demokratischen Kräften im Bundestag eine Mehrheit gibt für ein zusätzliches Hilfspaket für die Ukraine, sollten wir das noch vor der Bundestagswahl beschließen.&quot;\nSchwarz forderte einen Schulterschluss im Parlament auch mit CDU und CSU: &quot;Allerdings sollte sich dann auch die Union klar dazu bekennen, die überplanmäßige Ausgabe von drei Milliarden Euro mitzutragen&quot;, sagte er. Schwarz ist im Haushaltsausschuss Berichterstatter für den Etat des Verteidigungsministeriums und das Sondervermögen Bundeswehr und gehört als stellvertretendes Mitglied dem Verteidigungsausschuss an.\nScholz lehnt Einsparungen an anderer Stelle für die Finanzierung weiterer Waffenlieferungen in die Ukraine ab.\nSchäfer: Nicht auf Zeit spielen\nDer SPD-Verteidigungspolitiker Kristian Klinck sagte dem Magazin, nur die Kombination aus Unterstützung der Ukraine und Diplomatie werde einen stabilen Waffenstillstand näherbringen. &quot;Ich rate dazu, das Hilfspaket auf den Weg zu bringen.&quot; Ob dies durch eine außerplanmäßige Ausgabe aus dem Bundeshaushalt geschehe oder durch die Nutzung des von den G7-Staaten zur Verfügung gestellten Kredits geschehe, &quot;sollte aufgrund rein sachlicher Erwägungen entschieden werden&quot;.\nDer Grünenpolitiker Sebastian Schäfer forderte Scholz und den SPD-Fraktionsvorsitzenden Rolf Mützenich auf, ihre Blockadehaltung zu überdenken. &quot;In dieser Frage auf Zeit zu spielen, ist angesichts der Lage in der Ukraine schlicht verantwortungslos&quot;, sagte Schäfer, der Mitglied im Haushaltsausschuss und stellvertretender Vorsitzender des Gremiums zum Sondervermögen für die Bundeswehr ist.\nVerteidigungsminister Boris Pistorius nahm seinen Parteifreund Scholz hingegen in Schutz. &quot;Ich sehe keinerlei Grund anzunehmen, dass der Bundeskanzler hier bremst&quot;, sagte er in den ARD- Tagesthemen . Pistorius verwies darauf, dass es für 2025 noch keinen regulären Bundeshaushalt gebe und der Bund daher mit einer vorläufigen Haushaltsführung agiere. &quot;Es ist nicht trivial, das Geld aufzutreiben&quot;, sagte er im heute-journal des ZDF. Zudem zeigte Pistorius sich zuversichtlich, dass zeitnah eine Lösung gefunden werde. Er hoffe darauf in den nächsten Tagen, sagte er."}, {"id": "s019", "summary": "Die Feuerwehr in Kalifornien hat nach langen und heftigen Waldbränden erste Erfolge erzielt, aber Meteorologen warnen vor weiteren Böen am Wochenende.\n\nUnd hier sind die nächsten vier Sätze:\n\nDie Rettungskräfte haben offenbar eine Pause bei den heftigen Winden genutzt, die die Brände angefacht hatten. Meteorologen warnen <del title=\"removed\">jedoch<\/del> <ins>deshalb<\/ins> davor, dass starke Böen zurückkehren könnten und die Situation weiter verschlimmern. Die Bedingungen mit niedriger Luftfeuchtigkeit und trockener Vegetation sind immer noch kritisch, aber eine Abschwächung der Winde könnte den Feuerwehrleuten entscheidende Unterstützung aus der Luft bringen. Insgesamt haben fünf Brandherde im Bezirk Los Angeles auf einer Fläche von rund 13.750 Hektar gewütet, bei denen fast 10.000 Gebäude zerstört und mindestens zehn Menschen ums Leben gekommen sind.", "original": "Die Feuerwehr in Kalifornien hat nach langen und heftigen Waldbränden erste Erfolge erzielt, aber Meteorologen warnen vor weiteren Böen am Wochenende.\n\nUnd hier sind die nächsten vier Sätze:\n\nDie Rettungskräfte haben offenbar eine Pause bei den heftigen Winden genutzt, die die Brände angefacht hatten. Meteorologen warnen jedoch davor, dass starke Böen zurückkehren könnten und die Situation weiter verschlimmern. Die Bedingungen mit niedriger Luftfeuchtigkeit und trockener Vegetation sind immer noch kritisch, aber eine Abschwächung der Winde könnte den Feuerwehrleuten entscheidende Unterstützung aus der Luft bringen. Insgesamt haben fünf Brandherde im Bezirk Los Angeles auf einer Fläche von rund 13.750 Hektar gewütet, bei denen fast 10.000 Gebäude zerstört und mindestens zehn Menschen ums Leben gekommen sind.", "title": "", "article": "Im Kampf gegen\ndie schwersten Waldbrände in der Geschichte Kaliforniens hat die Feuerwehr offenbar erste Erfolge erzielt. Eigenen Angaben zufolge kam den Rettungskräften dabei eine\nPause bei den heftigen Winden zugute, die die Feuer angefacht\nhatten. Meteorologen warnen jedoch davor, dass starke Böen am\nWochenende zurückkehren könnten.\nDie Windverhältnisse im Gebiet\nvon Los Angeles werden sich nach Angaben des Nationalen\nWetterdienstes bis zum Wochenende verbessern. &quot;Es\nist nicht mehr so böig, was den Feuerwehrleuten hoffentlich\nhelfen wird&quot;, sagte die NWS-Meteorologin Allison Santorelli. Die\nBedingungen mit niedriger Luftfeuchtigkeit und trockener\nVegetation seien aber immer noch kritisch.\nEine Abschwächung der Winde dürfte den Feuerwehrleuten am\nBoden entscheidende Unterstützung aus der Luft bringen, da die\nFlugzeuge Wasser und Löschmittel auf die brennenden Hügel\nabwerfen können. &quot;Es gibt ein paar gute Nachrichten, wenn\nüberhaupt&quot;, sagte Santorelli.\nAm Vormittag gab es in Los\nAngeles noch drei größere Brände. Insgesamt hatten fünf\nBrandherde im Bezirk Los Angeles auf einer Fläche von rund\n13.750 Hektar – so groß wie rund 19.000 Fußballfelder – gewütet. Bislang wurden fast 10.000 Gebäude zerstört , 180.000 Personen\nmussten die gefährdeten Gebiete verlassen. Inzwischen sind\nmindestens zehn Menschen bei den Bränden ums Leben gekommen. Der\nprivate Wetter-Vorhersagedienst AccuWeather schätzte den Schaden\nund den wirtschaftlichen Verlust durch die Brände auf 135 bis\n150 Milliarden Dollar.\n\nAusgangssperren wegen Plünderungen\n\nIn den Brandgebieten im Großraum Los Angeles mussten Menschen auf \nBehördenanordnung ihre Häuser verlassen. Das Eigentum ist nicht nur \nvom Feuer bedroht, sondern auch von Plünderern. Deshalb haben die \nBehörden teilweise für die Abend- und Nachtstunden eine Ausgangssperre verhängt. Die Ausgangssperren gelten für\n zwei Gebiete. &quot;Sie dürfen sich nicht in diesen \nbetroffenen Gebieten aufhalten. Wenn Sie es doch tun, werden Sie \nverhaftet&quot;, sagte Sheriff Robert Luna bei einer Pressekonferenz. &quot;Wir \ntun das, um die Strukturen und die Häuser zu schützen, die Menschen auf unsere \nAnordnung hin verlassen haben.&quot;\nDie Ausgangssperre \nsei bereits in der vergangenen Nacht in Kraft gewesen und gelte auch \nheute von 18 Uhr bis 6 Uhr (Ortszeit), sagte Luna. Angeordnet ist \nsie für Gebiete, die vom Palisades Fire und Eaton Fire betroffen \nsind."}, {"id": "s001", "summary": "Der rbb <del title=\"removed\">hat<\/del> <ins>wird<\/ins> sämtliche Beiträge zu Belästigungsvorwürfen gegen den Grünenbundestagsabgeordneten Stefan Gelbhaar zurückgezogen, da Zweifel an der Identität der beschuldigenden Frau bestehen.\nEs wird vermutet, dass eine Grünenbezirkspolitikerin unter falschem Namen die Vorwürfe erhoben hat.\nGelbhaar bestreitet die Anschuldigungen und spricht von einer geplanten Aktion gegen ihn.\nDie Berliner Grünen fordern, Falschaussagen konsequent zu ahnden, und erwägen auch parteirechtliche Schritte.\nEhemalige Parteimitglieder wie Kerstin Müller unterstützen Gelbhaar und vermuten eine Intrige, um ihn zu schaden.", "original": "Der rbb hat sämtliche Beiträge zu Belästigungsvorwürfen gegen den Grünenbundestagsabgeordneten Stefan Gelbhaar zurückgezogen, da Zweifel an der Identität der beschuldigenden Frau bestehen. Es wird vermutet, dass eine Grünenbezirkspolitikerin unter falschem Namen die Vorwürfe erhoben hat. Gelbhaar bestreitet die Anschuldigungen und spricht von einer geplanten Aktion gegen ihn. Die Berliner Grünen fordern, Falschaussagen konsequent zu ahnden, und erwägen auch parteirechtliche Schritte. Ehemalige Parteimitglieder wie Kerstin Müller unterstützen Gelbhaar und vermuten eine Intrige, um ihn zu schaden.", "title": "", "article": "Der Sender rbb hat nach eigenen Angaben sämtliche Beiträge,\nin denen es um Belästigungsvorwürfe gegen den Grünenbundestagsabgeordneten Stefan\nGelbhaar geht, zurückgezogen. Es gebe Zweifel an der Identität einer Frau,\ndie zentrale Vorwürfe gegen Gelbhaar erhoben habe, teilte der Sender mit . &quot;Mit hoher\nWahrscheinlichkeit existiert diese Frau gar nicht.&quot;\nWeitere Recherchen hätten zu einer\nGrünenbezirkspolitikerin geführt, die sich als die betroffene Frau ausgegeben\nhaben und unter falschem Namen die eidesstattliche Versicherung abgegeben haben\nsoll. Der Sender erstattete Strafanzeige gegen die Politikerin.\n\nGelbhaar bestreitet Vorwürfe\n\n&quot;Nicht alle Vorwürfe, über die wir berichtet haben,\nsind damit automatisch nichtig – ein wesentlicher Vorwurf allerdings\nschon&quot;, teilte der rbb mit. Der Sender hatte auf Grundlage mehrerer eidesstattlicher Versicherungen\n von Frauen über die Vorwürfe gegen Gelbhaar berichtet. Zudem gab es demnach anonyme \nMeldungen an die Ombudsstelle der Grünen.\nGelbhaar hatte zuvor die Vorwürfe\ngegen ihn bestritten und ging von einer &quot;geplanten Aktion&quot; gegen\nseine Person aus, wie er auf seiner Website schrieb.\nDie Spitze der Berliner\nGrünen zeigte sich &quot;erschüttert über den Bericht des rbb&quot; und fordert, etwaige Falschaussagen konsequent zu ahnden. &quot;Eine falsche eidesstattliche Erklärung abzugeben ist\neine Straftat&quot;, zitiert die Nachrichtenagentur dpa die Landesvorsitzenden Nina Stahr und Philmon Ghirmai. Auch parteirechtlich könnte es Folgen\ngeben: &quot;Wenn sich der Vorwurf bewahrheitet und klar ist, wer die betroffene\nPerson ist, werden wir auch parteirechtliche Schritte einleiten.&quot;\nKerstin Müller, ehemalige Vorsitzende der Grünenbundestagsfraktion und inzwischen einfaches Parteimitglied in Berlin-Pankow, stellte sich hinter Stefan Gelbhaar. &quot;Es bestätigt sich immer mehr, dass hier wahrscheinlich mit einer Intrige eine nicht genehme Person beschädigt und aus dem Verkehr gezogen werden sollte&quot;, sagte sie dem RedaktionsNetzwerk Deutschland  (RND) . &quot;Es kann kein Zufall sein, dass einen Tag vor der Listenaufstellung die Beschwerden bei der Ombudsstelle auflaufen und das auch noch der Presse gesteckt wird.&quot;\nGelbhaar, der seit 2017 für\ndie Grünen im Bundestag sitzt, war bei einer ersten\nWahlversammlung im November mit 98,4 Prozent der Stimmen zum\nDirektkandidaten gewählt worden. Nachdem Mitte Dezember die Vorwürfe gegen ihn bekannt wurden, setzte der Kreisverband Pankow eine\nWiederholung an . Als neue Direktkandidatin wurde dort Julia Schneider gewählt."}, {"id": "s012", "summary": "In der Demokratischen Republik Kongo ist die Zahl der Toten durch eine unbekannte Krankheit auf 131 gestiegen. Medizinische Teams sind in betroffenen Ortschaften im Südwesten des Landes im Einsatz und haben zwei weitere Dörfer mit mindestens 60 Toten entdeckt. Epidemiologen unterstützen Ärzte bei der Behandlung der Patienten und ermitteln die Art der Krankheit, von der bisher 382 Menschen betroffen sind. Besonders Kinder bis 15 Jahre sind betroffen, Symptome sind Fieber, Kopfschmerzen, Atemprobleme und Anämie. Expertenteams werden Proben entnehmen und die Bevölkerung zu Hygiene- und Abstandsmaßnahmen aufrufen, <del title=\"removed\">da<\/del> <ins>obwohl<\/ins> die Übertragungswege der Krankheit noch unbekannt sind.", "original": "In der Demokratischen Republik Kongo ist die Zahl der Toten durch eine unbekannte Krankheit auf 131 gestiegen. Medizinische Teams sind in betroffenen Ortschaften im Südwesten des Landes im Einsatz und haben zwei weitere Dörfer mit mindestens 60 Toten entdeckt. Epidemiologen unterstützen Ärzte bei der Behandlung der Patienten und ermitteln die Art der Krankheit, von der bisher 382 Menschen betroffen sind. Besonders Kinder bis 15 Jahre sind betroffen, Symptome sind Fieber, Kopfschmerzen, Atemprobleme und Anämie. Expertenteams werden Proben entnehmen und die Bevölkerung zu Hygiene- und Abstandsmaßnahmen aufrufen, da die Übertragungswege der Krankheit noch unbekannt sind.", "title": "", "article": "Die Zahl der Toten durch eine unbekannte Krankheit in der Demokratischen\nRepublik Kongo ist gestiegen. Nach Angaben der örtlichen Gesundheitsbehörden starben\ninzwischen 131 Menschen.\nSeit Dienstag sind medizinische Teams in\nbetroffenen Ortschaften im Südwesten des Landes unterwegs. Sie hätten inzwischen zwei\nweitere Dörfer gefunden, in denen mindestens 60 Tote verzeichnet worden seien,\nteilte der Gesundheitsminister der Provinz Kwango, Apollinaire Yumba, mit.\nIn den vergangenen Tagen waren Epidemiologen in\ndie zu Kwango gehörende Region Panzi gereist. Sie sollen dort Ärzte bei der\nBehandlung der Patienten unterstützen und ermitteln, um was für eine Art\nvon Krankheit es sich handelt. Bisher wurden nach Angaben Yumbas 382 Menschen\nmit Symptomen der Krankheit registriert.\n\nFieber,\nKopfschmerzen, Atemprobleme und Anämie\n\nÜber die Krankheit ist derzeit nur wenig bekannt. Besonders\noft betroffen sind offenbar Kinder bis 15 Jahre. Zu den Symptomen zählen \nFieber,\nKopfschmerzen, Atemprobleme und Anämie\n.\nDer Minister kündigte die Entsendung weiterer Expertenteams an.\nSie sollen den Angaben zufolge Proben entnehmen und die\nBevölkerung zu Hygiene- und Abstandsmaßnahmen aufrufen. Ob die Krankheit nur\ndurch körperlichen Kontakt oder auch über andere Wege übertragen werden kann,\nist bisher nicht bekannt."}, {"id": "s026", "summary": "Die verheerenden Waldbrände in Kalifornien fordern weitere Opfer und zerstören tausende Gebäude, während Einsatzkräfte und <ins>Deutsche<\/ins> Soldaten im Kampf gegen die Flammen Unterstützung leisten.", "original": "Die verheerenden Waldbrände in Kalifornien fordern weitere Opfer und zerstören tausende Gebäude, während Einsatzkräfte und Soldaten im Kampf gegen die Flammen Unterstützung leisten.", "title": "", "article": "Bei den verheerenden Waldbränden in Kalifornien bleibt die\nLage trotz nachlassender Winde angespannt. Behörden melden einen weiteren Toten,\ndamit sind bisher mindestens elf Menschen durch die Feuerkatastrophe umgekommen.\nSoldaten stehen bereit, um im Kampf gegen die Flammen zu helfen. Gleichzeitig\nstellt sich die Frage, wer für die Schäden aufkommt, die das Feuer hinterlässt.\nAm Freitagmittag (Ortszeit) überbrachte US-Präsident Joe\nBiden aber auch positive Nachrichten: Es gebe Fortschritte bei den Löscharbeiten. Kaliforniens\nGouverneur Gavin Newsom äußerte die Hoffnung, dass die Einsatzkräfte im\nTagesverlauf weitere Erfolge erzielen.\nGleichzeitig warnte die Chefin des US-Katastrophenschutzes\nFema, Deanne Criswell, dass die Gefahr keineswegs gebannt sei: &quot;Die Situation\nist weiterhin sehr gefährlich.&quot; Zwar sei der Wind aktuell schwächer , doch werde\nin den kommenden Tagen wieder mit stärkeren Böen gerechnet.\n\nFast 10.000 Gebäude zerstört\n\nIm Großraum Los Angeles brennen weiterhin mehrere Feuer, die\nbislang kaum eingedämmt sind. Insgesamt hatten fünf Brandherde auf einer Fläche von rund 13.750 Hektar (137,5 Quadratkilometer) gewütet. Das ist fast so groß wie die Stadt Kaiserslautern. Die Flammen haben fast 10.000 Gebäude zerstört, rund\n180.000 Menschen mussten fliehen.\nTausende Einsatzkräfte kämpfen gegen die Flammen. Laut\nVerteidigungsministerium stehen auch 500 in Kalifornien stationierte Soldaten\nfür Einsätze bereit. Sie könnten auf Anforderung der kalifornischen Behörden\nunter anderem bei Such- und Rettungseinsätzen oder beim Räumen von Straßen\nhelfen, sagte eine Sprecherin. Zudem seien zehn Helikopter sowie\nvier spezielle Brandbekämpfungssysteme verfügbar, die in Militärflugzeuge\neingebaut werden können und teilweise am Wochenende zum Einsatz kommen sollen.\n\nSorgen um Versicherungsschutz\n\nNeben der akuten Katastrophe ist auch die Rolle von\nVersicherern in den Fokus gerückt: Die Brände könnten laut Analysten zu den\nkostspieligsten in der Geschichte der USA werden. Kaliforniens\nVersicherungsbeauftragter Ricardo Lara forderte eine schnelle Auszahlung von\nVersicherungsleistungen für die Betroffenen. Zudem seien eine Modernisierung\ndes Versicherungssystems und eine bessere Katastrophenvorsorge dringend\nnotwendig.\nViele Häuser in den USA bestehen aus Holz, was die Ausbreitung von\nBränden begünstigt. Wegen steigender Risiken durch Fluten, Stürme und Brände durch den Klimawandel wird es zudem immer schwieriger, tragfähige Versicherungspolicen anzubieten."}, {"id": "s025", "summary": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. <ins>Der Haftbefehl war am 5. Januar erlassen worden.<\/ins> Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen Machtmissbrauchs und Aufruhrs angeklagt werden.", "original": "Südkoreas Polizei hat den suspendierten Präsidenten Yoon Suk Yeol festgenommen, der sich weigerte, zu einer Vernehmung im Zusammenhang mit der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember zu erscheinen. Tausende Einsatzkräfte waren an der erfolgreichen Festnahme beteiligt, nachdem ein erster Versuch Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert war. Die Polizei drang unter Einsatz von Leitern in die Residenz des Präsidenten ein und es kam zu gewalttätigen Auseinandersetzungen. Yoon Suk Yeol soll wegen Machtmissbrauchs und Aufruhrs angeklagt werden.", "title": "", "article": "Südkoreas Polizei und Mitarbeiter der Antikorruptionsbehörde (CIO) haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen. Yoon sei am \nMittwochmorgen aus seinem Wohnsitz abgeführt worden, um ihn zur Staatsanwaltschaft zu \nbringen, berichtete Südkoreas amtliche Nachrichtenagentur Yonhap. Damit ist Yoon das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde.\nYoon soll wegen der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember vernommen werden, hatte sich bisher aber geweigert, zur Vernehmung zu erscheinen. Ein erster Versuch, einen Haftbefehl umzusetzen, war Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert . An der nun erfolgreichen Festnahme waren Tausende Einsatzkräfte beteiligt.\n\nMit Leitern in Yoons Residenz\n\nEinigen Polizisten gelang es Beobachtern zufolge, mithilfe von Leitern in die Residenz einzudringen. Zunächst kam es zu gewalttätigen Auseinandersetzungen, wie die südkoreanische Nachrichtenagentur Yonhap berichtete.\nYoons Anwälte hatten bekannt gegeben, dieser sei bereit, bei der Behörde zu erscheinen. &quot;Präsident Yoon hat entschieden, \nheute persönlich bei der Korruptionsermittlungsbehörde zu erscheinen&quot;, schrieb Yoons Anwalt Seok Dong Hyeon auf Facebook. Yoon werde überdies später \nam Tag eine Rede halten, schrieb Seok weiter.\nGegen Yoon Suk Yeol wird wegen Machtmissbrauchs und Aufruhrs ermittelt, nachdem er am 3. Dezember im Zuge eines Haushaltsstreits mit der Opposition kurzzeitig das Kriegsrecht ausgerufen hatte. Das Parlament stimmte daraufhin für seine Amtsenthebung. In den kommenden Wochen prüft das Verfassungsgericht nun diese Entscheidung.\nYoon, der sich wochenlang in seiner Residenz verschanzt hatte, verteidigte die Ausrufung des Kriegsrechts als legitime Maßnahme, nachdem die Opposition in einem Haushaltsstreit Yoons politische Pläne im Parlament verhindert hatte. Er werde gegen die Versuche, ihn aus dem Amt zu drängen, &quot;bis zum Ende kämpfen&quot;, sagte Yoon. Als Reaktion auf die Ausrufung des Kriegsrechts demonstrierten Zehntausende Menschen gegen Yoon und für den Erhalt der Demokratie in Südkorea, aber auch Unterstützer Yoons organisierten Proteste."}, {"id": "s005", "summary": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während <del title=\"removed\">die Inflation<\/del> <ins>er<\/ins> sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "original": "Der DAX hat erstmals die 20.000-Punkte-Marke überschritten und innerhalb eines Jahres um rund 3.000 Zähler gestiegen. Hoffnung auf sinkende Zinsen und eine positive Entwicklung an der Wall Street treiben den Index nach oben, während die Inflation sinkt und Anleger auf weitere Leitzinssenkungen setzen.", "title": "", "article": "Der bedeutendste deutsche Aktienindex Dax         hat\nerstmals die 20.000-Punkte-Marke überstiegen. Der deutsche\nLeitindex stieg in der Spitze um 0,4 Prozent auf\n20.003,50 Zähler. Innerhalb nur eines Jahres ist der Dax damit \num rund 3.000 Zähler gestiegen. Erst Mitte September hatte er die \nMarke von 19.000 Punkten übertroffen , zuvor Mitte März die von 18.000 .\nGrund dafür sind laut Börsenexperten die Hoffnung auf vorerst weiter sinkende Zinsen in den USA und\nin der Euro-Zone, die für mehr Konsum und Investitionen sorgen . Angesichts der zuletzt deutlich gefallenen Inflation setzen Anleger \noffenbar darauf, dass die Notenbanken die Leitzinsen weiter senken. Das ist positiv für Aktienkäufer, weil Unternehmen dann im besten Fall wachsen und mehr wert werden.\nRekorde auch bei US-Indizes\nSeit\nJahresbeginn legte der Dax bereits 16 Prozent zu. Auch wegen der positiven Entwicklungen an der Wall Street steigt der Dax: Die beiden dort bedeutenden Aktienindexe S&amp;P\n500 und Nasdaq-Composite erreichten zu\nWochenbeginn einen neuen Schlussrekord. Auch die Wahl Donald Trumps zum neuen US-Präsidenten lässt die Wall Street auf mehr Gewinne hoffen , da Trump Steuersenkungen, Zölle und weniger Regulierungen versprochen hat.\nDie Wall Street entwickelt sich also bereits länger positiv, der Dax scheint den Zahlen zufolge nun nachzuziehen. Gleichzeitig steht die Entwicklung an den Börsen in Kontrast zur eher schwierigen\nWirtschaftslage in Deutschland . Doch Investoren richten sich oft eher nach künftigen Gewinnen. Zudem sind die meisten der 40 Konzerne, aus denen der Dax gespeist wird, international aufgestellt."}, {"id": "s030", "summary": "Erstmals in der Geschichte des Vatikans wurde eine Frau, die italienische Ordensschwester Simona Brambilla, zur Leiterin einer großen Vatikanbehörde ernannt. Papst Franziskus beauftragte sie mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens, was mit der Verantwortung einer Ministerin vergleichbar ist. Brambilla, eine Missionarin, Krankenschwester und Doktorin der Psychologie, ist die erste Präfektin des katholischen Kirchenstaates. Diese Ernennung ist Teil von Franziskus&#x27; Bemühungen, Frauen stärker in Kirchenämter einzubeziehen, und folgt auf die Öffnung von Spitzenämtern für Frauen im Vatikan im Jahr <del title=\"removed\">2022.<\/del> <ins>2020.<\/ins>", "original": "Erstmals in der Geschichte des Vatikans wurde eine Frau, die italienische Ordensschwester Simona Brambilla, zur Leiterin einer großen Vatikanbehörde ernannt. Papst Franziskus beauftragte sie mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens, was mit der Verantwortung einer Ministerin vergleichbar ist. Brambilla, eine Missionarin, Krankenschwester und Doktorin der Psychologie, ist die erste Präfektin des katholischen Kirchenstaates. Diese Ernennung ist Teil von Franziskus&#x27; Bemühungen, Frauen stärker in Kirchenämter einzubeziehen, und folgt auf die Öffnung von Spitzenämtern für Frauen im Vatikan im Jahr 2022.", "title": "Papst ernennt erstmals eine Frau zur Leiterin einer Vatikanbehörde", "article": "Erstmals in der Geschichte des Vatikans ist eine Frau zur Leiterin einer großen Vatikanbehörde ernannt worden. Papst Franziskus beauftragte die italienische Ordensschwester Simona Brambilla mit der Leitung des Dikasteriums für die Institute des gottgeweihten Lebens und Gesellschaften des apostolischen Lebens. Das Amt lässt sich mit der Verantwortung einer Ministerin vergleichen.\nDie 59-Jährige ist laut Angaben des Presseamts die erste Präfektin des katholischen Kirchenstaates. In ihrem Dikasterium hatte sie zuvor bereits als Sekretärin die zweithöchste Position inne, seit 2019 gehörte sie der Behörde an. Das Dikasterium strukturiert, fördert und verwaltet die Institutionen in der katholischen Kirche, die sich dem &quot;geweihten&quot; und dem apostolischen Leben innerhalb der Gemeinschaft widmen.\n\nMissionarin, Krankenschwester und Doktorin der Psychologie\n\nBrambilla ist Teil der Consolata-Missionsschwestern und war früher als Krankenschwester und Missionarin in dem westafrikanischen Staat Mosambik tätig. Zudem hat sie einen Doktortitel in Psychologie. Von 2011 bis Mai 2023 war sie Generalsuperiorin ihrer Ordensgemeinschaft.\nDie Dikasterien im Vatikan sind mit den Ministerien in einer Regierung vergleichbar. Sie werden nicht von einem Minister, sondern von einem Präfekten geleitet. Der zweite Rang, der in einem Ministerium von einem Staatssekretär bekleidet wird, heißt im Vatikan Sekretär. In seiner Arbeit wird dieser von Untersekretären unterstützt.\nIn der Katholischen Kirche gibt es immer wieder Diskussionen darüber, Frauen mehr an Kirchenämtern zu beteiligen, insbesondere über die Weihe von Frauen zu Diakoninnen oder später einmal auch zu Priesterinnen. Dazu brachte auch die jüngste Weltsynode unter Leitung des Papstes keinen Durchbruch.\n\nKurienreform 2022 öffnete Spitzenämter für Frauen\n\nFranziskus vergab in seinem mittlerweile zwölf Jahre andauernden Pontifikat bisher zweimal hochrangige Ämter an Frauen. 2016 ernannte er die italienische Kunsthistorikerin Barbara Jatta zur Direktorin der Vatikanischen Museen, einer der wichtigsten Einnahmequellen des Kirchenstaats. 2022 wurde die italienische Ordensschwester Raffaella Petrini im Vatikan Generalsekretärin – ein Amt, das üblicherweise ein Bischof innehatte.\nBis 2022 war es nur Bischöfen – und somit nur Männern – möglich, die Leitung einer Vatikanbehörde zu übernehmen. Mit seiner Kurienreform vor zwei Jahren öffnete der Papst diese Ämter dann auch für Katholikinnen und Katholiken ohne Bischofstitel. Die Katholische Kirche zählt weltweit rund 1,4 Milliarden Mitglieder."}, {"id": "s010", "summary": "Südkoreas Polizei und die Antikorruptionsbehörde haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen, nachdem er sich geweigert hatte, zur Vernehmung zu erscheinen. Yoon ist das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde. <del title=\"removed\">Er<\/del> <ins>Ihn<\/ins> wird wegen Machtmissbrauchs und Aufruhrs untersucht, nachdem er kurzzeitig das Kriegsrecht ausgerufen hatte. Trotzdem verteidigt Yoon diese Maßnahme als legitim und kündigt an, bis zum Ende zu kämpfen.", "original": "Südkoreas Polizei und die Antikorruptionsbehörde haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen, nachdem er sich geweigert hatte, zur Vernehmung zu erscheinen. Yoon ist das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde. Er wird wegen Machtmissbrauchs und Aufruhrs untersucht, nachdem er kurzzeitig das Kriegsrecht ausgerufen hatte. Trotzdem verteidigt Yoon diese Maßnahme als legitim und kündigt an, bis zum Ende zu kämpfen.", "title": "", "article": "Südkoreas Polizei und Mitarbeiter der Antikorruptionsbehörde (CIO) haben den suspendierten Präsidenten Yoon Suk Yeol festgenommen. Yoon sei am \nMittwochmorgen aus seinem Wohnsitz abgeführt worden, um ihn zur Staatsanwaltschaft zu \nbringen, berichtete Südkoreas amtliche Nachrichtenagentur Yonhap. Damit ist Yoon das erste amtierende Staatsoberhaupt des Landes, das in Haft genommen wurde.\nYoon soll wegen der kurzzeitigen Verhängung des Kriegsrechts Anfang Dezember vernommen werden, hatte sich bisher aber geweigert, zur Vernehmung zu erscheinen. Ein erster Versuch, einen Haftbefehl umzusetzen, war Anfang Januar am Widerstand des militärischen Sicherheitsdienstes gescheitert . An der nun erfolgreichen Festnahme waren Tausende Einsatzkräfte beteiligt.\n\nMit Leitern in Yoons Residenz\n\nEinigen Polizisten gelang es Beobachtern zufolge, mithilfe von Leitern in die Residenz einzudringen. Zunächst kam es zu gewalttätigen Auseinandersetzungen, wie die südkoreanische Nachrichtenagentur Yonhap berichtete.\nYoons Anwälte hatten bekannt gegeben, dieser sei bereit, bei der Behörde zu erscheinen. &quot;Präsident Yoon hat entschieden, \nheute persönlich bei der Korruptionsermittlungsbehörde zu erscheinen&quot;, schrieb Yoons Anwalt Seok Dong Hyeon auf Facebook. Yoon werde überdies später \nam Tag eine Rede halten, schrieb Seok weiter.\nGegen Yoon Suk Yeol wird wegen Machtmissbrauchs und Aufruhrs ermittelt, nachdem er am 3. Dezember im Zuge eines Haushaltsstreits mit der Opposition kurzzeitig das Kriegsrecht ausgerufen hatte. Das Parlament stimmte daraufhin für seine Amtsenthebung. In den kommenden Wochen prüft das Verfassungsgericht nun diese Entscheidung.\nYoon, der sich wochenlang in seiner Residenz verschanzt hatte, verteidigte die Ausrufung des Kriegsrechts als legitime Maßnahme, nachdem die Opposition in einem Haushaltsstreit Yoons politische Pläne im Parlament verhindert hatte. Er werde gegen die Versuche, ihn aus dem Amt zu drängen, &quot;bis zum Ende kämpfen&quot;, sagte Yoon. Als Reaktion auf die Ausrufung des Kriegsrechts demonstrierten Zehntausende Menschen gegen Yoon und für den Erhalt der Demokratie in Südkorea, aber auch Unterstützer Yoons organisierten Proteste."}, {"id": "s016", "summary": "Die Deutsche Fußball Liga ist vor dem Bundesverfassungsgericht mit ihrer Verfassungsbeschwerde gegen die Beteiligung an Polizeikosten für Hochrisikospiele gescheitert. Bremen verlangt seit 2014, dass Veranstalter von Profifußballspielen die Mehrkosten für erhöhte Polizeieinsätze tragen. Die DFL hatte gegen die Regelung geklagt, aber das Bundesverwaltungsgericht erklärte sie bereits <del title=\"removed\">2019<\/del> <ins>2020<\/ins> für rechtmäßig. Die DFL argumentierte, dass die Gebühren nicht gerechtfertigt seien, da die Polizeieinsätze auf einzelne Störer zurückzuführen seien. Das Fanbündnis Unsere Kurve äußerte sich bestürzt über das Urteil und forderte, dass die Clubs mehr Entscheidungsbefugnisse in der polizeilichen Einsatzplanung erhalten sollten.", "original": "Die Deutsche Fußball Liga ist vor dem Bundesverfassungsgericht mit ihrer Verfassungsbeschwerde gegen die Beteiligung an Polizeikosten für Hochrisikospiele gescheitert. Bremen verlangt seit 2014, dass Veranstalter von Profifußballspielen die Mehrkosten für erhöhte Polizeieinsätze tragen. Die DFL hatte gegen die Regelung geklagt, aber das Bundesverwaltungsgericht erklärte sie bereits 2019 für rechtmäßig. Die DFL argumentierte, dass die Gebühren nicht gerechtfertigt seien, da die Polizeieinsätze auf einzelne Störer zurückzuführen seien. Das Fanbündnis Unsere Kurve äußerte sich bestürzt über das Urteil und forderte, dass die Clubs mehr Entscheidungsbefugnisse in der polizeilichen Einsatzplanung erhalten sollten.", "title": "", "article": "Die Deutsche Fußball Liga (DFL) ist im Streit um eine Beteiligung der Dachorganisation an den Polizeikosten für Hochrisikospiele am Bundesverfassungsgericht gescheitert. Ihre Verfassungsbeschwerde gegen eine entsprechende Regelung aus Bremen blieb ohne Erfolg, wie der Erste Senat in Karlsruhe verkündete .\nDie Hansestadt hatte bereits 2014 beschlossen, dass sich die Veranstalter von Profifußballspielen an den Mehrkosten beteiligen müssen , die bei erhöhten Polizeieinsätzen bei Hochrisikospielen entstehen. Die Gebühr wird bei allen Großveranstaltungen fällig, die gewinnorientiert sind, mehr als 5.000 Teilnehmer haben und bei denen es erfahrungsgemäß zu Gewalt kommen kann.\nDer erste Kostenbescheid über 425.000 Euro war 2015 fällig geworden, für ein Spiel zwischen Werder Bremen und dem Hamburger SV. Inzwischen hat sich die insgesamt geforderte Summe durch andere Partien auf mehr als drei Millionen Euro erhöht, die die DFL aber nur unter Vorbehalt und teilweise bezahlte.\n\nWeitere Bundesländer könnten Gebühren erheben\n\nDer Ligaverband hatte vor mehreren Gerichtsinstanzen gegen die Bescheide geklagt, das Bundesverwaltungsgericht in Leipzig erklärte die Regelung aber schon 2019 für rechtmäßig . Die vom Bundesverfassungsgericht abgewiesene Verfassungsbeschwerde bezog sich auf die Entscheidung von 2019.\nDie DFL argumentierte, in dem Bremer Gesetz fehle es an einer abgrenzbaren Leistung der Stadt Bremen, die man ihr zurechnen könne – was verfassungsrechtliche Voraussetzung für eine Erhebung von Gebühren sei. Für den erforderlichen Polizeieinsatz seien zudem einzelne Störer verantwortlich und nicht die Fußballorganisation.\nOb andere Bundesländer dem Bremer Beispiel nun folgen werden, ist unklar. Auf die Profivereine kämen dann deutlich mehr Gebühren zu. Mehrere Bundesländer warteten bislang die Entscheidung des Verfassungsgerichts ab und könnten nun selbst Gebühren erheben.\n\nFassungslosigkeit beim Fanbündnis\n\nDas Fanbündnis Unsere Kurve äußerte sich bestürzt über das Urteil. In einer Stellungnahme warnte das Bündnis, dass die Entscheidung Deutschland langfristig erheblich schaden könnte. Die öffentliche Sicherheit sei eine staatliche Aufgabe. Gleichzeitig teilte das Bündnis mit, dass der Profifußball mit Steuereinnahmen von 1,6 Milliarden Euro einen wichtigen Beitrag zur Finanzierung dieser Aufgabe leiste.\nFür den Bündnisvorsitzenden Jost Peters ist es jetzt &quot;zwingend notwendig, dass den Clubs Entscheidungsbefugnisse in der polizeilichen Einsatzplanung eingeräumt werden und überdimensionierte Polizeieinsätze ein Ende finden&quot;. Thomas Kessen, Sprecher von Unsere Kurve, forderte zudem, das Urteil müsse auf alle öffentlichen Großveranstaltungen ausgeweitet werden, etwa auf das Münchner Oktoberfest oder den Kölner Karneval."}, {"id": "s023", "summary": "Die CDU präsentiert mit &quot;Agenda 2030&quot; ein Wirtschaftsprogramm für die Bundestagswahl, <del title=\"removed\">das<\/del> <ins>die<\/ins> Firmen und Bürgern Steuererleichterungen verspricht, um Wachstumsquoten zu erhöhen; das Programm sieht eine große Steuerreform in vier Schritten vor, die Einkommensteuerbelastung soll sinken und der Spitzensteuersatz erst ab 80.000 Euro greifen; zudem will die Partei das Arbeitszeitgesetz flexibilisieren, den Solidaritätszuschlag abschaffen und das Bürgergeld in eine &quot;Neue Grundsicherung&quot; überführen.", "original": "Die CDU präsentiert mit &quot;Agenda 2030&quot; ein Wirtschaftsprogramm für die Bundestagswahl, das Firmen und Bürgern Steuererleichterungen verspricht, um Wachstumsquoten zu erhöhen; das Programm sieht eine große Steuerreform in vier Schritten vor, die Einkommensteuerbelastung soll sinken und der Spitzensteuersatz erst ab 80.000 Euro greifen; zudem will die Partei das Arbeitszeitgesetz flexibilisieren, den Solidaritätszuschlag abschaffen und das Bürgergeld in eine &quot;Neue Grundsicherung&quot; überführen.", "title": "CDU plant Steuerentlastungen mit Wirtschaftsprogramm &quot;Agenda 2030&quot;", "article": "Die CDU will mit einem Wirtschaftsprogramm namens &quot;Agenda 2030&quot; in die Bundestagswahl ziehen. Darin verspricht die Partei nach übereinstimmenden Berichten Firmen und Bürgern Steuererleichterungen\nund in der Folge höhere Wachstumsquoten.\n&quot;Mit dieser Agenda 2030 setzen wir uns für\nDeutschland ein wirtschaftspolitisches Zwei-Prozent-Ziel: Wir wollen wieder\nWachstumsraten von mindestens zwei Prozent erreichen&quot;, heißt es in dem\nzwölfseitigen Entwurf, der auf der Klausurtagung des CDU-Bundesvorstands in\nHamburg beschlossen werden soll. Die Nachrichtenagenturen dpa und Reuters sowie das Portal table.news zitierten aus dem Papier.\nDie Partei schlägt eine große Steuerreform in vier\nJahresschritten vor, die Anfang 2026 starten soll. Zudem soll die Einkommensteuerbelastung sinken, der Spitzensteuersatz erst ab 80.000 Euro greifen, der\nGrundfreibetrag jährlich steigen.\n\nKeine täglichen Höchstarbeitszeiten mehr\n\nDie Partei will das Arbeitszeitgesetz flexibler gestalten. Statt einer täglichen soll es nur noch eine wöchentliche Höchstarbeitszeit geben. Der Solidaritätszuschlag\nsoll komplett abgeschafft werden, das Bürgergeld in eine &quot;Neue Grundsicherung&quot;\nüberführt werden, diese Forderung findet sich auch im gemeinsamen Wahlprogramm\nvon CDU und CSU.\nÜberstundenzuschläge sollen bei Vollzeitbeschäftigung\nsteuerfrei gestellt werden. Für Rentner, die freiwillig weiterarbeiten, sollen\nVerdienste bis 2.000 Euro im Monat steuerfrei bleiben. Zur Anwerbung ausländischer Fachkräfte soll eine digitale Bundesagentur für\nFachkräfteeinwanderung geschaffen werden.\n\nPartei will Verbrennerverbot rückgängig machen\n\nBei den Strompreisen fordert die CDU eine Entlastung von mindestens fünf Cent je\nKilowattstunde. Stromsteuer und Netzentgelte sollen sinken. Um die\nAutomobilindustrie zu stärken, will die Partei das Verbrenneraus rückgängig\nmachen . Die CDU will Gründer in der Startphase weitgehend von Bürokratie\nentlasten sowie Digitalisierung und KI-Anwendungen vorantreiben. Forschung und\nEntwicklung sollen vorangetrieben werden, als Ziel nennt die CDU jährlich 3,5\nProzent des Bruttoinlandsprodukts bis 2030.\nFesthalten will die Partei zudem an der Schuldenbremse. Laut dem Papier will die CDU alle Bundesausgaben und die unter der Ampelkoalition gestiegenen Subventionen prüfen. Auf dem Parteitag am 3. Februar will die CDU Maßnahmen\nbeschließen, die im Fall einer Regierungsverantwortung unmittelbar umgesetzt werden sollen.\nDer Name &quot;Agenda 2030&quot; erinnert an Reformpläne des früheren SPD-Bundeskanzlers Gerhard Schröder für den Sozial- und Arbeitsmarkt. Mit seiner Agenda 2010 wurden später vor allem die umstrittenen Hartz-IV-Reformen verbunden.\nTransparenzhinweis: In einer früheren Version der Meldung stand im Teaser, die CDU wolle den Spitzensteuersatz anheben. Sie will ihn jedoch erst bei höheren Einkommen greifen lassen. Wir haben das korrigiert und bitten den Fehler zu entschuldigen."}, {"id": "s007", "summary": "Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;. <del title=\"removed\">Die<\/del> <ins>Der<\/ins> Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "original": "Das Unwort des Jahres 2024 ist &quot;Biodeutsch&quot;. Die Jury der Sprachaktion in Marburg kritisierte den rassistischen und nationalistischer Gebrauch des Begriffs in sozialen Medien, der eine Unterteilung in angeblich &quot;echte&quot; Deutsche und Deutsche zweiter Klasse darstelle.", "title": "&quot;Biodeutsch&quot; ist Unwort des Jahres 2024", "article": "&quot;Biodeutsch&quot; ist das Unwort des Jahres 2024. Das Wort werde vor allem in den Sozialen Medien in rassistischer und nationalistischer Weise gebraucht, teilte die Jury der Sprachaktion in Marburg zur Begründung ihrer Wahl mit. &quot;Die mit dem Gebrauch von biodeutsch einhergehende Unterteilung in angeblich &#x27;echte&#x27; Deutsche und in Deutsche zweiter Klasse ist eine Form von Alltagsrassismus&quot;, erklärte die Jury. Mehr in Kürze hier auf ZEIT ONLINE"}];
const SAMPLE = "b51867da";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
