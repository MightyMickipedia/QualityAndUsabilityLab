const NAME = "Mick";
const ITEMS = [{"id": "s034", "summary": "Ermittler haben die Geschäfts- und Fraktionsräume von CDU, SPD und AfD im Landtag von Sachsen-Anhalt wegen des Verdachts der Untreue durchsucht. Es besteht der Verdacht, dass unberechtigte Zulagen an ehemalige und aktuelle Fraktionsmitarbeiter ausgezahlt wurden. Die Ermittlungen basieren auf einer Anzeige des Bundes der Steuerzahler und konzentrieren sich auf Zahlungen aus den Jahren 2021 bis 2022. Die <del title=\"removed\">CDU<\/del><ins>SPD<\/ins> zahlte dabei mit rund 113.000 Euro am meisten, gefolgt von der AfD mit knapp 26.000 Euro und der SPD mit 7.500 Euro. CDU und AfD haben sich bisher nicht geäußert, während die SPD-Fraktion die Ermittlungen unterstützt und alle erforderlichen Auskünfte erteilt. Weitere Ermittler trafen am Landtag ein, um Unterlagen sicherzustellen.", "original": "Ermittler haben die Geschäfts- und Fraktionsräume von CDU, SPD und AfD im Landtag von Sachsen-Anhalt wegen des Verdachts der Untreue durchsucht. Es besteht der Verdacht, dass unberechtigte Zulagen an ehemalige und aktuelle Fraktionsmitarbeiter ausgezahlt wurden. Die Ermittlungen basieren auf einer Anzeige des Bundes der Steuerzahler und konzentrieren sich auf Zahlungen aus den Jahren 2021 bis 2022. Die CDU zahlte dabei mit rund 113.000 Euro am meisten, gefolgt von der AfD mit knapp 26.000 Euro und der SPD mit 7.500 Euro. CDU und AfD haben sich bisher nicht geäußert, während die SPD-Fraktion die Ermittlungen unterstützt und alle erforderlichen Auskünfte erteilt. Weitere Ermittler trafen am Landtag ein, um Unterlagen sicherzustellen.", "title": "Büros von CDU, SPD und AfD im Magdeburger Landtag durchsucht", "article": "Wegen des Verdachts der Untreue haben Ermittler die Geschäfts- und Fraktionsräume von CDU, SPD und AfD im Landtag von Sachsen-Anhalt durchsucht. Das teilte ein Sprecher der Staatsanwaltschaft Magdeburg mit.\nKonkret geht es demnach um den Verdacht der Auszahlung unberechtigter\n Zulagen. Im Fokus stehen dabei ehemalige und \naktuelle Fraktionsmitarbeiter. Es steht der Verdacht im Raum, dass \nsogenannte Funktionszulagen auch an nicht berechtigte \nFraktionsmitglieder ausgezahlt worden sein könnten. Grundlage der Ermittlungen sei eine Anzeige des Bundes der Steuerzahler.\nIm Blick der Ermittler sind Zahlungen aus dem Zeitraum 2021 bis 2022. In diesen Jahren griff bereits ein geändertes Abgeordnetengesetz. Es beschränkt die Zahlung von Zulagen laut \nSteuerzahlerbund auf Abgeordnete mit besonderen \nParlamentsfunktionen – also etwa Mitglieder des Landtagspräsidiums oder \nder Fraktionsführung. In den Rechnungsunterlagen von CDU, AfD und SPD fanden\n sich aber Hinweise auf mögliche Zahlungen für fraktionsinterne \nFunktionen.\n\nLaut Steuerzahlerbund geht es um fast 150.000 Euro – CDU zahlte demnach am meisten\n\nLaut dem Steuerzahlerbund zahlte die CDU in den beiden Jahren insgesamt rund 113.000 Euro aus. Bei der AfD wurden demnach 2021 knapp 26.000 Euro gezahlt, in der SPD-Fraktion 7.500 Euro. Spätere Jahre waren demnach nicht betroffen, andere Fraktionen auch nicht.\nCDU und AfD wollten sich auf Anfrage der ZEIT bisher nicht äußern. Die SPD-Fraktion teilte mit, man unterstütze die Ermittlungen der Staatsanwaltschaft und erteile alle erforderlichen Auskünfte. Auch auf eine konkret gezahlte Zulage nimmt die Fraktion in ihrem Statement Bezug: Die bis zur siebten Wahlperiode gezahlten Zulagen für stellvertretende Fraktionsvorsitzende in Höhe von zuletzt 750 Euro monatlich seien zum Beginn der achten Wahlperiode abgeschafft worden. In der Übergangsphase zwischen gesetzlicher Neuregelung 2020 und Ende der Wahlperiode 2021 seien &quot;zur pauschalen Abgeltung des erhöhten Aufwandes&quot; weiterhin Zahlungen in selber Höhe geleistet worden.\nNach Informationen der Nachrichtenagentur dpa trafen weitere Ermittler \nam Mittag mit einem Lastwagen am Landtag ein, um offenbar größere Mengen an Unterlagen sicherzustellen."}, {"id": "s055", "summary": "Das Jahr 2024 war das wärmste seit Messbeginn, mit einer Durchschnittstemperatur von mehr als 1,5 Grad über dem vorindustriellen Mittel. Der Klimawandeldienst Copernicus berichtete von einer Erwärmung um 1,6 Grad Celsius. Trotzdem sei das Pariser Klimaabkommen noch nicht verfehlt, da <del title=\"removed\">es<\/del><ins>dem<\/ins> eine Überschreitung des Schwellenwerts über 20 Jahre erfordert. Die Rekordtemperaturen werden hauptsächlich durch die Anhäufung von Treibhausgasen verursacht. Copernicus-Chef Carlo Buontempo betonte die Bedeutung schnellen und entschlossenen Handelns, um die Klimaentwicklung zu beeinflussen.", "original": "Das Jahr 2024 war das wärmste seit Messbeginn, mit einer Durchschnittstemperatur von mehr als 1,5 Grad über dem vorindustriellen Mittel. Der Klimawandeldienst Copernicus berichtete von einer Erwärmung um 1,6 Grad Celsius. Trotzdem sei das Pariser Klimaabkommen noch nicht verfehlt, da es eine Überschreitung des Schwellenwerts über 20 Jahre erfordert. Die Rekordtemperaturen werden hauptsächlich durch die Anhäufung von Treibhausgasen verursacht. Copernicus-Chef Carlo Buontempo betonte die Bedeutung schnellen und entschlossenen Handelns, um die Klimaentwicklung zu beeinflussen.", "title": "", "article": "Das Jahr 2024 war das wärmste seit Messbeginn. Die Temperatur war im Durchschnitt mehr als 1,5 Grad wärmer als im vorindustriellen Mittel, wie der Klimawandeldienst des EU-Programms Copernicus berichtet. Das europäische Team berechnete eine Erwärmung von 1,6 Grad Celsius.\nIn den beiden vergangenen Jahren zusammen wurde die Erderwärmung im Schnitt um mehr als 1,5 Grad im Vergleich zur vorindustriellen Zeit überschritten. Dabei sei 2024 das erste Kalenderjahr, in dem die Durchschnittstemperatur mehr als 1,5 Grad höher war als im Vergleichszeitraum, teilte das Erdbeobachtungsprogramm weiter mit. Es bestätigte zudem frühere Annahmen, dass 2024 das heißeste Jahr seit Beginn der Aufzeichnungen Mitte des 19. Jahrhunderts war.\nDies bedeute noch nicht, dass das Ziel des Pariser Klimaabkommens verfehlt sei, erklärte Copernicus. Dieses beziehe sich auf eine Überschreitung des Schwellenwerts während mindestens 20 Jahren. &quot;Aber es macht deutlich, dass die globalen Temperaturen höher steigen, als die moderne Menschheit es je erlebt hat&quot;, hieß es weiter. &quot;Die Zukunft liegt in unserer Hand: Schnelles und entschlossenes Handeln kann die Entwicklung des Klimas noch beeinflussen&quot;, sagte Copernicus-Chef Carlo Buontempo.\nDer Hauptgrund für die Rekordtemperaturen ist die Anhäufung von Treibhausgasen in der Atmosphäre, &quot;die durch die Verbrennung von Kohle, Öl und Gas entstehen&quot;, sagte Samantha Burgess vom Corpernicus-Klimadienst. &quot;Da sich die Treibhausgase weiterhin in der Atmosphäre ansammeln, steigen die Temperaturen weiter an, auch im Meer, der Meeresspiegel steigt weiter an, und die Gletscher und Eisschilde schmelzen weiter.&quot;\n\nAuch Meeresoberfläche so heiß wie nie\n\nAuch bei der Erwärmung der Meeresoberfläche ist laut dem Klimawandeldienst ein neuer Höchstwert erreicht worden. Im vergangenen Jahr habe die Durchschnittstemperatur bei 20,9 Grad gelegen, etwa ein halbes Grad höher als in den Jahren zwischen 1990 und 2020.\nDie internationale Gemeinschaft hatte sich 2015 bei der Weltklimakonferenz in Paris darauf verständigt, die Erderwärmung auf möglichst 1,5 Grad im Vergleich zum vorindustriellen Zeitalter zu begrenzen. Die UN-Klimakonferenz in Baku, COP29, endete im vergangenen Jahr mit einem viel kritisierten Minimalkompromiss zur Klimafinanzierung. Neue Beschlüsse zur Abkehr von fossilen Energieträgern blieben aus."}, {"id": "s050", "summary": "Die AfD hat eine Großspende über 1,5 Millionen Euro von dem umstrittenen Arzt und Professor Winfried Stöcker erhalten, die größte Summe, die eine Partei bisher im Jahr 2025 erhalten hat. Stöcker hatte im Zusammenhang mit einem nicht zugelassenen Impfstoff für Aufsehen gesorgt und wurde zu einer Geldstrafe verurteilt. Trotzdem ist <del title=\"removed\">er<\/del><ins>sie<\/ins> kein Impfgegner und wurde sogar von der AfD zu einem Coronasymposium eingeladen. Stöcker ist Gründer eines Labors und Besitzer eines Kaufhauses, aber auch wegen rassistischer und sexistischer Äußerungen umstritten.", "original": "Die AfD hat eine Großspende über 1,5 Millionen Euro von dem umstrittenen Arzt und Professor Winfried Stöcker erhalten, die größte Summe, die eine Partei bisher im Jahr 2025 erhalten hat. Stöcker hatte im Zusammenhang mit einem nicht zugelassenen Impfstoff für Aufsehen gesorgt und wurde zu einer Geldstrafe verurteilt. Trotzdem ist er kein Impfgegner und wurde sogar von der AfD zu einem Coronasymposium eingeladen. Stöcker ist Gründer eines Labors und Besitzer eines Kaufhauses, aber auch wegen rassistischer und sexistischer Äußerungen umstritten.", "title": "", "article": "Die AfD hat eine Großspende über 1,5 Millionen Euro von dem umstrittenen Arzt und Professor Winfried Stöcker erhalten. Das geht aus der Veröffentlichung des Bundestages zu den Großspenden über 35.000 Euro im Jahr 2025 hervor. Demnach soll die Spende bei der Partei am Dienstag eingegangen sein.\nDie Spende stellt die größte Summe dar, die eine Partei bisher im Jahr 2025 erhalten hat. 2024 hatte die AfD nach Angaben des Bundestages keine Großspende über 35.000 Euro erhalten. Parteien müssen diese anzeigen. Nach Informationen des Spiegels handelt es sich um die \ngrößte Einzelspende, die die AfD bislang erhalten hat.\nStöcker ist kein Unbekannter. Er hat im ersten Jahr der Coronapandemie für Aufsehen gesorgt, weil er verkündet hatte, einen eigenen Impfstoff entwickelt zu haben, der allerdings niemals von einer anerkannten Institution geprüft worden war .\n\nStöcker zu Geldstrafe verurteilt\n\nIm November startete er dennoch eine illegale Impfaktion am Lübecker \nFlughafen, die von der Polizei aufgelöst wurde. Das Paul-Ehrlich-Institut zeigte ihn deshalb an. Stöcker gehört der Flughafen, er hatte ihn aus der Insolvenz herausgekauft. Auch in der Oberlausitz soll er Menschen seinen Impfstoff verabreicht haben.\nStöcker wurde zur Zahlung einer Geldstrafe in Höhe von 250.000 Euro verurteilt . Er habe ein nicht zugelassenes Arzneimittel vorsätzlich in Verkehr gebracht und damit gegen das Arzneimittelgesetz verstoßen, urteilte das Amtsgericht in Lübeck. Dagegen legte er mit seinem Anwalt Wolfgang Kubicki, der auch für die FDP im Bundestag sitzt, Berufung ein .\nAnders als viele in der AfD ist Stöcker kein Impfgegner. Im Dezember 2021 rief er zum Impfen mit zugelassenen Impfstoffen gegen das Coronavirus auf . Die AfD-Fraktion lud ihn zu ihrem dritten Coronasymposium im November im Bundestag ein, in dem sie die Coronapolitik aufarbeiten will.\nStöcker ist Gründer des Labors Euroimmun und Besitzer des Kaufhauses Görlitz. An der Universität Lübeck unterrichtete er als Honorarprofessor. 2024 gab er den Titel zurück. Schon zuvor hatte sich die Universität mehrmals wegen rassistischer und sexistischer Äußerungen von ihm distanziert ."}, {"id": "s036", "summary": "Die deutschen Erzeugerpreise stiegen im Dezember um 0,8 Prozent im Vergleich zum Vorjahr, der stärkste Anstieg seit anderthalb Jahren. Im Jahresdurchschnitt 2024 lagen sie jedoch 1,8 Prozent unter dem Vorjahreswert. Der Anstieg war vor allem auf höhere Preise für Investitionsgüter zurückzuführen, darunter Maschinen und Kraftwagen. Nahrungsmittel verteuerten sich um 3,1 Prozent, wobei Butter und Süßwaren besonders stark zulegten. Die Inflationsrate stieg auf 2,6 Prozent, der höchste Wert seit Januar <del title=\"removed\">2024.<\/del><ins>2023.<\/ins> Experten erwarten keine Entlastung und spekulieren über weitere Zinssenkungen durch die EZB.", "original": "Die deutschen Erzeugerpreise stiegen im Dezember um 0,8 Prozent im Vergleich zum Vorjahr, der stärkste Anstieg seit anderthalb Jahren. Im Jahresdurchschnitt 2024 lagen sie jedoch 1,8 Prozent unter dem Vorjahreswert. Der Anstieg war vor allem auf höhere Preise für Investitionsgüter zurückzuführen, darunter Maschinen und Kraftwagen. Nahrungsmittel verteuerten sich um 3,1 Prozent, wobei Butter und Süßwaren besonders stark zulegten. Die Inflationsrate stieg auf 2,6 Prozent, der höchste Wert seit Januar 2024. Experten erwarten keine Entlastung und spekulieren über weitere Zinssenkungen durch die EZB.", "title": "", "article": "Die deutschen Erzeugerpreise sind im Dezember um 0,8 Prozent im Vergleich zum Vorjahresmonat gestiegen. Laut dem Statistischen Bundesamt ist das der stärkste Anstieg seit anderthalb Jahren. Experten hatten ein Plus von 1,1 Prozent erwartet. Im November war der Anstieg mit 0,1 Prozent minimal. Im Jahresdurchschnitt 2024 lagen die Erzeugerpreise jedoch 1,8 Prozent unter dem Vorjahreswert, als sie noch um 0,2 Prozent gestiegen waren.\nErzeugerpreise sind die Preise, die Unternehmen für ihre Produkte und Dienstleistungen erhalten, bevor diese in den Einzelhandel oder an den Endverbraucher weiterverkauft werden. Sie beziehen sich auf die Preise auf der Produktionsstufe und sind ein wichtiger Indikator für die Inflation, da steigende Erzeugerpreise oft zu höheren Preisen für Verbraucher führen können.\nDer Anstieg der Erzeugerpreise im Dezember war vor allem auf höhere Preise für Investitionsgüter zurückzuführen, die um 1,8 Prozent teurer wurden. Besonders stark verteuerten sich Maschinen (2,0 Prozent) und Kraftwagen (1,4 Prozent). Nahrungsmittel waren 3,1 Prozent teurer, wobei Butter (+40,9 Prozent) und Süßwaren (+24,4 Prozent) besonders stark zulegten. Rindfleisch verteuerte sich um 15,9 Prozent. Im Gegensatz dazu wurden Zucker (–32,6 Prozent), Schweinefleisch (–7,0 Prozent) und Getreidemehl (–6,3 Prozent) günstiger.\nDie Inflationsrate stieg im Dezember auf 2,6 Prozent und damit auf den höchsten\nWert seit Januar 2024. &quot;Bis auf Weiteres wird die\nGesamtinflationsrate keine Entlastung mehr erfahren&quot;, sagte der Chefvolkswirt der Hauck Aufhäuser Lampe\nPrivatbank, Alexander Krüger. &quot;Die EZB wird das aber kaum als bedrohlich empfinden und\ndie Leitzinsen weiter senken.&quot;"}, {"id": "s054", "summary": "In der Serie &quot;Kontoauszug&quot; werden Menschen vorgestellt, die offen über ihr Einkommen und ihre Ausgaben sprechen, um mehr Transparenz zu schaffen und sich gegenseitig zu unterstützen. Die Gesprächspartner reichen von Sozialarbeitern bis zu IT-Experten und haben <del title=\"removed\">unterschiedliche<\/del><ins>gleiche<\/ins> Einkommensverhältnisse. Leser sind eingeladen, ihre eigenen Erfahrungen zu teilen und können sich per E-Mail an kontoauszug@zeit.de wenden.", "original": "In der Serie &quot;Kontoauszug&quot; werden Menschen vorgestellt, die offen über ihr Einkommen und ihre Ausgaben sprechen, um mehr Transparenz zu schaffen und sich gegenseitig zu unterstützen. Die Gesprächspartner reichen von Sozialarbeitern bis zu IT-Experten und haben unterschiedliche Einkommensverhältnisse. Leser sind eingeladen, ihre eigenen Erfahrungen zu teilen und können sich per E-Mail an kontoauszug@zeit.de wenden.", "title": "Wie viel verdienen Sie?", "article": "&quot;Wie viel verdienst du eigentlich?&quot; Selbst in der Familie und unter Freunden reden viele Menschen nicht offen über ihr Einkommen oder darüber, wie viel Geld sie in ETFs stecken oder auf dem Tagesgeldkonto liegen haben. Dabei könnte man einander mit mehr Transparenz viel besser unterstützen – bei der Berufswahl zum Beispiel oder bei Gehaltsverhandlungen.\nAuch deswegen stellen wir in unserer Reihe Kontoauszug jeden Sonntag Menschen vor, die von ihrem Beruf und ihrer Ausbildung erzählen und ihre Einnahmen und Ausgaben offenlegen: eine Sozialarbeiterin zum Beispiel, ein Rettungssanitäter , ein Jurist oder IT-Expertinnen . Manche unserer Gesprächspartner haben sehr wenig Geld zur Verfügung, andere verdienen monatlich viele Tausend Euro.\nManche sprechen offen mit ihrem Namen, andere anonym. Möchten Sie auch von Ihren Kosten fürs Wohnen, für Lebensmittel und Freizeitaktivitäten erzählen? Oder gar Tipps für Investments geben, für Jobs werben oder vor ihnen warnen? Dann schreiben Sie uns!\nBitte schildern Sie uns Ihre Erfahrungen im Formular oder melden Sie sich per E-Mail an  kontoauszug@zeit.de . Ausgewählte Beiträge möchten wir nach Rücksprache mit Ihnen veröffentlichen, auf Wunsch auch anonym.\nUnsere Leserschaft bereichert unseren Journalismus.  Hier finden Sie alle Stimmen-Texte ."}, {"id": "s042", "summary": "Im Titelduell zwischen Ding Liren und Herausforderer Gukesh steht es nach dem vierten Remis in Serie weiterhin unentschieden, 3,5 zu 3,5. Gukesh überraschte Ding mit einem Turmmanöver, doch Ding rettete sich mit einer kunstvollen Verteidigung. Das WM-Duell ist auf bis zu vierzehn Partien angesetzt, der erste Spieler, <del title=\"removed\">der<\/del><ins>den<\/ins> 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "original": "Im Titelduell zwischen Ding Liren und Herausforderer Gukesh steht es nach dem vierten Remis in Serie weiterhin unentschieden, 3,5 zu 3,5. Gukesh überraschte Ding mit einem Turmmanöver, doch Ding rettete sich mit einer kunstvollen Verteidigung. Das WM-Duell ist auf bis zu vierzehn Partien angesetzt, der erste Spieler, der 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "title": "", "article": "Am Dienstag überraschte Gukesh den Weltmeister Ding Liren im 7. Zug mit einem Turmmanöver. Ding war geschockt, wie er später sagte, doch er rettete sich dank einer kunstvollen Verteidigungsleistung. Es war das vierte Remis in Serie. Damit steht es \nim Titelduell zwischen Ding Liren und\n dem Herausforderer Gukesh weiter unentschieden, 3,5 zu 3,5. Angesetzt\n ist das WM-Duell auf bis zu vierzehn \nPartien. Für jeden Sieg gibt es einen Punkt, für jedes Remis einen \nhalben. Weltmeister wird der Spieler, der zuerst 7,5 Punkte erreicht.\nBei uns können Sie alle Partien mit den Experten von chess.com live verfolgen, hier ab 10 Uhr die achte Partie dieser WM.\nUnser Reporter Ulrich Stock schreibt vom Ort des Geschehens. Alle Texte aus Singapur lesen Sie hier . Der Großmeister Niclas Huschenbeth liefert für ZEIT ONLINE Videoanalysen aller Partien zu."}, {"id": "s044", "summary": "In Dänemark kam es zu einem großflächigen Ausfall des Mobilfunknetzes, bei dem auch der Notruf 112 betroffen sein könnte. Die dänische Polizei verstärkt ihre Präsenz in Gebieten mit Notruf-Ausfall. Gleichzeitig gab es auch Probleme bei vielen Bahnverbindungen im Land, wobei Züge auf freier Strecke stehenblieben. Der Betreiber Banedanmark stellte vorübergehend den Betrieb ein, <del title=\"removed\">da<\/del><ins>bevor<\/ins> es Probleme mit dem digitalen Signalsystem gab. Es wird vermutet, dass die Ausfälle möglicherweise zusammenhängen, aber die genaue Ursache ist noch unklar. Banedanmark gab jedoch bekannt, dass das digitale Signalsystem im Westen des Landes wieder in Betrieb sei und der Zugverkehr langsam wieder normalisiert werde.", "original": "In Dänemark kam es zu einem großflächigen Ausfall des Mobilfunknetzes, bei dem auch der Notruf 112 betroffen sein könnte. Die dänische Polizei verstärkt ihre Präsenz in Gebieten mit Notruf-Ausfall. Gleichzeitig gab es auch Probleme bei vielen Bahnverbindungen im Land, wobei Züge auf freier Strecke stehenblieben. Der Betreiber Banedanmark stellte vorübergehend den Betrieb ein, da es Probleme mit dem digitalen Signalsystem gab. Es wird vermutet, dass die Ausfälle möglicherweise zusammenhängen, aber die genaue Ursache ist noch unklar. Banedanmark gab jedoch bekannt, dass das digitale Signalsystem im Westen des Landes wieder in Betrieb sei und der Zugverkehr langsam wieder normalisiert werde.", "title": "", "article": "In Dänemark ist es zu einem großflächigen Ausfall des Mobilfunknetzes gekommen. Kunden hatten der größten Telefongesellschaft des Landes, TDC, Probleme gemeldet. TDC teilte mit, dass auch der Notruf 112 betroffen sein könne. Die dänische Polizei zeigt in Gebieten mit Notruf-Ausfall verstärkt Präsenz auf den Straßen, berichteten dänische Medien.\n&quot;Wir schätzen, dass der Fehler auf ein Update zurückzuführen sein könnte, das innerhalb der letzten 24 Stunden durchgeführt wurde&quot;, sagte Lasse Bjerre Sørensen, Kommunikationsleiter bei TDC, dem dänischen Sender DR. Es gebe derzeit keine Hinweise auf einen Cyberangriff.\n\nAuch Bahnverkehr ist beeinträchtigt\n\nZu größeren Ausfällen kam es auch bei vielen Bahnverbindungen in Dänemark. Vereinzelt seien Züge auf freier Strecke stehengeblieben. Der Betreiber Banedanmark hatte vorübergehend den Betrieb eingestellt. Es gebe Probleme mit dem digitalen Signalsystem, hieß es in einer Mitteilung, die das Unternehmen auf der Onlineplattform X teilte.\n&quot;Wir arbeiten derzeit mit Hochdruck daran, den Verkehr wieder in Gang zu bringen und untersuchen die Ursache der Störung&quot;, teilte Nicolai Smidt Sigsgaard, stellvertretender Verkehrsdirektor bei Banedanmark, in einer Mitteilung des Unternehmens mit. Ob die parallel aufgetretenen Ausfälle des Mobilfunknetzes und des Bahnsystems zusammenhängen, ist bisher unklar. &quot;Wir suchen auf breiter Ebene nach der Ursache, aber wir können mit Sicherheit sagen, dass auch wir von einer größeren Störung im Telekommunikationsnetz betroffen sind&quot;, teilte Smidt weiter mit.\nBanedanmark teilte mit, dass das digitale Signalsystem im Westen des Landes inzwischen wieder in Betrieb sei. &quot;Die Züge können fahren.&quot; Der stündliche Betrieb soll im Laufe des Abend wieder aufrechterhalten werden. &quot;Wir arbeiten jetzt mit unserem Lieferanten zusammen, um die Probleme in den nächsten Tagen zu untersuchen&quot;, kündigte der Unternehmenssprecher in einer Mitteilung an."}, {"id": "s046", "summary": "In Aschaffenburg ereignete sich am Mittag ein tödlicher Messerangriff im Park Schönthal, bei dem zwei Menschen starben und mehrere verletzt wurden. Ein Tatverdächtiger wurde unmittelbar festgenommen, während ein weiterer als Zeuge vernommen wird. Die Polizei sucht nach Augenzeugen des Vorfalls, dessen Hintergründe noch unklar sind. Der Tatort wurde weiträumig abgesperrt und der Bahnverkehr in Aschaffenburg eingestellt, da ein Verdächtiger versucht haben soll, über Bahngleise zu fliehen. Es werden <del title=\"removed\">zwei<\/del><ins>drei<\/ins> Schwerverletzte im Krankenhaus behandelt, darunter auch ein Kind. Die genauen Zahlen der Verletzten sind noch nicht bekannt. Die Polizei hat keine weitere Gefahr für die Bevölkerung ausgemacht und bittet Zeugen, sich bei der Polizei zu melden.", "original": "In Aschaffenburg ereignete sich am Mittag ein tödlicher Messerangriff im Park Schönthal, bei dem zwei Menschen starben und mehrere verletzt wurden. Ein Tatverdächtiger wurde unmittelbar festgenommen, während ein weiterer als Zeuge vernommen wird. Die Polizei sucht nach Augenzeugen des Vorfalls, dessen Hintergründe noch unklar sind. Der Tatort wurde weiträumig abgesperrt und der Bahnverkehr in Aschaffenburg eingestellt, da ein Verdächtiger versucht haben soll, über Bahngleise zu fliehen. Es werden zwei Schwerverletzte im Krankenhaus behandelt, darunter auch ein Kind. Die genauen Zahlen der Verletzten sind noch nicht bekannt. Die Polizei hat keine weitere Gefahr für die Bevölkerung ausgemacht und bittet Zeugen, sich bei der Polizei zu melden.", "title": "", "article": "In Aschaffenburg sind zwei Menschen bei einem Messerangriff getötet worden. Das teilte das Polizeipräsidium Unterfranken mit. Ein Tatverdächtiger sei unmittelbar in der Nähe des Tatorts festgenommen worden.\nEs bestehe keine Gefahr für die Bevölkerung, teilte die Polizei mit. Zunächst wurden den Angaben zufolge zwei Verdächtige festgenommen. Bei einer der Personen konnte der Tatverdacht jedoch ausgeschlossen werden, sie werde als Zeuge vernommen. Hinweise auf weitere Tatverdächtige gibt es demnach nicht.\nZwei Schwerverletzte werden nach Polizeiangaben derzeit im Krankenhaus behandelt, darunter soll auch ein Kind sein. Zur genauen Zahl\nder Verletzten lagen keine Angaben vor.\n\nPolizei sucht Augenzeugen\n\nZum Tathergang teilte die Polizei bisher nur mit, dass die Opfer gegen Mittag im Park Schöntal in der Innenstadt mit einem Messer angegriffen worden seien. Die Hintergründe sind noch unklar.\nDer Tatort wurde den Angaben zufolge weiträumig abgesperrt. Weil ein Verdächtiger versucht haben soll, über Bahngleise zu fliehen, wurde der Bahnverkehr in Aschaffenburg eingestellt. Züge von und nach Aschaffenburg werden nach Bahnangaben aktuell zurückgehalten. Wie groß die Auswirkungen auf den Regional- und Fernverkehr sein werden, war zunächst nicht absehbar.\nDie Polizei rief derweil Augenzeugen dazu auf, sich beim Polizeinotruf oder einer Polizeidienststelle zu melden. Es werde zudem ein Portal eingerichtet, mit dem sachdienliche Bilder und Videos zugesendet werden könnten. Weiter bat die Behörde darum, auf Spekulationen zu verzichten.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s060", "summary": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert und ihm in einem Brief ein starkes Mandat für Führung attestiert. Merz verspricht, im Falle seiner Kanzlerschaft an einer Stärkung der Beziehungen zwischen Deutschland und den USA zu arbeiten. <del title=\"removed\">Während<\/del><ins>Weil<\/ins> keine hohen Vertreter der Bundesregierung zur Amtseinführung Trumps nach Washington reisen, äußert sich Merz zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps als seine Konkurrenten. Trotz Warnungen des deutschen Botschafters in Washington vor der Politik des neuen US-Präsidenten betont Merz, dass Europa die Herausforderung durch Trump annehmen könne, wenn es zusammenstehe.", "original": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert und ihm in einem Brief ein starkes Mandat für Führung attestiert. Merz verspricht, im Falle seiner Kanzlerschaft an einer Stärkung der Beziehungen zwischen Deutschland und den USA zu arbeiten. Während keine hohen Vertreter der Bundesregierung zur Amtseinführung Trumps nach Washington reisen, äußert sich Merz zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps als seine Konkurrenten. Trotz Warnungen des deutschen Botschafters in Washington vor der Politik des neuen US-Präsidenten betont Merz, dass Europa die Herausforderung durch Trump annehmen könne, wenn es zusammenstehe.", "title": "", "article": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert. &quot;Ihr Wahlsieg ist wahrlich bemerkenswert&quot;, schreibt Merz in dem sechszeiligen Brief, der ZEIT ONLINE vorliegt. Er attestiert Trump und dessen Republikanern darin ein &quot;starkes Mandat für Führung&quot;.\nMerz hat im ZEIT-Podcast Alles gesagt? bekannt gegeben , er habe Trump einen handschriftlichen Brief verfasst, der diesem am heutigen Montag übergeben werden soll. Der CDU-Vorsitzende, der vor seiner Rückkehr in die Politik unter anderem für den US-Vermögensverwalter BlackRock gearbeitet hat und Vorsitzender der transatlantischen Vereinigung Atlantik-Brücke war, schreibt: &quot;Ich habe einen beträchtlichen Teil meiner beruflichen Karriere und meines politischen Lebens der Stärkung der Beziehungen unserer beiden Länder gewidmet.&quot; Sollte er Bundeskanzler werden, verspricht Merz Trump, werde eine seiner Prioritäten sein, &quot;mit Ihnen auf ein neues Kapitel in unserer Beziehung hinzuarbeiten&quot;.\nZur Amtseinführung Trumps reisen keine hohen Vertreter der Bundesregierung aus Deutschland nach Washington. SPD, Grüne und FDP sind nicht anwesend, während der CDU-Außenpolitiker und frühere Transatlantik-Koordinator Jürgen Hardt eine Einladung erhielt. Von der AfD ist unter anderem Parteichef Tino Chrupalla vor Ort.\nMerz hat sich wiederholt zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps geäußert als seine Konkurrenten Bundeskanzler Olaf Scholz (SPD) und Vizekanzler Robert Habeck (Grüne). Der deutsche Botschafter in Washington, Andreas Michaelis, warnte in einem vertraulichen Schreiben an die Bundesregierung in deutlichen Worten vor der Politik des neuen US-Präsidenten.\nMerz hingegen sagte in einer Videobotschaft zu Trumps Amtseinführung am Montag: Es gebe für die Europäer &quot;keinen Grund, ängstlich nach Washington zu schauen&quot;. Die Herausforderung durch Trump könne Europa annehmen, wenn es zusammenstehe. &quot;Wir sind 450 Millionen Europäer – mehr als die USA und Kanada zusammen.&quot; Europa müsse sich wegen Trump stärker abstimmen, sagte Merz kürzlich. Er schaue auf eine Amtszeit von Trump nicht &quot;wie das Kaninchen auf die Schlange&quot;. Zudem berichtete Merz im ZEIT-Podcast, er berate sich regelmäßig mit Nato-Generalsekretär Mark Rutte, der Trump gut kenne und von ihm respektiert werde."}, {"id": "s043", "summary": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet <del title=\"removed\">sie<\/del><ins>ihn<\/ins> als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "original": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet sie als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "title": "", "article": "Unionskanzlerkandidat Friedrich Merz hat die Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump kritisiert. &quot;Diese Nachricht aus Washington ist in der Sprache eines politischen Aktivisten verfasst. Und sie ist offensichtlich bewusst öffentlich gemacht worden&quot;, sagte der CDU-Politiker im Deutschlandfunk. Dies seien gleich zwei schwere Fehler der deutschen Außenpolitik.\nEin schriftlicher Bericht des Botschafters Andreas Michaelis an das Außenministerium war kurz vor der Amtseinführung Trumps an die Öffentlichkeit gelangt . Darin schrieb Michaelis unter anderem, Trumps Agenda &quot;der maximalen Disruption, des Aufbrechens etablierter politischer Ordnung und bürokratischer Strukturen sowie seine Rachepläne&quot; bedeuteten letztlich &quot;eine Neudefinition der verfassungsrechtlichen Ordnung&quot;. Zudem kritisierte er die &quot;maximale Machtkonzentration beim Präsidenten zulasten von Kongress und Bundesstaaten&quot;.\nMerz sagte über Michaelis&#x27; Bericht: &quot;Allein die Tatsache, dass dies offensichtlich bewusst öffentlich gemacht worden ist, ist ein Affront.&quot; Hinter der Veröffentlichung sieht er eine innenpolitische Motivation. &quot;Für das Ansehen der Bundesregierung in Washington, D. C. , ist das ein großer Schaden&quot;, sagte der Unionskanzlerkandidat. Die aktuelle Bundesregierung werde in Washington, D. C., zeitnah keine Gesprächspartner mehr finden.\n&quot;Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren?&quot;\nDie Kritik des CDU-Vorsitzenden bezog sich primär auf die Veröffentlichung des Textes, nicht auf den Inhalt. So stehe in der Analyse &quot;auch manches Richtige&quot;. Allerdings müssten aus dieser Analyse Schlussfolgerungen gezogen werden.\nLaut Merz müssten die Konsequenzen sein, dass sich die Europäer &quot;jetzt schnell zusammensetzen&quot; und insbesondere über zwei Themen diskutieren: die eigenen Schritte für die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA. &quot;Diese beiden Fragen müssen nicht deutsch, sondern europäisch beantwortet werden&quot;, sagte Merz.\nIn beiden Aspekten sieht Merz Deutschland in besonderer Verantwortung. So gebe es aktuell sehr viele Möglichkeiten für Europa, die nicht ausgeschöpft würden. &quot;Alles hängt da an der Frage: Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren? Ist Deutschland bereit, für Europa eine Führungsverantwortung zu übernehmen?&quot;\nVerfolgen sie die aktuellen Entwicklungen zur Amtseinführung Donald Trumps in unserem Liveblog ."}, {"id": "s047", "summary": "Biodeutsch&quot; wurde zum Unwort des Jahres 2024 gewählt, da es in rassistischer und nationalistischer Weise in den sozialen Medien verwendet wird. Die Jury in Marburg kritisiert die Unterteilung in &quot;echte&quot; und &quot;Deutsche zweiter Klasse&quot; als Alltagsrassismus. Auf Platz zwei landete <ins>nicht <\/ins>&quot;Heizungsverbot&quot;, das in der Klimaschutzdebatte irreführend benutzt wird. Die Jury möchte mit der Auswahl auf undifferenzierten und diskriminierenden Sprachgebrauch aufmerksam machen.", "original": "Biodeutsch&quot; wurde zum Unwort des Jahres 2024 gewählt, da es in rassistischer und nationalistischer Weise in den sozialen Medien verwendet wird. Die Jury in Marburg kritisiert die Unterteilung in &quot;echte&quot; und &quot;Deutsche zweiter Klasse&quot; als Alltagsrassismus. Auf Platz zwei landete &quot;Heizungsverbot&quot;, das in der Klimaschutzdebatte irreführend benutzt wird. Die Jury möchte mit der Auswahl auf undifferenzierten und diskriminierenden Sprachgebrauch aufmerksam machen.", "title": "&quot;Biodeutsch&quot; ist Unwort des Jahres 2024", "article": "&quot;Biodeutsch&quot; ist das Unwort des Jahres 2024. Das Wort werde vor allem in den sozialen Medien in rassistischer und nationalistischer Weise gebraucht, teilte die Jury der Sprachaktion in Marburg zur Begründung ihrer Wahl mit. &quot;Die mit dem Gebrauch von biodeutsch einhergehende Unterteilung in angeblich &#x27;echte&#x27; Deutsche und in Deutsche zweiter Klasse ist eine Form von Alltagsrassismus&quot;, erklärte die Jury.\nUrsprünglich sei &quot;biodeutsch&quot; als ironisch-satirischer Ausdruck verwendet worden, seit mehreren Jahren jedoch sei &quot;eine sehr gedankenlose und unreflektierte, nicht-satirische, also wörtlich gemeinte Verwendung festzustellen&quot;. Dabei werde &quot;Deutschsein&quot; naturbezogen begründet und würden Menschen mit Migrationsbiografie ausgegrenzt. Das verstoße gegen die Idee von demokratischer Gleichheit und Inklusion.\n\n&quot;Heizungsverbot&quot; auf Platz zwei\n\nAuf Platz zwei wählten die Sprachexperten und -expertinnen das Wort &quot;Heizungsverbot&quot; . Es werde irreführend und sachlich falsch in der Debatte um Klimaschutz benutzt. Bis knapp zwei Wochen vor Einsendeschluss gingen mehr als 2.800 Vorschläge ein, erneut deutlich mehr als im Vorjahr.\nSeit 1991 werden mit dem Unwort des Jahres unmenschliche oder unangemessene Begriffe ausgewählt, die gegen das Prinzip der Menschenwürde verstoßen, in irreführender Weise etwas Negatives beschönigen oder diskriminieren. Die Jury aus Sprachwissenschaftlerinnen und -wissenschaftlern will damit insgesamt auf &quot;undifferenzierten, verschleiernden oder diffamierenden öffentlichen Sprachgebrauch&quot; aufmerksam machen.\nIm vergangenen Jahr wurde der Begriff &quot;Remigration&quot; zum Unwort des Jahres gekürt . Das Wort werde als beschönigende Tarnvokabel benutzt, hieß es damals zur Begründung.  Tatsächlich solle damit eine menschenunwürdige Abschiebepraxis verschleiert werden."}, {"id": "s033", "summary": "Donald Trump kündigt als designierter US-Präsident die Gründung einer neuen Bundesbehörde zur Erhebung von Zöllen und anderen Einkünften aus dem Ausland an, um die amerikanische Wirtschaft zu stärken. Die neue Behörde soll &quot;External Revenue Service&quot; heißen und direkt nach seiner Amtseinführung per Dekret geschaffen werden. Trump hatte bereits im Wahlkampf neue Zölle angekündigt, darunter zehn Prozent auf weltweite Einfuhren in die USA und bis zu 60 Prozent für Produkte aus China. Diese Pläne könnten den Welthandel stark <del title=\"removed\">belasten.<\/del><ins>entlasten.<\/ins>", "original": "Donald Trump kündigt als designierter US-Präsident die Gründung einer neuen Bundesbehörde zur Erhebung von Zöllen und anderen Einkünften aus dem Ausland an, um die amerikanische Wirtschaft zu stärken. Die neue Behörde soll &quot;External Revenue Service&quot; heißen und direkt nach seiner Amtseinführung per Dekret geschaffen werden. Trump hatte bereits im Wahlkampf neue Zölle angekündigt, darunter zehn Prozent auf weltweite Einfuhren in die USA und bis zu 60 Prozent für Produkte aus China. Diese Pläne könnten den Welthandel stark belasten.", "title": "", "article": "Der designierte US-Präsident Donald\nTrump hat die Gründung einer neuen Bundesbehörde zur Erhebung\nvon Zöllen und anderen Einkünften aus dem Ausland angekündigt. Diese soll &quot;External Revenue Service&quot; (etwa: Behörde für\nexterne Einnahmen) heißen. Trump will die neue Behörde per Dekret direkt nach seiner\nAmtseinführung schaffen, schrieb er im sozialen Netzwerk Truth Social. Eine neue Zollpolitik hatte Trump bereits mehrmals angekündigt.\n&quot;Die\namerikanische Wirtschaft hat der Welt durch lasche und\nerbärmlich schwache Handelsabkommen Wachstum und Wohlstand\nbeschert, während wir uns selbst besteuert haben&quot;, schrieb Trump.\nEs sei Zeit, dass sich das ändere. Nun würden diejenigen\nbelastet, die an den USA verdient hätten und nun\nihren gerechten Anteil zahlen sollten. Weitere Einzelheiten wurden nicht genannt.\nTrump übernimmt am 20. Januar das Amt des US-Präsidenten. Schon im Wahlkampf hatte er neue Zölle angekündigt. Zehn Prozent will er nach eigener Aussage auf weltweite\nEinfuhren in die USA erheben, für Produkte aus China sogar 60 Prozent. Kanada und Mexiko sollen Trump zufolge\n25 Prozent zahlen , solange sie seiner Meinung nach nicht ausreichend gegen Migranten\nund den Drogenhandel an den US-Grenzen vorgehen. Das dürfte den Welthandel sehr belasten.\nAuch der Europäischen Union (EU) drohte Trump hohe Zölle an. Die EU solle mehr amerikanisches Öl und Gas einführen, sonst drohten zusätzliche Zölle, hatte Trump im vergangenen Jahr gesagt. Die EU will nach eigener Aussage einen Wirtschaftskrieg mit den USA vermeiden , kündigte aber an, auf hohe Zölle ebenfalls mit neuen Zöllen reagieren zu können. Diese könnten zum Beispiel US-Digitalkonzerne treffen . In Europa und vor allem in Deutschland könnte die Autoindustrie im Fokus sein."}];

  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
