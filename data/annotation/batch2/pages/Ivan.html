const ITEMS = [{"id": "s036", "summary": "Die deutschen Erzeugerpreise stiegen im Dezember um 0,8 Prozent im Vergleich zum Vorjahr, der stärkste Anstieg seit anderthalb Jahren. Im Jahresdurchschnitt 2024 lagen sie jedoch 1,8 Prozent unter dem Vorjahreswert. Der Anstieg war vor allem auf höhere Preise für Investitionsgüter zurückzuführen, darunter Maschinen und Kraftwagen. Nahrungsmittel verteuerten sich um 3,1 Prozent, wobei Butter und Süßwaren besonders stark zulegten. Die Inflationsrate stieg auf 2,6 Prozent, der höchste Wert seit Januar <del title=\"removed\">2024.<\/del><ins>2023.<\/ins> Experten erwarten keine Entlastung und spekulieren über weitere Zinssenkungen durch die EZB.", "original": "Die deutschen Erzeugerpreise stiegen im Dezember um 0,8 Prozent im Vergleich zum Vorjahr, der stärkste Anstieg seit anderthalb Jahren. Im Jahresdurchschnitt 2024 lagen sie jedoch 1,8 Prozent unter dem Vorjahreswert. Der Anstieg war vor allem auf höhere Preise für Investitionsgüter zurückzuführen, darunter Maschinen und Kraftwagen. Nahrungsmittel verteuerten sich um 3,1 Prozent, wobei Butter und Süßwaren besonders stark zulegten. Die Inflationsrate stieg auf 2,6 Prozent, der höchste Wert seit Januar 2024. Experten erwarten keine Entlastung und spekulieren über weitere Zinssenkungen durch die EZB.", "title": "", "article": "Die deutschen Erzeugerpreise sind im Dezember um 0,8 Prozent im Vergleich zum Vorjahresmonat gestiegen. Laut dem Statistischen Bundesamt ist das der stärkste Anstieg seit anderthalb Jahren. Experten hatten ein Plus von 1,1 Prozent erwartet. Im November war der Anstieg mit 0,1 Prozent minimal. Im Jahresdurchschnitt 2024 lagen die Erzeugerpreise jedoch 1,8 Prozent unter dem Vorjahreswert, als sie noch um 0,2 Prozent gestiegen waren.\nErzeugerpreise sind die Preise, die Unternehmen für ihre Produkte und Dienstleistungen erhalten, bevor diese in den Einzelhandel oder an den Endverbraucher weiterverkauft werden. Sie beziehen sich auf die Preise auf der Produktionsstufe und sind ein wichtiger Indikator für die Inflation, da steigende Erzeugerpreise oft zu höheren Preisen für Verbraucher führen können.\nDer Anstieg der Erzeugerpreise im Dezember war vor allem auf höhere Preise für Investitionsgüter zurückzuführen, die um 1,8 Prozent teurer wurden. Besonders stark verteuerten sich Maschinen (2,0 Prozent) und Kraftwagen (1,4 Prozent). Nahrungsmittel waren 3,1 Prozent teurer, wobei Butter (+40,9 Prozent) und Süßwaren (+24,4 Prozent) besonders stark zulegten. Rindfleisch verteuerte sich um 15,9 Prozent. Im Gegensatz dazu wurden Zucker (–32,6 Prozent), Schweinefleisch (–7,0 Prozent) und Getreidemehl (–6,3 Prozent) günstiger.\nDie Inflationsrate stieg im Dezember auf 2,6 Prozent und damit auf den höchsten\nWert seit Januar 2024. &quot;Bis auf Weiteres wird die\nGesamtinflationsrate keine Entlastung mehr erfahren&quot;, sagte der Chefvolkswirt der Hauck Aufhäuser Lampe\nPrivatbank, Alexander Krüger. &quot;Die EZB wird das aber kaum als bedrohlich empfinden und\ndie Leitzinsen weiter senken.&quot;"}, {"id": "s037", "summary": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.<ins> Die katholische Kirche soll eine Liste mit Namen der Gefangenen vor der Freilassung öffentlich prüfen lassen.<\/ins>", "original": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.", "title": "", "article": "Nach der Ankündigung eines US-Regierungsvertreters, Kuba von der US-Terrorliste zu streichen , hat die Regierung in Havanna die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt.\nDie Entscheidung der Vereinigten Staaten sei ein Schritt in die richtige\n Richtung, komme aber zu spät, kritisierte Außenminister Bruno Rodríguez in einer Mitteilung . \nGleichzeitig forderte er ein Ende des US-Handelsembargos gegen Kuba , das seit 1962 in Kraft ist.\nWie der US-Regierungsvertreter mitgeteilt hatte, soll \ndiese &quot;Geste des guten Willens&quot; die Verhandlungen über die Freilassung \neiner &quot;bedeutenden Zahl politischer Gefangener&quot; befördern. Es bestehe die\n Hoffnung, dass die Freilassung noch vor dem Amtsantritt von Donald \nTrump am kommenden Montag erfolgen könne, dessen Republikanische Partei \ngegenüber den Behörden im kommunistischen Kuba traditionell eine harte \nLinie verfolgt.\nDie katholische Kirche treibe das Abkommen voran, das \nvor allem Menschen betrifft, die bei den regierungskritischen Protesten \nim Sommer 2021 in Kuba festgenommen wurden.\n\nTrump könnte die Entscheidung von Biden zurücknehmen\n\nVor vier Jahren hatte Trump \nKuba auf die US-Liste der Terrorunterstützer gesetzt, auf der auch \nSyrien, der Iran und Nordkorea verzeichnet sind. Nach seinem Amtsantritt\n könnte er die Entscheidung Bidens sofort wieder rückgängig machen.\n&quot;Kuba hätte niemals in die \nwillkürliche Liste der staatlichen Sponsoren des Terrorismus aufgenommen\n werden dürfen&quot;, schrieb Rodríguez auf der Plattform X. Die US-Politik \nder harten Sanktionen gegen Kuba habe schwerwiegende Folgen für die \nBevölkerung von elf Millionen Menschen, schade der Wirtschaft des \nInselstaates und fördere die Migration in die USA.\n\nKuba hatte Hunderte Menschen nach friedlichen Protesten verhaftet\n\nDie\n geplante Freilassung von Häftlingen, die wegen verschiedener Straftaten\n verurteilt worden waren, soll nach Angaben des kubanischen \nAußenministeriums schrittweise erfolgen. Wegen ihrer Teilnahme an \nfriedlichen Protesten sind Hunderte Menschen auf Kuba inhaftiert, unter ihnen auch der deutsche Staatsbürger Luis Frómeta Compte. Wer \nfreikommen dürfte, war zunächst unklar.\nNach offiziellen Angaben wurden in Kuba rund 500 Menschen wegen ihrer \nTeilnahme an den Protesten im Juli 2021 zu Haftstrafen \nverurteilt, die teils bis zu 25 Jahre betrugen. Es waren die größten \nProteste gegen die Regierung in Havanna seit der Kubanischen Revolution \n1959.\nAnfang Januar habe \nStaatspräsident Miguel Díaz-Canel Papst Franziskus in einem Schreiben \nüber die Entscheidung informiert, teilte die kubanische Regierung mit. \nDie Freilassungen seien im Geiste des von der katholischen Kirche \nausgerufenen Jubeljahres 2025 beschlossen worden. Zuvor habe Díaz-Canel \nim Juni 2023 bei einem Besuch im Vatikan mit dem Papst über die \nSituation der Häftlinge und die Auswirkungen der US-Sanktionen \ngesprochen."}, {"id": "s042", "summary": "Im Titelduell zwischen Ding Liren und Herausforderer Gukesh steht es nach dem vierten Remis in Serie weiterhin unentschieden, 3,5 zu 3,5. Gukesh überraschte Ding mit einem Turmmanöver, doch Ding rettete sich mit einer kunstvollen Verteidigung. Das WM-Duell ist auf bis zu vierzehn Partien angesetzt, der erste Spieler, <del title=\"removed\">der<\/del><ins>den<\/ins> 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "original": "Im Titelduell zwischen Ding Liren und Herausforderer Gukesh steht es nach dem vierten Remis in Serie weiterhin unentschieden, 3,5 zu 3,5. Gukesh überraschte Ding mit einem Turmmanöver, doch Ding rettete sich mit einer kunstvollen Verteidigung. Das WM-Duell ist auf bis zu vierzehn Partien angesetzt, der erste Spieler, der 7,5 Punkte erreicht, wird Weltmeister. Die achte Partie der WM kann live auf chess.com verfolgt werden.", "title": "", "article": "Am Dienstag überraschte Gukesh den Weltmeister Ding Liren im 7. Zug mit einem Turmmanöver. Ding war geschockt, wie er später sagte, doch er rettete sich dank einer kunstvollen Verteidigungsleistung. Es war das vierte Remis in Serie. Damit steht es \nim Titelduell zwischen Ding Liren und\n dem Herausforderer Gukesh weiter unentschieden, 3,5 zu 3,5. Angesetzt\n ist das WM-Duell auf bis zu vierzehn \nPartien. Für jeden Sieg gibt es einen Punkt, für jedes Remis einen \nhalben. Weltmeister wird der Spieler, der zuerst 7,5 Punkte erreicht.\nBei uns können Sie alle Partien mit den Experten von chess.com live verfolgen, hier ab 10 Uhr die achte Partie dieser WM.\nUnser Reporter Ulrich Stock schreibt vom Ort des Geschehens. Alle Texte aus Singapur lesen Sie hier . Der Großmeister Niclas Huschenbeth liefert für ZEIT ONLINE Videoanalysen aller Partien zu."}, {"id": "s046", "summary": "In Aschaffenburg ereignete sich am Mittag ein tödlicher Messerangriff im Park Schönthal, bei dem zwei Menschen starben und mehrere verletzt wurden. Ein Tatverdächtiger wurde unmittelbar festgenommen, während ein weiterer als Zeuge vernommen wird. Die Polizei sucht nach Augenzeugen des Vorfalls, dessen Hintergründe noch unklar sind. Der Tatort wurde weiträumig abgesperrt und der Bahnverkehr in Aschaffenburg eingestellt, da ein Verdächtiger versucht haben soll, über Bahngleise zu fliehen. Es werden <del title=\"removed\">zwei<\/del><ins>drei<\/ins> Schwerverletzte im Krankenhaus behandelt, darunter auch ein Kind. Die genauen Zahlen der Verletzten sind noch nicht bekannt. Die Polizei hat keine weitere Gefahr für die Bevölkerung ausgemacht und bittet Zeugen, sich bei der Polizei zu melden.", "original": "In Aschaffenburg ereignete sich am Mittag ein tödlicher Messerangriff im Park Schönthal, bei dem zwei Menschen starben und mehrere verletzt wurden. Ein Tatverdächtiger wurde unmittelbar festgenommen, während ein weiterer als Zeuge vernommen wird. Die Polizei sucht nach Augenzeugen des Vorfalls, dessen Hintergründe noch unklar sind. Der Tatort wurde weiträumig abgesperrt und der Bahnverkehr in Aschaffenburg eingestellt, da ein Verdächtiger versucht haben soll, über Bahngleise zu fliehen. Es werden zwei Schwerverletzte im Krankenhaus behandelt, darunter auch ein Kind. Die genauen Zahlen der Verletzten sind noch nicht bekannt. Die Polizei hat keine weitere Gefahr für die Bevölkerung ausgemacht und bittet Zeugen, sich bei der Polizei zu melden.", "title": "", "article": "In Aschaffenburg sind zwei Menschen bei einem Messerangriff getötet worden. Das teilte das Polizeipräsidium Unterfranken mit. Ein Tatverdächtiger sei unmittelbar in der Nähe des Tatorts festgenommen worden.\nEs bestehe keine Gefahr für die Bevölkerung, teilte die Polizei mit. Zunächst wurden den Angaben zufolge zwei Verdächtige festgenommen. Bei einer der Personen konnte der Tatverdacht jedoch ausgeschlossen werden, sie werde als Zeuge vernommen. Hinweise auf weitere Tatverdächtige gibt es demnach nicht.\nZwei Schwerverletzte werden nach Polizeiangaben derzeit im Krankenhaus behandelt, darunter soll auch ein Kind sein. Zur genauen Zahl\nder Verletzten lagen keine Angaben vor.\n\nPolizei sucht Augenzeugen\n\nZum Tathergang teilte die Polizei bisher nur mit, dass die Opfer gegen Mittag im Park Schöntal in der Innenstadt mit einem Messer angegriffen worden seien. Die Hintergründe sind noch unklar.\nDer Tatort wurde den Angaben zufolge weiträumig abgesperrt. Weil ein Verdächtiger versucht haben soll, über Bahngleise zu fliehen, wurde der Bahnverkehr in Aschaffenburg eingestellt. Züge von und nach Aschaffenburg werden nach Bahnangaben aktuell zurückgehalten. Wie groß die Auswirkungen auf den Regional- und Fernverkehr sein werden, war zunächst nicht absehbar.\nDie Polizei rief derweil Augenzeugen dazu auf, sich beim Polizeinotruf oder einer Polizeidienststelle zu melden. Es werde zudem ein Portal eingerichtet, mit dem sachdienliche Bilder und Videos zugesendet werden könnten. Weiter bat die Behörde darum, auf Spekulationen zu verzichten.\nDieser Artikel wird weiter aktualisiert."}, {"id": "s058", "summary": "Die AfD erreicht im ZDF-Politbarometer 21 Prozent, ein Plus von zwei Prozentpunkten im Vergleich zur letzten<ins> Umfrage. Dies ist der erste Wert über 20 Prozent für die Partei in dieser<\/ins> Umfrage. Die Union bleibt stärkste Kraft mit 30 Prozent, gefolgt von den Grünen mit 15 Prozent vor der SPD mit 14 Prozent. In der Kanzlerfrage liegen Habeck und Merz mit je 27 Prozent gleichauf, während Scholz nur 14 Prozent erreicht.", "original": "Die AfD erreicht im ZDF-Politbarometer 21 Prozent, ein Plus von zwei Prozentpunkten im Vergleich zur letzten Umfrage. Die Union bleibt stärkste Kraft mit 30 Prozent, gefolgt von den Grünen mit 15 Prozent vor der SPD mit 14 Prozent. In der Kanzlerfrage liegen Habeck und Merz mit je 27 Prozent gleichauf, während Scholz nur 14 Prozent erreicht.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s038", "summary": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte <del title=\"removed\">Syrien<\/del><ins>Jordanien<\/ins> und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "original": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "title": "Entwicklungsministerin Schulze sagt Syrien deutsche Unterstützung zu", "article": "Bundesentwicklungsministerin Svenja Schulze (SPD) hat bei\neinem Besuch in Syrien deutsche Unterstützung für\neine &quot;friedliche und stabile Entwicklung&quot; des Landes angekündigt.\nSchulze traf sich am Morgen in Damaskus mit Vertretern der\nÜbergangsregierung, Ärzten und dem De-facto-Gesundheitsminister Maher al-Scharaa,\neinem Bruder des neuen Machthabers Ahmed al-Scharaa. Die Ministerin kündigte\nzudem neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern an.\nSchulzes Ministerium sieht große Herausforderungen im traditionell eigentlich sehr starken syrischen Gesundheitswesen. Das hat mit der gezielten Bombardierung von Krankenhäusern in ehemaligen Rebellengebieten während des Bürgerkriegs zu tun. Außerdem fehlt durch Flucht und Vertreibung vielerorts das medizinische Personal. Laut Entwicklungsministerium hat mehr als die Hälfte des Gesundheitspersonals das Land verlassen, mehr als ein Drittel der\nKrankenhäuser sei nicht mehr funktionstüchtig.\nUm das Gesundheitssystem zu unterstützen, soll es sogenannte Klinikpartnerschaften geben, die Deutschland bereits mit 52 Ländern finanziert. Dabei geht es um den Austausch von Wissen und Erfahrung. Ärzte aus Deutschland sollen nach Syrien reisen, um dort Fortbildungsmaßnahmen anzubieten oder mit lokalen Kollegen den Einsatz neuer Geräte zu üben. Auch Fortbildungen in Deutschland sind möglich. Eine Auftaktkonferenz für die Klinikpartnerschaften soll am 12. Februar in Berlin stattfinden.\n\nDeutschland auf syrisches Fachpersonal &quot;angewiesen&quot;\n\nAuf ihrer Reise wird Schulze von einem in Deutschland arbeitenden syrischen Arzt begleitet. In den kommenden Monaten dürfte es auch um die Frage gehen, ob syrische Ärztinnen und Ärzte aus Deutschland wieder nach Syrien zurückkehren sollen. Regierungsangaben zufolge gibt es bundesweit etwa 5.800 Ärztinnen und über 2.000 Pflegekräfte mit syrischem Pass. Viele hätten sich bereits beim Entwicklungsministerium gemeldet, weil\nsie helfen wollten.\nEs sei verständlich, dass die neue Regierung in Syrien die Fachkräfte gern zurückholen wolle, sagte Schulze. &quot;Aber auch Deutschland hat ein\nInteresse, diese Menschen zu halten, auf die wir gerade in\nunserem Gesundheitssystem angewiesen sind.&quot; Durch die Klinikpartnerschaften wolle sie ermöglichen, &quot;dass beides geht: sich von Deutschland aus für Syrien engagieren&quot;. Letztendlich sei aber vor allem entscheidend, was jede einzelne Fachkraft selbst für ihr Leben wolle.\nSchulze ist die zweite deutsche Ministerin, die nach dem Sturz des langjährigen Machthabers Baschar al-Assad nach Syrien reist. Anfang des Jahres war Außenministerin Annalena Baerbock (Grüne) nach Damaskus geflogen und hatte dort mit Vertretern der neuen Übergangsregierung beraten. Dabei hatte sie wiederholt hervorgehoben, dass unter der neuen Regierung der Schutz aller religiösen und ethnischen Minderheiten gewahrt werden müsse."}, {"id": "s040", "summary": "Bei der Amtseinführung von Donald Trump als US-Präsident hat Elon Musk eine Geste gemacht, die für viele Nutzer auf seinem Online-Plattform X eindeutig antisemitisch erscheint: Ein Hitlergruß. Der Tesla-Gründer <ins>trug einen dunklen Anzug, <\/ins>sprang über die Bühne und bedankte sich bei den Anhängern des neuen Präsidenten, bevor er seine rechte Hand an sein Herz legte und sie nach oben streckte.", "original": "Bei der Amtseinführung von Donald Trump als US-Präsident hat Elon Musk eine Geste gemacht, die für viele Nutzer auf seinem Online-Plattform X eindeutig antisemitisch erscheint: Ein Hitlergruß. Der Tesla-Gründer sprang über die Bühne und bedankte sich bei den Anhängern des neuen Präsidenten, bevor er seine rechte Hand an sein Herz legte und sie nach oben streckte.", "title": "", "article": "Elon Musk hat nach der Amtseinführung Donald Trumps als neuer US-Präsident bei der \nVeranstaltung in der Capital One Arena mit einer\n dem Hitlergruß ähnlichen Geste für Irritationen gesorgt. Musk\n war einer der Redner auf der Bühne vor dem Eintreffen Trumps. In einem ungewöhnlichen Auftritt sprang und tanzte der Tesla-Gründer über die Bühne und bedankte sich bei den Anhängern des \nneuen Präsidenten. Dann hielt er seine rechte Hand an sein Herz und \nstreckte sie in einer schnellen Bewegung nach oben raus. Danach \nwiederholte er die Geste noch einmal mit dem Rücken zum Publikum. &quot;Mein Herz\n fliegt euch zu&quot;, rief Musk.\nViele Nutzer auf Musks\n Onlineplattform X sahen in der Geste einen Hitlergruß. Der Nachrichtensender CNN wiederholte die Szene in seinem \nProgramm mehrfach. Die Zuschauer seien selbst klug genug, sich eine \nMeinung dazu zu bilden, sagte eine Moderatorin.\nDie Bürgerrechtsgruppe Anti-Defamation League nahm den Tesla-Chef in Schutz. Es habe sich nicht um den Hitlergruß gehandelt, schrieb die Organisation, die Antisemitismus bekämpft, auf Musks Plattform X: &quot;Es scheint, als ob Musk in einem Moment der Begeisterung eine ungeschickte Geste gemacht hat.&quot;\nVon Musk\n gab es zunächst keine Erklärung dazu. Auf seinem\n X-Account teilte er einen Mitschnitt seiner Rede vom Sender Fox News, in dem im \nMoment der ersten – und problematischer aussehenden – Geste die Zuhörer \neingeblendet wurden. Später nannte er die Kritik einen &quot;müden Angriff&quot;. Auf X schrieb er offenbar \nauf seine Kritiker bezogen, &quot;sie brauchen bessere schmutzige Tricks&quot;. \nDer &quot;Jeder ist Hitler&quot;-Angriff sei ermüdend.\nBei seinem Auftritt sagte Musk noch, durch Trumps Wahl sei die &quot;Zukunft der Zivilisation gesichert&quot; worden. Die ganze Menschheit sei an einer Weggabelung gewesen."}, {"id": "s032", "summary": "<del title=\"removed\">Die AfD-Delegierten haben auf ihrem Parteitag in Riesa Alice Weidel einstimmig zur Kanzlerkandidatin gewählt. <\/del>Die 45-Jährige ist die erste eigene Kanzlerkandidatin der Partei und soll die Regierungsverantwortung nach der Bundestagswahl übernehmen. Der Parteitag wurde von Protesten überschattet und musste später beginnen, da Weidel wegen blockierter Zufahrtsstraßen verspätet ankam. Weidel ist eine Ausnahmeerscheinung in der AfD als offen homosexuelle Politikerin, die für ein traditionelles Familienbild einsteht. Die Partei streamte den Parteitag auf einer Plattform, auf der auch Tesla-Gründer Elon Musk die Partei unterstützt und Weidel zu einem weltweit gestreamten Gespräch einlud.", "original": "Die AfD-Delegierten haben auf ihrem Parteitag in Riesa Alice Weidel einstimmig zur Kanzlerkandidatin gewählt. Die 45-Jährige ist die erste eigene Kanzlerkandidatin der Partei und soll die Regierungsverantwortung nach der Bundestagswahl übernehmen. Der Parteitag wurde von Protesten überschattet und musste später beginnen, da Weidel wegen blockierter Zufahrtsstraßen verspätet ankam. Weidel ist eine Ausnahmeerscheinung in der AfD als offen homosexuelle Politikerin, die für ein traditionelles Familienbild einsteht. Die Partei streamte den Parteitag auf einer Plattform, auf der auch Tesla-Gründer Elon Musk die Partei unterstützt und Weidel zu einem weltweit gestreamten Gespräch einlud.", "title": "Alice Weidel einstimmig zur Kanzlerkandidatin der AfD gewählt", "article": "Die AfD -Delegierten haben auf ihrem Parteitag in Riesa einstimmig Parteichefin Alice Weidel zur Kanzlerkandidatin gewählt. Mit der 45-Jährigen kürte die in Teilen als rechtsextrem eingestufte Partei erstmals in ihrer\nGeschichte eine eigene Kanzlerkandidatin. Ziel sei die Übernahme der\nRegierungsverantwortung nach der Bundestagswahl, sagte der Co-Vorsitzende\nTino Chrupalla.\n&quot;Sie ist die zukünftige Kanzlerin&quot;, sagte Chrupalla . &quot;Jetzt müssen wir die 20-Prozent-Marke hinter uns lassen und\nweiter klettern.&quot;\nDer Parteitag in Riesa ist von Protesten überschattet und musste deshalb später anfangen als ursprünglich geplant . Unter anderem Weidel hatte wegen blockierter Zufahrtsstraßen nicht rechtzeitig am Veranstaltungsort ankommen können.\n\nWeidel ist eine Ausnahmeerscheinung in der AfD\n\nDie Partei- und Fraktionschefin ist seit Jahren eines der\nbekanntesten Gesichter der AfD. Als offen homosexuelle Politikerin, die mit\nihrer Lebenspartnerin in der Schweiz zwei Söhne großzieht, ist Weidel in ihrer\nPartei eine Ausnahmeerscheinung. Insbesondere, weil die AfD für ein traditionelles Familienbild einsteht. Zudem ist sie eine der wenigen prominenten\nFrauen in der von Männern dominierten AfD.\nBei früheren Bundestagswahlen hatte die AfD auf die\nAufstellung eines eigenen Kanzlerkandidaten verzichtet. Weidel war aber bereits\n2017 und 2021 Teil eines Spitzenkandidaten-Duos für Bundestagswahlen. Parteichef Chrupalla hatte im September seinen Verzicht auf\neine Kanzlerkandidatur erklärt. Am heutigen Samstag bekräftigte er seine Unterstützung\nfür Weidels Kandidatur. &quot;Ich halte ihr den Rücken frei&quot;, sagte er.\n\nParteitag streamt auf X\n\nIn Umfragen rangiert die Partei derzeit auf Platz zwei\nhinter der Union. Aussicht auf eine Regierungsbeteiligung hat die AfD jedoch\nnicht, da bisher keine andere Partei mit ihr koalieren will.\nDen Parteitag streamt die AfD auf der Plattform X – wo der Stream von Tesla-Gründer Elon Musk geteilt wurde. Zwischenzeitlich schauen dort mehr als 1,4 Millionen Menschen zu, mehr als viermal so viele, wie die Partei Abonnenten auf der Plattform verzeichnet. Der US-Amerikaner unterstützt die Partei im Wahlkampf, unter anderem sprach er sich für sie in einem Gastbeitrag in der Welt am Sonntag aus , außerdem lud er Weidel zu einem Gespräch auf X ein , das weltweit gestreamt wurde."}, {"id": "s035", "summary": "Junge Erwachsene in Deutschland sind zunehmend von Armut bedroht, wie der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit zeigt: 25 Prozent der 18- bis 24-Jährigen und 21 Prozent der unter 18-Jährigen lebten 2023 nahe der Armutsgrenze. Wohnen ist dabei ein wichtiger Faktor, da insbesondere Studierende und Auszubildende von hohen Mieten betroffen sind: Jeder dritte Studierende und jeder zweite Auszubildende gibt mehr als 40 Prozent ihres Einkommens für den Wohnraum aus. Die Wohnungsnot trifft somit vermehrt junge Menschen, was zu wachsender Sorge und Unsicherheit führt.<ins> Kommunen könnten leer stehende Bürogebäude vorübergehend in kleine Wohnheime für Auszubildende umwandeln.<\/ins>", "original": "Junge Erwachsene in Deutschland sind zunehmend von Armut bedroht, wie der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit zeigt: 25 Prozent der 18- bis 24-Jährigen und 21 Prozent der unter 18-Jährigen lebten 2023 nahe der Armutsgrenze. Wohnen ist dabei ein wichtiger Faktor, da insbesondere Studierende und Auszubildende von hohen Mieten betroffen sind: Jeder dritte Studierende und jeder zweite Auszubildende gibt mehr als 40 Prozent ihres Einkommens für den Wohnraum aus. Die Wohnungsnot trifft somit vermehrt junge Menschen, was zu wachsender Sorge und Unsicherheit führt.", "title": "", "article": "Etwa jeder vierte junge Erwachsene in Deutschland ist armutsgefährdet . Zu diesem Ergebnis kommt der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit. Demnach lag die sogenannte Armutsgefährdungsquote in der Altersgruppe von 18 bis 24 Jahren 2023 bei 25 Prozent.\nBei den unter 18-Jährigen lag sie etwas niedriger: Dort waren 21 Prozent von Armut bedroht. Die Zahlen decken sich in etwa mit denen des Monitors Jugendarmut 2022 . Dem zufolge waren 2021 25,5 Prozent der 18- bis 25-Jährigen sowie 20,8 Prozent der Minderjährigen von Armut bedroht.\nIn die Kategorie Armut fallen Menschen, die mit weniger als 60 Prozent des mittleren Einkommens auskommen müssen. Das traf deutschlandweit auf rund zwölf Millionen Menschen zu. Nach Abzug von Steuern und Sozialabgaben lag das mittlere Einkommen für eine alleinlebende Person 2023 bei 1.310 Euro monatlich.\n\nWohnen birgt Armutsrisiko\n\nArmut geht laut dem Verband häufig mit Ängsten einher. Demnach sorgen sich 54 Prozent der Jugendlichen wegen hoher Mieten . Vor allem Studierende und Auszubildende fallen in die Risikogruppe . 50 Prozent der Auszubildenden sowie jeder dritte Studierende galten 2023 als &quot;durch Wohnkosten überlastet&quot;, mussten also mehr als 40 Prozent ihres Einkommens für den Wohnraum aufbringen.\nDie Wohnungsnot betrifft somit häufig junge Menschen. Dem Bericht zufolge waren 40 Prozent aller Wohnungslosen, die 2024 in einer Einrichtung untergebracht wurden, jünger als 25 Jahre. Die Bundesgemeinschaft wertet für den Bericht unter anderem vorliegende Daten des Statistischen Bundesamtes und anderer Studien aus."}, {"id": "s049", "summary": "Nach den verheerenden Bränden in Los Angeles schätzt US-Präsident Joe Biden, dass der Wiederaufbau mehrere Milliarden Dollar kosten wird. Bisher sind mindestens 24 Menschen gestorben und über 180.000 mussten evakuiert werden. Sportteams und Musiker haben Großspenden angekündigt, während <del title=\"removed\">die<\/del><ins>der<\/ins> Staatsanwaltschaft gegen mutmaßliche Plünderer vorgeht. Die Bekanntgabe der Oscarnominierungen wurde aufgrund der Brände verschoben, die Oscarverleihung soll jedoch wie geplant stattfinden.", "original": "Nach den verheerenden Bränden in Los Angeles schätzt US-Präsident Joe Biden, dass der Wiederaufbau mehrere Milliarden Dollar kosten wird. Bisher sind mindestens 24 Menschen gestorben und über 180.000 mussten evakuiert werden. Sportteams und Musiker haben Großspenden angekündigt, während die Staatsanwaltschaft gegen mutmaßliche Plünderer vorgeht. Die Bekanntgabe der Oscarnominierungen wurde aufgrund der Brände verschoben, die Oscarverleihung soll jedoch wie geplant stattfinden.", "title": "", "article": "Für den Wiederaufbau nach der Brandkatastrophe von Los Angeles werden nach Einschätzung von US-Präsident Joe Biden mehrere Milliarden nötig sein . &quot;Es wird Dutzende Milliarden Dollar kosten, Los Angeles wieder dorthin zu bringen, wo es einmal war&quot;, sagte der scheidende Staatschef bei einem Treffen mit Vertretern des Katastrophenschutzes.\nUnterdessen bereitete sich die Stadt auf eine Rückkehr der heftigen Winde vor, die drohten, die Flammen erneut zu schüren. Bei den Großbränden sind bisher mindestens 24 Menschen gestorben . Mehr als 180.000 mussten zeitweilig ihre Häuser verlassen. Rund 92.000 Anwohner können auch sieben Tage nach Ausbruch der ersten Feuer bislang nicht in ihr Zuhause zurückkehren.\n\nSportteams und Musiker kündigen Großspenden an\n\nZur Unterstützung der Brandopfer wollen die großen Sportteams aus der Metropole insgesamt acht Millionen US-Dollar spenden. Zudem sollen von den verheerenden Bränden betroffene Menschen an drei Stadien in der Stadt Sachspenden entgegennehmen können. Neben diesen vier Teams engagieren sich auch die Basketball-Teams der Lakers, Clippers und Sparks, die NHL-Mannschaften Kings und Ducks, die Angels als weiteres MLB-Team sowie die Fußballmannschaften von Angel City FC und LA Galaxy. Die Heavy-Metal-Band Metallica kündigte zudem an, 500.000 US-Dollar für die Opfer der Feuerkatastrophe zu spenden.\nDie Staatsanwaltschaft in Los Angeles geht derweil gegen mutmaßliche Plünderer und Einbrecher in den von Feuern betroffenen Gebieten vor. Gegen zehn festgenommene Verdächtige sei Anklage erhoben worden, teilte Bezirksstaatsanwalt Nathan Hochman auf einer Pressekonferenz mit. Wer die &quot;tragische&quot; Situation der Feuerkatastrophe für sich ausnutze, müsse mit schwerstmöglicher Bestrafung rechnen.\nIn neun Fällen drehen sich die Vorwürfe um Einbrüche und Plünderungen von Häusern in Evakuierungszonen. Zwei der Angeklagten sollen zusammen Diebesgut im Wert von mehr als 200.000 Dollar mitgenommen haben. Beide seien vorbestraft, daher drohten im Falle einer Verurteilung langjährige Haftstrafen, sagte Hochman. Ein Mann wurde wegen Brandstiftung angeklagt. Er soll in einem Park in der Stadt Azusa östlich von Pasadena versucht haben, einen umgefallenen Baum anzuzünden. Bei einer Verurteilung drohen ihm neun Jahre Haft, wie die Behörden mitteilten.\n\nNominierungen für Oscars werden später bekannt gegeben\n\nWegen der Waldbrände wurde auch die Bekanntgabe der Oscarnominierungen um fast eine Woche verschoben. Als neuer Termin wurde nun der 23. Januar festgelegt, teilte die Oscarakademie mit. &quot;Wir alle sind erschüttert über die Auswirkungen der Feuer und die erheblichen Verluste, die so viele in unserer Gemeinde hinnehmen müssen&quot;, sagten Academy-Chef und Academy-Präsidentin Janet Yang in einer Stellungnahme. Die 97. Oscarverleihung soll aber nach aktuellem Stand wie geplant am 2. März im Dolby Theatre über die Bühne gehen."}, {"id": "s045", "summary": "Apple wehrt sich gegen Aktionärsforderung zur Abschaffung von Diversitätsprogrammen. Der Konzern ruft seine Anteilseigner auf, bei der Hauptversammlung gegen einen entsprechenden Antrag zu stimmen. In den USA haben verschiedene Unternehmen in den letzten Monaten ihre Programme für Vielfalt, Gleichberechtigung und Inklusion (DEI) gestrichen oder zurückgefahren. Die Apple-Aktionäre argumentieren, dass die Diversitätsvorgaben Diskriminierung von Beschäftigten und Klagen nach sich ziehen können. Sie berufen sich dabei auf zwei Urteile des obersten Gerichts der USA. Apple betont <del title=\"removed\">jedoch,<\/del><ins>deshalb,<\/ins> dass der Vorschlag ein unzulässiger Eingriff ins Tagesgeschäft des Unternehmens sei und man über eingespielte Verfahren verfüge, um rechtliche Risiken zu minimieren.", "original": "Apple wehrt sich gegen Aktionärsforderung zur Abschaffung von Diversitätsprogrammen. Der Konzern ruft seine Anteilseigner auf, bei der Hauptversammlung gegen einen entsprechenden Antrag zu stimmen. In den USA haben verschiedene Unternehmen in den letzten Monaten ihre Programme für Vielfalt, Gleichberechtigung und Inklusion (DEI) gestrichen oder zurückgefahren. Die Apple-Aktionäre argumentieren, dass die Diversitätsvorgaben Diskriminierung von Beschäftigten und Klagen nach sich ziehen können. Sie berufen sich dabei auf zwei Urteile des obersten Gerichts der USA. Apple betont jedoch, dass der Vorschlag ein unzulässiger Eingriff ins Tagesgeschäft des Unternehmens sei und man über eingespielte Verfahren verfüge, um rechtliche Risiken zu minimieren.", "title": "Apple verteidigt Diversitätsinitiativen", "article": "Der Apple-Konzern stellt sich gegen eine Aktionärsforderung, die Diversitätsprogramme zu beenden. Apple rief die Anteilseignerinnen auf, bei der Ende Februar \nanstehenden Hauptversammlung gegen den entsprechenden Antrag zu stimmen.\nIn den vergangenen Monaten schafften verschiedene US-Unternehmen ihre \nProgramme für Vielfalt, Gleichberechtigung und Inklusion (&quot;Diversity, \nEquity and Inclusion&quot;, DEI) unter ihren Beschäftigten ab oder fuhren diese stark zurück.\nDie Apple-Aktionäre begründeten ihren Antrag damit, dass die \nDiversitätsvorgaben zur Diskriminierung von Beschäftigten und Klagen \nführen können. Dabei verwiesen sie auf zwei Urteile des obersten Gerichts der USA.\nApple teilte mit, der \nVorschlag sei ein unzulässiger Eingriff ins Tagesgeschäft des \nUnternehmens. Was die rechtlichen Risiken angehe, habe der Konzern \neingespielte Verfahren, um diese zu minimieren.\nVor Kurzem gab der Facebook-Konzern Meta bekannt, seine Diversitätsprogramme zu beenden . Die Initiativen werden bereits seit Jahren heftig kritisiert von der Republikanischen Partei des künftigen Präsidenten Donald Trump . Ein \nausgesprochener Gegner davon ist auch der X-Besitzer und aktuelle\nTrump-Vertraute Elon Musk ."}, {"id": "s041", "summary": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise <d const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
