const NAME = "Anton";
const ITEMS = [{"id": "s051", "summary": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle.<ins> Das ZDF-Politbarometer ist eine regelmäßige politische Umfrage des Fernsehsenders ZDF.<\/ins> Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "original": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle. Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s052", "summary": "Nach einer Serie von Niederlagen wurde Nuri Şahin als Trainer beim BVB entlassen. Borussia Dortmund bestätigte die Entscheidung und wird vorerst U19-Trainer Mike Tullberg als Interimscoach einsetzen. Der Verein steckt in einer sportlichen Krise, rangiert in der Bundesliga auf Platz zehn und ist sieben Punkte von einem Champions-League-Platz entfernt. Şahin war der achte Trainer seit 2015 und hatte zuvor keine Erfahrung als Cheftrainer. Kritik gibt es auch am Sportdirektor Kehl, dessen Vertrag kürzlich bis 2027 verlängert wurde.<ins> Das Louvre in Paris präsentiert ab kommendem Monat eine umfassende Ausstellung zur Renaissance, die mehr als zweihundert Gemälde und Skulpturen aus ganz Europa vereint und restaurierte Meisterwerke erstmals öffentlich zeigt.<\/ins>", "original": "Nach einer Serie von Niederlagen wurde Nuri Şahin als Trainer beim BVB entlassen. Borussia Dortmund bestätigte die Entscheidung und wird vorerst U19-Trainer Mike Tullberg als Interimscoach einsetzen. Der Verein steckt in einer sportlichen Krise, rangiert in der Bundesliga auf Platz zehn und ist sieben Punkte von einem Champions-League-Platz entfernt. Şahin war der achte Trainer seit 2015 und hatte zuvor keine Erfahrung als Cheftrainer. Kritik gibt es auch am Sportdirektor Kehl, dessen Vertrag kürzlich bis 2027 verlängert wurde.", "title": "", "article": "Nuri Şahin ist nicht länger Trainer beim BVB. Nach einer Reihe von Niederlagen des Vereins wurde er entlassen. Borussia Dortmund bestätigte damit entsprechende Berichte der Nachrichtenagentur SID und der Sport-Bild . Die Vereinsführung habe &quot;leider den Glauben daran verloren, in der gegenwärtigen Konstellation noch unsere sportlichen Ziele erreichen zu können&quot;. Şahins Amtszeit endet somit nach sieben Monaten. Wie der BVB später mitteilte , wird U19-Trainer Mike Tullberg die Mannschaft zunächst als Interimscoach beim Spiel gegen Werder Bremen am Samstag betreuen.\nBorussia Dortmund steckt derzeit in einer sportlichen Krise . Zuletzt erlitt der Verein vier Niederlagen in Serie. In der Bundesliga rangiert der BVB derzeit auf Platz zehn und ist mit 25 Zählern sieben Punkte von einem Champions-League-Platz entfernt.\nAm Dienstagabend hatte der BVB in der Champions League nach einer Führung gegen den FC Bologna innerhalb von 88 Sekunden zwei Gegentore kassiert und die Partie verloren. Daraufhin kündigten Kehl und Sportgeschäftsführer Lars Ricken ein Treffen mit Vereinsboss Hans-Joachim Watzke und Şahin an, um zu entscheiden, &quot;wie wir weitermachen&quot;.\n\nAchter Trainer in zehn Jahren\n\n&quot;Diese Entscheidung tut mir auch persönlich weh, aber sie war nach dem Spiel in Bologna nicht mehr vermeidbar&quot;, sagte Ricken zur Trennung.  &quot;Leider haben wir es nicht geschafft, den sportlichen Ambitionen von Borussia Dortmund in dieser Saison zum jetzigen Zeitpunkt gerecht zu werden&quot;, sagte Şahin laut der Mitteilung des BVB. &quot;Ich wünsche diesem besonderen Verein alles Gute.&quot;\nŞahin war zwischen 2005 und 2011 Mittelfeldspieler beim BVB und wurde im vergangenen Jahr zunächst Assistenz-, ab Juli Cheftrainer . Zuvor trainierte er den türkischen Verein Antalyaspor, weitere Erfahrungen als Trainer hatte er nicht. Mit seiner Entlassung setzt sich die Serie häufiger Trainerwechsel bei dem Verein fort: Şahin war der achte Trainer seit 2015, als Jürgen Klopp den BVB verließ .\n\nVertrag mit Sportdirektor Kehl bis 2027 verlängert\n\nIm Fokus der Kritik stand Şahin bereits im vergangenen Oktober. Zwischenzeitlich konnte der BVB sich stabilisieren, auch in der Champions League besteht noch eine Chance auf das Achtelfinale. Doch der Start in das Fußballjahr 2025 missglückte komplett: Zunächst verloren die Borussen mit 2:3 gegen Bayer Leverkusen, danach beim Aufsteiger Holstein Kiel mit 2:4 und am vergangenen Freitag in Frankfurt mit 0:2 .\nKritik gibt es dabei nicht nur am entlassenen Trainer, sondern auch am Sportdirektor Kehl. In einer Umbruchphase nach Abschieden langjähriger Spieler wie Mats Hummels und Marco Reus übergab er mit Şahin einem unerfahrenen Trainer die Führung einer ebenfalls unerfahrenen Mannschaft . Zudem gilt Kehls Kader als zu klein und unausgewogen. Dennoch hat der Verein den Vertrag mit Kehl erst vor zwei Wochen bis 2027 verlängert."}, {"id": "s053", "summary": "Die ZEIT startet ab März 2025 exklusive monatliche Folgen von &quot;Verbrechen&quot; für Abonnenten auf www.zeit.de, Apple Podcasts und Spotify.\n\nIm März erscheint erstmals eine exklusive Verbrechen-Dokuserie über mehrere Folgen hinweg, mit weiteren Serien in Planung.\n\nAbonnenten behalten vollständigen Zugriff auf das Verbrechen-Archiv, da alle vor April 2021 erschienenen Folgen ab sofort nur noch für Abonnenten zugänglich sind.\n\nEin kostenloses digitales Probeabo der ZEIT ist hier verfügbar. Bereits bestehende Abonennten können ihr Abo mit Apple Podcasts oder Spotify verbinden.\n\nWer kein Abo abschließt, findet weiterhin kostenfrei alle zwei Wochen eine neue Folge von &quot;Verbrechen&quot; in seinem Podcast-Feed.<ins>\n\nDer Deutsche Wetterdienst hat für das kommende Wochenende verbreitet Sonnenschein und Temperaturen bis zu 22 Grad vorhergesagt.<\/ins>", "original": "Die ZEIT startet ab März 2025 exklusive monatliche Folgen von &quot;Verbrechen&quot; für Abonnenten auf www.zeit.de, Apple Podcasts und Spotify.\n\nIm März erscheint erstmals eine exklusive Verbrechen-Dokuserie über mehrere Folgen hinweg, mit weiteren Serien in Planung.\n\nAbonnenten behalten vollständigen Zugriff auf das Verbrechen-Archiv, da alle vor April 2021 erschienenen Folgen ab sofort nur noch für Abonnenten zugänglich sind.\n\nEin kostenloses digitales Probeabo der ZEIT ist hier verfügbar. Bereits bestehende Abonennten können ihr Abo mit Apple Podcasts oder Spotify verbinden.\n\nWer kein Abo abschließt, findet weiterhin kostenfrei alle zwei Wochen eine neue Folge von &quot;Verbrechen&quot; in seinem Podcast-Feed.", "title": "", "article": "Ab März 2025 wird exklusiv für Abonnentinnen und Abonnenten jeden Monat eine zusätzliche Folge von Verbrechen erscheinen, zu hören auf www.zeit.de , auf Apple Podcasts oder auf Spotify. Im März erscheint, ebenfalls exklusiv für Abonnentinnen und Abonnenten, die erste Verbrechen -Dokuserie, in der wir einen besonders spannenden Fall über mehrere Folgen erzählen. Weitere Serien werden folgen.\nMit einem Abo behaltet ihr außerdem vollen Zugriff auf das Verbrechen -Archiv. Folgen, die vor April 2021 erschienen sind, sind nämlich ab sofort nur noch exklusiv für Abonentinnen und Abonnenten zugänglich.\nEin kostenloses digitales Probeabo der ZEIT könnt ihr hier abschließen .\nWenn ihr bereits ein Abo habt, könnt ihr es mit Apple Podcasts oder Spotify verbinden. Wie das geht, könnt ihr hier nachlesen .\nWer kein Abo abschließt, findet auch in Zukunft wie gewohnt kostenfrei alle zwei Wochen eine neue Folge Verbrechen in seinem Podcast-Feed.\nMit allen weiteren Fragen wendet euch gerne an kontakt@zeit.de"}, {"id": "s035", "summary": "Junge Erwachsene in Deutschland sind zunehmend von Armut bedroht, wie der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit zeigt: 25 Prozent der 18- bis 24-Jährigen und 21 Prozent der unter 18-Jährigen lebten 2023 nahe der Armutsgrenze. Wohnen ist dabei ein wichtiger Faktor, da insbesondere Studierende und Auszubildende von hohen Mieten betroffen sind: Jeder dritte Studierende und jeder zweite Auszubildende gibt mehr als 40 Prozent ihres Einkommens für den Wohnraum aus. Die Wohnungsnot trifft somit vermehrt junge Menschen, was zu wachsender Sorge und Unsicherheit führt.<ins> Kommunen könnten leer stehende Bürogebäude vorübergehend in kleine Wohnheime für Auszubildende umwandeln.<\/ins>", "original": "Junge Erwachsene in Deutschland sind zunehmend von Armut bedroht, wie der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit zeigt: 25 Prozent der 18- bis 24-Jährigen und 21 Prozent der unter 18-Jährigen lebten 2023 nahe der Armutsgrenze. Wohnen ist dabei ein wichtiger Faktor, da insbesondere Studierende und Auszubildende von hohen Mieten betroffen sind: Jeder dritte Studierende und jeder zweite Auszubildende gibt mehr als 40 Prozent ihres Einkommens für den Wohnraum aus. Die Wohnungsnot trifft somit vermehrt junge Menschen, was zu wachsender Sorge und Unsicherheit führt.", "title": "", "article": "Etwa jeder vierte junge Erwachsene in Deutschland ist armutsgefährdet . Zu diesem Ergebnis kommt der Monitor Jugendarmut der Bundesarbeitsgemeinschaft Katholische Jugendsozialarbeit. Demnach lag die sogenannte Armutsgefährdungsquote in der Altersgruppe von 18 bis 24 Jahren 2023 bei 25 Prozent.\nBei den unter 18-Jährigen lag sie etwas niedriger: Dort waren 21 Prozent von Armut bedroht. Die Zahlen decken sich in etwa mit denen des Monitors Jugendarmut 2022 . Dem zufolge waren 2021 25,5 Prozent der 18- bis 25-Jährigen sowie 20,8 Prozent der Minderjährigen von Armut bedroht.\nIn die Kategorie Armut fallen Menschen, die mit weniger als 60 Prozent des mittleren Einkommens auskommen müssen. Das traf deutschlandweit auf rund zwölf Millionen Menschen zu. Nach Abzug von Steuern und Sozialabgaben lag das mittlere Einkommen für eine alleinlebende Person 2023 bei 1.310 Euro monatlich.\n\nWohnen birgt Armutsrisiko\n\nArmut geht laut dem Verband häufig mit Ängsten einher. Demnach sorgen sich 54 Prozent der Jugendlichen wegen hoher Mieten . Vor allem Studierende und Auszubildende fallen in die Risikogruppe . 50 Prozent der Auszubildenden sowie jeder dritte Studierende galten 2023 als &quot;durch Wohnkosten überlastet&quot;, mussten also mehr als 40 Prozent ihres Einkommens für den Wohnraum aufbringen.\nDie Wohnungsnot betrifft somit häufig junge Menschen. Dem Bericht zufolge waren 40 Prozent aller Wohnungslosen, die 2024 in einer Einrichtung untergebracht wurden, jünger als 25 Jahre. Die Bundesgemeinschaft wertet für den Bericht unter anderem vorliegende Daten des Statistischen Bundesamtes und anderer Studien aus."}, {"id": "s056", "summary": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor <del title=\"removed\">vier<\/del><ins>fünf<\/ins> Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "original": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "title": "Anführer ultrarechter Gruppen aus Gefängnissen entlassen", "article": "Donald Trump hat seinen Amtseid als 47. Präsident der Vereinigten Staaten abgelegt. Es ist bereits seine zweite Amtszeit, er war auch von 2017 bis 2021 US-Präsident.\nDie Zeremonie fand wegen frostiger Temperaturen im Kapitol statt. Den Sitz des US-Kongresses hatten wütende Trump-Anhänger vor vier Jahren gestürmt.\nKurz nach seinem Amtsantritt unterzeichnete Trump zahlreiche Dekrete , die unter anderem eine Begnadigung der Kapitolstürmer, eine Abschaffung des Birthrights und einen Austritt aus dem Pariser Klimaabkommen vorsehen.\nAlle Artikel zum Thema finden Sie auf unserer Themenseite zum neuen US-Präsidenten .\nNeben eigenen Recherchen verwenden wir auch Material der Nachrichtenagenturen dpa, AP, AFP, KNA und Reuters."}, {"id": "s039", "summary": "<del title=\"removed\">Svenja<\/del><ins>Annalena<\/ins> <del title=\"removed\">Schulze,<\/del><ins>Baerbock,<\/ins> Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "original": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "title": "Entwicklungsministerin Schulze sagt Syrien deutsche Unterstützung zu", "article": "Bundesentwicklungsministerin Svenja Schulze (SPD) hat bei\neinem Besuch in Syrien deutsche Unterstützung für\neine &quot;friedliche und stabile Entwicklung&quot; des Landes angekündigt.\nSchulze traf sich am Morgen in Damaskus mit Vertretern der\nÜbergangsregierung, Ärzten und dem De-facto-Gesundheitsminister Maher al-Scharaa,\neinem Bruder des neuen Machthabers Ahmed al-Scharaa. Die Ministerin kündigte\nzudem neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern an.\nSchulzes Ministerium sieht große Herausforderungen im traditionell eigentlich sehr starken syrischen Gesundheitswesen. Das hat mit der gezielten Bombardierung von Krankenhäusern in ehemaligen Rebellengebieten während des Bürgerkriegs zu tun. Außerdem fehlt durch Flucht und Vertreibung vielerorts das medizinische Personal. Laut Entwicklungsministerium hat mehr als die Hälfte des Gesundheitspersonals das Land verlassen, mehr als ein Drittel der\nKrankenhäuser sei nicht mehr funktionstüchtig.\nUm das Gesundheitssystem zu unterstützen, soll es sogenannte Klinikpartnerschaften geben, die Deutschland bereits mit 52 Ländern finanziert. Dabei geht es um den Austausch von Wissen und Erfahrung. Ärzte aus Deutschland sollen nach Syrien reisen, um dort Fortbildungsmaßnahmen anzubieten oder mit lokalen Kollegen den Einsatz neuer Geräte zu üben. Auch Fortbildungen in Deutschland sind möglich. Eine Auftaktkonferenz für die Klinikpartnerschaften soll am 12. Februar in Berlin stattfinden.\n\nDeutschland auf syrisches Fachpersonal &quot;angewiesen&quot;\n\nAuf ihrer Reise wird Schulze von einem in Deutschland arbeitenden syrischen Arzt begleitet. In den kommenden Monaten dürfte es auch um die Frage gehen, ob syrische Ärztinnen und Ärzte aus Deutschland wieder nach Syrien zurückkehren sollen. Regierungsangaben zufolge gibt es bundesweit etwa 5.800 Ärztinnen und über 2.000 Pflegekräfte mit syrischem Pass. Viele hätten sich bereits beim Entwicklungsministerium gemeldet, weil\nsie helfen wollten.\nEs sei verständlich, dass die neue Regierung in Syrien die Fachkräfte gern zurückholen wolle, sagte Schulze. &quot;Aber auch Deutschland hat ein\nInteresse, diese Menschen zu halten, auf die wir gerade in\nunserem Gesundheitssystem angewiesen sind.&quot; Durch die Klinikpartnerschaften wolle sie ermöglichen, &quot;dass beides geht: sich von Deutschland aus für Syrien engagieren&quot;. Letztendlich sei aber vor allem entscheidend, was jede einzelne Fachkraft selbst für ihr Leben wolle.\nSchulze ist die zweite deutsche Ministerin, die nach dem Sturz des langjährigen Machthabers Baschar al-Assad nach Syrien reist. Anfang des Jahres war Außenministerin Annalena Baerbock (Grüne) nach Damaskus geflogen und hatte dort mit Vertretern der neuen Übergangsregierung beraten. Dabei hatte sie wiederholt hervorgehoben, dass unter der neuen Regierung der Schutz aller religiösen und ethnischen Minderheiten gewahrt werden müsse."}, {"id": "s033", "summary": "Donald Trump kündigt als designierter US-Präsident die Gründung einer neuen Bundesbehörde zur Erhebung von Zöllen und anderen Einkünften aus dem Ausland an, um die amerikanische Wirtschaft zu stärken. Die neue Behörde soll &quot;External Revenue Service&quot; heißen und direkt nach seiner Amtseinführung per Dekret geschaffen werden. Trump hatte bereits im Wahlkampf neue Zölle angekündigt, darunter zehn Prozent auf weltweite Einfuhren in die USA und bis zu 60 Prozent für Produkte aus China. Diese Pläne könnten den Welthandel stark <del title=\"removed\">belasten.<\/del><ins>entlasten.<\/ins>", "original": "Donald Trump kündigt als designierter US-Präsident die Gründung einer neuen Bundesbehörde zur Erhebung von Zöllen und anderen Einkünften aus dem Ausland an, um die amerikanische Wirtschaft zu stärken. Die neue Behörde soll &quot;External Revenue Service&quot; heißen und direkt nach seiner Amtseinführung per Dekret geschaffen werden. Trump hatte bereits im Wahlkampf neue Zölle angekündigt, darunter zehn Prozent auf weltweite Einfuhren in die USA und bis zu 60 Prozent für Produkte aus China. Diese Pläne könnten den Welthandel stark belasten.", "title": "", "article": "Der designierte US-Präsident Donald\nTrump hat die Gründung einer neuen Bundesbehörde zur Erhebung\nvon Zöllen und anderen Einkünften aus dem Ausland angekündigt. Diese soll &quot;External Revenue Service&quot; (etwa: Behörde für\nexterne Einnahmen) heißen. Trump will die neue Behörde per Dekret direkt nach seiner\nAmtseinführung schaffen, schrieb er im sozialen Netzwerk Truth Social. Eine neue Zollpolitik hatte Trump bereits mehrmals angekündigt.\n&quot;Die\namerikanische Wirtschaft hat der Welt durch lasche und\nerbärmlich schwache Handelsabkommen Wachstum und Wohlstand\nbeschert, während wir uns selbst besteuert haben&quot;, schrieb Trump.\nEs sei Zeit, dass sich das ändere. Nun würden diejenigen\nbelastet, die an den USA verdient hätten und nun\nihren gerechten Anteil zahlen sollten. Weitere Einzelheiten wurden nicht genannt.\nTrump übernimmt am 20. Januar das Amt des US-Präsidenten. Schon im Wahlkampf hatte er neue Zölle angekündigt. Zehn Prozent will er nach eigener Aussage auf weltweite\nEinfuhren in die USA erheben, für Produkte aus China sogar 60 Prozent. Kanada und Mexiko sollen Trump zufolge\n25 Prozent zahlen , solange sie seiner Meinung nach nicht ausreichend gegen Migranten\nund den Drogenhandel an den US-Grenzen vorgehen. Das dürfte den Welthandel sehr belasten.\nAuch der Europäischen Union (EU) drohte Trump hohe Zölle an. Die EU solle mehr amerikanisches Öl und Gas einführen, sonst drohten zusätzliche Zölle, hatte Trump im vergangenen Jahr gesagt. Die EU will nach eigener Aussage einen Wirtschaftskrieg mit den USA vermeiden , kündigte aber an, auf hohe Zölle ebenfalls mit neuen Zöllen reagieren zu können. Diese könnten zum Beispiel US-Digitalkonzerne treffen . In Europa und vor allem in Deutschland könnte die Autoindustrie im Fokus sein."}, {"id": "s057", "summary": "Donald Trump wurde als 47. Präsident der Vereinigten Staaten vereidigt, zusammen mit seinem Vizepräsidenten J. D. Vance.<del title=\"removed\"> In seiner Antrittsrede versprach er, Amerika an erste Stelle zu setzen und das Land wieder stolz, prosperierend und frei zu machen.<\/del> Trump kündigte mehr als 100 präsidentielle Dekrete an, darunter die Umbenennung des Golf von Mexiko in Golf von Amerika und die Stärkung des Militärs. Die Amtseinführung fand aufgrund der Kälte im Kapitol statt, wo Trump sein düsteres Bild der USA zeichnete und versprach, Amerikas Niedergang zu beenden.", "original": "Donald Trump wurde als 47. Präsident der Vereinigten Staaten vereidigt, zusammen mit seinem Vizepräsidenten J. D. Vance. In seiner Antrittsrede versprach er, Amerika an erste Stelle zu setzen und das Land wieder stolz, prosperierend und frei zu machen. Trump kündigte mehr als 100 präsidentielle Dekrete an, darunter die Umbenennung des Golf von Mexiko in Golf von Amerika und die Stärkung des Militärs. Die Amtseinführung fand aufgrund der Kälte im Kapitol statt, wo Trump sein düsteres Bild der USA zeichnete und versprach, Amerikas Niedergang zu beenden.", "title": "", "article": "Donald Trump ist als 47. Präsident der Vereinigten Staaten\nvereidigt worden. In der Kuppelhalle des Kapitols legte der 78-Jährige den Amtseid an.\nEs ist seine zweite Amtszeit: Schon von 2017 bis 2021 war er Präsident der USA. Zuvor wurde auch sein Vizepräsident, J. D. Vance , vereidigt.\n&quot;Das goldene Zeitalter Amerikas beginnt genau jetzt&quot;, sagte Trump in seiner Antrittsrede. Zu dessen Beginn wiederholte er sein Wahlkampfversprechen, &quot;Amerika an erste \nStelle&quot; zu setzen. Er werde die &quot;Souveränität&quot; des Landes \nwiederherstellen, ebenso wie den  internationalen Respekt für das Land. Seine oberste Priorität sei es, das Land wieder &quot;stolz, prosperierend und frei&quot; zu machen.\nDonald Trump zeichnete dabei ein düsteres Bild der USA.  Er sprach von einer Krise des Vertrauens, einer korrupten Elite und einer Regierung, die die Probleme des Landes nicht mehr lösen könne. All das werde sich nun jedoch ändern: &quot;Amerikas Niedergang ist jetzt vorbei&quot;. Sein Vorgänger Joe Biden und die ehemalige Vizepräsidentin Kamala Harris saßen während der Rede hinter dem Präsidenten.\n\nMehr als 100 Dekrete an Tag eins\n\nTrump nannte in seiner Rede einige der Ankündigungen , die er auch zuvor schon versprochen hatte. Der Golf von Mexiko soll etwa in Golf von Amerika umbenannt\nwerden. Das Militär will Trump zudem stärken. Amerikanische Astronauten sollen außerdem\ndie Flagge der USA auf dem Mars platzieren.\nDafür will Trump noch am ersten Tag seiner Amtszeit zahlreiche präsidentielle Dekrete unterzeichnen. Mehr als 100 solcher executive orders sollen am ersten Tag seiner Amtszeit in Kraft treten , hatte Trump noch vor der Amtseinführung angekündigt.\n\nAmtseinführung ins Kapitol verlegt\n\nWegen Kälte fand die Amtseinführung nicht wie üblich draußen vor dem Kapitol\ngefeiert, sondern wurde ins Innere des Gebäudes verlegt. Offizielles Public\nViewing fand in Washington, D. C., deshalb unter anderem in der Capital One\nArena statt.\nDer Republikaner hatte die Wahl im November 2024 entgegen Vorhersagen\ndeutlich gewonnen. Trump versammelte 312 Wahlleute hinter sich , 270 waren für\neinen Wahlsieg notwendig. Kamala Harris, die für die Demokraten antrat, kam auf\n226 Wahlleute.\nAlle Entwicklungen zur Amtseinführung des 47. Präsidenten lesen\nSie in unserem Liveblog."}, {"id": "s038", "summary": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte <del title=\"removed\">Syrien<\/del><ins>Jordanien<\/ins> und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "original": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "title": "Entwicklungsministerin Schulze sagt Syrien deutsche Unterstützung zu", "article": "Bundesentwicklungsministerin Svenja Schulze (SPD) hat bei\neinem Besuch in Syrien deutsche Unterstützung für\neine &quot;friedliche und stabile Entwicklung&quot; des Landes angekündigt.\nSchulze traf sich am Morgen in Damaskus mit Vertretern der\nÜbergangsregierung, Ärzten und dem De-facto-Gesundheitsminister Maher al-Scharaa,\neinem Bruder des neuen Machthabers Ahmed al-Scharaa. Die Ministerin kündigte\nzudem neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern an.\nSchulzes Ministerium sieht große Herausforderungen im traditionell eigentlich sehr starken syrischen Gesundheitswesen. Das hat mit der gezielten Bombardierung von Krankenhäusern in ehemaligen Rebellengebieten während des Bürgerkriegs zu tun. Außerdem fehlt durch Flucht und Vertreibung vielerorts das medizinische Personal. Laut Entwicklungsministerium hat mehr als die Hälfte des Gesundheitspersonals das Land verlassen, mehr als ein Drittel der\nKrankenhäuser sei nicht mehr funktionstüchtig.\nUm das Gesundheitssystem zu unterstützen, soll es sogenannte Klinikpartnerschaften geben, die Deutschland bereits mit 52 Ländern finanziert. Dabei geht es um den Austausch von Wissen und Erfahrung. Ärzte aus Deutschland sollen nach Syrien reisen, um dort Fortbildungsmaßnahmen anzubieten oder mit lokalen Kollegen den Einsatz neuer Geräte zu üben. Auch Fortbildungen in Deutschland sind möglich. Eine Auftaktkonferenz für die Klinikpartnerschaften soll am 12. Februar in Berlin stattfinden.\n\nDeutschland auf syrisches Fachpersonal &quot;angewiesen&quot;\n\nAuf ihrer Reise wird Schulze von einem in Deutschland arbeitenden syrischen Arzt begleitet. In den kommenden Monaten dürfte es auch um die Frage gehen, ob syrische Ärztinnen und Ärzte aus Deutschland wieder nach Syrien zurückkehren sollen. Regierungsangaben zufolge gibt es bundesweit etwa 5.800 Ärztinnen und über 2.000 Pflegekräfte mit syrischem Pass. Viele hätten sich bereits beim Entwicklungsministerium gemeldet, weil\nsie helfen wollten.\nEs sei verständlich, dass die neue Regierung in Syrien die Fachkräfte gern zurückholen wolle, sagte Schulze. &quot;Aber auch Deutschland hat ein\nInteresse, diese Menschen zu halten, auf die wir gerade in\nunserem Gesundheitssystem angewiesen sind.&quot; Durch die Klinikpartnerschaften wolle sie ermöglichen, &quot;dass beides geht: sich von Deutschland aus für Syrien engagieren&quot;. Letztendlich sei aber vor allem entscheidend, was jede einzelne Fachkraft selbst für ihr Leben wolle.\nSchulze ist die zweite deutsche Ministerin, die nach dem Sturz des langjährigen Machthabers Baschar al-Assad nach Syrien reist. Anfang des Jahres war Außenministerin Annalena Baerbock (Grüne) nach Damaskus geflogen und hatte dort mit Vertretern der neuen Übergangsregierung beraten. Dabei hatte sie wiederholt hervorgehoben, dass unter der neuen Regierung der Schutz aller religiösen und ethnischen Minderheiten gewahrt werden müsse."}, {"id": "s048", "summary": "Der Ausstoß klimaschädlicher Treibhausgase in der EU ist im vergangenen Jahr um sieben Prozent gesunken.\nDieser Rückgang von rund 3,4 Milliarden Tonnen Kohlendioxid entspricht einem Zehnjahreszeitraum von 18 Prozent.\nFast alle Wirtschaftszweige konnten zu diesem Ergebnis beitragen, mit Ausnahme des Transports und der Lagerung.\nDie größten Emissionsreduktionen wurden in den Bereichen Stromerzeugung (-43%) und Haushalten (-14%) erzielt.\nDie Emissionsintensität sank in einigen EU-Ländern wie Estland und Irland deutlich, während andere wie Österreich und Litauen nur geringe Fortschritte machten. Deutschland lag bei knapp 39 Prozent.<ins> Die Emissionsintensität gibt an, wie viel Treibhausgas im Verhältnis zur Wirtschaftsleistung ausgestoßen wird.<\/ins>", "original": "Der Ausstoß klimaschädlicher Treibhausgase in der EU ist im vergangenen Jahr um sieben Prozent gesunken.\nDieser Rückgang von rund 3,4 Milliarden Tonnen Kohlendioxid entspricht einem Zehnjahreszeitraum von 18 Prozent.\nFast alle Wirtschaftszweige konnten zu diesem Ergebnis beitragen, mit Ausnahme des Transports und der Lagerung.\nDie größten Emissionsreduktionen wurden in den Bereichen Stromerzeugung (-43%) und Haushalten (-14%) erzielt.\nDie Emissionsintensität sank in einigen EU-Ländern wie Estland und Irland deutlich, während andere wie Österreich und Litauen nur geringe Fortschritte machten. Deutschland lag bei knapp 39 Prozent.", "title": "", "article": "Der Ausstoß klimaschädlicher Treibhausgase in der EU ist im vergangenen Jahr um sieben Prozent im Vergleich zum Vorjahr gesunken. Das teilte das Statistikamt Eurostat in Luxemburg mit. Über den Zehnjahreszeitraum von 2013 bis 2023 betrug der Rückgang 18 Prozent. In absoluten Zahlen entsprach die Menge der im vergangenen Jahr ausgestoßenen Emissionen rund 3,4 Milliarden Tonnen Kohlendioxid .\nLaut Eurostat konnten fast alle Wirtschaftszweige dazu beitragen, mit Ausnahme von Transport und Lagerung. Am meisten gingen die Emissionen in den Bereichen Stromerzeugung, Gas- und Dampfversorgung sowie Klimatisierung zurück – und zwar um 43 Prozent. Zudem produzierten Haushalte in der EU 14 Prozent weniger Emissionen als noch vor zehn Jahren.\nEurostat erfasst außerdem die sogenannte Emissionsintensität, also wie viel Treibhausgas im Verhältnis zur Wirtschaftsleistung ausgestoßen wird. Der Wert gibt so Aufschluss über die Umwelteffizienz der \nwirtschaftlichen Produktion. Ein Rückgang der Emissionsintensität \nbedeutet, dass bei gleicher Wirtschaftsleistung weniger Treibhausgase \nausgestoßen werden.\nZwischen den EU-Ländern zeigten sich hier deutliche Unterschiede: \nWährend die Emissionsintensität in Estland um 61 Prozent und in Irland \num 50 Prozent sank, verringerte sie sich in Österreich und Litauen nur\n um 17 Prozent. Deutschland lag bei knapp 39 Prozent."}, {"id": "s031", "summary": "Die Bundestagsverwaltung prüft den geplanten Talk zwischen Elon Musk und AfD-Kanzlerkandidatin Alice Weidel auf X wegen möglicher Wahlkampfbeeinflussung und illegaler Parteispende.<ins> Eine Parteispende ist eine Geld- oder Sachzuwendung an eine politische Partei.<\/ins> Die Organisation Lobbycontrol wirft verdeckte Wahlkampfspenden vor, da das Gespräch eine höhere Reichweite als andere Beiträge erzielen könnte. Weidels Sprecher sieht darin ein legitimes, unabgesprochenes und offenes Gespräch. Der Experte Jan Penfrat vom Verband European Digital Rights (EDRi) meint, dass das Gespräch nur unter bestimmten Bedingungen gegen den europäischen Digital Services Act (DSA) verstoße. Bundeswirtschaftsminister Robert Habeck fordert Transparenz zu den Algorithmen von X bezüglich der Sichtbarkeit des Gesprächs.", "original": "Die Bundestagsverwaltung prüft den geplanten Talk zwischen Elon Musk und AfD-Kanzlerkandidatin Alice Weidel auf X wegen möglicher Wahlkampfbeeinflussung und illegaler Parteispende. Die Organisation Lobbycontrol wirft verdeckte Wahlkampfspenden vor, da das Gespräch eine höhere Reichweite als andere Beiträge erzielen könnte. Weidels Sprecher sieht darin ein legitimes, unabgesprochenes und offenes Gespräch. Der Experte Jan Penfrat vom Verband European Digital Rights (EDRi) meint, dass das Gespräch nur unter bestimmten Bedingungen gegen den europäischen Digital Services Act (DSA) verstoße. Bundeswirtschaftsminister Robert Habeck fordert Transparenz zu den Algorithmen von X bezüglich der Sichtbarkeit des Gesprächs.", "title": "", "article": "Die Bundestagsverwaltung beschäftigt sich mit dem geplanten Gespräch von Elon Musk mit der AfD-Kanzlerkandidatin Alice Weidel auf X. Sie wolle prüfen, ob es sich dabei um eine Beeinflussung des\nWahlkampfs und um eine illegale Parteispende handle, schrieb die Verwaltung. Zunächst\nhatte die Rheinische Post berichtet.\nDie Organisation Lobbycontrol hat den Vorwurf möglicher verdeckter Wahlkampfspenden erhoben . Das Gespräch werde auf X\nvoraussichtlich deutlich stärker verbreitet als Beiträge anderer\nNutzer, schrieb die Organisation. &quot;Insofern kann man hier durchaus von politischer Werbung\nsprechen, denn die Plattform X verkauft eine solche Reichweite\nnormalerweise für sehr viel Geld.&quot; Weidels Sprecher sagte, es sei ein legitimes &quot;unabgesprochenes\nund offenes Gespräch&quot;.\nDer Experte für die Regulierung von Onlineplattformen\nbeim Verband European Digital Rights (EDRi), Jan Penfrat, sagte, das Gespräch verstoße nur unter bestimmen Bedingungen gegen den europäischen Digital Services Act (DSA): Wenn Musk seine Plattform dazu nutzen würde, bestimmten politischen\nStimmen mehr Sichtbarkeit zu geben – oder wenn illegale Aussagen während des Gesprächs fallen würden.\n\nHabeck fordert Transparenz zu Algorithmen von X\n\nAuch Bundeswirtschaftsminister und Grünen-Kanzlerkandidat Robert Habeck sagte, besorgniserregend sei nicht das Gespräch an sich, sondern die Funktionsweise von X.  Dass Musk und Weidel miteinander redeten, sei ihm erstens egal und zweitens kein Problem, sagte er den Sendern RTL und ntv sowie der Welt. Wichtiger sei eine andere Frage: &quot;Sind die Algorithmen, die die Plattform X benutzt, so ausgerichtet, dass es einen einseitigen Vorteil für bestimmte Inhalte gibt&quot;, sagte er. Ob es um die Inhalte der AfD oder von Elon Musk gehe, sei dabei &quot;im Moment schwer auseinanderzuhalten&quot;.\nIn diesem Fall hätte die AfD einen &quot;geldwerten Vorteil&quot;, sagte Habeck. &quot;Das wäre dann Parteienfinanzierung, in diesem Fall wahrscheinlich illegale Parteienfinanzierung.&quot; Weiter forderte er, auch unabhängig vom Wahlkampf müsse transparent gemacht werden, mit welcher Logik Plattformen wie X funktionieren, die darüber entscheiden, was Nutzern prominent angezeigt werde.\nMusk und Weidel wollen an diesem Donnerstagabend auf X öffentlich miteinander sprechen. Dabei solle es um die aktuelle politische Lage\nmit Blick auf die Bundestagswahl am 23. Februar gehen . Musk wirbt seit einiger Zeit für die AfD und andere rechte Gruppierungen in\nEuropa ."}, {"id": "s037", "summary": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.<ins> Die katholische Kirche soll eine Liste mit Namen der Gefangenen vor der Freilassung öffentlich prüfen lassen.<\/ins>", "original": "Die Regierung in Havanna hat die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt, nachdem die USA angekündigt haben, Kuba von der Terrorliste zu streichen. Außenminister Rodríguez kritisierte die Entscheidung als zu spät und forderte ein Ende des US-Handelsembargos. Die Freilassung soll politische Gefangene betreffen, die bei regierungskritischen Protesten festgenommen wurden. Die katholische Kirche treibt das Abkommen voran, während Trump die Entscheidung von Biden rückgängig machen könnte. In Kuba wurden Hunderte Menschen nach friedlichen Protesten verhaftet, darunter auch der deutsche Staatsbürger Luis Frómeta Compte.", "title": "", "article": "Nach der Ankündigung eines US-Regierungsvertreters, Kuba von der US-Terrorliste zu streichen , hat die Regierung in Havanna die Freilassung von mehr als 550 Gefangenen in Aussicht gestellt.\nDie Entscheidung der Vereinigten Staaten sei ein Schritt in die richtige\n Richtung, komme aber zu spät, kritisierte Außenminister Bruno Rodríguez in einer Mitteilung . \nGleichzeitig forderte er ein Ende des US-Handelsembargos gegen Kuba , das seit 1962 in Kraft ist.\nWie der US-Regierungsvertreter mitgeteilt hatte, soll \ndiese &quot;Geste des guten Willens&quot; die Verhandlungen über die Freilassung \neiner &quot;bedeutenden Zahl politischer Gefangener&quot; befördern. Es bestehe die\n Hoffnung, dass die Freilassung noch vor dem Amtsantritt von Donald \nTrump am kommenden Montag erfolgen könne, dessen Republikanische Partei \ngegenüber den Behörden im kommunistischen Kuba traditionell eine harte \nLinie verfolgt.\nDie katholische Kirche treibe das Abkommen voran, das \nvor allem Menschen betrifft, die bei den regierungskritischen Protesten \nim Sommer 2021 in Kuba festgenommen wurden.\n\nTrump könnte die Entscheidung von Biden zurücknehmen\n\nVor vier Jahren hatte Trump \nKuba auf die US-Liste der Terrorunterstützer gesetzt, auf der auch \nSyrien, der Iran und Nordkorea verzeichnet sind. Nach seinem Amtsantritt\n könnte er die Entscheidung Bidens sofort wieder rückgängig machen.\n&quot;Kuba hätte niemals in die \nwillkürliche Liste der staatlichen Sponsoren des Terrorismus aufgenommen\n werden dürfen&quot;, schrieb Rodríguez auf der Plattform X. Die US-Politik \nder harten Sanktionen gegen Kuba habe schwerwiegende Folgen für die \nBevölkerung von elf Millionen Menschen, schade der Wirtschaft des \nInselstaates und fördere die Migration in die USA.\n\nKuba hatte Hunderte Menschen nach friedlichen Protesten verhaftet\n\nDie\n geplante Freilassung von Häftlingen, die wegen verschiedener Straftaten\n verurteilt worden waren, soll nach Angaben des kubanischen \nAußenministeriums schrittweise erfolgen. Wegen ihrer Teilnahme an \nfriedlichen Protesten sind Hunderte Menschen auf Kuba inhaftiert, unter ihnen auch der deutsche Staatsbürger Luis Frómeta Compte. Wer \nfreikommen dürfte, war zunächst unklar.\nNach offiziellen Angaben wurden in Kuba rund 500 Menschen wegen ihrer \nTeilnahme an den Protesten im Juli 2021 zu Haftstrafen \nverurteilt, die teils bis zu 25 Jahre betrugen. Es waren die größten \nProteste gegen die Regierung in Havanna seit der Kubanischen Revolution \n1959.\nAnfang Januar habe \nStaatspräsident Miguel Díaz-Canel Papst Franziskus in einem Schreiben \nüber die Entscheidung informiert, teilte die kubanische Regierung mit. \nDie Freilassungen seien im Geiste des von der katholischen Kirche \nausgerufenen Jubeljahres 2025 beschlossen worden. Zuvor habe Díaz-Canel \nim Juni 2023 bei einem Besuch im Vatikan mit dem Papst über die \nSituation der Häftlinge und die Auswirkungen der US-Sanktionen \ngesprochen."}];
const SAMPLE = "8afcbfd2";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
