const NAME = "Giuseppe";
const ITEMS = [{"id": "s034", "summary": "Ermittler haben die Geschäfts- und Fraktionsräume von CDU, SPD und AfD im Landtag von Sachsen-Anhalt wegen des Verdachts der Untreue durchsucht. Es besteht der Verdacht, dass unberechtigte Zulagen an ehemalige und aktuelle Fraktionsmitarbeiter ausgezahlt wurden. Die Ermittlungen basieren auf einer Anzeige des Bundes der Steuerzahler und konzentrieren sich auf Zahlungen aus den Jahren 2021 bis 2022. Die <del title=\"removed\">CDU<\/del><ins>SPD<\/ins> zahlte dabei mit rund 113.000 Euro am meisten, gefolgt von der AfD mit knapp 26.000 Euro und der SPD mit 7.500 Euro. CDU und AfD haben sich bisher nicht geäußert, während die SPD-Fraktion die Ermittlungen unterstützt und alle erforderlichen Auskünfte erteilt. Weitere Ermittler trafen am Landtag ein, um Unterlagen sicherzustellen.", "original": "Ermittler haben die Geschäfts- und Fraktionsräume von CDU, SPD und AfD im Landtag von Sachsen-Anhalt wegen des Verdachts der Untreue durchsucht. Es besteht der Verdacht, dass unberechtigte Zulagen an ehemalige und aktuelle Fraktionsmitarbeiter ausgezahlt wurden. Die Ermittlungen basieren auf einer Anzeige des Bundes der Steuerzahler und konzentrieren sich auf Zahlungen aus den Jahren 2021 bis 2022. Die CDU zahlte dabei mit rund 113.000 Euro am meisten, gefolgt von der AfD mit knapp 26.000 Euro und der SPD mit 7.500 Euro. CDU und AfD haben sich bisher nicht geäußert, während die SPD-Fraktion die Ermittlungen unterstützt und alle erforderlichen Auskünfte erteilt. Weitere Ermittler trafen am Landtag ein, um Unterlagen sicherzustellen.", "title": "Büros von CDU, SPD und AfD im Magdeburger Landtag durchsucht", "article": "Wegen des Verdachts der Untreue haben Ermittler die Geschäfts- und Fraktionsräume von CDU, SPD und AfD im Landtag von Sachsen-Anhalt durchsucht. Das teilte ein Sprecher der Staatsanwaltschaft Magdeburg mit.\nKonkret geht es demnach um den Verdacht der Auszahlung unberechtigter\n Zulagen. Im Fokus stehen dabei ehemalige und \naktuelle Fraktionsmitarbeiter. Es steht der Verdacht im Raum, dass \nsogenannte Funktionszulagen auch an nicht berechtigte \nFraktionsmitglieder ausgezahlt worden sein könnten. Grundlage der Ermittlungen sei eine Anzeige des Bundes der Steuerzahler.\nIm Blick der Ermittler sind Zahlungen aus dem Zeitraum 2021 bis 2022. In diesen Jahren griff bereits ein geändertes Abgeordnetengesetz. Es beschränkt die Zahlung von Zulagen laut \nSteuerzahlerbund auf Abgeordnete mit besonderen \nParlamentsfunktionen – also etwa Mitglieder des Landtagspräsidiums oder \nder Fraktionsführung. In den Rechnungsunterlagen von CDU, AfD und SPD fanden\n sich aber Hinweise auf mögliche Zahlungen für fraktionsinterne \nFunktionen.\n\nLaut Steuerzahlerbund geht es um fast 150.000 Euro – CDU zahlte demnach am meisten\n\nLaut dem Steuerzahlerbund zahlte die CDU in den beiden Jahren insgesamt rund 113.000 Euro aus. Bei der AfD wurden demnach 2021 knapp 26.000 Euro gezahlt, in der SPD-Fraktion 7.500 Euro. Spätere Jahre waren demnach nicht betroffen, andere Fraktionen auch nicht.\nCDU und AfD wollten sich auf Anfrage der ZEIT bisher nicht äußern. Die SPD-Fraktion teilte mit, man unterstütze die Ermittlungen der Staatsanwaltschaft und erteile alle erforderlichen Auskünfte. Auch auf eine konkret gezahlte Zulage nimmt die Fraktion in ihrem Statement Bezug: Die bis zur siebten Wahlperiode gezahlten Zulagen für stellvertretende Fraktionsvorsitzende in Höhe von zuletzt 750 Euro monatlich seien zum Beginn der achten Wahlperiode abgeschafft worden. In der Übergangsphase zwischen gesetzlicher Neuregelung 2020 und Ende der Wahlperiode 2021 seien &quot;zur pauschalen Abgeltung des erhöhten Aufwandes&quot; weiterhin Zahlungen in selber Höhe geleistet worden.\nNach Informationen der Nachrichtenagentur dpa trafen weitere Ermittler \nam Mittag mit einem Lastwagen am Landtag ein, um offenbar größere Mengen an Unterlagen sicherzustellen."}, {"id": "s051", "summary": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle.<ins> Das ZDF-Politbarometer ist eine regelmäßige politische Umfrage des Fernsehsenders ZDF.<\/ins> Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "original": "Die AfD hat in der neuesten Umfrage des ZDF-Politbarometers einen überraschenden Aufschwung erlebt, mit 21 Prozent liegt die Partei nun an dritter Stelle. Die Union bleibt stärkste Kraft mit 30 Prozent, während die Grünen erstmals seit einem Jahr vor der SPD liegen und mit 15 Prozent ein Plus von einem Punkt auf den vierten Platz kommen. Die Kanzlerfrage ist jedoch ein weiterer Szenenjäger, in der Robert Habeck gleichauf mit Friedrich Merz liegt, während Olaf Scholz deutlich hinterherhinkt. Die AfD-Kanzlerkandidatin Alice Weidel schneidet dann aber mit 15 Prozent auf Platz zwei ab.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s054", "summary": "In der Serie &quot;Kontoauszug&quot; werden Menschen vorgestellt, die offen über ihr Einkommen und ihre Ausgaben sprechen, um mehr Transparenz zu schaffen und sich gegenseitig zu unterstützen. Die Gesprächspartner reichen von Sozialarbeitern bis zu IT-Experten und haben <del title=\"removed\">unterschiedliche<\/del><ins>gleiche<\/ins> Einkommensverhältnisse. Leser sind eingeladen, ihre eigenen Erfahrungen zu teilen und können sich per E-Mail an kontoauszug@zeit.de wenden.", "original": "In der Serie &quot;Kontoauszug&quot; werden Menschen vorgestellt, die offen über ihr Einkommen und ihre Ausgaben sprechen, um mehr Transparenz zu schaffen und sich gegenseitig zu unterstützen. Die Gesprächspartner reichen von Sozialarbeitern bis zu IT-Experten und haben unterschiedliche Einkommensverhältnisse. Leser sind eingeladen, ihre eigenen Erfahrungen zu teilen und können sich per E-Mail an kontoauszug@zeit.de wenden.", "title": "Wie viel verdienen Sie?", "article": "&quot;Wie viel verdienst du eigentlich?&quot; Selbst in der Familie und unter Freunden reden viele Menschen nicht offen über ihr Einkommen oder darüber, wie viel Geld sie in ETFs stecken oder auf dem Tagesgeldkonto liegen haben. Dabei könnte man einander mit mehr Transparenz viel besser unterstützen – bei der Berufswahl zum Beispiel oder bei Gehaltsverhandlungen.\nAuch deswegen stellen wir in unserer Reihe Kontoauszug jeden Sonntag Menschen vor, die von ihrem Beruf und ihrer Ausbildung erzählen und ihre Einnahmen und Ausgaben offenlegen: eine Sozialarbeiterin zum Beispiel, ein Rettungssanitäter , ein Jurist oder IT-Expertinnen . Manche unserer Gesprächspartner haben sehr wenig Geld zur Verfügung, andere verdienen monatlich viele Tausend Euro.\nManche sprechen offen mit ihrem Namen, andere anonym. Möchten Sie auch von Ihren Kosten fürs Wohnen, für Lebensmittel und Freizeitaktivitäten erzählen? Oder gar Tipps für Investments geben, für Jobs werben oder vor ihnen warnen? Dann schreiben Sie uns!\nBitte schildern Sie uns Ihre Erfahrungen im Formular oder melden Sie sich per E-Mail an  kontoauszug@zeit.de . Ausgewählte Beiträge möchten wir nach Rücksprache mit Ihnen veröffentlichen, auf Wunsch auch anonym.\nUnsere Leserschaft bereichert unseren Journalismus.  Hier finden Sie alle Stimmen-Texte ."}, {"id": "s056", "summary": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor <del title=\"removed\">vier<\/del><ins>fünf<\/ins> Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "original": "Donald Trump hat seine zweite Amtszeit als 47. Präsident der Vereinigten Staaten angetreten, nachdem er zuvor von 2017 bis 2021 im Amt war. Die Amtseinführung fand im Kapitol statt, wo vor vier Jahren wütende Trump-Anhänger eingedrungen waren. Trump unterzeichnete kurz nach Amtsantritt Dekrete, die unter anderem eine Begnadigung der Kapitolstürmer, die Abschaffung des Birthrights und den Austritt aus dem Pariser Klimaabkommen vorsehen. Weitere Informationen zum neuen US-Präsidenten finden sich auf unserer Themenseite.", "title": "Anführer ultrarechter Gruppen aus Gefängnissen entlassen", "article": "Donald Trump hat seinen Amtseid als 47. Präsident der Vereinigten Staaten abgelegt. Es ist bereits seine zweite Amtszeit, er war auch von 2017 bis 2021 US-Präsident.\nDie Zeremonie fand wegen frostiger Temperaturen im Kapitol statt. Den Sitz des US-Kongresses hatten wütende Trump-Anhänger vor vier Jahren gestürmt.\nKurz nach seinem Amtsantritt unterzeichnete Trump zahlreiche Dekrete , die unter anderem eine Begnadigung der Kapitolstürmer, eine Abschaffung des Birthrights und einen Austritt aus dem Pariser Klimaabkommen vorsehen.\nAlle Artikel zum Thema finden Sie auf unserer Themenseite zum neuen US-Präsidenten .\nNeben eigenen Recherchen verwenden wir auch Material der Nachrichtenagenturen dpa, AP, AFP, KNA und Reuters."}, {"id": "s048", "summary": "Der Ausstoß klimaschädlicher Treibhausgase in der EU ist im vergangenen Jahr um sieben Prozent gesunken.\nDieser Rückgang von rund 3,4 Milliarden Tonnen Kohlendioxid entspricht einem Zehnjahreszeitraum von 18 Prozent.\nFast alle Wirtschaftszweige konnten zu diesem Ergebnis beitragen, mit Ausnahme des Transports und der Lagerung.\nDie größten Emissionsreduktionen wurden in den Bereichen Stromerzeugung (-43%) und Haushalten (-14%) erzielt.\nDie Emissionsintensität sank in einigen EU-Ländern wie Estland und Irland deutlich, während andere wie Österreich und Litauen nur geringe Fortschritte machten. Deutschland lag bei knapp 39 Prozent.<ins> Die Emissionsintensität gibt an, wie viel Treibhausgas im Verhältnis zur Wirtschaftsleistung ausgestoßen wird.<\/ins>", "original": "Der Ausstoß klimaschädlicher Treibhausgase in der EU ist im vergangenen Jahr um sieben Prozent gesunken.\nDieser Rückgang von rund 3,4 Milliarden Tonnen Kohlendioxid entspricht einem Zehnjahreszeitraum von 18 Prozent.\nFast alle Wirtschaftszweige konnten zu diesem Ergebnis beitragen, mit Ausnahme des Transports und der Lagerung.\nDie größten Emissionsreduktionen wurden in den Bereichen Stromerzeugung (-43%) und Haushalten (-14%) erzielt.\nDie Emissionsintensität sank in einigen EU-Ländern wie Estland und Irland deutlich, während andere wie Österreich und Litauen nur geringe Fortschritte machten. Deutschland lag bei knapp 39 Prozent.", "title": "", "article": "Der Ausstoß klimaschädlicher Treibhausgase in der EU ist im vergangenen Jahr um sieben Prozent im Vergleich zum Vorjahr gesunken. Das teilte das Statistikamt Eurostat in Luxemburg mit. Über den Zehnjahreszeitraum von 2013 bis 2023 betrug der Rückgang 18 Prozent. In absoluten Zahlen entsprach die Menge der im vergangenen Jahr ausgestoßenen Emissionen rund 3,4 Milliarden Tonnen Kohlendioxid .\nLaut Eurostat konnten fast alle Wirtschaftszweige dazu beitragen, mit Ausnahme von Transport und Lagerung. Am meisten gingen die Emissionen in den Bereichen Stromerzeugung, Gas- und Dampfversorgung sowie Klimatisierung zurück – und zwar um 43 Prozent. Zudem produzierten Haushalte in der EU 14 Prozent weniger Emissionen als noch vor zehn Jahren.\nEurostat erfasst außerdem die sogenannte Emissionsintensität, also wie viel Treibhausgas im Verhältnis zur Wirtschaftsleistung ausgestoßen wird. Der Wert gibt so Aufschluss über die Umwelteffizienz der \nwirtschaftlichen Produktion. Ein Rückgang der Emissionsintensität \nbedeutet, dass bei gleicher Wirtschaftsleistung weniger Treibhausgase \nausgestoßen werden.\nZwischen den EU-Ländern zeigten sich hier deutliche Unterschiede: \nWährend die Emissionsintensität in Estland um 61 Prozent und in Irland \num 50 Prozent sank, verringerte sie sich in Österreich und Litauen nur\n um 17 Prozent. Deutschland lag bei knapp 39 Prozent."}, {"id": "s043", "summary": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet <del title=\"removed\">sie<\/del><ins>ihn<\/ins> als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "original": "Unionskanzlerkandidat Friedrich Merz kritisiert die öffentliche Veröffentlichung der Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump, bezeichnet sie als Affront und sieht darin einen großen Schaden für das Ansehen der Bundesregierung in Washington, D. C. Merz betont, dass die Europäer sich schnell zusammensetzen müssen, um über die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA zu diskutieren, und fordert eine europäische Antwort auf diese Fragen.", "title": "", "article": "Unionskanzlerkandidat Friedrich Merz hat die Einschätzung des deutschen Botschafters in den USA über US-Präsident Donald Trump kritisiert. &quot;Diese Nachricht aus Washington ist in der Sprache eines politischen Aktivisten verfasst. Und sie ist offensichtlich bewusst öffentlich gemacht worden&quot;, sagte der CDU-Politiker im Deutschlandfunk. Dies seien gleich zwei schwere Fehler der deutschen Außenpolitik.\nEin schriftlicher Bericht des Botschafters Andreas Michaelis an das Außenministerium war kurz vor der Amtseinführung Trumps an die Öffentlichkeit gelangt . Darin schrieb Michaelis unter anderem, Trumps Agenda &quot;der maximalen Disruption, des Aufbrechens etablierter politischer Ordnung und bürokratischer Strukturen sowie seine Rachepläne&quot; bedeuteten letztlich &quot;eine Neudefinition der verfassungsrechtlichen Ordnung&quot;. Zudem kritisierte er die &quot;maximale Machtkonzentration beim Präsidenten zulasten von Kongress und Bundesstaaten&quot;.\nMerz sagte über Michaelis&#x27; Bericht: &quot;Allein die Tatsache, dass dies offensichtlich bewusst öffentlich gemacht worden ist, ist ein Affront.&quot; Hinter der Veröffentlichung sieht er eine innenpolitische Motivation. &quot;Für das Ansehen der Bundesregierung in Washington, D. C. , ist das ein großer Schaden&quot;, sagte der Unionskanzlerkandidat. Die aktuelle Bundesregierung werde in Washington, D. C., zeitnah keine Gesprächspartner mehr finden.\n&quot;Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren?&quot;\nDie Kritik des CDU-Vorsitzenden bezog sich primär auf die Veröffentlichung des Textes, nicht auf den Inhalt. So stehe in der Analyse &quot;auch manches Richtige&quot;. Allerdings müssten aus dieser Analyse Schlussfolgerungen gezogen werden.\nLaut Merz müssten die Konsequenzen sein, dass sich die Europäer &quot;jetzt schnell zusammensetzen&quot; und insbesondere über zwei Themen diskutieren: die eigenen Schritte für die Sicherheit Europas und die Stärkung der europäischen Position im Handel mit den USA. &quot;Diese beiden Fragen müssen nicht deutsch, sondern europäisch beantwortet werden&quot;, sagte Merz.\nIn beiden Aspekten sieht Merz Deutschland in besonderer Verantwortung. So gebe es aktuell sehr viele Möglichkeiten für Europa, die nicht ausgeschöpft würden. &quot;Alles hängt da an der Frage: Ist Deutschland bereit, sich wieder stärker in Europa zu engagieren? Ist Deutschland bereit, für Europa eine Führungsverantwortung zu übernehmen?&quot;\nVerfolgen sie die aktuellen Entwicklungen zur Amtseinführung Donald Trumps in unserem Liveblog ."}, {"id": "s039", "summary": "<del title=\"removed\">Svenja<\/del><ins>Annalena<\/ins> <del title=\"removed\">Schulze,<\/del><ins>Baerbock,<\/ins> Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "original": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "title": "Entwicklungsministerin Schulze sagt Syrien deutsche Unterstützung zu", "article": "Bundesentwicklungsministerin Svenja Schulze (SPD) hat bei\neinem Besuch in Syrien deutsche Unterstützung für\neine &quot;friedliche und stabile Entwicklung&quot; des Landes angekündigt.\nSchulze traf sich am Morgen in Damaskus mit Vertretern der\nÜbergangsregierung, Ärzten und dem De-facto-Gesundheitsminister Maher al-Scharaa,\neinem Bruder des neuen Machthabers Ahmed al-Scharaa. Die Ministerin kündigte\nzudem neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern an.\nSchulzes Ministerium sieht große Herausforderungen im traditionell eigentlich sehr starken syrischen Gesundheitswesen. Das hat mit der gezielten Bombardierung von Krankenhäusern in ehemaligen Rebellengebieten während des Bürgerkriegs zu tun. Außerdem fehlt durch Flucht und Vertreibung vielerorts das medizinische Personal. Laut Entwicklungsministerium hat mehr als die Hälfte des Gesundheitspersonals das Land verlassen, mehr als ein Drittel der\nKrankenhäuser sei nicht mehr funktionstüchtig.\nUm das Gesundheitssystem zu unterstützen, soll es sogenannte Klinikpartnerschaften geben, die Deutschland bereits mit 52 Ländern finanziert. Dabei geht es um den Austausch von Wissen und Erfahrung. Ärzte aus Deutschland sollen nach Syrien reisen, um dort Fortbildungsmaßnahmen anzubieten oder mit lokalen Kollegen den Einsatz neuer Geräte zu üben. Auch Fortbildungen in Deutschland sind möglich. Eine Auftaktkonferenz für die Klinikpartnerschaften soll am 12. Februar in Berlin stattfinden.\n\nDeutschland auf syrisches Fachpersonal &quot;angewiesen&quot;\n\nAuf ihrer Reise wird Schulze von einem in Deutschland arbeitenden syrischen Arzt begleitet. In den kommenden Monaten dürfte es auch um die Frage gehen, ob syrische Ärztinnen und Ärzte aus Deutschland wieder nach Syrien zurückkehren sollen. Regierungsangaben zufolge gibt es bundesweit etwa 5.800 Ärztinnen und über 2.000 Pflegekräfte mit syrischem Pass. Viele hätten sich bereits beim Entwicklungsministerium gemeldet, weil\nsie helfen wollten.\nEs sei verständlich, dass die neue Regierung in Syrien die Fachkräfte gern zurückholen wolle, sagte Schulze. &quot;Aber auch Deutschland hat ein\nInteresse, diese Menschen zu halten, auf die wir gerade in\nunserem Gesundheitssystem angewiesen sind.&quot; Durch die Klinikpartnerschaften wolle sie ermöglichen, &quot;dass beides geht: sich von Deutschland aus für Syrien engagieren&quot;. Letztendlich sei aber vor allem entscheidend, was jede einzelne Fachkraft selbst für ihr Leben wolle.\nSchulze ist die zweite deutsche Ministerin, die nach dem Sturz des langjährigen Machthabers Baschar al-Assad nach Syrien reist. Anfang des Jahres war Außenministerin Annalena Baerbock (Grüne) nach Damaskus geflogen und hatte dort mit Vertretern der neuen Übergangsregierung beraten. Dabei hatte sie wiederholt hervorgehoben, dass unter der neuen Regierung der Schutz aller religiösen und ethnischen Minderheiten gewahrt werden müsse."}, {"id": "s047", "summary": "Biodeutsch&quot; wurde zum Unwort des Jahres 2024 gewählt, da es in rassistischer und nationalistischer Weise in den sozialen Medien verwendet wird. Die Jury in Marburg kritisiert die Unterteilung in &quot;echte&quot; und &quot;Deutsche zweiter Klasse&quot; als Alltagsrassismus. Auf Platz zwei landete <ins>nicht <\/ins>&quot;Heizungsverbot&quot;, das in der Klimaschutzdebatte irreführend benutzt wird. Die Jury möchte mit der Auswahl auf undifferenzierten und diskriminierenden Sprachgebrauch aufmerksam machen.", "original": "Biodeutsch&quot; wurde zum Unwort des Jahres 2024 gewählt, da es in rassistischer und nationalistischer Weise in den sozialen Medien verwendet wird. Die Jury in Marburg kritisiert die Unterteilung in &quot;echte&quot; und &quot;Deutsche zweiter Klasse&quot; als Alltagsrassismus. Auf Platz zwei landete &quot;Heizungsverbot&quot;, das in der Klimaschutzdebatte irreführend benutzt wird. Die Jury möchte mit der Auswahl auf undifferenzierten und diskriminierenden Sprachgebrauch aufmerksam machen.", "title": "&quot;Biodeutsch&quot; ist Unwort des Jahres 2024", "article": "&quot;Biodeutsch&quot; ist das Unwort des Jahres 2024. Das Wort werde vor allem in den sozialen Medien in rassistischer und nationalistischer Weise gebraucht, teilte die Jury der Sprachaktion in Marburg zur Begründung ihrer Wahl mit. &quot;Die mit dem Gebrauch von biodeutsch einhergehende Unterteilung in angeblich &#x27;echte&#x27; Deutsche und in Deutsche zweiter Klasse ist eine Form von Alltagsrassismus&quot;, erklärte die Jury.\nUrsprünglich sei &quot;biodeutsch&quot; als ironisch-satirischer Ausdruck verwendet worden, seit mehreren Jahren jedoch sei &quot;eine sehr gedankenlose und unreflektierte, nicht-satirische, also wörtlich gemeinte Verwendung festzustellen&quot;. Dabei werde &quot;Deutschsein&quot; naturbezogen begründet und würden Menschen mit Migrationsbiografie ausgegrenzt. Das verstoße gegen die Idee von demokratischer Gleichheit und Inklusion.\n\n&quot;Heizungsverbot&quot; auf Platz zwei\n\nAuf Platz zwei wählten die Sprachexperten und -expertinnen das Wort &quot;Heizungsverbot&quot; . Es werde irreführend und sachlich falsch in der Debatte um Klimaschutz benutzt. Bis knapp zwei Wochen vor Einsendeschluss gingen mehr als 2.800 Vorschläge ein, erneut deutlich mehr als im Vorjahr.\nSeit 1991 werden mit dem Unwort des Jahres unmenschliche oder unangemessene Begriffe ausgewählt, die gegen das Prinzip der Menschenwürde verstoßen, in irreführender Weise etwas Negatives beschönigen oder diskriminieren. Die Jury aus Sprachwissenschaftlerinnen und -wissenschaftlern will damit insgesamt auf &quot;undifferenzierten, verschleiernden oder diffamierenden öffentlichen Sprachgebrauch&quot; aufmerksam machen.\nIm vergangenen Jahr wurde der Begriff &quot;Remigration&quot; zum Unwort des Jahres gekürt . Das Wort werde als beschönigende Tarnvokabel benutzt, hieß es damals zur Begründung.  Tatsächlich solle damit eine menschenunwürdige Abschiebepraxis verschleiert werden."}, {"id": "s031", "summary": "Die Bundestagsverwaltung prüft den geplanten Talk zwischen Elon Musk und AfD-Kanzlerkandidatin Alice Weidel auf X wegen möglicher Wahlkampfbeeinflussung und illegaler Parteispende.<ins> Eine Parteispende ist eine Geld- oder Sachzuwendung an eine politische Partei.<\/ins> Die Organisation Lobbycontrol wirft verdeckte Wahlkampfspenden vor, da das Gespräch eine höhere Reichweite als andere Beiträge erzielen könnte. Weidels Sprecher sieht darin ein legitimes, unabgesprochenes und offenes Gespräch. Der Experte Jan Penfrat vom Verband European Digital Rights (EDRi) meint, dass das Gespräch nur unter bestimmten Bedingungen gegen den europäischen Digital Services Act (DSA) verstoße. Bundeswirtschaftsminister Robert Habeck fordert Transparenz zu den Algorithmen von X bezüglich der Sichtbarkeit des Gesprächs.", "original": "Die Bundestagsverwaltung prüft den geplanten Talk zwischen Elon Musk und AfD-Kanzlerkandidatin Alice Weidel auf X wegen möglicher Wahlkampfbeeinflussung und illegaler Parteispende. Die Organisation Lobbycontrol wirft verdeckte Wahlkampfspenden vor, da das Gespräch eine höhere Reichweite als andere Beiträge erzielen könnte. Weidels Sprecher sieht darin ein legitimes, unabgesprochenes und offenes Gespräch. Der Experte Jan Penfrat vom Verband European Digital Rights (EDRi) meint, dass das Gespräch nur unter bestimmten Bedingungen gegen den europäischen Digital Services Act (DSA) verstoße. Bundeswirtschaftsminister Robert Habeck fordert Transparenz zu den Algorithmen von X bezüglich der Sichtbarkeit des Gesprächs.", "title": "", "article": "Die Bundestagsverwaltung beschäftigt sich mit dem geplanten Gespräch von Elon Musk mit der AfD-Kanzlerkandidatin Alice Weidel auf X. Sie wolle prüfen, ob es sich dabei um eine Beeinflussung des\nWahlkampfs und um eine illegale Parteispende handle, schrieb die Verwaltung. Zunächst\nhatte die Rheinische Post berichtet.\nDie Organisation Lobbycontrol hat den Vorwurf möglicher verdeckter Wahlkampfspenden erhoben . Das Gespräch werde auf X\nvoraussichtlich deutlich stärker verbreitet als Beiträge anderer\nNutzer, schrieb die Organisation. &quot;Insofern kann man hier durchaus von politischer Werbung\nsprechen, denn die Plattform X verkauft eine solche Reichweite\nnormalerweise für sehr viel Geld.&quot; Weidels Sprecher sagte, es sei ein legitimes &quot;unabgesprochenes\nund offenes Gespräch&quot;.\nDer Experte für die Regulierung von Onlineplattformen\nbeim Verband European Digital Rights (EDRi), Jan Penfrat, sagte, das Gespräch verstoße nur unter bestimmen Bedingungen gegen den europäischen Digital Services Act (DSA): Wenn Musk seine Plattform dazu nutzen würde, bestimmten politischen\nStimmen mehr Sichtbarkeit zu geben – oder wenn illegale Aussagen während des Gesprächs fallen würden.\n\nHabeck fordert Transparenz zu Algorithmen von X\n\nAuch Bundeswirtschaftsminister und Grünen-Kanzlerkandidat Robert Habeck sagte, besorgniserregend sei nicht das Gespräch an sich, sondern die Funktionsweise von X.  Dass Musk und Weidel miteinander redeten, sei ihm erstens egal und zweitens kein Problem, sagte er den Sendern RTL und ntv sowie der Welt. Wichtiger sei eine andere Frage: &quot;Sind die Algorithmen, die die Plattform X benutzt, so ausgerichtet, dass es einen einseitigen Vorteil für bestimmte Inhalte gibt&quot;, sagte er. Ob es um die Inhalte der AfD oder von Elon Musk gehe, sei dabei &quot;im Moment schwer auseinanderzuhalten&quot;.\nIn diesem Fall hätte die AfD einen &quot;geldwerten Vorteil&quot;, sagte Habeck. &quot;Das wäre dann Parteienfinanzierung, in diesem Fall wahrscheinlich illegale Parteienfinanzierung.&quot; Weiter forderte er, auch unabhängig vom Wahlkampf müsse transparent gemacht werden, mit welcher Logik Plattformen wie X funktionieren, die darüber entscheiden, was Nutzern prominent angezeigt werde.\nMusk und Weidel wollen an diesem Donnerstagabend auf X öffentlich miteinander sprechen. Dabei solle es um die aktuelle politische Lage\nmit Blick auf die Bundestagswahl am 23. Februar gehen . Musk wirbt seit einiger Zeit für die AfD und andere rechte Gruppierungen in\nEuropa ."}, {"id": "s044", "summary": "In Dänemark kam es zu einem großflächigen Ausfall des Mobilfunknetzes, bei dem auch der Notruf 112 betroffen sein könnte. Die dänische Polizei verstärkt ihre Präsenz in Gebieten mit Notruf-Ausfall. Gleichzeitig gab es auch Probleme bei vielen Bahnverbindungen im Land, wobei Züge auf freier Strecke stehenblieben. Der Betreiber Banedanmark stellte vorübergehend den Betrieb ein, <del title=\"removed\">da<\/del><ins>bevor<\/ins> es Probleme mit dem digitalen Signalsystem gab. Es wird vermutet, dass die Ausfälle möglicherweise zusammenhängen, aber die genaue Ursache ist noch unklar. Banedanmark gab jedoch bekannt, dass das digitale Signalsystem im Westen des Landes wieder in Betrieb sei und der Zugverkehr langsam wieder normalisiert werde.", "original": "In Dänemark kam es zu einem großflächigen Ausfall des Mobilfunknetzes, bei dem auch der Notruf 112 betroffen sein könnte. Die dänische Polizei verstärkt ihre Präsenz in Gebieten mit Notruf-Ausfall. Gleichzeitig gab es auch Probleme bei vielen Bahnverbindungen im Land, wobei Züge auf freier Strecke stehenblieben. Der Betreiber Banedanmark stellte vorübergehend den Betrieb ein, da es Probleme mit dem digitalen Signalsystem gab. Es wird vermutet, dass die Ausfälle möglicherweise zusammenhängen, aber die genaue Ursache ist noch unklar. Banedanmark gab jedoch bekannt, dass das digitale Signalsystem im Westen des Landes wieder in Betrieb sei und der Zugverkehr langsam wieder normalisiert werde.", "title": "", "article": "In Dänemark ist es zu einem großflächigen Ausfall des Mobilfunknetzes gekommen. Kunden hatten der größten Telefongesellschaft des Landes, TDC, Probleme gemeldet. TDC teilte mit, dass auch der Notruf 112 betroffen sein könne. Die dänische Polizei zeigt in Gebieten mit Notruf-Ausfall verstärkt Präsenz auf den Straßen, berichteten dänische Medien.\n&quot;Wir schätzen, dass der Fehler auf ein Update zurückzuführen sein könnte, das innerhalb der letzten 24 Stunden durchgeführt wurde&quot;, sagte Lasse Bjerre Sørensen, Kommunikationsleiter bei TDC, dem dänischen Sender DR. Es gebe derzeit keine Hinweise auf einen Cyberangriff.\n\nAuch Bahnverkehr ist beeinträchtigt\n\nZu größeren Ausfällen kam es auch bei vielen Bahnverbindungen in Dänemark. Vereinzelt seien Züge auf freier Strecke stehengeblieben. Der Betreiber Banedanmark hatte vorübergehend den Betrieb eingestellt. Es gebe Probleme mit dem digitalen Signalsystem, hieß es in einer Mitteilung, die das Unternehmen auf der Onlineplattform X teilte.\n&quot;Wir arbeiten derzeit mit Hochdruck daran, den Verkehr wieder in Gang zu bringen und untersuchen die Ursache der Störung&quot;, teilte Nicolai Smidt Sigsgaard, stellvertretender Verkehrsdirektor bei Banedanmark, in einer Mitteilung des Unternehmens mit. Ob die parallel aufgetretenen Ausfälle des Mobilfunknetzes und des Bahnsystems zusammenhängen, ist bisher unklar. &quot;Wir suchen auf breiter Ebene nach der Ursache, aber wir können mit Sicherheit sagen, dass auch wir von einer größeren Störung im Telekommunikationsnetz betroffen sind&quot;, teilte Smidt weiter mit.\nBanedanmark teilte mit, dass das digitale Signalsystem im Westen des Landes inzwischen wieder in Betrieb sei. &quot;Die Züge können fahren.&quot; Der stündliche Betrieb soll im Laufe des Abend wieder aufrechterhalten werden. &quot;Wir arbeiten jetzt mit unserem Lieferanten zusammen, um die Probleme in den nächsten Tagen zu untersuchen&quot;, kündigte der Unternehmenssprecher in einer Mitteilung an."}, {"id": "s059", "summary": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.<ins> Trainer Marcel Rapp ließ offen, ob er in der nächsten Partie dieselbe Startelf aufstellen wird.<\/ins>", "original": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.", "title": "", "article": "Holstein Kiel – Borussia Dortmund 4:2 (3:0)\nBorussia Dortmund hat in der Bundesliga überraschend gegen den Tabellenvorletzten Holstein Kiel mit 2:4 (0:3) verloren. Der BVB zeigte dabei vor allem in der ersten Halbzeit große Schwächen in der Defensive, während Kiel den Sieg mit einer disziplinierten Leistung sicherte.\nIn der 27. Minute gingen die Gastgeber durch Shuto Machino in Führung, der nach einem Fehler von Julian Brandt einen präzisen Rechtsschuss verwandelte. Nur fünf Minuten später (32. Spielminute) erhöhte Phil Harres per Kopf auf 2:0. Kurz vor der Halbzeitpause traf Alexander Bernhardsson in der Nachspielzeit (45.+4) zum dritten Mal für die Kieler. Dortmund konnte in der zweiten Hälfte durch Giovanni Reyna (71.) und Jamie Gittens (77.) verkürzen, ehe Fiete Arp in der Nachspielzeit (90.+8) den Schlusspunkt setzte. Kiels Lewis Holtby sah nach einem Foulspiel in der 86. Minute die Rote Karte.\nFür Holstein Kiel bedeutet der unerwartete Sieg wichtige Punkte im Kampf um den Klassenerhalt. Der BVB hingegen droht, den Anschluss an die Champions-League-Plätze zu verlieren. Bereits am Freitag steht für Dortmund ein Auswärtsspiel gegen Eintracht Frankfurt an, während Kiel am Samstag bei der TSG Hoffenheim zu Gast ist."}, {"id": "s053", "summary": "Die ZEIT startet ab März 2025 exklusive monatliche Folgen von &quot;Verbrechen&quot; für Abonnenten auf www.zeit.de, Apple Podcasts und Spotify.\n\nIm März erscheint erstmals eine exklusive Verbrechen-Dokuserie über mehrere Folgen hinweg, mit weiteren Serien in Planung.\n\nAbonnenten behalten vollständigen Zugriff auf das Verbrechen-Archiv, da alle vor April 2021 erschienenen Folgen ab sofort nur noch für Abonnenten zugänglich sind.\n\nEin kostenloses digitales Probeabo der ZEIT ist hier verfügbar. Bereits bestehende Abonennten können ihr Abo mit Apple Podcasts oder Spotify verbinden.\n\nWer kein Abo abschließt, findet weiterhin kostenfrei alle zwei Wochen eine neue Folge von &quot;Verbrechen&quot; in seinem Podcast-Feed.<ins>\n\nDer Deutsche Wetterdienst hat für das kommende Wochenende verbreitet Sonnenschein und Temperaturen bis zu 22 Grad vorhergesagt.<\/ins>", "original": "Die ZEIT startet ab März 2025 exklusive monatliche Folgen von &quot;Verbrechen&quot; für Abonnenten auf www.zeit.de, Apple Podcasts und Spotify.\n\nIm März erscheint erstmals eine exklusive Verbrechen-Dokuserie über mehrere Folgen hinweg, mit weiteren Serien in Planung.\n\nAbonnenten behalten vollständigen Zugriff auf das Verbrechen-Archiv, da alle vor April 2021 erschienenen Folgen ab sofort nur noch für Abonnenten zugänglich sind.\n\nEin kostenloses digitales Probeabo der ZEIT ist hier verfügbar. Bereits bestehende Abonennten können ihr Abo mit Apple Podcasts oder Spotify verbinden.\n\nWer kein Abo abschließt, findet weiterhin kostenfrei alle zwei Wochen eine neue Folge von &quot;Verbrechen&quot; in seinem Podcast-Feed.", "title": "", "article": "Ab März 2025 wird exklusiv für Abonnentinnen und Abonnenten jeden Monat eine zusätzliche Folge von Verbrechen erscheinen, zu hören auf www.zeit.de , auf Apple Podcasts oder auf Spotify. Im März erscheint, ebenfalls exklusiv für Abonnentinnen und Abonnenten, die erste Verbrechen -Dokuserie, in der wir einen besonders spannenden Fall über mehrere Folgen erzählen. Weitere Serien werden folgen.\nMit einem Abo behaltet ihr außerdem vollen Zugriff auf das Verbrechen -Archiv. Folgen, die vor April 2021 erschienen sind, sind nämlich ab sofort nur noch exklusiv für Abonentinnen und Abonnenten zugänglich.\nEin kostenloses digitales Probeabo der ZEIT könnt ihr hier abschließen .\nWenn ihr bereits ein Abo habt, könnt ihr es mit Apple Podcasts oder Spotify verbinden. Wie das geht, könnt ihr hier nachlesen .\nWer kein Abo abschließt, findet auch in Zukunft wie gewohnt kostenfrei alle zwei Wochen eine neue Folge Verbrechen in seinem Podcast-Feed.\nMit allen weiteren Fragen wendet euch gerne an kontakt@zeit.de"}];
const SAMPLE = "8afcbfd2";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
