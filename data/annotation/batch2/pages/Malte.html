const ITEMS = [{"id": "s032", "summary": "<del title=\"removed\">Die AfD-Delegierten haben auf ihrem Parteitag in Riesa Alice Weidel einstimmig zur Kanzlerkandidatin gewählt. <\/del>Die 45-Jährige ist die erste eigene Kanzlerkandidatin der Partei und soll die Regierungsverantwortung nach der Bundestagswahl übernehmen. Der Parteitag wurde von Protesten überschattet und musste später beginnen, da Weidel wegen blockierter Zufahrtsstraßen verspätet ankam. Weidel ist eine Ausnahmeerscheinung in der AfD als offen homosexuelle Politikerin, die für ein traditionelles Familienbild einsteht. Die Partei streamte den Parteitag auf einer Plattform, auf der auch Tesla-Gründer Elon Musk die Partei unterstützt und Weidel zu einem weltweit gestreamten Gespräch einlud.", "original": "Die AfD-Delegierten haben auf ihrem Parteitag in Riesa Alice Weidel einstimmig zur Kanzlerkandidatin gewählt. Die 45-Jährige ist die erste eigene Kanzlerkandidatin der Partei und soll die Regierungsverantwortung nach der Bundestagswahl übernehmen. Der Parteitag wurde von Protesten überschattet und musste später beginnen, da Weidel wegen blockierter Zufahrtsstraßen verspätet ankam. Weidel ist eine Ausnahmeerscheinung in der AfD als offen homosexuelle Politikerin, die für ein traditionelles Familienbild einsteht. Die Partei streamte den Parteitag auf einer Plattform, auf der auch Tesla-Gründer Elon Musk die Partei unterstützt und Weidel zu einem weltweit gestreamten Gespräch einlud.", "title": "Alice Weidel einstimmig zur Kanzlerkandidatin der AfD gewählt", "article": "Die AfD -Delegierten haben auf ihrem Parteitag in Riesa einstimmig Parteichefin Alice Weidel zur Kanzlerkandidatin gewählt. Mit der 45-Jährigen kürte die in Teilen als rechtsextrem eingestufte Partei erstmals in ihrer\nGeschichte eine eigene Kanzlerkandidatin. Ziel sei die Übernahme der\nRegierungsverantwortung nach der Bundestagswahl, sagte der Co-Vorsitzende\nTino Chrupalla.\n&quot;Sie ist die zukünftige Kanzlerin&quot;, sagte Chrupalla . &quot;Jetzt müssen wir die 20-Prozent-Marke hinter uns lassen und\nweiter klettern.&quot;\nDer Parteitag in Riesa ist von Protesten überschattet und musste deshalb später anfangen als ursprünglich geplant . Unter anderem Weidel hatte wegen blockierter Zufahrtsstraßen nicht rechtzeitig am Veranstaltungsort ankommen können.\n\nWeidel ist eine Ausnahmeerscheinung in der AfD\n\nDie Partei- und Fraktionschefin ist seit Jahren eines der\nbekanntesten Gesichter der AfD. Als offen homosexuelle Politikerin, die mit\nihrer Lebenspartnerin in der Schweiz zwei Söhne großzieht, ist Weidel in ihrer\nPartei eine Ausnahmeerscheinung. Insbesondere, weil die AfD für ein traditionelles Familienbild einsteht. Zudem ist sie eine der wenigen prominenten\nFrauen in der von Männern dominierten AfD.\nBei früheren Bundestagswahlen hatte die AfD auf die\nAufstellung eines eigenen Kanzlerkandidaten verzichtet. Weidel war aber bereits\n2017 und 2021 Teil eines Spitzenkandidaten-Duos für Bundestagswahlen. Parteichef Chrupalla hatte im September seinen Verzicht auf\neine Kanzlerkandidatur erklärt. Am heutigen Samstag bekräftigte er seine Unterstützung\nfür Weidels Kandidatur. &quot;Ich halte ihr den Rücken frei&quot;, sagte er.\n\nParteitag streamt auf X\n\nIn Umfragen rangiert die Partei derzeit auf Platz zwei\nhinter der Union. Aussicht auf eine Regierungsbeteiligung hat die AfD jedoch\nnicht, da bisher keine andere Partei mit ihr koalieren will.\nDen Parteitag streamt die AfD auf der Plattform X – wo der Stream von Tesla-Gründer Elon Musk geteilt wurde. Zwischenzeitlich schauen dort mehr als 1,4 Millionen Menschen zu, mehr als viermal so viele, wie die Partei Abonnenten auf der Plattform verzeichnet. Der US-Amerikaner unterstützt die Partei im Wahlkampf, unter anderem sprach er sich für sie in einem Gastbeitrag in der Welt am Sonntag aus , außerdem lud er Weidel zu einem Gespräch auf X ein , das weltweit gestreamt wurde."}, {"id": "s049", "summary": "Nach den verheerenden Bränden in Los Angeles schätzt US-Präsident Joe Biden, dass der Wiederaufbau mehrere Milliarden Dollar kosten wird. Bisher sind mindestens 24 Menschen gestorben und über 180.000 mussten evakuiert werden. Sportteams und Musiker haben Großspenden angekündigt, während <del title=\"removed\">die<\/del><ins>der<\/ins> Staatsanwaltschaft gegen mutmaßliche Plünderer vorgeht. Die Bekanntgabe der Oscarnominierungen wurde aufgrund der Brände verschoben, die Oscarverleihung soll jedoch wie geplant stattfinden.", "original": "Nach den verheerenden Bränden in Los Angeles schätzt US-Präsident Joe Biden, dass der Wiederaufbau mehrere Milliarden Dollar kosten wird. Bisher sind mindestens 24 Menschen gestorben und über 180.000 mussten evakuiert werden. Sportteams und Musiker haben Großspenden angekündigt, während die Staatsanwaltschaft gegen mutmaßliche Plünderer vorgeht. Die Bekanntgabe der Oscarnominierungen wurde aufgrund der Brände verschoben, die Oscarverleihung soll jedoch wie geplant stattfinden.", "title": "", "article": "Für den Wiederaufbau nach der Brandkatastrophe von Los Angeles werden nach Einschätzung von US-Präsident Joe Biden mehrere Milliarden nötig sein . &quot;Es wird Dutzende Milliarden Dollar kosten, Los Angeles wieder dorthin zu bringen, wo es einmal war&quot;, sagte der scheidende Staatschef bei einem Treffen mit Vertretern des Katastrophenschutzes.\nUnterdessen bereitete sich die Stadt auf eine Rückkehr der heftigen Winde vor, die drohten, die Flammen erneut zu schüren. Bei den Großbränden sind bisher mindestens 24 Menschen gestorben . Mehr als 180.000 mussten zeitweilig ihre Häuser verlassen. Rund 92.000 Anwohner können auch sieben Tage nach Ausbruch der ersten Feuer bislang nicht in ihr Zuhause zurückkehren.\n\nSportteams und Musiker kündigen Großspenden an\n\nZur Unterstützung der Brandopfer wollen die großen Sportteams aus der Metropole insgesamt acht Millionen US-Dollar spenden. Zudem sollen von den verheerenden Bränden betroffene Menschen an drei Stadien in der Stadt Sachspenden entgegennehmen können. Neben diesen vier Teams engagieren sich auch die Basketball-Teams der Lakers, Clippers und Sparks, die NHL-Mannschaften Kings und Ducks, die Angels als weiteres MLB-Team sowie die Fußballmannschaften von Angel City FC und LA Galaxy. Die Heavy-Metal-Band Metallica kündigte zudem an, 500.000 US-Dollar für die Opfer der Feuerkatastrophe zu spenden.\nDie Staatsanwaltschaft in Los Angeles geht derweil gegen mutmaßliche Plünderer und Einbrecher in den von Feuern betroffenen Gebieten vor. Gegen zehn festgenommene Verdächtige sei Anklage erhoben worden, teilte Bezirksstaatsanwalt Nathan Hochman auf einer Pressekonferenz mit. Wer die &quot;tragische&quot; Situation der Feuerkatastrophe für sich ausnutze, müsse mit schwerstmöglicher Bestrafung rechnen.\nIn neun Fällen drehen sich die Vorwürfe um Einbrüche und Plünderungen von Häusern in Evakuierungszonen. Zwei der Angeklagten sollen zusammen Diebesgut im Wert von mehr als 200.000 Dollar mitgenommen haben. Beide seien vorbestraft, daher drohten im Falle einer Verurteilung langjährige Haftstrafen, sagte Hochman. Ein Mann wurde wegen Brandstiftung angeklagt. Er soll in einem Park in der Stadt Azusa östlich von Pasadena versucht haben, einen umgefallenen Baum anzuzünden. Bei einer Verurteilung drohen ihm neun Jahre Haft, wie die Behörden mitteilten.\n\nNominierungen für Oscars werden später bekannt gegeben\n\nWegen der Waldbrände wurde auch die Bekanntgabe der Oscarnominierungen um fast eine Woche verschoben. Als neuer Termin wurde nun der 23. Januar festgelegt, teilte die Oscarakademie mit. &quot;Wir alle sind erschüttert über die Auswirkungen der Feuer und die erheblichen Verluste, die so viele in unserer Gemeinde hinnehmen müssen&quot;, sagten Academy-Chef und Academy-Präsidentin Janet Yang in einer Stellungnahme. Die 97. Oscarverleihung soll aber nach aktuellem Stand wie geplant am 2. März im Dolby Theatre über die Bühne gehen."}, {"id": "s040", "summary": "Bei der Amtseinführung von Donald Trump als US-Präsident hat Elon Musk eine Geste gemacht, die für viele Nutzer auf seinem Online-Plattform X eindeutig antisemitisch erscheint: Ein Hitlergruß. Der Tesla-Gründer <ins>trug einen dunklen Anzug, <\/ins>sprang über die Bühne und bedankte sich bei den Anhängern des neuen Präsidenten, bevor er seine rechte Hand an sein Herz legte und sie nach oben streckte.", "original": "Bei der Amtseinführung von Donald Trump als US-Präsident hat Elon Musk eine Geste gemacht, die für viele Nutzer auf seinem Online-Plattform X eindeutig antisemitisch erscheint: Ein Hitlergruß. Der Tesla-Gründer sprang über die Bühne und bedankte sich bei den Anhängern des neuen Präsidenten, bevor er seine rechte Hand an sein Herz legte und sie nach oben streckte.", "title": "", "article": "Elon Musk hat nach der Amtseinführung Donald Trumps als neuer US-Präsident bei der \nVeranstaltung in der Capital One Arena mit einer\n dem Hitlergruß ähnlichen Geste für Irritationen gesorgt. Musk\n war einer der Redner auf der Bühne vor dem Eintreffen Trumps. In einem ungewöhnlichen Auftritt sprang und tanzte der Tesla-Gründer über die Bühne und bedankte sich bei den Anhängern des \nneuen Präsidenten. Dann hielt er seine rechte Hand an sein Herz und \nstreckte sie in einer schnellen Bewegung nach oben raus. Danach \nwiederholte er die Geste noch einmal mit dem Rücken zum Publikum. &quot;Mein Herz\n fliegt euch zu&quot;, rief Musk.\nViele Nutzer auf Musks\n Onlineplattform X sahen in der Geste einen Hitlergruß. Der Nachrichtensender CNN wiederholte die Szene in seinem \nProgramm mehrfach. Die Zuschauer seien selbst klug genug, sich eine \nMeinung dazu zu bilden, sagte eine Moderatorin.\nDie Bürgerrechtsgruppe Anti-Defamation League nahm den Tesla-Chef in Schutz. Es habe sich nicht um den Hitlergruß gehandelt, schrieb die Organisation, die Antisemitismus bekämpft, auf Musks Plattform X: &quot;Es scheint, als ob Musk in einem Moment der Begeisterung eine ungeschickte Geste gemacht hat.&quot;\nVon Musk\n gab es zunächst keine Erklärung dazu. Auf seinem\n X-Account teilte er einen Mitschnitt seiner Rede vom Sender Fox News, in dem im \nMoment der ersten – und problematischer aussehenden – Geste die Zuhörer \neingeblendet wurden. Später nannte er die Kritik einen &quot;müden Angriff&quot;. Auf X schrieb er offenbar \nauf seine Kritiker bezogen, &quot;sie brauchen bessere schmutzige Tricks&quot;. \nDer &quot;Jeder ist Hitler&quot;-Angriff sei ermüdend.\nBei seinem Auftritt sagte Musk noch, durch Trumps Wahl sei die &quot;Zukunft der Zivilisation gesichert&quot; worden. Die ganze Menschheit sei an einer Weggabelung gewesen."}, {"id": "s060", "summary": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert und ihm in einem Brief ein starkes Mandat für Führung attestiert. Merz verspricht, im Falle seiner Kanzlerschaft an einer Stärkung der Beziehungen zwischen Deutschland und den USA zu arbeiten. <del title=\"removed\">Während<\/del><ins>Weil<\/ins> keine hohen Vertreter der Bundesregierung zur Amtseinführung Trumps nach Washington reisen, äußert sich Merz zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps als seine Konkurrenten. Trotz Warnungen des deutschen Botschafters in Washington vor der Politik des neuen US-Präsidenten betont Merz, dass Europa die Herausforderung durch Trump annehmen könne, wenn es zusammenstehe.", "original": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert und ihm in einem Brief ein starkes Mandat für Führung attestiert. Merz verspricht, im Falle seiner Kanzlerschaft an einer Stärkung der Beziehungen zwischen Deutschland und den USA zu arbeiten. Während keine hohen Vertreter der Bundesregierung zur Amtseinführung Trumps nach Washington reisen, äußert sich Merz zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps als seine Konkurrenten. Trotz Warnungen des deutschen Botschafters in Washington vor der Politik des neuen US-Präsidenten betont Merz, dass Europa die Herausforderung durch Trump annehmen könne, wenn es zusammenstehe.", "title": "", "article": "Der CDU-Kanzlerkandidat Friedrich Merz hat Donald Trump zur Amtsübernahme gratuliert. &quot;Ihr Wahlsieg ist wahrlich bemerkenswert&quot;, schreibt Merz in dem sechszeiligen Brief, der ZEIT ONLINE vorliegt. Er attestiert Trump und dessen Republikanern darin ein &quot;starkes Mandat für Führung&quot;.\nMerz hat im ZEIT-Podcast Alles gesagt? bekannt gegeben , er habe Trump einen handschriftlichen Brief verfasst, der diesem am heutigen Montag übergeben werden soll. Der CDU-Vorsitzende, der vor seiner Rückkehr in die Politik unter anderem für den US-Vermögensverwalter BlackRock gearbeitet hat und Vorsitzender der transatlantischen Vereinigung Atlantik-Brücke war, schreibt: &quot;Ich habe einen beträchtlichen Teil meiner beruflichen Karriere und meines politischen Lebens der Stärkung der Beziehungen unserer beiden Länder gewidmet.&quot; Sollte er Bundeskanzler werden, verspricht Merz Trump, werde eine seiner Prioritäten sein, &quot;mit Ihnen auf ein neues Kapitel in unserer Beziehung hinzuarbeiten&quot;.\nZur Amtseinführung Trumps reisen keine hohen Vertreter der Bundesregierung aus Deutschland nach Washington. SPD, Grüne und FDP sind nicht anwesend, während der CDU-Außenpolitiker und frühere Transatlantik-Koordinator Jürgen Hardt eine Einladung erhielt. Von der AfD ist unter anderem Parteichef Tino Chrupalla vor Ort.\nMerz hat sich wiederholt zuversichtlicher zu den Herausforderungen einer zweiten Präsidentschaft Trumps geäußert als seine Konkurrenten Bundeskanzler Olaf Scholz (SPD) und Vizekanzler Robert Habeck (Grüne). Der deutsche Botschafter in Washington, Andreas Michaelis, warnte in einem vertraulichen Schreiben an die Bundesregierung in deutlichen Worten vor der Politik des neuen US-Präsidenten.\nMerz hingegen sagte in einer Videobotschaft zu Trumps Amtseinführung am Montag: Es gebe für die Europäer &quot;keinen Grund, ängstlich nach Washington zu schauen&quot;. Die Herausforderung durch Trump könne Europa annehmen, wenn es zusammenstehe. &quot;Wir sind 450 Millionen Europäer – mehr als die USA und Kanada zusammen.&quot; Europa müsse sich wegen Trump stärker abstimmen, sagte Merz kürzlich. Er schaue auf eine Amtszeit von Trump nicht &quot;wie das Kaninchen auf die Schlange&quot;. Zudem berichtete Merz im ZEIT-Podcast, er berate sich regelmäßig mit Nato-Generalsekretär Mark Rutte, der Trump gut kenne und von ihm respektiert werde."}, {"id": "s045", "summary": "Apple wehrt sich gegen Aktionärsforderung zur Abschaffung von Diversitätsprogrammen. Der Konzern ruft seine Anteilseigner auf, bei der Hauptversammlung gegen einen entsprechenden Antrag zu stimmen. In den USA haben verschiedene Unternehmen in den letzten Monaten ihre Programme für Vielfalt, Gleichberechtigung und Inklusion (DEI) gestrichen oder zurückgefahren. Die Apple-Aktionäre argumentieren, dass die Diversitätsvorgaben Diskriminierung von Beschäftigten und Klagen nach sich ziehen können. Sie berufen sich dabei auf zwei Urteile des obersten Gerichts der USA. Apple betont <del title=\"removed\">jedoch,<\/del><ins>deshalb,<\/ins> dass der Vorschlag ein unzulässiger Eingriff ins Tagesgeschäft des Unternehmens sei und man über eingespielte Verfahren verfüge, um rechtliche Risiken zu minimieren.", "original": "Apple wehrt sich gegen Aktionärsforderung zur Abschaffung von Diversitätsprogrammen. Der Konzern ruft seine Anteilseigner auf, bei der Hauptversammlung gegen einen entsprechenden Antrag zu stimmen. In den USA haben verschiedene Unternehmen in den letzten Monaten ihre Programme für Vielfalt, Gleichberechtigung und Inklusion (DEI) gestrichen oder zurückgefahren. Die Apple-Aktionäre argumentieren, dass die Diversitätsvorgaben Diskriminierung von Beschäftigten und Klagen nach sich ziehen können. Sie berufen sich dabei auf zwei Urteile des obersten Gerichts der USA. Apple betont jedoch, dass der Vorschlag ein unzulässiger Eingriff ins Tagesgeschäft des Unternehmens sei und man über eingespielte Verfahren verfüge, um rechtliche Risiken zu minimieren.", "title": "Apple verteidigt Diversitätsinitiativen", "article": "Der Apple-Konzern stellt sich gegen eine Aktionärsforderung, die Diversitätsprogramme zu beenden. Apple rief die Anteilseignerinnen auf, bei der Ende Februar \nanstehenden Hauptversammlung gegen den entsprechenden Antrag zu stimmen.\nIn den vergangenen Monaten schafften verschiedene US-Unternehmen ihre \nProgramme für Vielfalt, Gleichberechtigung und Inklusion (&quot;Diversity, \nEquity and Inclusion&quot;, DEI) unter ihren Beschäftigten ab oder fuhren diese stark zurück.\nDie Apple-Aktionäre begründeten ihren Antrag damit, dass die \nDiversitätsvorgaben zur Diskriminierung von Beschäftigten und Klagen \nführen können. Dabei verwiesen sie auf zwei Urteile des obersten Gerichts der USA.\nApple teilte mit, der \nVorschlag sei ein unzulässiger Eingriff ins Tagesgeschäft des \nUnternehmens. Was die rechtlichen Risiken angehe, habe der Konzern \neingespielte Verfahren, um diese zu minimieren.\nVor Kurzem gab der Facebook-Konzern Meta bekannt, seine Diversitätsprogramme zu beenden . Die Initiativen werden bereits seit Jahren heftig kritisiert von der Republikanischen Partei des künftigen Präsidenten Donald Trump . Ein \nausgesprochener Gegner davon ist auch der X-Besitzer und aktuelle\nTrump-Vertraute Elon Musk ."}, {"id": "s041", "summary": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise <del title=\"removed\">sie<\/del><ins>er<\/ins> neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "original": "Svenja Schulze, Bundesentwicklungsministerin der SPD, besuchte Syrien und kündigte deutsche Unterstützung für eine friedliche und stabile Entwicklung des Landes an. Bei Treffen mit Vertretern der Übergangsregierung und dem De-facto-Gesundheitsminister Maher al-Scharaa promise sie neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern. Schulzes Ministerium sieht das traditionell starke syrische Gesundheitswesen durch den Bürgerkrieg und die Bombardierung von Spitälern sowie den Verlust von medizinischem Personal stark herausgefordert. Um das Gesundheitssystem zu unterstützen, sollen Klinikpartnerschaften entstehen, bei denen deutsche Ärzte nach Syrien reisen oder Fortbildungen in Deutschland angeboten werden.", "title": "Entwicklungsministerin Schulze sagt Syrien deutsche Unterstützung zu", "article": "Bundesentwicklungsministerin Svenja Schulze (SPD) hat bei\neinem Besuch in Syrien deutsche Unterstützung für\neine &quot;friedliche und stabile Entwicklung&quot; des Landes angekündigt.\nSchulze traf sich am Morgen in Damaskus mit Vertretern der\nÜbergangsregierung, Ärzten und dem De-facto-Gesundheitsminister Maher al-Scharaa,\neinem Bruder des neuen Machthabers Ahmed al-Scharaa. Die Ministerin kündigte\nzudem neue Partnerschaften zwischen deutschen und syrischen Krankenhäusern an.\nSchulzes Ministerium sieht große Herausforderungen im traditionell eigentlich sehr starken syrischen Gesundheitswesen. Das hat mit der gezielten Bombardierung von Krankenhäusern in ehemaligen Rebellengebieten während des Bürgerkriegs zu tun. Außerdem fehlt durch Flucht und Vertreibung vielerorts das medizinische Personal. Laut Entwicklungsministerium hat mehr als die Hälfte des Gesundheitspersonals das Land verlassen, mehr als ein Drittel der\nKrankenhäuser sei nicht mehr funktionstüchtig.\nUm das Gesundheitssystem zu unterstützen, soll es sogenannte Klinikpartnerschaften geben, die Deutschland bereits mit 52 Ländern finanziert. Dabei geht es um den Austausch von Wissen und Erfahrung. Ärzte aus Deutschland sollen nach Syrien reisen, um dort Fortbildungsmaßnahmen anzubieten oder mit lokalen Kollegen den Einsatz neuer Geräte zu üben. Auch Fortbildungen in Deutschland sind möglich. Eine Auftaktkonferenz für die Klinikpartnerschaften soll am 12. Februar in Berlin stattfinden.\n\nDeutschland auf syrisches Fachpersonal &quot;angewiesen&quot;\n\nAuf ihrer Reise wird Schulze von einem in Deutschland arbeitenden syrischen Arzt begleitet. In den kommenden Monaten dürfte es auch um die Frage gehen, ob syrische Ärztinnen und Ärzte aus Deutschland wieder nach Syrien zurückkehren sollen. Regierungsangaben zufolge gibt es bundesweit etwa 5.800 Ärztinnen und über 2.000 Pflegekräfte mit syrischem Pass. Viele hätten sich bereits beim Entwicklungsministerium gemeldet, weil\nsie helfen wollten.\nEs sei verständlich, dass die neue Regierung in Syrien die Fachkräfte gern zurückholen wolle, sagte Schulze. &quot;Aber auch Deutschland hat ein\nInteresse, diese Menschen zu halten, auf die wir gerade in\nunserem Gesundheitssystem angewiesen sind.&quot; Durch die Klinikpartnerschaften wolle sie ermöglichen, &quot;dass beides geht: sich von Deutschland aus für Syrien engagieren&quot;. Letztendlich sei aber vor allem entscheidend, was jede einzelne Fachkraft selbst für ihr Leben wolle.\nSchulze ist die zweite deutsche Ministerin, die nach dem Sturz des langjährigen Machthabers Baschar al-Assad nach Syrien reist. Anfang des Jahres war Außenministerin Annalena Baerbock (Grüne) nach Damaskus geflogen und hatte dort mit Vertretern der neuen Übergangsregierung beraten. Dabei hatte sie wiederholt hervorgehoben, dass unter der neuen Regierung der Schutz aller religiösen und ethnischen Minderheiten gewahrt werden müsse."}, {"id": "s058", "summary": "Die AfD erreicht im ZDF-Politbarometer 21 Prozent, ein Plus von zwei Prozentpunkten im Vergleich zur letzten<ins> Umfrage. Dies ist der erste Wert über 20 Prozent für die Partei in dieser<\/ins> Umfrage. Die Union bleibt stärkste Kraft mit 30 Prozent, gefolgt von den Grünen mit 15 Prozent vor der SPD mit 14 Prozent. In der Kanzlerfrage liegen Habeck und Merz mit je 27 Prozent gleichauf, während Scholz nur 14 Prozent erreicht.", "original": "Die AfD erreicht im ZDF-Politbarometer 21 Prozent, ein Plus von zwei Prozentpunkten im Vergleich zur letzten Umfrage. Die Union bleibt stärkste Kraft mit 30 Prozent, gefolgt von den Grünen mit 15 Prozent vor der SPD mit 14 Prozent. In der Kanzlerfrage liegen Habeck und Merz mit je 27 Prozent gleichauf, während Scholz nur 14 Prozent erreicht.", "title": "AfD legt in Umfrage zu, Grüne vor SPD", "article": "Die AfD kommt im ZDF- Politbarometer auf 21 Prozent. Das ist ein Plus von zwei\nProzentpunkten im Vergleich zur bisher letzten Umfrage im Dezember und der beste Umfragewert, den die Partei seit einem Jahr erreicht hat.\nKlar stärkste Kraft bleibt die Union, die aber einen Punkt\nverliert und auf 30 Prozent kommt. Die Grünen landen erstmals seit einem Jahr vor der SPD – mit einem Plus von einem Punkt auf 15 Prozent. Die Sozialdemokraten verlieren einen Prozentpunkt und kommen mit 14 Prozent nur noch auf Platz vier.\n\nKanzlerfrage: Habeck gleichauf mit Merz\n\nMit je vier Prozent würden die FDP (plus eins), die\nLinkspartei (unverändert) und das BSW (minus eins) nicht über die\nFünf-Prozent-Hürde kommen. Alle anderen Parteien schaffen es zusammen auf acht\nProzent.\nIn der Kanzlerfrage liegt Robert Habeck (Grüne) mit 27 Prozent gleichauf mit CDU-Kandidat Friedrich Merz. Bundeskanzler Olaf Scholz (SPD) erreicht nur noch 14 Prozent und liegt damit in der Umfrage hinter AfD-Kanzlerkandidatin Alice Weidel , die auf 15 Prozent kommt.\nIm Vergleich nur mit Merz schneidet Scholz deutlich besser ab. Er kommt dann auf 41 Prozent und Merz auf 44 Prozent."}, {"id": "s050", "summary": "Die AfD hat eine Großspende über 1,5 Millionen Euro von dem umstrittenen Arzt und Professor Winfried Stöcker erhalten, die größte Summe, die eine Partei bisher im Jahr 2025 erhalten hat. Stöcker hatte im Zusammenhang mit einem nicht zugelassenen Impfstoff für Aufsehen gesorgt und wurde zu einer Geldstrafe verurteilt. Trotzdem ist <del title=\"removed\">er<\/del><ins>sie<\/ins> kein Impfgegner und wurde sogar von der AfD zu einem Coronasymposium eingeladen. Stöcker ist Gründer eines Labors und Besitzer eines Kaufhauses, aber auch wegen rassistischer und sexistischer Äußerungen umstritten.", "original": "Die AfD hat eine Großspende über 1,5 Millionen Euro von dem umstrittenen Arzt und Professor Winfried Stöcker erhalten, die größte Summe, die eine Partei bisher im Jahr 2025 erhalten hat. Stöcker hatte im Zusammenhang mit einem nicht zugelassenen Impfstoff für Aufsehen gesorgt und wurde zu einer Geldstrafe verurteilt. Trotzdem ist er kein Impfgegner und wurde sogar von der AfD zu einem Coronasymposium eingeladen. Stöcker ist Gründer eines Labors und Besitzer eines Kaufhauses, aber auch wegen rassistischer und sexistischer Äußerungen umstritten.", "title": "", "article": "Die AfD hat eine Großspende über 1,5 Millionen Euro von dem umstrittenen Arzt und Professor Winfried Stöcker erhalten. Das geht aus der Veröffentlichung des Bundestages zu den Großspenden über 35.000 Euro im Jahr 2025 hervor. Demnach soll die Spende bei der Partei am Dienstag eingegangen sein.\nDie Spende stellt die größte Summe dar, die eine Partei bisher im Jahr 2025 erhalten hat. 2024 hatte die AfD nach Angaben des Bundestages keine Großspende über 35.000 Euro erhalten. Parteien müssen diese anzeigen. Nach Informationen des Spiegels handelt es sich um die \ngrößte Einzelspende, die die AfD bislang erhalten hat.\nStöcker ist kein Unbekannter. Er hat im ersten Jahr der Coronapandemie für Aufsehen gesorgt, weil er verkündet hatte, einen eigenen Impfstoff entwickelt zu haben, der allerdings niemals von einer anerkannten Institution geprüft worden war .\n\nStöcker zu Geldstrafe verurteilt\n\nIm November startete er dennoch eine illegale Impfaktion am Lübecker \nFlughafen, die von der Polizei aufgelöst wurde. Das Paul-Ehrlich-Institut zeigte ihn deshalb an. Stöcker gehört der Flughafen, er hatte ihn aus der Insolvenz herausgekauft. Auch in der Oberlausitz soll er Menschen seinen Impfstoff verabreicht haben.\nStöcker wurde zur Zahlung einer Geldstrafe in Höhe von 250.000 Euro verurteilt . Er habe ein nicht zugelassenes Arzneimittel vorsätzlich in Verkehr gebracht und damit gegen das Arzneimittelgesetz verstoßen, urteilte das Amtsgericht in Lübeck. Dagegen legte er mit seinem Anwalt Wolfgang Kubicki, der auch für die FDP im Bundestag sitzt, Berufung ein .\nAnders als viele in der AfD ist Stöcker kein Impfgegner. Im Dezember 2021 rief er zum Impfen mit zugelassenen Impfstoffen gegen das Coronavirus auf . Die AfD-Fraktion lud ihn zu ihrem dritten Coronasymposium im November im Bundestag ein, in dem sie die Coronapolitik aufarbeiten will.\nStöcker ist Gründer des Labors Euroimmun und Besitzer des Kaufhauses Görlitz. An der Universität Lübeck unterrichtete er als Honorarprofessor. 2024 gab er den Titel zurück. Schon zuvor hatte sich die Universität mehrmals wegen rassistischer und sexistischer Äußerungen von ihm distanziert ."}, {"id": "s059", "summary": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.<ins> Trainer Marcel Rapp ließ offen, ob er in der nächsten Partie dieselbe Startelf aufstellen wird.<\/ins>", "original": "Borussia Dortmund verliert überraschend 2:4 gegen Holstein Kiel in der Bundesliga. Kiel sichert sich den Sieg mit einer disziplinierten Leistung, während der BVB vor allem in der ersten Halbzeit Schwächen in der Defensive zeigt. Tore von Machino, Harres und Bernhardsson bringen Kiel in Führung, Dortmund verkürzt durch Reyna und Gittens. Arp setzt den Schlusspunkt. Holtby sieht Rot. Kiel sammelt wichtige Punkte im Abstiegskampf, während Dortmund den Anschluss an die Champions-League-Plätze zu verlieren droht.", "title": "", "article": "Holstein Kiel – Borussia Dortmund 4:2 (3:0)\nBorussia Dortmund hat in der Bundesliga überraschend gegen den Tabellenvorletzten Holstein Kiel mit 2:4 (0:3) verloren. Der BVB zeigte dabei vor allem in der ersten Halbzeit große Schwächen in der Defensive, während Kiel den Sieg mit einer disziplinierten Leistung sicherte.\nIn der 27. Minute gingen die Gastgeber durch Shuto Machino in Führung, der nach einem Fehler von Julian Brandt einen präzisen Rechtsschuss verwandelte. Nur fünf Minuten später (32. Spielminute) erhöhte Phil Harres per Kopf auf 2:0. Kurz vor der Halbzeitpause traf Alexander Bernhardsson in der Nachspielzeit (45.+4) zum dritten Mal für die Kieler. Dortmund konnte in der zweiten Hälfte durch Giovanni Reyna (71.) und Jamie Gittens (77.) verkürzen, ehe Fiete Arp in der Nachspielzeit (90.+8) den Schlusspunkt setzte. Kiels Lewis Holtby sah nach einem Foulspiel in der 86. Minute die Rote Karte.\nFür Holstein Kiel bedeutet der unerwartete Sieg wichtige Punkte im Kampf um den Klassenerhalt. Der BVB hingegen droht, den Anschluss an die Champions-League-Plätze zu verlieren. Bereits am Freitag steht für Dortmund ein Auswärtsspiel gegen Eintracht Frankfurt an, während Kiel am Samstag bei der TSG Hoffenheim zu Gast ist."}, {"id": "s057", "summary": "Donald Trump wurde als 47. Präsident der Vereinigten Staaten vereidigt, zusammen mit seinem Vizepräsidenten J. D. Vance.<del title=\"removed\"> In seiner Antrittsrede versprach er, Amerika an erste Stelle zu setzen und das Land wieder stolz, prosperierend und frei zu machen.<\/del> Trump kündigte mehr als 100 präsidentielle Dekrete an, darunter die Umbenennung des Golf von Mexiko in Golf von Amerika und die Stärkung des Militärs. Die Amtseinführung fand aufgrund der Kälte im Kapitol statt, wo Trump sein düsteres Bild der USA zeichnete und versprach, Amerikas Niedergang zu beenden.", "original": "Donald Trump wurde als 47. Präsident der Vereinigten Staaten vereidigt, zusammen mit seinem Vizepräsidenten J. D. Vance. In seiner Antrittsrede versprach er, Amerika an erste Stelle zu setzen und das Land wieder stolz, prosperierend und frei zu machen. Trump kündigte mehr als 100 präsidentielle Dekrete an, darunter die Umbenennung des Golf von Mexiko in Golf von Amerika und die Stärkung des Militärs. Die Amtseinführung fand aufgrund der Kälte im Kapitol statt, wo Trump sein düsteres Bild der USA zeichnete und versprach, Amerikas Niedergang zu beenden.", "title": "", "article": "Donald Trump ist als 47. Präsident der Vereinigten Staaten\nvereidigt worden. In der Kuppelhalle des Kapitols legte der 78-Jährige den Amtseid an.\nEs ist seine zweite Amtszeit: Schon von 2017 bis 2021 war er Präsident der USA. Zuvor wurde auch sein Vizepräsident, J. D. Vance , vereidigt.\n&quot;Das goldene Zeitalter Amerikas beginnt genau jetzt&quot;, sagte Trump in seiner Antrittsrede. Zu dessen Beginn wiederholte er sein Wahlkampfversprechen, &quot;Amerika an erste \nStelle&quot; zu setzen. Er werde die &quot;Souveränität&quot; des Landes \nwiederherstellen, ebenso wie den  internationalen Respekt für das Land. Seine oberste Priorität sei es, das Land wieder &quot;stolz, prosperierend und frei&quot; zu machen.\nDonald Trump zeichnete dabei ein düsteres Bild der USA.  Er sprach von einer Krise des Vertrauens, einer korrupten Elite und einer Regierung, die die Probleme des Landes nicht mehr lösen könne. All das werde sich nun jedoch ändern: &quot;Amerikas Niedergang ist jetzt vorbei&quot;. Sein Vorgänger Joe Biden und die ehemalige Vizepräsidentin Kamala Harris saßen während der Rede hinter dem Präsidenten.\n\nMehr als 100 Dekrete an Tag eins\n\nTrump nannte in seiner Rede einige der Ankündigungen , die er auch zuvor schon versprochen hatte. Der Golf von Mexiko soll etwa in Golf von Amerika umbenannt\nwerden. Das Militär will Trump zudem stärken. Amerikanische Astronauten sollen außerdem\ndie Flagge der USA auf dem Mars platzieren.\nDafür will Trump noch am ersten Tag seiner Amtszeit zahlreiche präsidentielle Dekrete unterzeichnen. Mehr als 100 solcher executive orders sollen am ersten Tag seiner Amtszeit in Kraft treten , hatte Trump noch vor der Amtseinführung angekündigt.\n\nAmtseinführung ins Kapitol verlegt\n\nWegen Kälte fand die Amtseinführung nicht wie üblich draußen vor dem Kapitol\ngefeiert, sondern wurde ins Innere des Gebäudes verlegt. Offizielles Public\nViewing fand in Washington, D. C., deshalb unter anderem in der Capital One\nArena statt.\nDer Republikaner hatte die Wahl im November 2024 entgegen Vorhersagen\ndeutlich gewonnen. Trump versammelte 312 Wahlleute hinter sich , 270 waren für\neinen Wahlsieg notwendig. Kamala Harris, die für die Demokraten antrat, kam auf\n226 Wahlleute.\nAlle Entwicklungen zur Amtseinführung des 47. Präsidenten lesen\nSie in unserem Liveblog."}, {"id": "s055", "summary": "Das Jahr 2024 war das wärmste seit Messbeginn, mit einer Durchschnittstemperatur von mehr als 1,5 Grad über dem vorindustriellen Mittel. Der Klimawandeldienst Copernicus berichtete von einer Erwärmung um 1,6 Grad Celsius. Trotzdem sei das Pariser Klimaabkommen noch nicht verfehlt, da <del title=\"removed\">es<\/del><ins>dem<\/ins> eine Überschreitung des Schwellenwerts über 20 Jahre erfordert. Die Rekordtemperaturen werden hauptsächlich durch die Anhäufung von Treibhausgasen verursacht. Copernicus-Chef Carlo Buontempo betonte die Bedeutung schnellen und entschlossenen Handelns, um die Klimaentwicklung zu beeinflussen.", "original": "Das Jahr 2024 war das wärmste seit Messbeginn, mit einer Durchschnittstemperatur von mehr als 1,5 Grad über dem vorindustriellen Mittel. Der Klimawandeldienst Copernicus berichtete von einer Erwärmung um 1,6 Grad Celsius. Trotzdem sei das Pariser Klimaabkommen noch nicht verfehlt, da es eine Überschreitung des Schwellenwerts über 20 Jahre erfordert. Die Rekordtemperaturen werden hauptsächlich durch die Anhäufung von Treibhausgasen verursacht. Copernicus-Chef Carlo Buontempo betonte die Bedeutung schnellen und entschlossenen Handelns, um die Klimaentwicklung zu beeinflussen.", "title": "", "article": "Das Jahr 2024 war das wärmste seit Messbeginn. Die Temperatur war im Durchschnitt mehr als 1,5 Grad wärmer als im vorindustriellen Mittel, wie der Klimawandeldienst des EU-Programms Copernicus berichtet. Das europäische Team berechnete eine Erwärmung von 1,6 Grad Celsius.\nIn den beiden vergangenen Jahren zusammen wurde die Erderwärmung im Schnitt um mehr als 1,5 Grad im Vergleich zur vorindustriellen Zeit überschritten. Dabei sei 2024 das erste Kalenderjahr, in dem die Durchschnittstemperatur mehr als 1,5 Grad höher war als im Vergleichszeitraum, teilte das Erdbeobachtungsprogramm weiter mit. Es bestätigte zudem frühere Annahmen, dass 2024 das heißeste Jahr seit Beginn der Aufzeichnungen Mitte des 19. Jahrhunderts war.\nDies bedeute noch nicht, dass das Ziel des Pariser Klimaabkommens verfehlt sei, erklärte Copernicus. Dieses beziehe sich auf eine Überschreitung des Schwellenwerts während mindestens 20 Jahren. &quot;Aber es macht deutlich, dass die globalen Temperaturen höher steigen, als die moderne Menschheit es je erlebt hat&quot;, hieß es weiter. &quot;Die Zukunft liegt in unserer Hand: Schnelles und entschlossenes Handeln kann die Entwicklung des Klimas noch beeinflussen&quot;, sagte Copernicus-Chef Carlo Buontempo.\nDer Hauptgrund für die Rekordtemperaturen ist die Anhäufung von Treibhausgasen in der Atmosphäre, &quot;die durch die Verbrennung von Kohle, Öl und Gas entstehen&quot;, sagte Samantha Burgess vom Corpernicus-Klimadienst. &quot;Da sich die Treibhausgase weiterhin in der Atmosphäre ansammeln, steigen die Temperaturen weiter an, auch im Meer, der Meeresspiegel steigt weiter an, und die Gletscher und Eisschilde schmelzen weiter.&quot;\n\nAuch Meeresoberfläche so heiß wie nie\n\nAuch bei der Erwärmung der Meeresoberfläche ist laut dem Klimawandeldienst ein neuer Höchstwert erreicht worden. Im vergangenen Jahr habe die Durchschnittstemperatur bei 20,9 Grad gelegen, etwa ein halbes Grad höher als in den Jahren zwischen 1990 und 2020.\nDie internationale Gemeinschaft hatte sich 2015 bei der Weltklimakonferenz in Paris darauf verständigt, die Erderwärmung auf möglichst 1,5 Grad im Vergleich zum vorindustriellen Zeitalter zu begrenzen. Die UN-Klimakonferenz in Baku, COP29, endete im vergangenen Jahr mit einem viel kritisierten Minimalkompromiss zur Klimafinanzierung. Neue Beschlüsse zur Abkehr von fossilen Energieträgern blieben aus."}, {"id": "s052", "summary": "Nach einer Serie von Niederlagen wurde Nuri Şahin als Trainer beim BVB entlassen. Borussia Dortmund bestätigte die Entscheidung und wird vorerst U19-Trainer Mike Tullberg als Interimscoach einsetzen. Der Verein steckt in einer sportlichen Krise, rangiert in der Bundesliga auf Platz zehn und ist sieben Punkte von einem Champions-League-Platz entfernt. Şahin war der achte Trainer seit 2015 und hatte zuvor keine Erfahrung als Cheftrainer. Kritik gibt es auch am Sportdirektor Kehl, dessen Vertrag kürzlich bis 2027 verlängert wurde.<ins> Das Louvre in Paris präsentiert ab kommendem Monat eine umfassende Ausstellung zur Renaissance, die mehr als zweihundert Gemälde und Skulpturen aus ganz Europa vereint und restaurierte Meisterwerke erstmals öffentlich zeigt.<\/ins>", "original": "Nach einer Serie von Niederlagen wurde Nuri Şahin als Trainer beim BVB entlassen. Borussia Dortmund bestätigte die Entscheidung und wird vorerst U19-Trainer Mike Tullberg als Interimscoach einsetzen. Der Verein steckt in einer sportlichen Krise, rangiert in der Bundesliga auf Platz zehn und ist sieben Punkte von einem Champions-League-Platz entfernt. Şahin war der achte Trainer seit 2015 und hatte zuvor keine Erfahrung als Cheftrainer. Kritik gibt es auch am Sportdirektor Kehl, dessen Vertrag kürzlich bis 2027 verlängert wurde.", "title": "", "article": "Nuri Şahin ist nicht länger Trainer beim BVB. Nach einer Reihe von Niederlagen des Vereins wurde er entlassen. Borussia Dortmund bestätigte damit entsprechende Berichte der Nachrichtenagentur SID und der Sport-Bild . Die Vereinsführung habe &quot;leider den Glauben daran verloren, in der gegenwärtigen Konstellation noch unsere sportlichen Ziele erreichen zu können&quot;. Şahins Amtszeit endet somit nach sieben Monaten. Wie der BVB später mitteilte , wird U19-Trainer Mike Tullberg die Mannschaft zunächst als Interimscoach beim Spiel gegen Werder Bremen am Samstag betreuen.\nBorussia Dortmund steckt derzeit in einer sportlichen Krise . Zuletzt erlitt der Verein vier Niederlagen in Serie. In der Bundesliga rangiert der BVB derzeit auf Platz zehn und ist mit 25 Zählern sieben Punkte von einem Champions-League-Platz entfernt.\nAm Dienstagabend hatte der BVB in der Champions League nach einer Führung gegen den FC Bologna innerhalb von 88 Sekunden zwei Gegentore kassiert und die Partie verloren. Daraufhin kündigten Kehl und Sportgeschäftsführer Lars Ricken ein Treffen mit Vereinsboss Hans-Joachim Watzke und Şahin an, um zu entscheiden, &quot;wie wir weitermachen&quot;.\n\nAchter Trainer in zehn Jahren\n\n&quot;Diese Entscheidung tut mir auch persönlich weh, aber sie war nach dem Spiel in Bologna nicht mehr vermeidbar&quot;, sagte Ricken zur Trennung.  &quot;Leider haben wir es nicht geschafft, den sportlichen Ambitionen von Borussia Dortmund in dieser Saison zum jetzigen Zeitpunkt gerecht zu werden&quot;, sagte Şahin laut der Mitteilung des BVB. &quot;Ich wünsche diesem besonderen Verein alles Gute.&quot;\nŞahin war zwischen 2005 und 2011 Mittelfeldspieler beim BVB und wurde im vergangenen Jahr zunächst Assistenz-, ab Juli Cheftrainer . Zuvor trainierte er den türkischen Verein Antalyaspor, weitere Erfahrungen als Trainer hatte er nicht. Mit seiner Entlassung setzt sich die Serie häufiger Trainerwechsel bei dem Verein fort: Şahin war der achte Trainer seit 2015, als Jürgen Klopp den BVB verließ .\n\nVertrag mit Sportdirektor Kehl bis 2027 verlängert\n\nIm Fokus der Kritik stand Şahin bereits im vergangenen Oktober. Zwischenzeitlich konnte der BVB sich stabilisieren, auch in der Champions League besteht noch eine Chance auf das Achtelfinale. Doch der Start in das Fußballjahr 2025 missglückte komplett: Zunächst verloren die Borussen mit 2:3 gegen Bayer Leverkusen, danach beim Aufsteiger Holstein Kiel mit 2:4 und am vergangenen Freitag in Frankfurt mit 0:2 .\nKritik gibt es dabei nicht nur am entlassenen Trainer, sondern auch am Sportdirektor Kehl. In einer Umbruchphase nach Abschieden langjähriger Spieler wie Mats Hummels und Marco Reus übergab er mit Şahin einem unerfahrenen Trainer die Führung einer ebenfalls unerfahrenen Mannschaft . Zudem gilt Kehls Kader als zu klein und unausgewogen. Dennoch hat der Verein den Vertrag mit Kehl erst vor zwei Wochen bis 2027 verlängert."}];
const SAMPLE = "8afcbfd2";
const KEY = "annotation-" + NAME + "-" + SAMPLE;
const DIMENSIONS = [
  {id: "faithfulness", text: "Faithfulness (Faktentreue)",
   def: "Die Zusammenfassung sollte inhaltlich korrekt und sprachlich verständlich sein. Sie darf keine erfundenen Details enthalten, die nicht in der Quelle vorkommen.",
   how: "Read each sentence of the summary and check it against the article. Count how many statements are wrong and how severe they are.",
   anchors: {7: "Ausgezeichnet: Alle Aussagen sind sachlich korrekt.", 4: "Durchwachsen: Enthält sachliche Fehler, die Gesamtzusammenfassung gibt jedoch die wichtigsten Fakten korrekt wieder.", 1: "Mangelhaft: Faktisch unzuverlässig; die meisten Aussagen sind falsch."}},
  {id: "coverage", text: "Coverage (Inhaltsabdeckung)",
   def: "Die Zusammenfassung sollte die wesentlichen Informationen des Originalartikels aus der Perspektive eines Nachrichtenlesers erfassen, sodass der Originalartikel selbst nicht mehr benötigt werden sollte.",
   how: "Find the key information of the article, then check whether the summary contains it. Missing key points lower the score; missing minor details don't.",
   anchors: {7: "Ausgezeichnet: Alle Schlüsselinformationen sind enthalten.", 4: "Gemischt: Ein oder zwei wichtige Details fehlen.", 1: "Mangelhaft: Es fehlen viele wichtige Punkte."}},
];
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
let pos = 0;

function complete(item) {
  const a = answers[item.id] || {};
  return DIMENSIONS.every(d => a[d.id]);
}
function store() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

function render() {
  const item = ITEMS[pos], a = answers[item.id] || {};
  const done = ITEMS.filter(complete).length;
  document.getElementById("progress").textContent = `Summary ${pos + 1} of ${ITEMS.length} (${item.id}) · ${done} done`;
  let h = `<div class="grid"><div><h2>Article <span class="muted">(read it first)</span></h2><div class="articlebox">${item.title ? `<h3>${item.title}</h3>` : ""}${item.article}</div></div><div>`;
  h += `<h2>Summary <span class="muted">(green = added, red struck through = removed)</span></h2><div class="text">${item.summary}</div>`;
  h += `<details class="orig"><summary>Original summary</summary><div class="text">${item.original}</div></details>`;
  h += `<p class="note">Rate the whole summary against the article, as a news reader would. The marks only help you find the change; don't rate the change alone. Red struck-through words have been removed: rate the summary without them.</p>`;
  for (const d of DIMENSIONS) {
    h += `<div class="q"><p>${d.text}</p><small>${d.def}<br>${d.how}</small><ul class="anchors">`;
    for (const k of [7, 4, 1]) h += `<li><b>${k}</b> – ${d.anchors[k]}</li>`;
    h += `</ul><div class="opts scale">`;
    for (let s = 1; s <= 7; s++) h += `<button data-q="${d.id}" data-o="${s}" class="${a[d.id] == s ? "on" : ""}">${s}</button>`;
    h += `</div></div>`;
  }
  h += `</div></div>`;
  document.getElementById("item").innerHTML = h;
  document.getElementById("prev").disabled = pos === 0;
  document.getElementById("next").disabled = pos === ITEMS.length - 1;
  document.getElementById("status").innerHTML = done === ITEMS.length ? '<span class="done">All summaries done.</span>' : `${ITEMS.length - done} summaries left`;
}

function output() {
  const clean = {};
  for (const item of ITEMS) {
    const a = answers[item.id] || {};
    const row = {};
    for (const d of DIMENSIONS) if (a[d.id]) row[d.id] = Number(a[d.id]);
    if (Object.keys(row).length) clean[item.id] = row;
  }
  return JSON.stringify({annotator: NAME, sample: SAMPLE, saved: new Date().toISOString(), answers: clean}, null, 1);
}

document.getElementById("item").addEventListener("click", e => {
  const id = ITEMS[pos].id;
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  answers[id] = Object.assign({}, answers[id], {[b.dataset.q]: Number(b.dataset.o)});
  store(); render();
});
document.getElementById("prev").onclick = () => { pos--; render(); scrollTo(0, 0); };
document.getElementById("next").onclick = () => { pos++; render(); scrollTo(0, 0); };
document.getElementById("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([output()], {type: "application/json"}));
  link.download = NAME + ".json";
  link.click();
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(output()); document.getElementById("status").textContent = "Copied."; }
  catch (e) { document.getElementById("status").textContent = "Copying is blocked here, use the file."; }
};
const LKEY = "annotation-layout";
function setLayout(stacked) {
  document.body.classList.toggle("stacked", stacked);
  document.getElementById("layout").textContent = stacked ? "Side by side" : "One below the other";
  try { localStorage.setItem(LKEY, stacked ? "stacked" : "side"); } catch (e) {}
}
let stacked = false;
try { stacked = localStorage.getItem(LKEY) === "stacked"; } catch (e) {}
setLayout(stacked);
document.getElementById("layout").onclick = () => setLayout(!document.body.classList.contains("stacked"));
render();
</script>
</body>
</html>
